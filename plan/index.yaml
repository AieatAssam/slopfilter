plan_id: slopfilter-x-extension
prd: docs/prd/slopfilter_prd.md
goal: Ship a Manifest V3 Chrome extension that collapses low-quality posts in the X/Twitter Home
  timeline using five layered, locally computed signals, with a versioned selector contract, an
  in-extension self-test that pauses filtering on markup drift, a scheduled CI drift monitor, and
  CI-enforced performance budgets. Runtime network access is limited to one-time model downloads and
  adapter-provided image-thumbnail fetches for C2PA inspection. No servers, no accounts, no
  authorship claims.
state:
  verified_on: 2026-08-08
  gates_green: lint, typecheck, test:unit (157), build, build:test, test:e2e (29) all exit 0
  shipped: SF-001..SF-207, all 30 tickets. Code is in the repository; do not rebuild it.
  open_work: "SF-208..SF-224, none blocked. SF-219..SF-221 depend on SF-214; SF-222 then SF-223
    follow SF-221; SF-224 is independent of all of them."
  known_defect: "Measured 2026-08-08: scorePost computed a weighted mean, so quiet layers diluted
    loud ones. Fixed by SF-214: composite is now a clamped additive sum of weighted scores, so
    behavioural 1.0 alone scores 0.6 and hides while model layers report zero."
protocol:
  - Read this file plus the one plan/tickets/<id>.yaml you are working. Nothing else.
  - "Work open tickets in depends_on order. done[] is a ledger of shipped work: read the code, never
    redo it."
  - A ticket is finished when every verify[].run in its file exits 0 and every gates[] entry exits 0.
  - "Then delete the ticket file and append its id and a one-line did: to done[] in this file."
  - E2E needs `npm run build:test` first. A production build omits the harness host permission and
    every content-script spec fails.
  - "On failure: retry once, then stop and report ticket id, command, exit code, output."
  - Never weaken an assertion, raise a timeout, skip a test, add a sleep, relax a strictness flag,
    or install an unlisted package to make a check pass.
  - If a file, symbol, selector, model id, or threshold is not named literally here, stop and report
    rather than infer it.
  - "provisional: on a done entry means the behaviour is deliberate and pending an owner decision.
    Do not change it."
constraints:
  - Manifest V3. No remote code, no eval, no new Function.
  - "host_permissions: x.com, twitter.com, pbs.twimg.com. localhost:5174 only in
    SLOPFILTER_BUILD_TARGET=test builds, never in a production build (gate GV-08)."
  - No runtime network call except the pinned model download and adapter-provided thumbnail fetches
    for C2PA. No analytics, telemetry, or accounts.
  - No string anywhere may claim, imply, or hedge that a post was written by AI. Reason labels state
    observable evidence only.
  - Fail open. Self-test failure, model failure, or a thrown signal shows every post unfiltered.
    Never hide what could not be scored.
  - "src/core/ is pure: no chrome.*, no DOM, no IndexedDB, no global mutable state. Enforced by
    Biome overrides."
  - Platform DOM knowledge lives only in src/adapters/x/ and its selectors.json contract.
  - "Budgets: page-load delta <50ms, scoring <100ms per 10-post batch, memory <300MB, first-run
    download <100MB. A breach is reported, never absorbed by raising the budget."
  - "public/content/styles.css stayed at 4778 bytes through SF-212; its old 5296-byte ceiling lived
    only in that ticket and died with it. SF-213 raises the encoding ceiling to 6450 bytes for the
    .slopfilter-inspector surface; re-measure whenever the set of injected controls changes: `wc -c
    public/content/styles.css`."
  - "Dependencies are pinned exact, latest published, and only those already in package.json. Never
    add eslint, typescript-eslint, prettier, or eslint-config-prettier: Biome replaces all four."
  - tsconfig.json must have no baseUrl and every paths target must start with ./ (TypeScript 7 hard
    errors TS5102 and TS5090).
  - "Unit test path mirrors source path: src/a/b.ts -> tests/unit/a/b.test.ts."
  - "E2E: local harness at http://localhost:5174 only, never live x.com. Locators getByRole, then
    getByLabel, then getByTestId; never CSS, XPath, or positional. Run-unique data via uniqueRunId,
    cleanup via resetHarness. No sleep or arbitrary polling."
  - Validation one-liners use `node --input-type=module -e` with ESM syntax.
