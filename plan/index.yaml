  pins:
    typescript: 7.0.2
    "@biomejs/biome": 2.5.7
    vite: 8.2.0
    "@types/chrome": 0.2.5
    "@huggingface/transformers": 4.2.0
    "@contentauth/c2pa-web": 0.13.2
    vitest: 4.1.10
    jsdom: 30.0.1
    "@vitest/coverage-v8": 4.1.10
    "@playwright/test": 1.62.1
  gotchas:
    - TypeScript 7 removed baseUrl (TS5102) and rejects non-relative paths targets (TS5090).
    - Vitest 4 removed test.environmentMatchGlobs; per-environment config uses test.projects.
    - "Content scripts are classic scripts: the content bundle is a separate IIFE build
      (vite.content.config.ts), run after build:main which sets emptyOutDir."
    - public/content/styles.css is copied verbatim by publicDir, never imported from TypeScript, or
      Vite renames it and the manifest path breaks.
    - CSP for extension pages is "script-src 'self' 'wasm-unsafe-eval'; object-src 'self'" and must
      not widen further.
decisions:
  answered:
    HD-016: "Owner confirmed 2026-08-08: a same-origin read of a response the page already fetched
      is compatible with the privacy claim, because it adds no outbound request. The store listing,
      privacy page, and README need no change for SF-216. This does not extend to issuing,
      replaying, or prefetching any request."
    HD-001: Product name is SlopFilter.
    HD-014: Plain TypeScript and direct DOM APIs for all extension UI. No framework.
    HD-015: Golden fixtures are captured and committed under tests/fixtures/dom/x/. No further live
      capture is authorised.
    HD-017: "Owner answered 2026-08-09: a text-pattern detector may ship as one available signal, but
      never as authoritative on its own. Review evidence in
      docs/research/2026-08-09-small-model-and-signal-review.md. Implemented by SF-223 under three
      binding conditions carried in that ticket: the layer emits no user-facing reason string ever,
      because the model's label map is {0:human,1:llm} and the plan forbids any string that claims,
      implies, or hedges AI authorship; its weight is capped so a maximal output alone cannot cross
      the hide threshold; and it is off by default with an opt-in download. The model is
      trentmkelly/slop-detector-mini-2 at revision 30775d5640f1ac6524d6a469d02e531e37852360,
      onnx/model_quantized.onnx, 23.12MB, verified 2026-08-09. Licensing is unresolved and tracked as
      HD-019."
    HD-018: "Owner answered 2026-08-09: retire the pinned zero-shot classifier
      Xenova/mobilebert-uncased-mnli and score the three PRD content labels as cosine distance to
      committed prototype centroids in the already pinned Xenova/all-MiniLM-L6-v2 embedder.
      Implemented by SF-222. One forward pass replaces three plus a second model, and first-run
      download drops from 71.17MB to 44.20MB, which is what makes SF-223 fit inside the 100MB budget
      at 67.32MB. HD-008 is untouched: the three labels are unchanged, only their scoring method.
      HD-007 now covers the embedder alone."
    HD-004: "Closed 2026-08-09. Re-opened 2026-08-08 because the in-viewport derivation needs two
      posts by the same author in one pass, which is rare in For You, so postsPerDay was usually null
      for exactly the accounts the layer exists to catch. Owner confirmed SF-215 plus SF-216 is the
      answer: SF-215 accumulates timeline sightings across sessions, SF-216 reads X's own
      already-fetched HomeTimeline response, and neither adds a request, so both stay inside the
      original answer of deriving the rate from data the page already has. An authenticated profile
      or API fetch remains rejected: it requires reading the ct0 cookie to forge x-csrf-token, which
      is credential handling, risks the user's account through unusual request patterns, and would
      rewrite the privacy claim in six places including the SF-207 grep gate."
    HD-003: "Owner answered 2026-08-09: the drift monitor files issues against the main repository,
      AieatAssam/slopfilter, which context.repo already resolves to. Because that repository is
      public, the captured DOM must be sanitised on the runner before it reaches an artifact or an
      issue body. SF-224 does that by reusing scripts/sanitise-fixture.mjs. drift-report.json needs
      no change: it carries only contract version, target, timestamp, status, and selector ids."
    HD-002: "Owner confirmed 2026-08-09: MIT licence, copyright holder Aieat Assam, as already
      written in LICENSE. No change required."
    HD-019: "Owner answered 2026-08-09: ship trentmkelly/slop-detector-mini-2 as it stands and
      document the position, rather than wait. The Hub repo declares no licence, so no rights are
      expressly granted and the Apache-2.0 of the base model TaylorAI/gte-tiny does not carry to the
      derivative; the owner accepts that risk knowingly. Nothing about the model is bundled or
      redistributed - the user's browser fetches it from huggingface.co on opt-in, as HD-013 already
      permits for the other pinned models. SF-223 records the position in README.md and in a new
      LICENSES.md covering every third-party model and package, and the opt-in copy links to it."
  provisional:
    SF-214: "Provisional recalibration, pending HD-005 sign-off: composite is now a clamped additive
      sum of weighted layer scores (never divided by total weight), hideThreshold 0.6, weights
      behavioural 0.6, content-type 0.5, taste 0.5, image-forensics 0.4, provenance 0.2. A maximal
      single layer alone crosses the threshold; layers reporting zero no longer dilute a fired
      layer. Acceptance evidence is tests/fixtures/posts/calibration.ts driven from pipeline.test.ts."
    HD-006: Drift workflow targets the committed fixture until SLOPFILTER_DRIFT_TARGET names an
      owner-approved live target.
    HD-007: "Embedder pinned to an immutable revision. The classifier half is superseded by HD-018:
      once SF-222 lands, Xenova/mobilebert-uncased-mnli is gone from MODEL_IDS and its unconfirmed
      licensing is moot. Until SF-222 lands the classifier is still pinned and still unconfirmed."
    HD-008: Three PRD content labels, equal treatment, 0.80 confidence cutoff.
    HD-009: No hard-veto rules are enabled until the evidence rules are approved.
    HD-010: onnx-community/CommunityForensics-DeepfakeDet-ViT-ONNX @
      f9fc6516b37cd7d1bec3b94847b3682ce97249f0, q4f16, 384px, max 4 thumbnails per post.
    HD-011: "@contentauth/c2pa-web 0.13.2 with local worker and WASM assets; X strips credentials, layer
