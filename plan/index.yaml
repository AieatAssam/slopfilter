fixtures:
  dom: "tests/fixtures/dom/x/*.html - real captured X markup, sanitised. Class names and inline
    colours are real; X injects its CSS at runtime so the capture carries no stylesheet."
  payload: "tests/fixtures/payload/x/home-timeline.json - synthetic HomeTimeline response matching the
    shape verified over CDP on 2026-08-08 and recorded in SF-216 verified_payload. 21 entries: 18
    organic, 1 promoted, 2 cursors. Regenerate with `node scripts/make-payload-fixture.mjs`; the case
    table in that script names the signal each row exercises. Extend the table rather than editing the
    JSON by hand."
  payload_clock: "Account ages are relative to FIXTURE_NOW 2026-08-08T12:00:00Z. Any signal consuming
    account age takes `now` as an argument and tests pass FIXTURE_NOW. Never Date.now()."

# Standing rules for any injected UI, not only the open tickets above.
ui_rules:
  - "Read the platform, never guess it. Colours, accent, and type come from getComputedStyle on
    probes resolved through selectors.json, with literal fallbacks. X's theme is set in X's
    settings, not the OS, so prefers-color-scheme is never the theme source. X's accent is
    user-selectable, so no accent literal may appear in a rule."
  - "Type is always `font: inherit`. The extension declares no font-family."
  - "Position is a function of the article's box, never of its content. Controls hang off the
    extension's own zero-size .slopfilter-anchor as the article's first child, absolutely
    positioned, consuming no layout space and never changing article height."
  - "The only inline style the extension writes to an X-owned node is the collapse display toggle.
    Everything else is a rule in public/content/styles.css."
  - "Every CSS rule is scoped under a .slopfilter- class. No bare element selectors, no X class
    names, no z-index above 1, no fixed or sticky positioning."
  - "Quiet by default: per-post controls rest at opacity 0 and reveal on hover, :focus-within, or an
    open menu. Never display:none or visibility:hidden - both break keyboard access and the existing
    Playwright locators. Always opaque on coarse pointers."
  - "The collapsed placeholder is always visible, sits in the post's flow position, and wears X's
    cell geometry: cell padding, one bottom border, no card border, no radius, no margin."
  - "Prefer a native platform feature over hand-written UI logic: popover for menus, :has() for
    scoping, color-mix for derived tones."
  - "Accessibility is not negotiable: every control keeps a non-empty accessible name, a 32px hit
    target, a visible focus ring, keyboard reachability, and 4.5:1 text contrast against the sampled
    surface."
  - "Every styling claim is asserted as a computed style or a bounding box in an E2E spec against
    the golden harness route. A styling change with no such assertion is not done."
