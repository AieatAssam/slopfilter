    "@playwright/test": 1.62.1
  gotchas:
    - TypeScript 7 removed baseUrl (TS5102) and rejects non-relative paths targets (TS5090).
    - Vitest 4 removed test.environmentMatchGlobs; per-environment config uses test.projects.
    - "Content scripts are classic scripts: the content bundle is a separate IIFE build
      (vite.content.config.ts), run after build:main which sets emptyOutDir."
    - public/content/styles.css is copied verbatim by publicDir, never imported from TypeScript, or
      Vite renames it and the manifest path breaks.
    - CSP for extension pages is "script-src 'self' 'wasm-unsafe-eval'; object-src 'self'" and must
      not widen further.
decisions:
  answered:
    HD-001: Product name is SlopFilter.
    HD-002: MIT licence; copyright-holder line in LICENSE still needs owner confirmation.
    HD-014: Plain TypeScript and direct DOM APIs for all extension UI. No framework.
    HD-015: Golden fixtures are captured and committed under tests/fixtures/dom/x/. No further live
      capture is authorised.
  reopened:
    HD-004: "Was answered as: estimate posting rate from consecutive timestamps visible in the
      timeline, no profile fetches, no X API. Re-opened 2026-08-08 because the in-viewport
      derivation needs two posts by the same author in one pass, which is rare in For You, so
      postsPerDay is usually null for exactly the accounts the layer exists to catch. SF-215 stays
      inside the original answer: it accumulates timeline sightings across sessions and adds no
      request. SF-216 would additionally read X's own already-fetched timeline response, which adds
      no request either but needs the owner to confirm it is compatible with the privacy claim. An
      authenticated profile or API fetch remains rejected: it requires reading the ct0 cookie to
      forge x-csrf-token, which is credential handling, risks the user's account through unusual
      request patterns, and would rewrite the privacy claim in six places including the SF-207
      grep gate."
  provisional:
    HD-006: Drift workflow targets the committed fixture until SLOPFILTER_DRIFT_TARGET names an
      owner-approved live target.
    HD-007: Classifier and embedder pair pinned to immutable revisions; classifier licensing unconfirmed.
    HD-008: Three PRD content labels, equal treatment, 0.80 confidence cutoff.
    HD-009: No hard-veto rules are enabled until the evidence rules are approved.
    HD-010: onnx-community/CommunityForensics-DeepfakeDet-ViT-ONNX @
      f9fc6516b37cd7d1bec3b94847b3682ce97249f0, q4f16, 384px, max 4 thumbnails per post.
    HD-011: "@contentauth/c2pa-web 0.13.2 with local worker and WASM assets; X strips credentials, layer
      retained for other media."
    HD-012: One shared offscreen document with a dedicated worker, not one model copy per tab.
    HD-013: Runtime downloads from huggingface.co and its CDN; WASM backend, WebGPU disabled after
      benchmarking.
  open:
    HD-003: GitHub owner/name the drift monitor files issues against.
    HD-005: Owner sign-off on the shipped default thresholds in src/core/scoring/weights.ts.
