id: SF-216
summary: Read account age and post count from X's own timeline response instead of inferring them
status: blocked
blocked_on: PAYLOAD-CHECK below, plus owner confirmation that a same-origin read of an
  already-fetched response is compatible with the privacy claim. Do not start until both are
  recorded here.
depends_on:
  - SF-215
why: "X's timeline GraphQL response is believed to carry per-user legacy fields including
  statuses_count and created_at, which are exactly the 'account age vs post count' inputs PRD
  section 4 names and which no amount of DOM scraping can recover. Reading a response the page
  already fetched adds no outbound request, so this is strictly better than SF-215's inference where
  it applies. It is unverified: this repository's fixtures are sanitised DOM with no captured JSON,
  and an attempt to probe the live payload on 2026-08-08 was blocked because Chrome's View >
  Developer > Allow JavaScript from Apple Events was disabled."
payload_check:
  - Run this before anything else. On x.com logged in, open DevTools, Network, filter HomeTimeline,
    scroll the timeline once, and open a response.
  - "Record here: whether a per-user object exists with statuses_count and created_at; the JSON path
    to it; and whether the response is JSON rather than a streamed or chunked format."
  - "If the fields are absent, close this ticket as not viable and rely on SF-215. Do not substitute
    an authenticated profile or API request: that is a separate owner decision with
    credential-handling and account-safety costs, recorded against HD-004."
rules:
  - Zero new outbound requests. This ticket reads a response the page already made and must never
    issue, retry, replay, or prefetch one. A single fetch added here breaks the privacy claim
    asserted in the PRD, README, store listing, privacy page, the plan constraints, and the SF-207
    grep.
  - Never read document.cookie, never construct an x-csrf-token, and never attach credentials to
    anything. If an approach needs either, stop and report.
  - The JSON paths are a drift surface exactly like a CSS selector. Declare them in a versioned
    contract with required and optional flags, cover them in the in-extension self-test, and add
    them to the drift monitor. An unmonitored parse is worse than the DOM scraping it replaces.
  - "Fail open and fail quiet: a missing path, a shape change, or a parse failure yields no-data for
    the layer and never pauses filtering or hides a post."
  - Interception runs in a MAIN-world content script at document_start, because the patch must be
    installed before X application code runs and an isolated-world script cannot see the page fetch.
    MAIN-world scripts have no chrome.* access, so results cross to the isolated world by
    postMessage with an origin check and a shape validator on the receiving end. This is a new
    manifest entry and a new build entry, not an edit to src/content/index.ts.
  - "Persist only derived numbers on the existing SF-215 author record: account created-at, post
    count, and the observation time. Never persist the response, and never persist post text."
  - "Lifetime rate and recent rate stay separate sub-signals with separate reasons, as in SF-215.
    statuses_count over account age is a lifetime average and does not describe current behaviour: a
    ten-year account with 300k posts averages 82 per day and may be dormant, while a two-week
    account with 500 posts is 35 per day and actively spamming."
changes:
  - path: src/adapters/x/payloadContract.json
    do: "Create, mirroring the selectors.json shape: contractVersion, and entries with id, description,
      ordered fallback JSON paths, and a required flag. Entries for the user object, statuses_count,
      created_at, and the screen name used to join it to a handle."
  - path: src/adapters/x/payload.ts
    do: Typed loader, path resolution with fallbacks, and a pure extract(json) returning per-handle
      account stats. No DOM, no chrome.*.
  - path: src/content/interceptor.ts
    do: "MAIN-world script: wrap window.fetch and XMLHttpRequest, match only the timeline endpoints
      named in the contract, clone the response, extract via payload.ts, and postMessage the derived
      per-handle stats to the isolated world. Never buffer or forward the raw response."
  - path: src/content/index.ts
    do: Listen for interceptor messages with an origin check and a shape validator, and write the
      derived stats onto the SF-215 author record. Everything else is unchanged.
  - path: public/manifest.json
    do: Add the MAIN-world content script at document_start, matching the existing host permissions
      only. No new host permission.
  - path: vite.content.config.ts
    do: Emit the interceptor as a second IIFE bundle. It cannot share the existing content bundle, which
      runs in the isolated world.
  - path: src/adapters/x/selftest.ts
    do: Extend the self-test to report payload-contract health separately from selector health, so a
      payload change degrades one signal rather than pausing filtering.
  - path: scripts/check-drift.mjs
    do: Assert the required payload paths alongside the required selectors, with the same distinct exit
      codes for drift and unreachable target.
  - path: tests/fixtures/payload/x/timeline-response.json
    do: "Create a sanitised captured response: real shape and key paths, with handles, ids, text, and
      counts replaced by synthetic values, matching how the DOM fixtures were sanitised."
  - path: tests/unit/adapters/x/payload.test.ts
    do: Extract against the fixture; assert fallback paths, a missing optional path, and that a shape
      change yields no-data rather than a throw.
  - path: e2e/specs/payload-intercept.spec.ts
    do: "Create: the harness serves a stub endpoint returning the fixture, and the spec asserts the
      derived stats reach the author record and that no additional network request was issued."
verify:
  - assert: Derived account stats from an intercepted response reach the author record and feed the
      lifetime sub-signal.
    run: npm run build:test && npm run test:e2e -- e2e/specs/payload-intercept.spec.ts
  - assert: No additional network request is issued by the interceptor, asserted from the recorded
      request list in the spec.
    run: npm run build:test && npm run test:e2e -- e2e/specs/payload-intercept.spec.ts
  - assert: A missing or renamed required path yields no-data and leaves filtering running.
    run: npm run test:unit -- tests/unit/adapters/x/payload.test.ts
  - assert: The drift monitor fails on a deliberately broken payload path with the drift exit code.
    run: node scripts/check-drift.mjs --fixture tests/fixtures/payload/x/timeline-response.json --break
      user-statuses-count
  - assert: No cookie read, no CSRF construction, and no request-issuing call in the interceptor.
    run: node --input-type=module -e "import fs from 'node:fs';const
      s=fs.readFileSync('src/content/interceptor.ts','utf8');for(const p of
      [/document\.cookie/,/csrf/i,/\bfetch\s*\(/,/\.open\s*\(/])if(p.test(s))throw new
      Error('interceptor must only observe, matched '+p);console.log('ok')"
  - assert: The captured payload fixture contains no real handle, post id, or post text.
    run: node --input-type=module -e "import fs from 'node:fs';const
      s=fs.readFileSync('tests/fixtures/payload/x/timeline-response.json','utf8');if(!/synthetic|account0|example/i.test(s))throw
      new Error('payload fixture does not look sanitised');console.log('ok')"
  - assert: The full suite is green.
    run: npm run lint && npm run typecheck && npm run test:unit && npm run build:test && npm run
      test:e2e
