id: SF-213
summary: Add a per-post inspector modal exposing every signal, its raw value, and why it did not fire
depends_on: []
why: Detection is weak in real use and there is no way to see why. The breakdown panel only exists
  on hidden posts and only lists layers that produced a contribution, so a layer that returned score
  0 is indistinguishable from a layer that never ran, was disabled, was gated out before the model,
  or had no data. Every tuning decision (HD-005 weights, HD-008 confidence cutoff, the content-type
  lexical gate) is currently guesswork for want of these numbers.
rules:
  - Available on every post, hidden or not. A post that was not hidden is the case most in need of
    explanation.
  - Read-only. The inspector changes no score, no setting, and no stored state.
  - Diagnostics are additive to SignalResult and optional, so src/core stays pure and every existing
    caller keeps compiling. No signal may change its score to produce a nicer diagnostic.
  - "A layer that did not contribute must report which of these it was: disabled in settings, model
    unavailable, pre-model gate not matched, below its own confidence or similarity cutoff, no data
    available, or genuinely scored 0."
  - "Show raw pre-threshold values, not just post-threshold outcomes: the classifier label scores
    before the confidence cutoff, the top cosine similarity before the taste cutoff, and postsPerDay
    with the observed post count and window that produced it."
  - Use a native <dialog> with showModal. No hand-written focus trap, backdrop, or Escape handler.
  - "Copy safety still applies: no diagnostic string may claim, imply, or hedge AI authorship. Layer
    ids and numbers only."
  - "The inspector trigger obeys ui_rules: it mounts in the SF-210 anchor when present, is quiet
    until hover or focus, and carries an accessible name."
changes:
  - path: src/core/scoring/types.ts
    do: "Add an optional detail field to SignalResult: { status: 'scored' | 'disabled' | 'unavailable' |
      'gated' | 'below-cutoff' | 'no-data'; values?: Readonly<Record<string, number | string |
      boolean | null>> }. Add the same optional detail to ScoreBreakdown.contributions entries, plus
      totalWeight and requiredDelta (how much composite was short of threshold) on ScoreBreakdown.
      All additive and optional."
  - path: src/core/scoring/pipeline.ts
    do: "Carry each result detail through to its contribution, and populate totalWeight and
      requiredDelta. No change to how the verdict is reached: SF-214 owns that."
  - path: src/core/signals/behavioural.ts
    do: Return detail.values with postsPerDay, observedPostCount, observationWindowHours,
      engagementRatio, and engagementStrength, and status 'no-data' when activity is null or
      postsPerDay could not be derived.
  - path: src/core/signals/contentType.ts
    do: Return detail.values with every label and its raw score, the winning label, the confidence
      cutoff in force, and whether the lexical gate matched. Status 'gated' when
      shouldClassifyContent was false, 'below-cutoff' when the top score was under the cutoff.
  - path: src/core/signals/taste.ts
    do: Return detail.values with the top cosine similarity, the centroid count, and the cutoff. Status
      'no-data' when there are no centroids, 'below-cutoff' when similarity was under the cutoff.
  - path: src/core/signals/provenance.ts
    do: Return detail.values with the thumbnail count inspected and whether a manifest was found, with
      the matching status.
  - path: src/core/signals/imageForensics.ts
    do: Return detail.values with the thumbnail count scored and the per-thumbnail scores, with the
      matching status.
  - path: src/offscreen/protocol.ts
    do: Carry the detail field on score-batch responses so classifier and forensics diagnostics survive
      the offscreen hop. Add a per-layer unavailable result when a model failed to load, rather than
      omitting the layer.
  - path: src/shared/messages.ts
    do: Widen the score-batch response validator for the added optional fields. A response without them
      stays valid.
  - path: src/content/inspector.ts
    do: "Create. openInspector(post, breakdown) builds a <dialog data-testid=\"slopfilter-inspector\">,
      calls showModal, and renders three sections: post facts (id, handle, posted-at, text length,
      image count, engagement counts as extracted by the adapter); one row per layer with id,
      enabled, status, raw score, weight, weighted contribution, reason, and its detail values; and
      totals with composite, total weight, threshold, verdict, and how far short of the threshold it
      fell. Close via the dialog's own close button and Escape."
  - path: src/content/feedback.ts
    do: Add a quiet 'Why this score' trigger to the control cluster, mounted in the anchor when present,
      opening the inspector for that post. Keep the existing controls and their accessible names
      unchanged.
  - path: src/content/index.ts
    do: Keep the last ScoreBreakdown per post id so the inspector shows the post-model breakdown rather
      than the first-pass behavioural-only one, and pass it to attachFeedbackControls on both render
      passes.
  - path: public/content/styles.css
    do: "Style .slopfilter-inspector from the sampled tokens: dialog surface, its ::backdrop, a
      monospace numeric column, and rows that stay readable at 320px. Scoped under .slopfilter- as
      always."
  - path: tests/unit/content/inspector.test.ts
    do: Create. A breakdown with one scored, one gated, one below-cutoff, and one unavailable layer
      renders four rows carrying those statuses and their raw values; totals show composite,
      threshold, and the shortfall; no rendered string matches the AI-authorship pattern.
  - path: tests/unit/core/scoring/pipeline.test.ts
    do: Assert detail is carried through to contributions and that totalWeight and requiredDelta are
      correct.
  - path: e2e/specs/inspector.spec.ts
    do: Create, covering the first three verify entries.
verify:
  - assert: A visible, non-hidden post opens the inspector and shows one row per configured layer,
      including layers that scored 0.
    run: npm run build:test && npm run test:e2e -- e2e/specs/inspector.spec.ts
  - assert: A hidden post opens the inspector and its totals match the reason label already shown on the
      placeholder.
    run: npm run build:test && npm run test:e2e -- e2e/specs/inspector.spec.ts
  - assert: The dialog closes on Escape and returns focus to its trigger, with no custom key handler in
      the source.
    run: npm run build:test && npm run test:e2e -- e2e/specs/inspector.spec.ts
  - assert: Each non-contributing layer renders a status distinguishing disabled, unavailable, gated,
      below-cutoff, and no-data from a genuine 0.
    run: npm run test:unit -- tests/unit/content/inspector.test.ts
  - assert: "Raw pre-cutoff values are shown: classifier label scores, taste top similarity, and
      postsPerDay with its observation window."
    run: npm run test:unit -- tests/unit/content/inspector.test.ts
  - assert: No inspector string claims or implies AI authorship.
    run: node --input-type=module -e "import fs from 'node:fs';const
      s=fs.readFileSync('src/content/inspector.ts','utf8');if(/\b(ai-written|ai generated|written by
      ai|synthetic|authored by)\b/i.test(s))throw new Error('authorship claim in inspector
      copy');console.log('ok')"
  - assert: The full suite is green.
    run: npm run lint && npm run typecheck && npm run test:unit && npm run build:test && npm run
      test:e2e
