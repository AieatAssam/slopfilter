id: SF-214
summary: Fix the scoring combination so a single strong layer can hide a post, per PRD section 4
depends_on:
  - SF-213
why: "scorePost divides the summed weighted scores by the total weight of usable layers, so it
  computes a weighted mean while PRD section 4 specifies a weighted additive score. Quiet layers
  dilute loud ones. Measured on 2026-08-08 with the shipped defaults: behavioural 1.0 alone scores
  1.000 and hides, the same post with two model layers reporting 0 scores 0.500 and does not, with
  four it scores 0.400, and a content-type result of 0.95 confidence scores 0.237. Maximum reachable
  by behavioural alone is 0.4/0.8 = 0.5, under the 0.6 threshold, so no single layer can ever hide a
  post once the models report, and detection gets worse when models load. This is the cause of the
  reported weak detection, not classifier conservatism."
rules:
  - "Composite is additive: the sum of weighted layer scores, clamped to 1. Never divided by total
    weight."
  - "Additivity alone is not enough: with the shipped weights behavioural 1.0 sums to 0.4 and still
    misses 0.6. Weights and threshold must be recalibrated together as one change, and the
    calibration table below is the acceptance evidence."
  - "Provisional recalibration, pending HD-005 sign-off: behavioural 0.6, content-type 0.5, taste
    0.5, image-forensics 0.4, provenance 0.2, hideThreshold 0.6. Record it in the plan decisions as
    provisional, not as an owner decision."
  - "Fail-open is unchanged: a layer that is unavailable, disabled, or gated contributes nothing and
    never raises the composite. Absence of evidence must never hide a post."
  - Do not compensate by lowering the content-type confidence cutoff or widening the lexical gate in
    this ticket. Those are HD-008 recall questions to settle with data from the SF-213 inspector,
    and changing two things at once makes the calibration unreadable.
  - "Do not assume behavioural is usually no-data: SF-215 and SF-216 make it reliable. Every
    calibration row must state each layer's availability explicitly, so the table stays correct
    once posting rate starts firing."
  - Existing settings persist user weights. Migrate stored weights that still match the old defaults
    to the new defaults; leave user-modified weights untouched and note the change on the options
    page.
changes:
  - path: src/core/scoring/pipeline.ts
    do: Replace the mean with a clamped additive sum of weighted scores over usable layers. Keep the
      veto path, the contributions array, and the SF-213 detail passthrough unchanged.
  - path: src/core/scoring/weights.ts
    do: Apply the provisional recalibrated weights and threshold, with a comment naming HD-005 and the
      measurement that motivated them.
  - path: src/storage/settings.ts
    do: Migrate stored weights equal to the previous defaults to the new defaults on load. Leave any
      user-modified value alone.
  - path: tests/fixtures/posts/calibration.ts
    do: "Create a calibration table, each row carrying a written derivation of its expected composite so
      no expected number can be fabricated: a spam account with behavioural 1.0 and quiet models
      hides; a normal post with every layer at 0 does not; a 0.95 classifier result with weak
      behavioural 0.3 hides; a 0.95 classifier result alone does not; a taste match of 0.9 with
      quiet other layers does not hide on its own; all layers unavailable does not hide."
  - path: tests/unit/core/scoring/pipeline.test.ts
    do: "Drive the calibration table and assert the mean is gone: a post with one layer at 1.0 must not
      score lower when additional layers report 0."
  - path: tests/unit/storage/settings.test.ts
    do: Assert old-default weights migrate and user-modified weights do not.
  - path: e2e/specs/filtering.spec.ts
    do: Add a case where a high-frequency account is hidden while the model layers report zero, which is
      the real-world failure this ticket fixes.
verify:
  - assert: Adding layers that score 0 never lowers the composite of a post whose other layers fired.
    run: npm run test:unit -- tests/unit/core/scoring/pipeline.test.ts
  - assert: Every calibration row reaches its documented verdict.
    run: npm run test:unit -- tests/unit/core/scoring/pipeline.test.ts
  - assert: A spam account is hidden end to end while the model layers report zero.
    run: npm run build:test && npm run test:e2e -- e2e/specs/filtering.spec.ts
  - assert: Stored weights matching the old defaults migrate; user-modified weights do not.
    run: npm run test:unit -- tests/unit/storage/settings.test.ts
  - assert: pipeline.ts no longer divides by a summed weight.
    run: node --input-type=module -e "import fs from 'node:fs';const
      s=fs.readFileSync('src/core/scoring/pipeline.ts','utf8');if(/\/\s*totalWeight/.test(s))throw
      new Error('composite is still a weighted mean');console.log('ok')"
  - assert: The full suite is green.
    run: npm run lint && npm run typecheck && npm run test:unit && npm run build:test && npm run
      test:e2e
