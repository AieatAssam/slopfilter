id: SF-209
summary: Derive injected-UI colour and type tokens from X's computed styles instead of hardcoding them
depends_on:
  - SF-208
why: "public/content/styles.css hardcodes X's light palette, the accent rgb(29, 155, 240), a system
  font stack, and switches theme on @media (prefers-color-scheme: dark). All four are wrong: X's
  theme is chosen in X's settings (Default, Dim, Lights out) and not from the OS, the accent is
  user-selectable from six colours, and X's type is TwitterChirp. Read the platform, the way the
  selector contract already does."
rules:
  - Probe elements resolve through src/adapters/x/selectors.json. No new hardcoded X selector
    outside the contract.
  - Every token has a literal fallback for a missing, empty, or transparent computed value. A
    missing probe must never yield invisible controls.
  - Tokens are written as --slopfilter-* custom properties on document.documentElement once per
    theme change, never per post, which would breach the performance budget.
  - "Injected elements use font: inherit. No font-family declaration may remain in styles.css."
  - Read computed styles only. Never read or write an X node's inline style.
changes:
  - path: src/adapters/x/selectors.json
    do: 'contractVersion 1.3.0. Add three entries, all required false so a probe change can never pause
      filtering: theme-surface selecting body; theme-accent selecting
      [data-testid="tweetButtonInline"] then [data-testid="SideNav_NewTweet_Button"];
      theme-separator selecting [data-testid="cellInnerDiv"] > div then
      article[data-testid="tweet"].'
  - path: src/content/themes.ts
    do: 'Keep the existing exports. Add readThemeTokens(doc) returning --slopfilter-surface, -text,
      -text-muted, -border, -accent sampled from the three probes, with -text-muted and -border
      derived via color-mix(in srgb, ...) rather than more probes. Fallbacks: surface rgb(255, 255,
      255), text rgb(15, 20, 25), accent rgb(29, 155, 240). Add applyThemeTokens(doc) writing them
      onto documentElement.style, and observeTheme(doc, onChange) using one MutationObserver on body
      with attributeFilter ["style", "class"], returning a disconnect function.'
  - path: src/content/index.ts
    do: Call applyThemeTokens once in start and register observeTheme. Never from the per-post path.
  - path: public/content/styles.css
    do: "Replace the hardcoded palette, the .slopfilter-theme-x colour block, and the
      prefers-color-scheme block with var(--slopfilter-*, fallback). Add font: inherit to every
      injected element. Keep existing class names, the .slopfilter- scoping, and the focus-visible
      outlines so no current test changes."
  - path: tests/unit/content/theme.test.ts
    do: "Create: light body, lights-out body, missing accent probe, transparent computed value,
      observeTheme firing once per body style change and stopping after disconnect."
  - path: tests/unit/adapters/x/selectors.test.ts
    do: Assert the three new entries exist and are required false.
  - path: e2e/specs/styling-theme.spec.ts
    do: Create, covering the last four verify entries.
verify:
  - assert: styles.css contains no font-family, no prefers-color-scheme, and no literal rgb(29, 155, 240).
    run: node --input-type=module -e "import fs from 'node:fs';const
      c=fs.readFileSync('public/content/styles.css','utf8');for(const p of
      [/font-family/,/prefers-color-scheme/,/29,?\s*155,?\s*240/])if(p.test(c))throw new
      Error('styles.css still matches '+p);console.log('ok')"
  - assert: Sampling returns probe values when present and the documented fallbacks when absent or
      transparent.
    run: npm run test:unit -- tests/unit/content/theme.test.ts
  - assert: Injected UI tracks each of X's three themes, asserted on computed background-color and color.
    run: npm run build:test && npm run test:e2e -- e2e/specs/styling-theme.spec.ts
  - assert: A non-default accent set on the page becomes the Show anyway control's computed
      background-color.
    run: npm run build:test && npm run test:e2e -- e2e/specs/styling-theme.spec.ts
  - assert: A theme change after injection restyles already-injected UI without a reload.
    run: npm run build:test && npm run test:e2e -- e2e/specs/styling-theme.spec.ts
  - assert: "Sampling is not per post: a jsdom spy shows applyThemeTokens called once on start, once per
      observeTheme fire, and zero times from the batch-scoring path. Do not try to count
      getComputedStyle from a spec: the content script runs in an isolated world and a page-world
      patch never sees its calls."
    run: npm run test:unit -- tests/unit/content/theme.test.ts
