id: SF-215
summary: Derive posting rate from a persistent cross-session author observation cache instead of one
  viewport
depends_on:
  - SF-213
why: "deriveAuthorActivity needs two posts by the same author visible in the same timeline pass,
  which is rare in For You, so postsPerDay is usually null and the behavioural layer scores 0 for
  exactly the spam accounts it exists to catch. Sightings accumulated across sessions give a real
  rate over days, and the sampling bias helps rather than hurts: an account posting 40 times a day
  appears in the timeline far more often than one posting twice. Zero new requests, so the privacy
  claim is untouched."
rules:
  - No network request of any kind. This ticket reads only what the timeline already rendered and
    what the user already navigated to.
  - "Store per author: first-seen, last-seen, and distinct post ids with their timestamps. Post ids
    and timestamps only. Never post text, which the privacy claim forbids persisting."
  - "Cap and evict the way the embedding store does: a hard author cap with oldest-last-seen
    eviction enforced inside the write transaction, and a per-author cap on retained post ids. State
    both numbers in the implementation."
  - Rate is derived from distinct post ids over the observed span, not from sighting count. Seeing
    the same post on ten scrolls is one post.
  - A span shorter than a documented minimum yields no-data rather than a rate extrapolated from
    minutes. Extrapolating 3 posts in 4 minutes to 1080 per day is how false positives happen.
  - Report the lifetime rate and the recent rate as separate sub-signals with separate reasons, as
    PRD section 4 names both 'account post frequency' and 'account age vs post count'. Never let one
    stand in for the other.
  - "Opportunistic profile capture only: if the user navigates to an author profile, read the join
    date and post count already in the DOM through the selector contract. Never navigate there to
    collect it."
  - src/core stays pure. The cache is storage, and derivation takes observations as an argument.
  - "Fail open: an unavailable or empty cache yields a no-data behavioural result, never a hide."
changes:
  - path: src/storage/authorActivity.ts
    do: "Create, alongside the existing account-keyed store in src/storage/accounts.ts. IndexedDB, keyed
      by handle: firstSeen, lastSeen, a bounded map of post id to timestamp, and optional
      profileJoinDate and profilePostCount from opportunistic capture. Expose
      recordSightings(handle, posts), getActivity(handle), and pruning inside the write
      transaction."
  - path: src/core/signals/behavioural.ts
    do: Extend AuthorActivity with observedSpanHours, distinctPostCount, lifetimePostsPerDay, and
      accountAgeDays, all nullable. Derive a recent rate from distinct post ids over the observed
      span and a lifetime rate from profile post count over account age, and emit them as separate
      contributions with separate reasons. Keep deriveAuthorActivity working from an in-viewport
      post list so the existing tests and the fail-open path are unchanged.
  - path: src/adapters/x/selectors.json
    do: Add profile-join-date and profile-post-count entries, both required false, so a profile-page
      markup change can never pause timeline filtering.
  - path: src/adapters/x/adapter.ts
    do: Add an optional readProfileStats(document) returning join date and post count when the current
      page is a profile, resolved through the new contract entries.
  - path: src/content/index.ts
    do: Record sightings for every extracted post before scoring, and read the cached activity for the
      post author instead of deriving from seenPosts alone. Keep the in-viewport derivation as the
      fallback when the cache has nothing. Call readProfileStats once per profile navigation, never
      on the timeline.
  - path: tests/unit/storage/authorActivity.test.ts
    do: "Create: distinct-id deduplication, author cap eviction by oldest lastSeen, per-author post-id
      cap, and that pruning happens inside the write transaction."
  - path: tests/unit/core/scoring/behavioural.test.ts
    do: Cover the minimum-span guard, distinct-id rate derivation, lifetime rate from profile stats,
      both sub-signals firing independently, and no-data when the cache is empty.
  - path: e2e/specs/author-activity.spec.ts
    do: Create, covering the first two verify entries.
verify:
  - assert: An author seen across two separate page loads is scored from the accumulated sightings, not
      from the current viewport alone.
    run: npm run build:test && npm run test:e2e -- e2e/specs/author-activity.spec.ts
  - assert: Repeated sightings of the same post id do not inflate the rate.
    run: npm run build:test && npm run test:e2e -- e2e/specs/author-activity.spec.ts
  - assert: An observation span under the documented minimum yields no-data rather than an extrapolated
      rate.
    run: npm run test:unit -- tests/unit/core/scoring/behavioural.test.ts
  - assert: The recent rate and the lifetime rate appear as separate contributions with separate reasons.
    run: npm run test:unit -- tests/unit/core/scoring/behavioural.test.ts
  - assert: The author cap evicts by oldest last-seen inside the write transaction.
    run: npm run test:unit -- tests/unit/storage/authorActivity.test.ts
  - assert: No post text is persisted by the activity store.
    run: node --input-type=module -e "import fs from 'node:fs';const
      s=fs.readFileSync('src/storage/authorActivity.ts','utf8');if(/\.text\b/.test(s))throw new
      Error('activity store must never persist post text');console.log('ok')"
  - assert: No network call was added.
    run: node --input-type=module -e "import fs from 'node:fs';const
      s=['src/storage/authorActivity.ts','src/content/index.ts','src/adapters/x/adapter.ts'].map(f=>fs.readFileSync(f,'utf8')).join('');if(/\b(fetch|XMLHttpRequest|sendBeacon|EventSource|WebSocket)\s*\(/.test(s))throw
      new Error('SF-215 must add no outbound request');console.log('ok')"
  - assert: The full suite is green.
    run: npm run lint && npm run typecheck && npm run test:unit && npm run build:test && npm run
      test:e2e
