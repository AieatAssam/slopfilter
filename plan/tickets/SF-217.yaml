id: SF-217
summary: Score recently created accounts that post at high volume as a graded behavioural sub-signal
depends_on:
  - SF-216
why: "Account age and post count are both now available per author from the HomeTimeline payload
  (SF-216), which makes the cohort-plus-volume pattern computable for the first time. A young
  account posting at industrial volume is the shape most content-farm output takes, and neither
  number alone carries it: a 2638-day account at 13.7 posts per day is unremarkable, and a 90-day
  account with 40 posts is nothing, but a 200-day account at 60 posts per day is a strong slop
  indicator."
rules:
  - Graded, never binary. Volume carries the score and account recency modulates it. A hard rule of
    the form 'created after DATE means slop' is wrong and would punish every legitimate new account.
  - Never a veto and never sufficient alone. This is one contribution among the layer's sub-signals,
    and its provisional weight must leave a single fire below the hide threshold.
  - "Reason copy states the two observed facts and nothing else, for example 'account created March
    2025, posts 62 times per day'. Never mention AI, models, bots, or authorship: the correlation is
    not evidence of how a post was written, and PRD section 8 forbids the claim."
  - The cohort cutoff is a named, documented, user-tunable setting, defaulting provisionally to
    2022-11-30, the public launch of ChatGPT, which is the date the owner means by 'since LLMs
    became popular'. Record it as provisional under HD-005 rather than as a settled default.
  - "Cohort recency is a ramp, not a step: an account created the day before the cutoff and one
    created the day after must not receive materially different treatment. Ramp the factor from 0 to
    1 across a documented window either side."
  - "Guard against small numbers: below a documented minimum account age and minimum post count,
    return no-data. A three-day-old account with 30 posts computes to 10 per day on noise."
  - Unknown or unparseable account_created_at yields no-data, never a fire. Fail open.
  - Use the higher of the SF-216 lifetime rate and the SF-215 recent rate, and record in the detail
    which one was used. A ten-year account bought and repurposed for spam has a harmless lifetime
    average and a damning recent one.
  - Expose both raw inputs and the chosen rate to the SF-213 inspector, not merely the resulting
    score. The whole point of this signal is that its inputs are legible.
  - "Account age must be computed from an injected `now`, never Date.now(). The payload fixture
    tests/fixtures/payload/x/home-timeline.json encodes ages against FIXTURE_NOW 2026-08-08T12:00:00Z,
    so a signal reading the wall clock drifts and its calibration rows fail on a later date."
changes:
  - path: src/core/signals/behavioural.ts
    do: "Add scoreAccountCohort(stats, config) as a distinct SignalResult contribution: a volume ramp
      from a floor to a ceiling in posts per day, multiplied by a recency ramp across the cutoff
      window, with the minimum-age and minimum-post-count guards and the no-data paths. Pure, taking
      the cutoff and thresholds as arguments."
  - path: src/core/scoring/weights.ts
    do: "Add provisional defaults with a comment naming HD-005 and the reasoning: cohortCutoff
      2022-11-30, cohortRampDays 180, volumeFloorPerDay 20, volumeCeilingPerDay 100,
      minAccountAgeDays 14, minPostCount 100. Give the sub-signal a weight low enough that a single
      maximal fire stays under the hide threshold."
  - path: src/storage/settings.ts
    do: Persist the cutoff date and the volume floor and ceiling, with validation and clamping,
      defaulting to the values above.
  - path: src/ui/options/options.html
    do: Add a labelled date input for the cohort cutoff and number inputs for the volume floor and
      ceiling, with help text explaining that the cutoff describes when an account was created, not
      what it posts.
  - path: src/ui/options/options.ts
    do: Bind the three controls to settings, including reset-to-default.
  - path: tests/fixtures/posts/cohort.ts
    do: "Calibration table, each row carrying a written derivation: a 200-day account at 60 per day
      fires strongly; a 2638-day account at 13.7 per day does not fire; a 985-day account at 14.5
      per day fires weakly; a 10-day account at 40 per day returns no-data on the age guard; an
      account with 80 posts returns no-data on the count guard; an account created one day either
      side of the cutoff differs only marginally; a missing created_at returns no-data."
  - path: tests/unit/core/scoring/behavioural.test.ts
    do: Drive the calibration table, and assert a single maximal cohort fire does not by itself cross
      the hide threshold.
  - path: e2e/specs/cohort-signal.spec.ts
    do: "Create: harness serves payload fixtures for a young high-volume author and an old
      moderate-volume author, and the spec asserts only the former is affected and that the reason
      names the two observed facts."
verify:
  - assert: Every calibration row reaches its documented outcome, including both guards and the ramp
      symmetry either side of the cutoff.
    run: npm run test:unit -- tests/unit/core/scoring/behavioural.test.ts
  - assert: A single maximal cohort fire does not on its own cross the hide threshold.
    run: npm run test:unit -- tests/unit/core/scoring/behavioural.test.ts
  - assert: The higher of the lifetime and recent rate is used, and the detail records which.
    run: npm run test:unit -- tests/unit/core/scoring/behavioural.test.ts
  - assert: A young high-volume author is scored and an old moderate-volume author is not, end to end.
    run: npm run build:test && npm run test:e2e -- e2e/specs/cohort-signal.spec.ts
  - assert: The cutoff, floor, and ceiling round-trip through settings and the options page.
    run: npm run build:test && npm run test:e2e -- e2e/specs/cohort-signal.spec.ts
  - assert: No cohort reason string mentions AI, bots, models, or authorship.
    run: node --input-type=module -e "import fs from 'node:fs';const
      s=fs.readFileSync('src/core/signals/behavioural.ts','utf8');if(/\b(ai|bot|model|generated|synthetic|authored)\b/i.test(s.replace(/[A-Za-z]*[Mm]odel[A-Za-z]*Id/g,'')))throw
      new Error('cohort copy must state observed facts only');console.log('ok')"
  - assert: The full suite is green.
    run: npm run lint && npm run typecheck && npm run test:unit && npm run build:test && npm run
      test:e2e
