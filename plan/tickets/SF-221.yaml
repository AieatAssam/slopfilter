id: SF-221
summary: Add a labelled calibration corpus and a false-positive gate so signal changes cannot silently
  regress the pipeline
depends_on:
  - SF-214
  - SF-219
  - SF-220
why: "The pipeline now has six contributions and a threshold, and every one of them is a provisional
  number under HD-005 that nobody can currently evaluate: the shipped tests assert per-signal
  behaviour but nothing asserts what the combined pipeline does to a feed. That is exactly how the
  known_defect went unnoticed until it was measured by hand on 2026-08-08 - a weighted mean that
  degrades as models load is invisible to per-signal unit tests. The detection literature is
  consistent that the failure mode users abandon a filter over is false positives, not misses, so the
  gate must be asymmetric: FALSE_POSITIVE_CEILING 0.05 on posts labelled ordinary, and a
  reported, non-blocking recall number on posts labelled slop."
rules:
  - "The corpus is committed, hand-labelled, and derived only from already-authorised sources: the
    golden DOM fixtures (HD-015) and the synthetic payload fixture. No new live capture is
    authorised, and none is needed."
  - "Every row carries a written label rationale. A row nobody can justify in one sentence does not
    belong in the corpus."
  - "Two classes only - ordinary and slop - plus an explicitly labelled hard-negative set: terse
    posts, non-native English phrasing, non-Latin scripts, quote-posts, breaking-news wording, and
    high-volume legitimate accounts such as news and sports feeds. The hard negatives exist because
    every published detector family fails on exactly these, with documented bias against non-native
    English writing."
  - "The gate blocks on false positives only. FALSE_POSITIVE_CEILING 0.05 over the union of the
    ordinary and hard-negative rows is a hard failure when exceeded; recall on the slop rows is
    printed and recorded, never enforced, and no recall number may fail the build. Both numbers are
    provisional under HD-005."
  - "Corpus size is named, not left to judgement: MIN_CORPUS_ROWS 120, of which at least 40 are
    hard-negative and at least 40 are slop. Below those counts the report exits non-zero, because a
    0.05 ceiling over 20 rows measures nothing."
  - "The report prints per-signal fire counts alongside the composite outcome, so a regression can be
    attributed to a layer rather than guessed at."
  - Run at the default settings and at the default settings with every model layer disabled. Both
    configurations must hold the false-positive ceiling, because the second is the first-run state.
  - Never weaken the ceiling to make a change pass. A breach is reported, exactly as a budget breach
    is.
  - The corpus is a fixture, not a model. Nothing here trains, fits, or fine-tunes anything.
changes:
  - path: tests/fixtures/posts/corpus.json
    do: "Create: at least MIN_CORPUS_ROWS 120 hand-labelled rows {id, source, text, author,
      engagement, label, hardNegative, rationale} drawn from the golden DOM fixtures and the payload
      fixture, with at least 40 hard-negative rows and at least 40 slop rows."
  - path: scripts/calibration-report.mjs
    do: "Create: score every corpus row through the real pipeline at default settings and at
      models-disabled settings, print a table of false-positive rate, recall, per-signal fire counts,
      and every misclassified row with its rationale, and exit non-zero when the false-positive
      ceiling is breached."
  - path: package.json
    do: Add a calibration script entry invoking the report.
  - path: tests/unit/core/scoring/calibration.test.ts
    do: Assert the false-positive ceiling holds in both configurations, assert every hard-negative row
      stays visible, and assert the report exits non-zero on a deliberately broken threshold.
  - path: plan/index.yaml
    do: Record the measured false-positive rate and recall of both configurations in state, with the
      date they were measured.
verify:
  - assert: The false-positive ceiling holds at default settings and with every model layer disabled.
    run: npm run test:unit -- tests/unit/core/scoring/calibration.test.ts
  - assert: Every hard-negative row stays visible.
    run: npm run test:unit -- tests/unit/core/scoring/calibration.test.ts
  - assert: The report runs and prints per-signal fire counts and recall.
    run: npm run calibration
  - assert: The corpus meets its size floors and every row carries a non-empty rationale and a label
      in the allowed set.
    run: node --input-type=module -e "import fs from 'node:fs';const
      rows=JSON.parse(fs.readFileSync('tests/fixtures/posts/corpus.json','utf8'));if(rows.length<120)throw
      new Error('corpus has '+rows.length+' rows, MIN_CORPUS_ROWS is
      120');if(rows.filter(r=>r.hardNegative).length<40)throw new Error('fewer than 40 hard-negative
      rows');if(rows.filter(r=>r.label==='slop').length<40)throw new Error('fewer than 40 slop
      rows');for(const r of rows){if(!['ordinary','slop'].includes(r.label))throw new Error('bad label
      '+r.label+' on '+r.id);if(!r.rationale||!r.rationale.trim())throw new Error('row '+r.id+' has no
      rationale');}console.log('ok')"
  - assert: The full suite is green.
    run: npm run lint && npm run typecheck && npm run test:unit && npm run build && npm run build:test
      && npm run test:e2e
