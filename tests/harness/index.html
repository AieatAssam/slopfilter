<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SlopFilter harness</title>
    <style>
      article[data-testid="tweet"] {
        border-block-end: 1px solid var(--slopfilter-border, rgb(239 243 244));
        padding: 12px 16px;
      }
    </style>
  </head>
  <body>
    <main data-testid="primaryColumn">
      <section aria-label="Timeline: Your Home Timeline">
        <article data-testid="tweet" data-post-id="placeholder-1">
          <div data-testid="User-Name"><div dir="ltr">Account 01</div><div dir="ltr"><a href="/placeholder-1/status/placeholder-1">@placeholder-1</a></div></div>
          <div data-testid="tweetText">A placeholder post for the local harness.</div>
          <time datetime="2026-08-05T09:00:00.000Z">1h</time>
        </article>
        <article data-testid="tweet" data-post-id="placeholder-2">
          <div data-testid="User-Name"><div dir="ltr">Account 02</div><div dir="ltr"><a href="/placeholder-2/status/placeholder-2">@placeholder-2</a></div></div>
          <div data-testid="tweetText">Another placeholder post for deterministic tests.</div>
          <time datetime="2026-08-05T08:00:00.000Z">2h</time>
        </article>
        <article data-testid="tweet" data-post-id="placeholder-3">
          <div data-testid="User-Name"><div dir="ltr">Account 03</div><div dir="ltr"><a href="/placeholder-3/status/placeholder-3">@placeholder-3</a></div></div>
          <div data-testid="tweetText">A third placeholder post in the timeline.</div>
          <time datetime="2026-08-05T07:00:00.000Z">3h</time>
        </article>
      </section>
    </main>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
