              needed, and a privacy declaration matching the privacy page exactly. It contains no
              authorship claim and no screenshot or binary asset.
          - path: public/manifest.json
            change: modify
            detail: "No new permission is added. The onboarding and privacy pages are extension pages served from the existing extension origin."
          - path: vite.config.ts
            change: modify
            detail: "Add 'ui/onboarding/onboarding' and 'ui/privacy/privacy' to rollupOptions.input so both pages are emitted into dist/."
          - path: e2e/specs/onboarding.spec.ts
            change: create
            detail: "Uses the extension fixture. Two tests matching the two test cases declared in e2e_validation below."
        instructions:
