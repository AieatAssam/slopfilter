        - Relevant negative path passes, or is explicitly approved as not applicable
        - Test is isolated and parallel-safe
        - Test creates unique data and performs cleanup
        - Test has no fixed delays, sleeps, or arbitrary waits
        - Browser-visible user result and persisted final state are verified
        - Failure artefacts are configured and available

  - id: SF-106
    title: Add weighted multi-layer scoring with hard-veto rules and a tunable threshold
    type: feature
    priority: P0
    status: planned
    description: >-
      Extend src/core/scoring/pipeline.ts and src/core/scoring/weights.ts to combine every available
      layer using per-layer weights, apply the hard-veto rules fixed by HD-009, and read the hide
      threshold and weights from user settings rather than from constants.
    reason: "PRD section 4 specifies a weighted additive score with hard-veto rules and user-tunable weights, with sensible defaults for the common case. This is where the five layers become one decision."
    user_value: "Multiple weak signals combine into one confident, explainable decision the user can tune."
    depends_on: [SF-008, SF-102, SF-104]
    blocks: [SF-107, SF-108]
    estimated_complexity: M
    risk_level: high
    risks:
      - risk: "A veto rule is invented from the PRD's single parenthetical example, which references an AI-watermark signal that does not exist in any of the five layers, so the rule can never fire or fires on the wrong input."
        mitigation: "Blocked on HD-009. If HD-009 selects the zero-rules option, VETO_RULES ships as an empty frozen array and a test asserts it is empty, which is an honest, verifiable state rather than a guess."
      - risk: "A veto bypasses the weighted score and hides a post outright, producing a wrong call with no recourse."
        mitigation: "Every veto must still produce a reason string rendered in the placeholder, and the wrong-call control from SF-105 remains available. A test asserts a vetoed post's breakdown carries at least one reason."
      - risk: "Changing weights silently invalidates the SF-008 fixture expectations, so the suite goes green against the wrong arithmetic."
        mitigation: "The scoring fixture entries each carry a derivation string, and this ticket requires every derivation to be recomputed and re-reviewed when weights change."
    constraints:
      - "The composite score must remain in the inclusive range 0 to 1 for every input."
      - "A post with no usable signal results must still never be hidden, preserving the SF-008 fail-open guarantee."
      - "Every veto must attach a reason string. A silent veto is forbidden."
      - "Weights and threshold are read from injected settings. src/core/ must not read chrome.storage itself."
      - "If HD-009 selects zero veto rules, VETO_RULES must be an empty frozen array, not a placeholder rule."
    prerequisites:
      - "SF-008, SF-102, and SF-104 complete."
      - "HD-005 answered: default weights and the hide threshold are fixed."
      - "HD-009 answered: the exact veto rules, or an explicit decision to ship none."
    acceptance_criteria:
      - id: SF-106-AC1
        statement: "The composite score is within 0 and 1 inclusive for every fixture entry and for a synthetic all-maximum input."
        verification: "Run `npm run test:unit -- tests/unit/core/scoring/pipeline.test.ts`; expect the range test to pass."
      - id: SF-106-AC2
        statement: "A post with no usable signal results is never hidden even at threshold 0."
        verification: "The existing SF-008 fail-open test must still pass unchanged."
      - id: SF-106-AC3
        statement: "Every vetoed post's breakdown contains at least one reason string."
        verification: "The test 'a veto always attaches a reason' asserts reasons.length is at least 1 for each configured veto rule; if VETO_RULES is empty the test asserts that emptiness explicitly."
      - id: SF-106-AC4
        statement: "Changing the injected threshold changes the hidden flag without changing the composite score."
        verification: "The test 'threshold is injected, not baked in' scores the same input at two thresholds and asserts identical scores with differing hidden flags."
      - id: SF-106-AC5
        statement: "Every entry in tests/fixtures/posts/posts-scoring.json still matches its recorded expected value after the weight change, with an updated derivation string."
        verification: "Run `npm run test:unit -- tests/unit/core/scoring/pipeline.test.ts`; expect one passing assertion per fixture entry."
    steps:
      - id: SF-106-S01
        title: Extend the pipeline tests for multi-layer combination and vetoes
        purpose: "Fix combination, range, veto-reason, and threshold-injection semantics before touching the working Phase 0 pipeline."
        tdd_phase: red
        depends_on_steps: []
        files_to_touch:
          - path: tests/unit/core/scoring/pipeline.test.ts
            change: modify
            detail: >-
              Add to the existing describe block: "combines multiple layers by weight", using three
              SignalResults with known scores and weights and asserting the composite equals the
              hand-computed weighted mean written in the assertion as a literal;
              "keeps the composite within 0 and 1 for an all-maximum input";
              "a veto always attaches a reason", iterating VETO_RULES and asserting each produces at
              least one reason, and asserting VETO_RULES.length is 0 if HD-009 selected zero rules;
              "threshold is injected, not baked in", scoring one input at two thresholds and asserting
              identical composite scores with differing hidden flags.
          - path: tests/fixtures/posts/posts-scoring.json
            change: modify
            detail: "Recompute every expectedScore and expectedHidden against the new multi-layer weights, and rewrite each derivation string to show the new arithmetic. Add at least two entries exercising more than one layer at once."
        instructions:
          - "Add the four new tests to tests/unit/core/scoring/pipeline.test.ts."
          - "Recompute every fixture entry's expectedScore and rewrite its derivation string."
          - "Run `npm run test:unit -- tests/unit/core/scoring/pipeline.test.ts` and record the failure."
        constraints:
          - "Do not modify src/core/scoring/ in this step."
          - "Every recomputed expectedScore must be derivable from the arithmetic in its derivation string. A value that cannot be derived is fabricated: stop and report."
        test_specification:
          test_type: unit
          test_file: tests/unit/core/scoring/pipeline.test.ts
          test_name: "scorePost > combines multiple layers by weight"
          arrange: "Three SignalResults with scores 0.2, 0.8, and 0.5 and weights taken from the HD-005 defaults."
          act: "Call scorePost with all three."
          assert:
            - "The composite equals the literal hand-computed weighted mean"
            - "An all-maximum input yields a composite of at most 1"
            - "Each veto rule attaches at least one reason, or VETO_RULES is asserted empty"
            - "Two thresholds give identical scores and differing hidden flags"
          expected_red_failure: "The new tests fail because VETO_RULES is not exported and the pipeline does not yet accept multiple weighted layers."
        validation:
          - command: "npm run test:unit -- tests/unit/core/scoring/pipeline.test.ts; test $? -ne 0 && echo red-confirmed"
            expected_result: "Prints red-confirmed."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the full Vitest output."
      - id: SF-106-S02
        title: Implement weighted combination, veto rules, and injected settings
        purpose: "Turn five independent scores into one tunable, explainable decision."
        tdd_phase: green
        depends_on_steps: [SF-106-S01]
        files_to_touch:
          - path: src/core/scoring/weights.ts
            change: modify
            detail: >-
              Replace the zero placeholder weights with the HD-005 values for every implemented layer.
              Export VETO_RULES, a frozen array of {id: string; applies: (results: readonly
              SignalResult[]) => boolean; reason: string}. Each entry is exactly one rule from the
              HD-009 answer. If HD-009 selected zero rules, export an empty frozen array and add a
              comment naming HD-009 as the reason it is empty.
          - path: src/core/scoring/pipeline.ts
            change: modify
            detail: >-
              Keep the existing signature and the fail-open behaviour. After computing the weighted
              mean over ok results, evaluate every VETO_RULES entry; the first whose applies returns
              true sets hidden to true and appends its reason to the reasons array, alongside the
              weighted contributions already collected. Clamp the composite to 0..1. hidden is
              composite >= config.hideThreshold OR a veto fired. The config is a parameter; the module
              reads no store.
        instructions:
          - "Update src/core/scoring/weights.ts with the HD-005 weights and the HD-009 veto rules."
          - "Update src/core/scoring/pipeline.ts to combine layers by weight and evaluate vetoes."
          - "Run `npm run test:unit -- tests/unit/core/scoring` and confirm every test passes."
          - "Run `npx biome lint src/core/` and confirm exit code 0."
        constraints:
          - "Preserve the divide-by-used-weights behaviour from SF-008. Dividing by the total configured weight would make a single available layer unable to reach the threshold."
          - "A veto must never suppress the reasons already collected from contributing layers."
          - "Do not read chrome.storage from src/core/."
        test_specification:
          test_type: unit
          test_file: tests/unit/core/scoring/pipeline.test.ts
          test_name: "scorePost > a veto always attaches a reason"
          arrange: "One SignalResult set per configured veto rule, constructed to satisfy that rule's applies predicate."
          act: "Call scorePost for each."
          assert:
            - "hidden is true for each"
            - "reasons.length is at least 1 for each"
            - "If VETO_RULES is empty, the test asserts that emptiness explicitly rather than being skipped"
