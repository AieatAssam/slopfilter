              extractPost(element) reading post-permalink to derive the post id from the final path
              segment, author-handle, post-text, and the optional fields, returning null if any of
              post-text, author-handle, or the derived id is missing or empty, and otherwise building
              a Post with imageUrls collected from the post-images entry, hasVideo from the presence
              of post-video, and engagement counts run through parseCompactCount;
              selfTest(root) delegating to the SF-010 implementation once it exists and, until then,
              returning {ok: true, failedSelectorIds: []}.
