  - id: SF-108
    title: Add the settings store and the options page for threshold, weights, and layer toggles
    type: feature
    priority: P1
    status: planned
    description: >-
      Implement src/storage/settings.ts over chrome.storage.local and build the options page exposing
      the hide threshold, per-layer weights, and per-layer enable toggles, with the HD-005 defaults
      applied on first run and changes taking effect without a browser restart.
    reason: "PRD section 4 requires user-tunable weights in an advanced settings panel with sensible defaults for the common case, and SF-106 made the pipeline read its config from injected settings rather than constants."
    user_value: "The user can make the filter more or less aggressive, or turn an individual signal off, without editing code."
    depends_on: [SF-106]
    blocks: [SF-205]
    estimated_complexity: M
    risk_level: medium
    risks:
      - risk: "A malformed or partially written stored settings object crashes the content script on load, disabling the extension with no explanation."
        mitigation: "loadSettings merges the stored object over the defaults field by field and discards any value failing a range check, so a corrupt store degrades to defaults. A unit test feeds it garbage and asserts the defaults come back."
      - risk: "A settings change requires a browser restart, so the user believes their change did nothing and pushes the threshold to an extreme."
        mitigation: "The content script subscribes to chrome.storage.onChanged and re-reads its config, and the E2E asserts a threshold change alters filtering after a reload without reinstalling the extension."
      - risk: "A user sets the threshold to 0 and every post is hidden, which reads as the extension being broken."
        mitigation: "The threshold input is range-clamped to the HD-005 permitted bounds, and a unit test asserts an out-of-range stored value is clamped rather than honoured."
    constraints:
      - "Defaults come from the HD-005 answer via src/core/scoring/weights.ts. The options page must not define its own default values."
      - "Every stored value must be range-checked on read. An out-of-range or wrong-typed value falls back to the default for that field."
      - "Settings live in chrome.storage.local, never IndexedDB, per PRD section 5."
      - "Every control must have a label associated with it, so getByLabel can address it."
      - "A settings change must take effect without reinstalling the extension."
    prerequisites:
      - "SF-106 complete."
      - "HD-005 answered: the defaults and the permitted threshold bounds are fixed."
      - "HD-014 answered: whether the options page uses a framework or plain TypeScript."
    acceptance_criteria:
      - id: SF-108-AC1
        statement: "loadSettings returns the HD-005 defaults when chrome.storage.local is empty."
        verification: "Run `npm run test:unit -- tests/unit/storage/settings.test.ts`; expect the empty-store test to deep-equal the defaults."
      - id: SF-108-AC2
        statement: "loadSettings discards a wrong-typed or out-of-range stored field and substitutes that field's default, keeping other stored fields."
        verification: "The test 'repairs a corrupt store field by field' stores a threshold of 'abc' and a valid weight, then asserts the threshold is the default and the weight is the stored value."
      - id: SF-108-AC3
        statement: "An out-of-range threshold is clamped to the HD-005 bounds."
        verification: "The test 'clamps an out-of-range threshold' asserts both the low and high bounds."
      - id: SF-108-AC4
        statement: "Every options-page control has an associated label."
        verification: "The test 'every control has a label' asserts each input resolves via a label association."
      - id: SF-108-AC5
        statement: "In a browser, changing the threshold changes which posts are collapsed."
        verification: "Run `npm run build:test && npm run test:e2e -- e2e/specs/settings.spec.ts`; expect 2 passed, 0 failed."
    steps:
      - id: SF-108-S01
        title: Write the failing settings tests
        purpose: "Pin defaulting, per-field repair, and clamping before any settings code exists."
        tdd_phase: red
        depends_on_steps: []
        files_to_touch:
          - path: tests/unit/storage/settings.test.ts
            change: create
            detail: >-
              Stubs chrome.storage.local with vi.stubGlobal exposing get and set backed by a plain
              object. Imports loadSettings, saveSettings, and DEFAULT_SETTINGS from '@/storage/settings'.
              Describe block "settings" with tests: "returns defaults for an empty store", deep-equal
              against DEFAULT_SETTINGS; "repairs a corrupt store field by field", storing
              {hideThreshold: 'abc', weights: {behavioural: 0.4}} and asserting the threshold is the
              default while the behavioural weight is 0.4; "clamps an out-of-range threshold" for both
              bounds; "round-trips a valid settings object through save and load";
              "DEFAULT_SETTINGS.hideThreshold equals the HD-005 value in src/core/scoring/weights.ts",
              asserting the two constants agree so the options page cannot drift from the pipeline.
        instructions:
          - "Create tests/unit/storage/settings.test.ts with exactly the five tests described above."
          - "Run `npm run test:unit -- tests/unit/storage/settings.test.ts` and record the failure."
        constraints:
          - "Do not create src/storage/settings.ts in this step."
          - "Stub chrome with vi.stubGlobal. Do not add a chrome mocking dependency."
        test_specification:
          test_type: unit
          test_file: tests/unit/storage/settings.test.ts
          test_name: "settings > repairs a corrupt store field by field"
          arrange: "chrome.storage.local stubbed to return {hideThreshold: 'abc', weights: {behavioural: 0.4}}."
          act: "Call loadSettings()."
          assert:
            - "hideThreshold equals DEFAULT_SETTINGS.hideThreshold"
            - "weights.behavioural equals 0.4, proving valid fields survive"
            - "An empty store yields DEFAULT_SETTINGS exactly"
            - "An out-of-range threshold is clamped at both bounds"
            - "DEFAULT_SETTINGS.hideThreshold equals the weights.ts constant"
          expected_red_failure: "The run fails at import time with a module-not-found error naming @/storage/settings."
        validation:
          - command: "npm run test:unit -- tests/unit/storage/settings.test.ts; test $? -ne 0 && echo red-confirmed"
            expected_result: "Prints red-confirmed."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the full Vitest output."
      - id: SF-108-S02
        title: Implement the settings store and the options page
        purpose: "Let the user tune the filter safely, with a store that cannot brick the extension."
        tdd_phase: green
        depends_on_steps: [SF-108-S01]
        files_to_touch:
          - path: src/storage/settings.ts
            change: create
            detail: >-
              Imports DEFAULT_SCORING_CONFIG from '@/core/scoring/weights' and derives DEFAULT_SETTINGS
              from it, so there is exactly one source of default values.
              Exports interface Settings {hideThreshold: number; weights: Record<LayerId, number>;
              enabledLayers: Record<LayerId, boolean>}.
              Exports THRESHOLD_MIN and THRESHOLD_MAX from the HD-005 bounds.
              Exports async loadSettings(): Promise<Settings>, which reads chrome.storage.local and
              merges field by field over DEFAULT_SETTINGS, replacing any field that is wrong-typed or
              out of range with that field's default, and clamping the threshold to the bounds.
              Exports async saveSettings(partial: Partial<Settings>): Promise<void> and
              onSettingsChanged(callback), which wraps chrome.storage.onChanged.
          - path: src/ui/options/options.html
            change: modify
            detail: >-
              Replace the SF-001 placeholder with a form containing: a labelled range input
              'Hide threshold' with the HD-005 min and max; one labelled number input per layer named
              'Weight: <layer>'; one labelled checkbox per layer named 'Enable <layer>'; and a status
              paragraph with data-testid slopfilter-settings-status. Every input is associated with its
              label via a for attribute.
          - path: src/ui/options/options.ts
            change: modify
            detail: >-
              On DOMContentLoaded, call loadSettings and populate every control. On any change event,
              validate, call saveSettings, and set the status paragraph text to 'Saved.' via
              textContent. Never assign innerHTML.
          - path: src/content/index.ts
            change: modify
            detail: "Load settings before starting the observer, pass them into scorePost as the ScoringConfig, and subscribe via onSettingsChanged so a change takes effect on the next scored batch without reinstalling the extension."
          - path: e2e/specs/settings.spec.ts
            change: create
            detail: "Uses the extension fixture. Two tests matching the two test cases declared in e2e_validation below."
        instructions:
          - "Create src/storage/settings.ts with exactly the exports described above."
          - "Replace the options page HTML and TypeScript with the content described above."
          - "Modify src/content/index.ts to load and subscribe to settings."
          - "Create e2e/specs/settings.spec.ts with the two declared test cases."
          - "Run `npm run test:unit -- tests/unit/storage/settings.test.ts` and `npm run build:test && npm run test:e2e -- e2e/specs/settings.spec.ts`, confirming both pass."
        constraints:
          - "DEFAULT_SETTINGS must be derived from src/core/scoring/weights.ts. Do not restate the numbers."
          - "Never assign innerHTML in the options page."
          - "A corrupt stored field must never throw. It falls back to that field's default."
        test_specification:
          test_type: e2e
          test_file: e2e/specs/settings.spec.ts
          test_name: "changing the hide threshold changes which posts are collapsed"
          arrange: "The harness at ?fixture=high-frequency with posts collapsing at the default threshold."
          act: "Open the options page, set the threshold to its maximum, return to the harness, and reload."
          assert:
            - "The status paragraph reads 'Saved.'"
            - "After reload the placeholder count is 0, proving the raised threshold took effect"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/storage/settings.test.ts"
            expected_result: "Exit code 0, 5 passed, 0 failed."
          - command: "npm run build:test && npm run test:e2e -- e2e/specs/settings.spec.ts"
            expected_result: "2 passed, 0 failed. Exit code 0."
          - command: "! grep -n 'innerHTML' src/ui/options/options.ts && echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, exact command, exit code, the assertion output, the trace, screenshot, and video paths, and the settings object actually read back from storage."
    definition_of_done:
      - "An empty store yields the HD-005 defaults, derived from weights.ts rather than restated"
      - "A corrupt store is repaired field by field and never throws"
      - "The threshold is clamped to the HD-005 bounds on read"
      - "Every options control has an associated label"
      - "A threshold change takes effect without reinstalling the extension, proven in a browser"
      - "npm run test:unit, npm run lint, npm run typecheck, and the settings E2E spec all exit 0"
