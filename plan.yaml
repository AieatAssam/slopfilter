            - XPath
            - positional selectors
            - generated IDs
            - DOM traversal
      browser_steps:
        - id: SF-204-E2E-01
          action: "Load the harness so at least one batch is scored and recorded"
          route: "http://localhost:5174/?fixture=high-frequency"
