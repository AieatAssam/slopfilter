            expected_result: "Exit code 0, all tests passed, 0 failed."
          - command: "npm run typecheck && npm run lint && echo ok"
            expected_result: "Prints ok, exit code 0."
          - command: "! grep -n 'innerText' src/adapters/x/adapter.ts && echo ok"
            expected_result: "Prints ok, exit code 0. innerText is unimplemented in jsdom and would make fixture tests diverge from browser behaviour."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, the failing assertion with its expected and received values, and the id of the post that failed to parse."
    definition_of_done:
