      - id: SF-007-S03
        title: Implement the adapter and make the fixture tests pass
        purpose: "Turn captured markup into normalized Post objects, with every failure path returning null."
        tdd_phase: green
        depends_on_steps: [SF-007-S02]
        files_to_touch:
          - path: src/adapters/x/adapter.ts
            change: create
            detail: >-
              Imports type PlatformAdapter and SelectorCheckResult from '@/adapters/types', type Post
              and PostAuthor and PostEngagement from '@/core/post', and getEntry plus resolveSelector
              plus selectorContract from './selectors'.
              Export function parseCompactCount(raw: string | null | undefined): number | null.
              It trims the input, returns null for null, undefined, or the empty string, strips commas,
              multiplies by 1000 for a trailing K or k and by 1000000 for a trailing M or m, parses the
              numeric part with Number, and returns null when the result is not finite. It never
              returns NaN.
              Export const xAdapter: PlatformAdapter with platform 'x', selectorContractVersion read
              from selectorContract.contractVersion, and:
              findTimelineContainer(root) using the timeline-container entry via resolveSelector;
              findPostElements(container) returning Array.from of container.querySelectorAll for the
