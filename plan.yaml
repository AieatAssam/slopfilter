        - id: SF-014-E2E-02
          action: "Wait for the extension to score the rendered batch and collapse the qualifying posts"
          route: "http://localhost:5174/?fixture=high-frequency"
          locator: "getByTestId('slopfilter-placeholder').first()"
          input: null
          wait_for:
            condition: "The first element with data-testid slopfilter-placeholder is visible"
            timeout_ms: 10000
          assertions:
            - "getByTestId('slopfilter-placeholder') has a count of at least 1"
            - "The first placeholder's text matches /posts \\d+\\+ times per day/"
            - "The first placeholder's text does not match /\\b(ai|generated|synthetic|authored)\\b/i"
        - id: SF-014-E2E-03
          action: "Restore one collapsed post to confirm nothing was destroyed"
          route: "http://localhost:5174/?fixture=high-frequency"
          locator: "getByRole('button', {name: 'Show anyway'}).first()"
          input: null
          wait_for:
            condition: "The placeholder count decreases by exactly one"
            timeout_ms: 5000
          assertions:
            - "The restored post's body text is visible"
            - "The remaining placeholder count is the original count minus one"
        - id: SF-014-E2E-04
          action: "Append a run-unique post from a low-frequency author and confirm it is not collapsed"
          route: "http://localhost:5174/"
          locator: null
          input: "{id: `${runId}-post`, authorHandle: `@${runId}`, text: `body ${runId}`, postedAt: '2026-08-05T10:00:00Z'}"
          wait_for:
            condition: "Text matching `body ${runId}` is visible"
            timeout_ms: 5000
          assertions:
