  - id: SF-103
    title: Add the IndexedDB downvote embedding store with a 1000-entry cap
    type: feature
    priority: P1
    status: planned
    description: >-
      Implement src/storage/embeddings.ts: an IndexedDB store holding downvoted-post embeddings with a
      hard cap of 1000 entries, an explicit eviction policy, and persisted cluster centroids that the
      Layer 5 taste model reads.
    reason: "PRD section 4 specifies a downvote set capped at roughly 1000 embeddings with cluster centroids in IndexedDB, and PRD section 5 assigns embeddings and stats to IndexedDB rather than chrome.storage."
    user_value: "Technical: the user's taste history persists locally across sessions and is bounded so it cannot grow without limit."
    depends_on: [SF-004]
    blocks: [SF-104, SF-204]
    estimated_complexity: M
    risk_level: medium
    risks:
      - risk: "The cap is enforced loosely, so the store grows past 1000 and breaches the 300MB memory budget."
        mitigation: "The cap is enforced on every write inside the same transaction as the insert, and a unit test inserts 1005 entries and asserts the count is exactly 1000."
      - risk: "Eviction discards the entries that carry the most signal, silently degrading the taste model."
        mitigation: "Eviction is oldest-first by insertion timestamp, stated explicitly here, and asserted by a test that checks which specific ids survive."
      - risk: "A schema change in a later ticket corrupts an existing user's store."
        mitigation: "The database carries an explicit version and an onupgradeneeded path, and a test opens a v1 database with the current code and asserts it upgrades without data loss."
    constraints:
      - "The cap is exactly 1000 entries, enforced within the same IndexedDB transaction as the insert."
      - "Eviction is oldest-first by insertion timestamp."
      - "Only the embedding vector, the post id, and a timestamp are stored. Post text must not be persisted."
      - "The module must expose no synchronous API that silently swallows a quota error; quota failures reject and are surfaced."
    prerequisites:
      - "SF-004 complete."
    acceptance_criteria:
      - id: SF-103-AC1
        statement: "Inserting 1005 embeddings leaves exactly 1000 in the store."
        verification: "Run `npm run test:unit -- tests/unit/storage/embeddings.test.ts`; expect the cap test to pass with a count of exactly 1000."
      - id: SF-103-AC2
        statement: "The five evicted entries are the five oldest by insertion timestamp."
        verification: "The test 'evicts oldest first' asserts the surviving id set excludes exactly the first five inserted ids."
      - id: SF-103-AC3
        statement: "No stored record contains post text."
        verification: "The test 'never persists post text' inserts a record and asserts the retrieved object has no text-bearing property."
      - id: SF-103-AC4
        statement: "Centroids round-trip through the store unchanged."
        verification: "The test 'persists and reloads centroids' writes a centroid array and asserts a deep equality on reload."
    steps:
      - id: SF-103-S01
        title: Write the failing embedding-store tests
        purpose: "Pin the cap, the eviction order, and the no-text guarantee before any storage code exists."
        tdd_phase: red
        depends_on_steps: []
        files_to_touch:
          - path: package.json
            change: modify
            detail: "Add fake-indexeddb as a dev dependency at its latest published version, resolved at implementation time and recorded in meta.repository_context.toolchain_versions. It is required because jsdom provides no IndexedDB implementation, so without it these tests cannot run at all."
          - path: tests/unit/storage/embeddings.test.ts
            change: create
            detail: >-
              Imports fake-indexeddb/auto at the top of the file, then imports addEmbedding,
              countEmbeddings, listEmbeddingIds, saveCentroids, and loadCentroids from
              '@/storage/embeddings'. Each test deletes and recreates the database in a beforeEach so
              tests are order-independent. Describe block "embedding store" with tests:
              "caps the store at 1000 entries", inserting 1005 and asserting countEmbeddings returns
              exactly 1000; "evicts oldest first", asserting listEmbeddingIds excludes exactly the
              first five inserted ids; "never persists post text", asserting a retrieved record has no
              property whose value is the original post text; "persists and reloads centroids" with a
              toEqual round-trip; "rejects rather than silently swallowing a write failure".
        instructions:
          - "Install fake-indexeddb as a dev dependency at its latest version and record the resolved version in meta.repository_context.toolchain_versions."
          - "Create tests/unit/storage/embeddings.test.ts with exactly the tests described above."
          - "Run `npm run test:unit -- tests/unit/storage/embeddings.test.ts` and record the failure."
        constraints:
          - "Do not create src/storage/embeddings.ts in this step."
          - "Each test must recreate the database in beforeEach. Sharing a database between tests would make results order-dependent."
        test_specification:
          test_type: unit
          test_file: tests/unit/storage/embeddings.test.ts
          test_name: "embedding store > caps the store at 1000 entries"
          arrange: "A fresh fake-indexeddb database and 1005 embedding records with increasing timestamps."
          act: "Call addEmbedding 1005 times, then countEmbeddings."
          assert:
            - "countEmbeddings returns exactly 1000"
            - "listEmbeddingIds excludes exactly the first five inserted ids"
            - "A retrieved record contains no post text"
            - "Centroids round-trip with deep equality"
          expected_red_failure: "The run fails at import time with a module-not-found error naming @/storage/embeddings."
        validation:
          - command: "npm run test:unit -- tests/unit/storage/embeddings.test.ts; test $? -ne 0 && echo red-confirmed"
            expected_result: "Prints red-confirmed."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the full Vitest output."
      - id: SF-103-S02
        title: Implement the embedding store
        purpose: "Give the taste model a bounded, private, durable memory of what the user has rejected."
        tdd_phase: green
        depends_on_steps: [SF-103-S01]
        files_to_touch:
          - path: src/storage/embeddings.ts
            change: create
            detail: >-
              Exports EMBEDDING_CAP = 1000 and DB_NAME, DB_VERSION constants.
              Exports interface EmbeddingRecord {postId: string; vector: Float32Array; createdAt: number}.
              Exports async addEmbedding(record), which opens the database, inserts into the
              'embeddings' object store keyed by postId with an index on createdAt, and within the SAME
              transaction counts the store and deletes oldest-first until the count is at most
              EMBEDDING_CAP.
              Exports countEmbeddings(), listEmbeddingIds(), listEmbeddings(),
              saveCentroids(centroids), loadCentroids(), and clearAll().
              The upgrade handler creates the embeddings and centroids object stores and the createdAt
              index. Every function returns a promise that rejects on error; none swallows a failure.
        instructions:
          - "Create src/storage/embeddings.ts implementing exactly the exports described above."
          - "Run `npm run test:unit -- tests/unit/storage/embeddings.test.ts` and confirm every test passes."
        constraints:
          - "The cap must be enforced inside the same transaction as the insert. Enforcing it afterwards leaves a window where the store exceeds the cap."
          - "Do not add a text field to EmbeddingRecord."
          - "Never catch and discard an IndexedDB error."
        test_specification:
          test_type: unit
          test_file: tests/unit/storage/embeddings.test.ts
          test_name: "embedding store > evicts oldest first"
          arrange: "1005 records inserted with strictly increasing createdAt values."
          act: "Read listEmbeddingIds after all inserts."
          assert:
            - "Exactly 1000 ids remain"
            - "The five missing ids are exactly the five earliest by createdAt"
            - "All tests pass, 0 failed"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/storage/embeddings.test.ts"
            expected_result: "Exit code 0, all passed, 0 failed."
          - command: "npm run lint && npm run typecheck && echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, the failing assertion, and the actual stored entry count and surviving id list."
    definition_of_done:
      - "The store holds at most 1000 embeddings, enforced within the insert transaction"
      - "Eviction is oldest-first by createdAt and is asserted by id"
      - "No post text is persisted"
      - "Centroids round-trip unchanged"
      - "No IndexedDB error is caught and discarded"
      - "npm run test:unit, npm run lint, and npm run typecheck all exit 0"
    e2e_validation:
      required: true
      applicability: not_applicable_pending_human_approval
      rationale_if_not_applicable: >-
        This ticket adds a storage module with no user-visible surface: no control writes to it and no
        UI reads from it until SF-105 adds the thumbs-down control. Its guarantees, the 1000-entry cap
        and oldest-first eviction, are only observable after inserting a thousand records, which is a
        unit-test concern rather than a user journey. The user-facing behaviour it enables is asserted
        end to end by SF-105.

  - id: SF-104
    title: Add the Layer 5 taste model scoring against downvote-cluster centroids
    type: feature
    priority: P1
    status: planned
    description: >-
      Implement src/core/signals/taste.ts: cosine similarity of a post embedding against the persisted
      downvote-cluster centroids, plus the k-means-style centroid recomputation that runs after each
      new downvote. Wire embedding generation into the inference host.
    reason: "PRD section 4 Layer 5 is the taste model, and PRD section 4's feedback loop requires re-clustering centroids after each thumbs-down. PRD section 9 names it the layer whose failure mode must be 'fewer posts hidden', never a wrong accusation."
    user_value: "The filter learns what this specific user does not want to see, from their own downvotes, entirely on their machine."
    depends_on: [SF-008, SF-101, SF-103]
    blocks: [SF-105, SF-106, SF-109]
    estimated_complexity: L
    risk_level: medium
    risks:
      - risk: "Cosine similarity is computed on unnormalised vectors, silently making the score a magnitude artefact rather than a similarity."
        mitigation: "Vectors are L2-normalised on write in SF-103's record path and again defensively before comparison, and a unit test asserts that scaling a vector by 10 does not change its similarity score."
      - risk: "With zero downvotes the layer fires on an empty centroid set and produces NaN, poisoning the composite score."
        mitigation: "scoreTaste returns score 0 and reason null when there are no centroids, asserted by a dedicated test, which also satisfies the PRD's 'fewer posts hidden' failure mode."
      - risk: "Re-clustering on every downvote is O(n·k) over 1000 vectors on the UI thread and janks the feed."
        mitigation: "Recomputation runs in the inference worker, never on the content-script thread, and SF-109 benchmarks it against the per-batch latency budget."
    constraints:
      - "src/core/signals/taste.ts is pure: it takes an embedding and a centroid list as arguments and reads no store."
      - "All vectors must be L2-normalised before comparison."
      - "An empty centroid set must yield score 0 and reason null, never NaN and never a hidden post."
      - "Centroid recomputation must not run on the content-script thread."
    prerequisites:
      - "SF-008, SF-101, and SF-103 complete."
      - "HD-007 answered: the embedding model id and revision are fixed."
      - "HD-005 answered: the taste-layer similarity threshold is fixed."
    acceptance_criteria:
      - id: SF-104-AC1
        statement: "scoreTaste returns score 0 and reason null when the centroid list is empty."
        verification: "Run `npm run test:unit -- tests/unit/core/signals/taste.test.ts`; expect the empty-centroids test to pass and the score to be exactly 0, not NaN."
      - id: SF-104-AC2
        statement: "Scaling an input vector by a constant factor does not change its similarity score."
        verification: "The test 'is scale invariant' compares scoreTaste for v and for v scaled by 10 with toBeCloseTo at 6 decimal places."
      - id: SF-104-AC3
        statement: "A vector identical to a centroid yields similarity 1, and an orthogonal vector yields 0."
        verification: "The test 'computes cosine similarity correctly' asserts both boundary cases."
      - id: SF-104-AC4
        statement: "Similarity below the HD-005 taste threshold produces score 0 and reason null."
        verification: "The test 'does not fire below the threshold' asserts both."
      - id: SF-104-AC5
        statement: "recomputeCentroids over a known vector set returns a deterministic centroid set for a fixed seed."
        verification: "The test 'is deterministic for a fixed seed' runs recomputeCentroids twice and asserts toEqual."
    steps:
      - id: SF-104-S01
        title: Write the failing taste-model tests
        purpose: "Pin scale invariance, the empty-centroid case, and determinism before implementation."
        tdd_phase: red
        depends_on_steps: []
        files_to_touch:
          - path: tests/unit/core/signals/taste.test.ts
            change: create
            detail: >-
              Imports scoreTaste and recomputeCentroids from '@/core/signals/taste'. Describe block
              "scoreTaste" with tests: "returns score 0 and reason null for an empty centroid set",
              asserting the score is exactly 0 and Number.isNaN is false;
              "computes cosine similarity correctly", using an identical vector expecting 1 and an
              orthogonal vector expecting 0; "is scale invariant", comparing v and v scaled by 10 with
              toBeCloseTo to 6 places; "does not fire below the HD-005 taste threshold";
              "returns the fixed reason wording above the threshold", asserting the reason equals
              "similar to posts you downvoted"; "never returns a reason matching the authorship
              pattern".
              Describe block "recomputeCentroids" with tests: "is deterministic for a fixed seed",
              running twice and comparing with toEqual; "returns an empty array for an empty input".
        instructions:
          - "Create tests/unit/core/signals/taste.test.ts with exactly the tests described above."
          - "Run `npm run test:unit -- tests/unit/core/signals/taste.test.ts` and record the failure."
        constraints:
          - "Do not create src/core/signals/taste.ts in this step."
          - "Use small hand-written vectors with known similarities. Do not generate random vectors without a fixed seed."
        test_specification:
          test_type: unit
          test_file: tests/unit/core/signals/taste.test.ts
          test_name: "scoreTaste > returns score 0 and reason null for an empty centroid set"
          arrange: "A normalised embedding vector and an empty centroid array."
          act: "Call scoreTaste(vector, [], threshold)."
          assert:
            - "score is exactly 0 and is not NaN"
            - "reason is null"
            - "An identical vector scores 1 and an orthogonal vector scores 0"
            - "Scaling a vector by 10 leaves the score unchanged to 6 decimal places"
            - "recomputeCentroids is deterministic across two identical runs"
          expected_red_failure: "The run fails at import time with a module-not-found error naming @/core/signals/taste."
        validation:
          - command: "npm run test:unit -- tests/unit/core/signals/taste.test.ts; test $? -ne 0 && echo red-confirmed"
            expected_result: "Prints red-confirmed."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the full Vitest output."
      - id: SF-104-S02
        title: Implement the taste signal and centroid recomputation
        purpose: "Turn the user's downvote history into a bounded similarity score that fails towards showing more, never hiding more."
        tdd_phase: green
        depends_on_steps: [SF-104-S01]
        files_to_touch:
          - path: src/core/signals/taste.ts
            change: create
            detail: >-
              Exports normaliseVector(v: Float32Array): Float32Array performing L2 normalisation and
              returning a zero vector unchanged rather than dividing by zero.
              Exports cosineSimilarity(a, b): number, which normalises both inputs defensively and
              returns 0 when either has zero magnitude.
              Exports scoreTaste(embedding: Float32Array, centroids: readonly Float32Array[],
              threshold: number): SignalResult with layerId 'taste'. It returns score 0 and reason null
              when centroids is empty or the maximum similarity is below threshold, and otherwise
              returns that maximum similarity clamped to 0..1 with the fixed reason
              "similar to posts you downvoted".
              Exports recomputeCentroids(vectors: readonly Float32Array[], k: number, seed: number):
              Float32Array[], a deterministic k-means using a seeded PRNG for initial centroid choice
              and a fixed iteration cap, returning an empty array for empty input.
          - path: src/offscreen/inference.worker.ts
            change: modify
            detail: "Add an embed request that returns a normalised embedding for a text input, and a recompute-centroids request that runs recomputeCentroids off the content-script thread and persists the result via the message the offscreen controller forwards."
        instructions:
          - "Create src/core/signals/taste.ts with exactly the exports described above."
          - "Extend src/offscreen/inference.worker.ts with the embed and recompute-centroids requests."
          - "Run `npm run test:unit -- tests/unit/core/signals/taste.test.ts` and confirm every test passes."
          - "Run `npx biome lint src/core/` and confirm exit code 0."
        constraints:
          - "Never divide by a zero magnitude. Return 0 similarity instead."
          - "recomputeCentroids must take an explicit seed. Do not call Math.random."
          - "Centroid recomputation must run in the worker, never in src/content/."
        test_specification:
          test_type: unit
          test_file: tests/unit/core/signals/taste.test.ts
          test_name: "scoreTaste > is scale invariant"
          arrange: "A vector v, the same vector scaled by 10, and a fixed centroid list."
          act: "Call scoreTaste for both vectors."
          assert:
            - "Both scores are equal to 6 decimal places"
            - "All tests in the file pass, 0 failed"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/core/signals/taste.test.ts"
            expected_result: "Exit code 0, all passed, 0 failed."
          - command: "! grep -n 'Math.random' src/core/signals/taste.ts && npx biome lint src/core/ && echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, the failing assertion with expected and received values, and the computed similarity for the failing vector pair."
    definition_of_done:
      - "An empty centroid set yields score 0 and reason null, never NaN"
      - "Cosine similarity is scale invariant and correct at both boundary cases"
      - "Similarity below the HD-005 threshold produces no contribution and no reason"
      - "recomputeCentroids is deterministic for a fixed seed and never calls Math.random"
      - "Centroid recomputation runs in the worker, not on the content-script thread"
      - "npm run test:unit, npm run lint, and npm run typecheck all exit 0"
    e2e_validation:
      required: true
      applicability: not_applicable_pending_human_approval
      rationale_if_not_applicable: >-
        The taste signal is a pure mathematical function plus a worker request. It has no control and
        no rendering of its own, and its user-visible effect requires a populated downvote history,
        which only exists once SF-105 ships the thumbs-down control. SF-105's E2E asserts the complete
        user journey of downvoting and seeing the result change.

  - id: SF-105
    title: Add the thumbs-down and wrong-call feedback controls
    type: feature
    priority: P0
    status: planned
    description: >-
      Implement src/content/feedback.ts: a thumbs-down control on every visible post that embeds it,
      adds it to the downvote store, and triggers centroid recomputation, and a "This was wrong"
      control on every placeholder that restores the post, adds it to an exclusion set, and records
      which layer misfired locally.
    reason: "PRD section 4 makes every action reversible and teaching: thumbs-down feeds the taste model, and wrong-call feeds an allowlist while logging the misfiring layer locally. PRD section 10 measures the wrong-call rate through this control."
    user_value: "The user can teach the filter in one click, both what to hide more of and what it got wrong, and every action is reversible."
    depends_on: [SF-009, SF-103, SF-104, SF-014]
    blocks: [SF-204]
    estimated_complexity: L
    risk_level: medium
    risks:
      - risk: "Feedback is recorded but never affects what is hidden, so the control is theatre."
        mitigation: "The E2E happy path downvotes a post and asserts a similar post is subsequently collapsed, which fails if the feedback loop is not wired end to end."
      - risk: "The wrong-call record is sent somewhere, breaking the zero-telemetry claim."
        mitigation: "A validation greps the whole feedback path for network calls, and the PRD wording 'telemetry stays local' is encoded as a constraint plus an assertion that no request leaves the extension."
      - risk: "Clicking thumbs-down twice creates duplicate embeddings and skews centroids."
        mitigation: "addEmbedding is keyed by postId so a repeat write replaces rather than appends, and a unit test asserts the count after two downvotes of the same post is 1."
    constraints:
      - "Every feedback action must be local. No network request may originate from src/content/feedback.ts."
      - "Controls must be reachable by keyboard and expose an accessible name, so getByRole can locate them."
      - "A wrong-call must restore the post immediately, before any storage write resolves, so the UI never feels blocked."
      - "Duplicate downvotes of the same post must not create duplicate embeddings."
    prerequisites:
