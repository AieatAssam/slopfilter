        setup:
          method: fixture
          steps:
            - "The extension fixture creates a per-worker browser profile with an empty chrome.storage.local."
            - "The test navigates to http://localhost:5174/?fixture=high-frequency and confirms the default behaviour first."
        cleanup:
          method: fixture teardown
          steps:
            - "The test calls resetHarness(page) in an afterEach hook."
            - "The context fixture closes the context and deletes the per-worker profile directory, discarding that worker's settings entirely."
        prohibited:
          - shared manually-created test data
          - reliance on test execution order
          - mutation of production data
      selector_contract:
        required_test_ids:
          - id: slopfilter-settings-status
            element: "The options-page paragraph confirming a save"
            component_file: src/ui/options/options.html
            purpose: "A status paragraph with no ARIA role and no label; its whole text is the message being asserted, so no accessible name exists to address it by."
        locator_policy:
          allowed_in_order:
            - getByRole with accessible name
            - getByLabel
            - getByTestId
          forbidden:
            - CSS classes
            - XPath
            - positional selectors
            - generated IDs
            - DOM traversal
      browser_steps:
        - id: SF-108-E2E-01
          action: "Confirm the default threshold collapses at least one post"
          route: "http://localhost:5174/?fixture=high-frequency"
          locator: "getByTestId('slopfilter-placeholder')"
          input: null
          wait_for:
            condition: "getByTestId('slopfilter-placeholder').first() is visible"
            timeout_ms: 10000
          assertions:
            - "The placeholder count is at least 1"
        - id: SF-108-E2E-02
          action: "Open the options page and raise the hide threshold to its maximum"
          route: "chrome-extension://<extensionId>/ui/options/options.html"
          locator: "getByLabel('Hide threshold')"
          input: "the HD-005 THRESHOLD_MAX value"
          wait_for:
            condition: "getByTestId('slopfilter-settings-status') has text 'Saved.'"
            timeout_ms: 5000
          assertions:
            - "The status paragraph reads 'Saved.'"
        - id: SF-108-E2E-03
          action: "Return to the harness and reload"
          route: "http://localhost:5174/?fixture=high-frequency"
          locator: "getByTestId('slopfilter-placeholder')"
          input: null
          wait_for:
            condition: "The post articles are visible, which is the settled state after document_idle"
            timeout_ms: 10000
          assertions:
            - "getByTestId('slopfilter-placeholder') has count 0"
            - "The post bodies are visible"
      test_cases:
        - id: SF-108-E2E-HAPPY-01
          title: Raising the threshold stops posts being collapsed
          priority: critical
          given: "The harness at ?fixture=high-frequency with at least one post collapsed at the default threshold"
          when: "The user raises the hide threshold to its maximum on the options page and reloads the feed"
          then:
            - "The options page confirms 'Saved.'"
            - "The placeholder count becomes 0"
            - "Every post body is visible"
            - "The change took effect without reinstalling the extension"
        - id: SF-108-E2E-NEGATIVE-01
          title: An out-of-range threshold is clamped rather than honoured
          priority: high
          applicability: applicable
          rationale_if_not_applicable: null
          given: "The options page open with the threshold control present"
          when: "A value beyond THRESHOLD_MAX is written to chrome.storage.local directly and the options page is reloaded"
          then:
            - "The threshold control displays the clamped THRESHOLD_MAX value, not the out-of-range value"
            - "The feed continues to render normally, proving a bad stored value cannot brick the extension"
            - "No uncaught error appears in the browser console"
      execution:
        command: "npm run build:test && npm run test:e2e -- e2e/specs/settings.spec.ts"
        expected_result: "2 passed, 0 failed"
        retries: 1
        artifacts_on_failure:
          - screenshot
          - trace
          - video
          - browser-console-output
          - failed-network-requests
      e2e_definition_of_done:
        - Happy path passes in the required browser
        - Relevant negative path passes, or is explicitly approved as not applicable
        - Test is isolated and parallel-safe
        - Test creates unique data and performs cleanup
        - Test has no fixed delays, sleeps, or arbitrary waits
        - Browser-visible user result and persisted final state are verified
        - Failure artefacts are configured and available

  - id: SF-109
    title: Add the scoring-latency and memory benchmarks enforcing the 100ms and 300MB budgets
    type: infrastructure
    priority: P1
    status: planned
    description: >-
      Create bench/scoring-latency.bench.ts measuring per-batch scoring latency for a batch of ten
      posts with every implemented layer active, and peak memory with models loaded, failing when the
      median latency exceeds 100ms or the memory footprint exceeds 300MB. Record which models, if any,
      are faster on WebGPU and populate WEBGPU_ALLOWLIST from that measurement.
    reason: "PRD section 5 sets both budgets and requires CI enforcement, and PRD section 5 states WebGPU is reserved for cases where benchmarks show a win. WEBGPU_ALLOWLIST from SF-101 is empty until this benchmark fills it."
    user_value: "Filtering provably keeps up with scrolling and the extension provably stays within a sane memory footprint."
    depends_on: [SF-101, SF-102, SF-104, SF-106, SF-013]
    blocks: []
    estimated_complexity: M
    risk_level: medium
    risks:
      - risk: "Latency is measured with models unloaded, so it reports Phase 0 numbers and the real ML cost is never measured."
        mitigation: "The benchmark asserts the inference host reported ready before taking any measurement, and fails with an explicit message if readiness is not reached within its timeout."
      - risk: "Memory is read with an API that reports the wrong process or is unavailable, producing a meaningless pass."
        mitigation: "Memory is read via performance.measureUserAgentSpecificMemory where available, and the benchmark FAILS with a clear message rather than passing when the API is unavailable."
      - risk: "WEBGPU_ALLOWLIST is populated by assumption rather than by measurement, contradicting the PRD."
        mitigation: "The benchmark prints a per-model WASM-versus-WebGPU comparison and the ticket requires the allowlist to be edited only from that printed output, with the numbers recorded in the commit."
    constraints:
      - "The benchmark must confirm model readiness before measuring. Measuring an unready host is a false pass."
      - "Compare medians over at least 15 measured repetitions after 3 warm-ups, as in SF-013."
      - "If the memory API is unavailable, fail with a descriptive message. Never skip and never pass by default."
      - "WEBGPU_ALLOWLIST may only be edited from this benchmark's printed measurements."
      - "workers must be 1, reusing playwright.bench.config.ts from SF-013."
    prerequisites:
      - "SF-101, SF-102, SF-104, SF-106, and SF-013 complete."
      - "HD-007 answered and the real models downloadable in the benchmark environment."
    acceptance_criteria:
      - id: SF-109-AC1
        statement: "`npm run bench:pageload` style invocation of the latency benchmark reports a median per-batch latency for a batch of 10 posts with all layers active."
        verification: "Run `npm run build:test && npx playwright test --config playwright.bench.config.ts bench/scoring-latency.bench.ts`; expect exit code 0 and a printed median."
      - id: SF-109-AC2
        statement: "The benchmark fails when the median latency exceeds 100ms."
        verification: "Temporarily set LATENCY_BUDGET_MS to 0, run, confirm non-zero exit naming the measured median, then restore to 100."
      - id: SF-109-AC3
        statement: "The benchmark fails with a descriptive message when the memory API is unavailable, rather than passing."
        verification: "Run the benchmark in a context without the memory API and confirm a non-zero exit whose message names the missing API."
      - id: SF-109-AC4
        statement: "WEBGPU_ALLOWLIST contents are justified by printed measurements recorded in the commit message."
        verification: "Confirm the commit body contains the per-model WASM and WebGPU medians for every id present in WEBGPU_ALLOWLIST, and that an absent id has no entry."
    steps:
      - id: SF-109-S01
        title: Implement the latency and memory benchmark
        purpose: "Turn the two remaining PRD performance budgets into measurements that can fail."
        tdd_phase: setup
        depends_on_steps: []
        files_to_touch:
          - path: bench/scoring-latency.bench.ts
            change: create
            detail: >-
              A header comment naming both budgets and their PRD source.
              Exports LATENCY_BUDGET_MS = 100 and MEMORY_BUDGET_BYTES = 300 * 1024 * 1024.
              One Playwright test "per-batch scoring latency stays within the 100ms budget". It loads
              the harness with the extension, waits for the inference host to report ready with a
              60000ms timeout and fails with the message 'inference host never became ready' on
              timeout, then appends batches of exactly 10 posts, measuring the elapsed time between
              appending the batch and the last placeholder settling, using performance marks read from
              the page rather than wall-clock timing in the test process. It runs 3 warm-ups and 15
              measured repetitions, prints the median and interquartile range, and asserts the median
              is at most LATENCY_BUDGET_MS.
              A second test "memory footprint stays within the 300MB budget" reads
              performance.measureUserAgentSpecificMemory, fails with the message
              'memory measurement API unavailable' when it is absent, and otherwise asserts the total
              is at most MEMORY_BUDGET_BYTES.
              A third test "records the WASM versus WebGPU comparison per model" runs the classifier
              and embedder under both backends where WebGPU is available and prints a per-model table.
              It asserts nothing; it exists to produce the evidence for WEBGPU_ALLOWLIST.
        instructions:
          - "Create bench/scoring-latency.bench.ts implementing exactly the three tests described above."
          - "Run `npm run build:test && npx playwright test --config playwright.bench.config.ts bench/scoring-latency.bench.ts` and record every printed number."
          - "Set LATENCY_BUDGET_MS to 0, confirm the benchmark fails naming the measured median, then restore it to 100."
          - "Populate src/offscreen/models.ts WEBGPU_ALLOWLIST using only the printed per-model comparison, leaving it empty if no model showed a WebGPU win."
          - "Record the printed medians in the commit body for this ticket."
        constraints:
          - "Fail, do not skip, when the memory API is unavailable."
          - "Do not raise either budget to make the benchmark pass. A budget breach is a real finding: stop and report."
          - "Do not add a model id to WEBGPU_ALLOWLIST without a printed measurement showing it is faster."
        test_specification:
          test_type: e2e
          test_file: bench/scoring-latency.bench.ts
          test_name: "per-batch scoring latency stays within the 100ms budget"
          arrange: "The harness loaded with the extension, models fully loaded, and the inference host reporting ready."
          act: "Append 15 measured batches of exactly 10 posts each, after 3 warm-up batches, reading page performance marks."
          assert:
            - "The median per-batch latency is at most 100ms"
            - "The interquartile range is printed alongside the median"
            - "Total memory is at most 300MB, or the run fails naming the unavailable API"
            - "A per-model WASM versus WebGPU comparison is printed"
          expected_red_failure: null
        validation:
          - command: "npm run build:test && npx playwright test --config playwright.bench.config.ts bench/scoring-latency.bench.ts"
            expected_result: "Exit code 0, with printed median latency at most 100, printed IQR, and printed memory total at most 314572800."
          - command: "grep -q 'LATENCY_BUDGET_MS = 100' bench/scoring-latency.bench.ts && grep -q 'MEMORY_BUDGET_BYTES' bench/scoring-latency.bench.ts && echo ok"
            expected_result: "Prints ok, exit code 0, confirming neither budget was raised to force a pass."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, exact command, exit code, the measured median latency, the interquartile range, the measured memory total, whether the inference host reached ready, and the machine load at the time. Never raise a budget."
    definition_of_done:
      - "Per-batch latency is measured with all layers active and models confirmed ready"
      - "The median latency is at most 100ms over at least 15 repetitions after 3 warm-ups"
      - "Memory is at most 300MB, and an unavailable memory API fails rather than passes"
      - "The benchmark was demonstrated to fail when the latency budget was lowered, then restored to 100"
      - "WEBGPU_ALLOWLIST contains only model ids with a printed measurement showing a WebGPU win, and the measurements are recorded in the commit body"
      - "Neither budget was raised"
    e2e_validation:
      required: true
      applicability: not_applicable_pending_human_approval
      rationale_if_not_applicable: >-
        This ticket adds performance measurement, not product behaviour. It drives a real browser but
        asserts timing and memory budgets rather than any user-visible outcome, and the properties it
        protects, that scrolling stays smooth and memory stays bounded, are non-functional with no UI
        state to assert. The user-visible filtering behaviour it measures is already covered end to
        end by SF-014, SF-105, and SF-108.

  - id: SF-201
    title: Add the Layer 2 provenance signal reading C2PA content credentials
    type: feature
    priority: P2
    status: planned
    description: >-
      Implement src/core/signals/provenance.ts, mapping parsed C2PA content-credential presence,
      absence, or unreadability on post image thumbnails into a SignalResult, and wire thumbnail
      metadata parsing into the inference host.
    reason: "PRD section 4 Layer 2 specifies C2PA content-credentials parsing on image thumbnails as a free, provenance-based signal."
    user_value: "Images carrying verifiable provenance are treated differently from images carrying none, on evidence rather than inference."
    depends_on: [SF-106]
    blocks: []
    estimated_complexity: M
    risk_level: high
    risks:
      - risk: "X re-encodes uploaded images and strips C2PA manifests, so the layer returns no signal for every real post and the entire ticket produces dead code."
        mitigation: "Blocked on HD-011, whose first option is to confirm viability against real X image URLs BEFORE implementation. If provenance is not readable on this platform, HD-011's second option records that finding and the ticket is closed unimplemented rather than shipped inert."
      - risk: "Absence of provenance is treated as evidence of wrongdoing, which is an authorship claim in disguise and violates PRD section 2."
        mitigation: "Absence contributes a small score with the reason 'no content credentials', never a claim about who or what made the image. A test asserts the reason never matches the authorship pattern."
      - risk: "A C2PA parsing library is added without approval, expanding the dependency and supply-chain surface."
        mitigation: "The library is named by the HD-011 answer and is the only permitted addition. Any other package is a constraint violation."
    constraints:
      - "src/core/signals/provenance.ts is pure: it consumes an already-parsed provenance result and performs no fetching or parsing itself."
      - "Absence of provenance must never produce a reason implying authorship."
      - "Only thumbnails may be inspected, never full-resolution images, per PRD section 4."
      - "The only permitted new dependency is the C2PA library named by HD-011."
      - "An unreadable or errored manifest must yield ok false, contributing nothing, not a maximum score."
    prerequisites:
      - "SF-106 complete."
      - "HD-011 answered: provenance viability on X is confirmed and the C2PA library and version are approved."
    acceptance_criteria:
      - id: SF-201-AC1
        statement: "A post with a valid provenance manifest yields score 0 and reason null, because verified provenance is not evidence of slop."
        verification: "Run `npm run test:unit -- tests/unit/core/signals/provenance.test.ts`; expect the valid-manifest test to pass."
      - id: SF-201-AC2
        statement: "A post whose images have no content credentials yields a small non-zero score with the reason 'no content credentials'."
        verification: "Expect the absent-manifest test to assert both the score bound and the exact reason string."
      - id: SF-201-AC3
        statement: "An unreadable manifest yields ok false, so the pipeline treats it as a zero contribution rather than a maximum."
        verification: "Expect the unreadable test to assert ok is false."
      - id: SF-201-AC4
        statement: "A post with no images at all yields ok true, score 0, and reason null."
        verification: "Expect the no-images test to pass."
      - id: SF-201-AC5
        statement: "No reason string matches the authorship pattern."
        verification: "Run `! grep -rniE '\\b(ai|generated|synthetic|authored)\\b' src/core/signals/provenance.ts && echo ok`; expect ok."
    steps:
      - id: SF-201-S01
        title: Write the failing provenance signal tests
        purpose: "Fix the four provenance states and their exact wording before implementation."
        tdd_phase: red
        depends_on_steps: []
        files_to_touch:
          - path: tests/unit/core/signals/provenance.test.ts
            change: create
            detail: >-
              Imports scoreProvenance from '@/core/signals/provenance'. Describe block
              "scoreProvenance" with tests: "a valid manifest yields score 0 and reason null";
              "absent credentials yield a small score with the reason 'no content credentials'",
              asserting the score is greater than 0 and at most 0.5 and the reason matches exactly;
              "an unreadable manifest yields ok false"; "a post with no images yields ok true, score 0,
              and reason null"; "never returns a reason matching the authorship pattern".
        instructions:
          - "Create tests/unit/core/signals/provenance.test.ts with exactly the five tests described above."
          - "Run `npm run test:unit -- tests/unit/core/signals/provenance.test.ts` and record the failure."
        constraints:
          - "Do not create src/core/signals/provenance.ts in this step."
          - "Do not fetch a real image in a unit test. The parsed result is an input."
        test_specification:
          test_type: unit
          test_file: tests/unit/core/signals/provenance.test.ts
          test_name: "scoreProvenance > absent credentials yield a small score with the reason 'no content credentials'"
          arrange: "A parsed provenance result reporting two images, both with no manifest."
          act: "Call scoreProvenance(result)."
          assert:
            - "score is greater than 0 and at most 0.5"
            - "reason equals 'no content credentials'"
            - "A valid manifest gives score 0 and reason null"
            - "An unreadable manifest gives ok false"
            - "No images gives ok true, score 0, reason null"
          expected_red_failure: "The run fails at import time with a module-not-found error naming @/core/signals/provenance."
        validation:
          - command: "npm run test:unit -- tests/unit/core/signals/provenance.test.ts; test $? -ne 0 && echo red-confirmed"
            expected_result: "Prints red-confirmed."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the full Vitest output."
      - id: SF-201-S02
        title: Implement the provenance signal and thumbnail metadata parsing
        purpose: "Read what the image itself declares, without turning silence into an accusation."
        tdd_phase: green
        depends_on_steps: [SF-201-S01]
        files_to_touch:
          - path: package.json
            change: modify
            detail: "Add the C2PA parsing library named by HD-011, at its latest published version, resolved at implementation time and recorded in meta.repository_context.toolchain_versions. No other dependency may be added."
          - path: src/core/signals/provenance.ts
            change: create
            detail: >-
              Exports interface ProvenanceResult {imageCount: number; withManifest: number;
              withoutManifest: number; unreadable: number}.
              Exports PROVENANCE_ABSENT_SCORE from the HD-005 weight table.
              Exports scoreProvenance(result: ProvenanceResult): SignalResult with layerId
              'provenance'. Returns {ok: true, score: 0, reason: null} when imageCount is 0 or when
              withManifest is greater than 0. Returns {ok: false, score: 0, reason: null} when
              unreadable equals imageCount. Otherwise returns PROVENANCE_ABSENT_SCORE with the reason
              'no content credentials'.
          - path: src/offscreen/offscreen.ts
            change: modify
            detail: "Add a parse-provenance request that fetches each thumbnail URL, parses its C2PA manifest with the approved library, and returns a ProvenanceResult per post id. Thumbnails only; full-resolution URLs must not be requested."
        instructions:
          - "Install the HD-011-approved C2PA library at its latest version and record the resolved version."
          - "Create src/core/signals/provenance.ts with exactly the exports described above."
          - "Extend src/offscreen/offscreen.ts with thumbnail-only provenance parsing."
          - "Run `npm run test:unit -- tests/unit/core/signals/provenance.test.ts` and confirm every test passes."
        constraints:
          - "Request thumbnail URLs only. Requesting a full-resolution image is a constraint violation."
          - "src/core/signals/provenance.ts must import nothing from src/offscreen/ and must perform no fetching."
        test_specification:
          test_type: unit
          test_file: tests/unit/core/signals/provenance.test.ts
          test_name: "scoreProvenance > an unreadable manifest yields ok false"
          arrange: "A ProvenanceResult where unreadable equals imageCount."
          act: "Call scoreProvenance(result)."
          assert:
            - "ok is false"
            - "The pipeline therefore treats it as a zero contribution"
            - "All tests pass, 0 failed"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/core/signals/provenance.test.ts"
            expected_result: "Exit code 0, 5 passed, 0 failed."
          - command: "! grep -rniE '\\b(ai|generated|synthetic|authored)\\b' src/core/signals/provenance.ts && npx biome lint src/core/ && echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, the failing assertion, and the ProvenanceResult that produced it."
    definition_of_done:
      - "Verified provenance contributes nothing; absence contributes a small, bounded score"
      - "An unreadable manifest yields ok false rather than a maximum score"
      - "A post with no images contributes nothing"
      - "No reason string implies authorship"
      - "Only thumbnails are requested, never full-resolution images"
      - "Only the HD-011-approved library was added"
      - "npm run test:unit, npm run lint, and npm run typecheck all exit 0"
    e2e_validation:
      required: true
      applicability: not_applicable_pending_human_approval
      rationale_if_not_applicable: >-
        This ticket adds a pure scoring function plus a metadata-parsing request. Exercising it in a
        browser would require serving real images carrying real C2PA manifests from the harness, which
        neither the committed fixtures nor the harness provide, and fetching them from an external
        origin would violate the hermetic-E2E constraint this plan applies to every spec. The
        user-visible outcome, a post collapsing with a provenance reason, is covered by SF-014's
        collapse journey once the layer is enabled in settings.

  - id: SF-202
    title: Add the Layer 4 image forensics signal on thumbnails
    type: feature
    priority: P2
    status: planned
    description: >-
      Implement src/core/signals/imageForensics.ts, mapping the output of the HD-010 vision model into
      a bounded SignalResult with an evidence-based reason, and wire thumbnail inference into the
      inference host.
    reason: "PRD section 4 Layer 4 specifies diffusion and GAN artefact detection on inline images via a lightweight WASM vision model, budgeted at roughly 20ms per image."
    user_value: "Images bearing detectable generation artefacts contribute to the score, described as artefacts observed rather than as a claim about who made them."
    depends_on: [SF-101, SF-106]
    blocks: []
    estimated_complexity: L
    risk_level: high
    risks:
      - risk: "No suitable model exists with a permissive licence and a Transformers.js-compatible export, so the ticket cannot be implemented as specified."
        mitigation: "Blocked on HD-010, which includes an explicit option to drop Layer 4 and record it as deferred. The ticket must not proceed on a guessed model id."
      - risk: "The reason wording reads as an authorship accusation, which is the single thing the PRD forbids most emphatically."
        mitigation: "The reason is fixed literally as 'image shows generation artefacts', reviewed as user-facing copy, and a test asserts it never matches the authorship pattern. It describes the image, never the poster."
      - risk: "Per-image inference blows the 100ms per-batch budget when a batch contains many images."
        mitigation: "Inference is capped at a fixed maximum images per post and runs in the worker. SF-109's latency benchmark covers batches containing images and fails on a breach."
    constraints:
      - "src/core/signals/imageForensics.ts is pure: it consumes model output and performs no inference."
      - "Thumbnails only, never full-resolution images."
      - "At most a fixed maximum number of images per post are analysed, declared as an exported constant."
      - "The reason must describe the image, never the author. No authorship wording anywhere."
      - "A model failure yields ok false, contributing nothing."
    prerequisites:
      - "SF-101 and SF-106 complete."
      - "HD-010 answered: the model id, revision, licence, and input resolution are fixed, or Layer 4 is formally dropped."
    acceptance_criteria:
      - id: SF-202-AC1
        statement: "Model confidence below the HD-010 threshold yields score 0 and reason null."
        verification: "Run `npm run test:unit -- tests/unit/core/signals/imageForensics.test.ts`; expect the below-threshold test to pass."
      - id: SF-202-AC2
        statement: "Model confidence above the threshold yields a bounded score with the reason 'image shows generation artefacts'."
        verification: "Expect the above-threshold test to assert the exact reason string and a score within 0 and 1."
      - id: SF-202-AC3
        statement: "A model failure yields ok false, contributing nothing."
        verification: "Expect the failure test to assert ok is false and score is 0."
      - id: SF-202-AC4
        statement: "At most MAX_IMAGES_PER_POST images are analysed for any post."
        verification: "The test 'analyses at most the capped number of images' passes a post with twice the cap and asserts the inference callback was invoked exactly MAX_IMAGES_PER_POST times."
      - id: SF-202-AC5
        statement: "No reason string matches the authorship pattern."
        verification: "Run `! grep -rniE '\\b(authored|written by)\\b' src/core/signals/imageForensics.ts && echo ok`; expect ok. Note that this file legitimately contains the word 'generation' describing an image artefact, which is not an authorship claim about a person."
    steps:
      - id: SF-202-S01
        title: Write the failing image-forensics tests
        purpose: "Fix the threshold, the cap, the failure mode, and the exact wording before implementation."
        tdd_phase: red
        depends_on_steps: []
        files_to_touch:
          - path: tests/unit/core/signals/imageForensics.test.ts
            change: create
            detail: >-
              Imports scoreImageForensics and MAX_IMAGES_PER_POST from
              '@/core/signals/imageForensics'. Describe block "scoreImageForensics" with tests:
              "returns score 0 and reason null below the confidence threshold";
              "returns a bounded score and the fixed reason above the threshold", asserting the reason
              equals 'image shows generation artefacts' and the score is within 0 and 1;
              "returns ok false when the model failed";
              "analyses at most the capped number of images", passing 2 times MAX_IMAGES_PER_POST
              image results and asserting only the first MAX_IMAGES_PER_POST are considered;
              "uses the maximum per-image score, not the mean", so one strongly artefacted image is
              not diluted by several clean ones.
        instructions:
          - "Create tests/unit/core/signals/imageForensics.test.ts with exactly the five tests described above."
          - "Run `npm run test:unit -- tests/unit/core/signals/imageForensics.test.ts` and record the failure."
        constraints:
          - "Do not create src/core/signals/imageForensics.ts in this step."
          - "Do not run a real vision model in a unit test."
        test_specification:
          test_type: unit
          test_file: tests/unit/core/signals/imageForensics.test.ts
          test_name: "scoreImageForensics > uses the maximum per-image score, not the mean"
          arrange: "One image result well above the threshold and three well below."
          act: "Call scoreImageForensics with all four."
          assert:
            - "The returned score equals the maximum per-image score, not the mean"
            - "Below-threshold input gives score 0 and reason null"
            - "Above-threshold input gives the exact fixed reason"
            - "A model failure gives ok false"
            - "Only MAX_IMAGES_PER_POST images are considered"
          expected_red_failure: "The run fails at import time with a module-not-found error naming @/core/signals/imageForensics."
        validation:
          - command: "npm run test:unit -- tests/unit/core/signals/imageForensics.test.ts; test $? -ne 0 && echo red-confirmed"
            expected_result: "Prints red-confirmed."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the full Vitest output."
      - id: SF-202-S02
        title: Implement the image-forensics signal and thumbnail inference
        purpose: "Score what the pixels show, bounded and capped, without ever describing a person."
        tdd_phase: green
        depends_on_steps: [SF-202-S01]
        files_to_touch:
          - path: src/core/signals/imageForensics.ts
            change: create
            detail: >-
              Exports MAX_IMAGES_PER_POST, a small integer constant chosen so the per-image cost stays
              within the SF-109 latency budget, and IMAGE_FORENSICS_THRESHOLD from the HD-010 answer.
              Exports interface ImageForensicsResult {ok: boolean; scores: readonly number[]}.
              Exports scoreImageForensics(result: ImageForensicsResult): SignalResult with layerId
              'image-forensics'. It returns ok false with score 0 when result.ok is false. Otherwise it
              takes the first MAX_IMAGES_PER_POST scores, uses their maximum, returns score 0 with
              reason null below IMAGE_FORENSICS_THRESHOLD, and otherwise returns that maximum clamped
              to 0..1 with the fixed reason 'image shows generation artefacts'.
          - path: src/offscreen/inference.worker.ts
            change: modify
            detail: "Add an analyse-images request loading the HD-010 model at the pinned revision and running it over at most MAX_IMAGES_PER_POST thumbnail URLs per post, returning an ImageForensicsResult per post id and ok false on any model error."
          - path: src/offscreen/models.ts
            change: modify
            detail: "Add the HD-010 model id and pinned revision to MODEL_IDS under the key 'imageForensics'."
        instructions:
          - "Create src/core/signals/imageForensics.ts with exactly the exports described above."
          - "Extend the worker and MODEL_IDS for the HD-010 model."
          - "Run `npm run test:unit -- tests/unit/core/signals/imageForensics.test.ts` and confirm every test passes."
          - "Re-run the SF-109 latency benchmark with image analysis active and confirm the 100ms median budget still holds."
        constraints:
          - "Use the maximum per-image score, never the mean. Averaging would let one clearly artefacted image be diluted away."
          - "Thumbnails only."
          - "If the SF-109 latency budget is breached with images active, stop and report rather than raising the budget."
        test_specification:
          test_type: unit
          test_file: tests/unit/core/signals/imageForensics.test.ts
          test_name: "scoreImageForensics > analyses at most the capped number of images"
          arrange: "An ImageForensicsResult carrying 2 times MAX_IMAGES_PER_POST scores."
          act: "Call scoreImageForensics."
          assert:
            - "Only the first MAX_IMAGES_PER_POST scores influence the result"
            - "All tests pass, 0 failed"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/core/signals/imageForensics.test.ts"
            expected_result: "Exit code 0, 5 passed, 0 failed."
          - command: "npm run build:test && npx playwright test --config playwright.bench.config.ts bench/scoring-latency.bench.ts"
            expected_result: "Exit code 0 with the median per-batch latency still at most 100ms with image analysis active."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, the failing assertion, and, if the latency benchmark failed, the measured median with image analysis active. Never raise the budget."
    definition_of_done:
      - "Confidence below the HD-010 threshold contributes nothing"
      - "Above the threshold the score is bounded and carries the fixed image-describing reason"
      - "A model failure yields ok false rather than a maximum score"
      - "At most MAX_IMAGES_PER_POST images are analysed per post, thumbnails only"
      - "The maximum per-image score is used, never the mean"
      - "The SF-109 latency budget still holds with image analysis active"
      - "npm run test:unit, npm run lint, and npm run typecheck all exit 0"
    e2e_validation:
      required: true
      applicability: not_applicable_pending_human_approval
      rationale_if_not_applicable: >-
        Exercising this layer in a browser requires real images containing detectable generation
        artefacts plus the real vision model, neither of which the committed fixtures or the harness
        provide, and fetching them externally would break the hermetic-E2E constraint applied to every
        spec in this plan. The layer's user-visible effect is a post collapsing with an image reason,
        which reuses the collapse journey already asserted end to end by SF-014.

  - id: SF-203
    title: Add per-account mute, trust, and images-only controls
    type: feature
    priority: P2
    status: planned
    description: >-
      Implement src/storage/accounts.ts and the per-account controls: mute an account so its posts are
      always collapsed, trust an account so its posts are never collapsed, and filter an account's
      images only. Trust must override every signal, including any veto.
    reason: "PRD section 4 specifies account-level controls for mute, trust, and images-only as part of the reversible feedback loop."
    user_value: "The user gets absolute manual override over any account, in both directions, regardless of what the signals say."
    depends_on: [SF-105, SF-106]
    blocks: []
    estimated_complexity: M
    risk_level: medium
    risks:
      - risk: "Trust is applied after scoring but before vetoes, so a veto still hides a trusted account's post and the control appears broken."
        mitigation: "Trust is evaluated first and short-circuits the entire pipeline including vetoes. A unit test constructs a post that satisfies every veto rule and asserts a trusted author is still not hidden."
      - risk: "Mute and trust are both set for one account, producing undefined behaviour."
        mitigation: "The store rejects a write that would set both, and a unit test asserts setting one clears the other."
      - risk: "Account state is keyed by display name, which the user can change, so overrides silently detach."
        mitigation: "Account state is keyed strictly by handle. A unit test asserts a display-name change leaves the override intact."
    constraints:
      - "Trust must short-circuit the entire decision, including vetoes."
      - "Account state is keyed by handle only, never by display name."
      - "Mute and trust are mutually exclusive; setting one clears the other."
      - "Account state lives in chrome.storage.local, per PRD section 5."
      - "Controls must expose accessible names so getByRole can address them."
    prerequisites:
      - "SF-105 and SF-106 complete."
    acceptance_criteria:
      - id: SF-203-AC1
        statement: "A trusted author's post is not hidden even when every veto rule applies."
        verification: "Run `npm run test:unit -- tests/unit/storage/accounts.test.ts`; expect the trust-overrides-veto test to pass."
      - id: SF-203-AC2
        statement: "A muted author's post is collapsed with the reason 'you muted this account' regardless of score."
        verification: "Expect the mute test to assert both hidden true and the exact reason."
      - id: SF-203-AC3
        statement: "Setting trust clears mute, and setting mute clears trust."
        verification: "Expect the mutual-exclusion test to assert both directions."
      - id: SF-203-AC4
        statement: "Changing an author's display name leaves the override in effect."
        verification: "Expect the handle-keying test to pass."
      - id: SF-203-AC5
        statement: "In a browser, muting an account collapses its posts and trusting it restores them."
        verification: "Run `npm run build:test && npm run test:e2e -- e2e/specs/account-controls.spec.ts`; expect 2 passed, 0 failed."
    steps:
      - id: SF-203-S01
        title: Write the failing account-override tests
        purpose: "Pin the override precedence, especially trust beating vetoes, before implementation."
        tdd_phase: red
        depends_on_steps: []
        files_to_touch:
          - path: tests/unit/storage/accounts.test.ts
            change: create
            detail: >-
              Stubs chrome.storage.local with vi.stubGlobal. Imports setAccountState,
              getAccountState, and applyAccountOverride from '@/storage/accounts'. Describe block
              "account overrides" with tests: "trust overrides every signal including vetoes",
              constructing a breakdown that every veto rule would hide and asserting the override
              result is not hidden; "mute collapses regardless of score", asserting hidden true and the
              reason 'you muted this account'; "setting trust clears mute and setting mute clears
              trust"; "state is keyed by handle, so a display-name change preserves the override";
              "images-only leaves a text-only post unfiltered".
        instructions:
          - "Create tests/unit/storage/accounts.test.ts with exactly the five tests described above."
          - "Run `npm run test:unit -- tests/unit/storage/accounts.test.ts` and record the failure."
        constraints:
          - "Do not create src/storage/accounts.ts in this step."
        test_specification:
          test_type: unit
          test_file: tests/unit/storage/accounts.test.ts
          test_name: "account overrides > trust overrides every signal including vetoes"
          arrange: "An account marked trusted and a ScoreBreakdown satisfying every configured veto rule."
          act: "Call applyAccountOverride(post, breakdown, accountState)."
          assert:
            - "The result's hidden flag is false"
            - "A muted account is hidden with the reason 'you muted this account'"
            - "Setting trust clears mute and vice versa"
            - "A display-name change preserves the override"
            - "Images-only leaves a text-only post unfiltered"
          expected_red_failure: "The run fails at import time with a module-not-found error naming @/storage/accounts."
        validation:
          - command: "npm run test:unit -- tests/unit/storage/accounts.test.ts; test $? -ne 0 && echo red-confirmed"
            expected_result: "Prints red-confirmed."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the full Vitest output."
      - id: SF-203-S02
        title: Implement the account store, the override, and the controls
        purpose: "Give the user a manual override that always wins, in both directions."
        tdd_phase: green
        depends_on_steps: [SF-203-S01]
        files_to_touch:
          - path: src/storage/accounts.ts
            change: create
            detail: >-
              Exports type AccountState = 'muted' | 'trusted' | 'images-only' | 'none'.
              Exports async setAccountState(handle: string, state: AccountState): Promise<void>,
              which writes to chrome.storage.local keyed by handle and, because the states are a single
              enum rather than independent flags, cannot represent muted and trusted simultaneously.
              Exports async getAccountState(handle): Promise<AccountState> defaulting to 'none'.
              Exports applyAccountOverride(post, breakdown, state): ScoreBreakdown, a pure function
              that returns a breakdown with hidden false and no reasons for 'trusted', hidden true with
              the single reason 'you muted this account' for 'muted', the unchanged breakdown for
              'none', and for 'images-only' the unchanged breakdown when the post has images and hidden
              false when it has none.
          - path: src/content/feedback.ts
            change: modify
            detail: "Add a control with accessible name 'Account options' opening a small menu whose items are buttons named 'Mute this account', 'Always show this account', and 'Filter images only', each calling setAccountState with the post author's handle."
          - path: src/content/index.ts
            change: modify
            detail: "After scorePost and before collapsePost, read the author's account state and pass the breakdown through applyAccountOverride, using its result for the collapse decision."
          - path: e2e/specs/account-controls.spec.ts
            change: create
            detail: "Uses the extension fixture. Two tests matching the two test cases declared in e2e_validation below."
        instructions:
          - "Create src/storage/accounts.ts with exactly the exports described above."
          - "Add the account-options control to src/content/feedback.ts."
          - "Apply the override in src/content/index.ts before collapsing."
          - "Create e2e/specs/account-controls.spec.ts with the two declared test cases."
          - "Run the unit tests and the account-controls E2E spec and confirm both pass."
        constraints:
          - "Model the states as one enum, not as independent booleans, so mute and trust cannot both be set."
          - "applyAccountOverride must be pure and must run after scoring, including after vetoes."
          - "Key by handle only."
        test_specification:
          test_type: e2e
          test_file: e2e/specs/account-controls.spec.ts
          test_name: "muting an account collapses its posts and trusting it restores them"
          arrange: "The harness with one run-unique post from a run-unique handle."
          act: "Open account options, choose 'Mute this account', reload, then choose 'Always show this account' and reload again."
          assert:
            - "After muting and reloading the post is collapsed with the mute reason"
            - "After trusting and reloading the post is visible with no placeholder"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/storage/accounts.test.ts"
            expected_result: "Exit code 0, 5 passed, 0 failed."
          - command: "npm run build:test && npm run test:e2e -- e2e/specs/account-controls.spec.ts"
            expected_result: "2 passed, 0 failed. Exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, exact command, exit code, the assertion output, the trace, screenshot, and video paths, and the account state actually read back from storage."
    definition_of_done:
      - "Trust short-circuits the whole decision including vetoes"
      - "Mute collapses with the reason 'you muted this account' regardless of score"
      - "Mute and trust are mutually exclusive by construction"
      - "Overrides are keyed by handle and survive a display-name change"
      - "Controls are keyboard reachable with accessible names"
      - "npm run test:unit, npm run lint, npm run typecheck, and the account-controls E2E spec all exit 0"
    e2e_validation:
      required: true
      applicability: applicable
      rationale_if_not_applicable: null
      test_file:
        path: e2e/specs/account-controls.spec.ts
        change: create
      user_journey:
        name: Taking manual control of a specific account
        actor:
          role: "Extension user overriding the filter for one account. The extension has no accounts and no roles."
          authentication:
            method: other
            fixture_or_source: "None. The extension has no authentication."
        preconditions:
          - "dist/ built with npm run build:test"
          - "The harness is serving http://localhost:5174"
          - "One run-unique post from a run-unique handle is visible"
        business_outcome: "The user's explicit decision about an account always wins over the automatic signals, in both directions."
      data_lifecycle:
        isolation_key: "Per-worker browser profile isolating chrome.storage.local, plus a run-unique author handle derived from uniqueRunId(testInfo) so no two workers touch the same account key"
        setup:
          method: fixture
          steps:
            - "The extension fixture creates a per-worker browser profile."
            - "The test appends a post whose authorHandle is derived from uniqueRunId."
        cleanup:
          method: fixture teardown
          steps:
            - "The test calls resetHarness(page) in an afterEach hook."
            - "The context fixture closes the context and deletes the per-worker profile directory, discarding all account state."
        prohibited:
          - shared manually-created test data
          - reliance on test execution order
          - mutation of production data
      selector_contract:
        required_test_ids: []
        locator_policy:
          allowed_in_order:
            - getByRole with accessible name
            - getByLabel
            - getByTestId
          forbidden:
            - CSS classes
            - XPath
            - positional selectors
            - generated IDs
            - DOM traversal
      browser_steps:
        - id: SF-203-E2E-01
          action: "Append a run-unique post and open its account options"
          route: "http://localhost:5174/"
          locator: "getByRole('button', {name: 'Account options'}).first()"
          input: "{id: `${runId}-post`, authorHandle: `@${runId}`, text: `body ${runId}`, postedAt: '2026-08-05T10:00:00Z'}"
          wait_for:
            condition: "getByRole('button', {name: 'Mute this account'}) is visible"
            timeout_ms: 5000
          assertions:
            - "The mute, always-show, and images-only options are all visible"
        - id: SF-203-E2E-02
          action: "Choose Mute this account and reload"
          route: "http://localhost:5174/"
          locator: "getByRole('button', {name: 'Mute this account'})"
          input: null
          wait_for:
            condition: "getByTestId('slopfilter-placeholder') is visible after the reload"
            timeout_ms: 10000
          assertions:
            - "The placeholder text contains 'you muted this account'"
            - "getByText(`body ${runId}`) is not visible"
        - id: SF-203-E2E-03
          action: "Restore the post, choose Always show this account, and reload"
          route: "http://localhost:5174/"
          locator: "getByRole('button', {name: 'Always show this account'})"
          input: null
          wait_for:
            condition: "getByText(`body ${runId}`) is visible after the reload"
            timeout_ms: 10000
          assertions:
            - "getByTestId('slopfilter-placeholder') has count 0"
            - "getByText(`body ${runId}`) is visible"
      test_cases:
        - id: SF-203-E2E-HAPPY-01
          title: Muting collapses an account's posts and trusting restores them
          priority: critical
          given: "The harness with one run-unique post from a run-unique handle visible"
          when: "The user mutes the account, reloads, then trusts the account and reloads again"
          then:
            - "After muting, the post is collapsed with the reason 'you muted this account'"
            - "After trusting, the placeholder count is 0 and the post body is visible"
            - "Both states survived a reload, proving the override persisted"
        - id: SF-203-E2E-NEGATIVE-01
          title: Trust wins even when the signals would hide the post
          priority: high
          applicability: applicable
          rationale_if_not_applicable: null
          given: "The harness at ?fixture=high-frequency, where the account exceeds the posting-frequency threshold and is collapsed by default"
          when: "The user trusts that account and reloads"
          then:
            - "The placeholder count for that account's posts is 0, proving trust beat the behavioural signal"
            - "The post bodies are visible"
            - "Muting and trusting were never both active, confirmed by the account options reflecting exactly one selected state"
      execution:
        command: "npm run build:test && npm run test:e2e -- e2e/specs/account-controls.spec.ts"
        expected_result: "2 passed, 0 failed"
        retries: 1
        artifacts_on_failure:
          - screenshot
          - trace
          - video
          - browser-console-output
          - failed-network-requests
      e2e_definition_of_done:
        - Happy path passes in the required browser
        - Relevant negative path passes, or is explicitly approved as not applicable
        - Test is isolated and parallel-safe
        - Test creates unique data and performs cleanup
        - Test has no fixed delays, sleeps, or arbitrary waits
        - Browser-visible user result and persisted final state are verified
        - Failure artefacts are configured and available

  - id: SF-204
    title: Add the local-only weekly stats panel
    type: feature
    priority: P2
    status: planned
    description: >-
      Implement src/storage/stats.ts recording posts seen, posts hidden, hidden-by-reason, and
      wrong-call counts in IndexedDB, and surface a weekly summary in the popup. All data stays local
      and can be cleared in one action.
    reason: "PRD section 4 requires a weekly local-only stats panel showing posts seen versus hidden, by reason, and PRD section 10 measures the wrong-call rate, which this is the only mechanism to observe."
    user_value: "The user can see how much the filter is doing and how often it is wrong, without any data leaving the machine."
    depends_on: [SF-103, SF-105]
    blocks: []
    estimated_complexity: M
    risk_level: low
    risks:
      - risk: "Counters are written per post on the content-script thread and add latency to the batch budget."
        mitigation: "Counters are accumulated in memory and flushed once per batch, not once per post, and the SF-109 latency benchmark covers the flushing path."
      - risk: "Stats accumulate without bound and grow the database indefinitely."
        mitigation: "Counters are bucketed by ISO week and buckets older than a fixed retention are pruned on write. A unit test inserts buckets beyond the retention and asserts the old ones are gone."
      - risk: "The wrong-call rate is displayed as a percentage of a tiny denominator and reads as alarming."
        mitigation: "The panel shows the raw counts alongside the rate and suppresses the rate entirely below a minimum denominator, asserted by a test."
    constraints:
      - "All statistics stay in IndexedDB on the user's machine. No network call anywhere in this ticket."
      - "Counters are flushed once per batch, never once per post."
      - "Buckets older than the retention window are pruned on write."
      - "The wrong-call rate is suppressed below the minimum denominator."
      - "A single control must clear all statistics."
    prerequisites:
      - "SF-103 and SF-105 complete."
    acceptance_criteria:
      - id: SF-204-AC1
        statement: "recordBatch increments seen and hidden counters once per call, not once per post."
        verification: "Run `npm run test:unit -- tests/unit/storage/stats.test.ts`; expect the single-flush test to assert exactly one write per batch."
      - id: SF-204-AC2
        statement: "Buckets older than the retention window are pruned on write."
        verification: "Expect the retention test to assert that only buckets within the window remain."
      - id: SF-204-AC3
        statement: "The wrong-call rate is null below the minimum denominator and a number at or above it."
        verification: "Expect the suppression test to assert both cases."
      - id: SF-204-AC4
        statement: "clearAllStats empties every bucket."
        verification: "Expect the clear test to assert a zero bucket count afterwards."
      - id: SF-204-AC5
        statement: "In a browser, the popup shows non-zero seen and hidden counts after filtering, and clearing resets them to zero."
        verification: "Run `npm run build:test && npm run test:e2e -- e2e/specs/stats.spec.ts`; expect 2 passed, 0 failed."
    steps:
      - id: SF-204-S01
        title: Write the failing stats tests
        purpose: "Pin batch-level flushing, retention, and rate suppression before implementation."
        tdd_phase: red
        depends_on_steps: []
        files_to_touch:
          - path: tests/unit/storage/stats.test.ts
            change: create
            detail: >-
              Imports fake-indexeddb/auto, then recordBatch, recordWrongCall, loadWeeklyStats,
              clearAllStats, RETENTION_WEEKS, and MIN_RATE_DENOMINATOR from '@/storage/stats'.
              Recreates the database in beforeEach. Describe block "stats" with tests:
              "records one write per batch regardless of post count", spying on the write path and
              asserting a single call for a batch of ten; "prunes buckets older than RETENTION_WEEKS";
              "suppresses the wrong-call rate below MIN_RATE_DENOMINATOR", asserting null below and a
              number at the boundary; "clearAllStats empties every bucket";
              "hidden-by-reason counts sum to the total hidden count".
        instructions:
          - "Create tests/unit/storage/stats.test.ts with exactly the five tests described above."
          - "Run `npm run test:unit -- tests/unit/storage/stats.test.ts` and record the failure."
        constraints:
          - "Do not create src/storage/stats.ts in this step."
          - "Recreate the database in beforeEach so tests are order-independent."
        test_specification:
          test_type: unit
          test_file: tests/unit/storage/stats.test.ts
          test_name: "stats > records one write per batch regardless of post count"
          arrange: "A fresh fake-indexeddb database and a batch of ten scored posts, four of them hidden."
          act: "Call recordBatch once with the whole batch."
          assert:
            - "Exactly one write occurred"
            - "seen increased by 10 and hidden by 4"
            - "Buckets older than RETENTION_WEEKS are pruned"
            - "The wrong-call rate is null below MIN_RATE_DENOMINATOR"
            - "hidden-by-reason counts sum to the total hidden count"
          expected_red_failure: "The run fails at import time with a module-not-found error naming @/storage/stats."
        validation:
          - command: "npm run test:unit -- tests/unit/storage/stats.test.ts; test $? -ne 0 && echo red-confirmed"
            expected_result: "Prints red-confirmed."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the full Vitest output."
      - id: SF-204-S02
        title: Implement the stats store and the popup panel
        purpose: "Let the user see what the filter did this week, honestly and locally."
        tdd_phase: green
        depends_on_steps: [SF-204-S01]
        files_to_touch:
          - path: src/storage/stats.ts
            change: create
            detail: >-
              Exports RETENTION_WEEKS and MIN_RATE_DENOMINATOR constants.
              Exports async recordBatch(entries: readonly {hidden: boolean; reasons: readonly
              string[]}[]): Promise<void>, which computes the ISO week bucket once, accumulates seen,
              hidden, and per-reason counts for the whole batch, writes them in one transaction, and
              prunes buckets older than RETENTION_WEEKS in the same transaction.
              Exports recordWrongCall(reasonIds), loadWeeklyStats(), which returns the current bucket
              plus a wrongCallRate that is null when hidden is below MIN_RATE_DENOMINATOR, and
              clearAllStats().
          - path: src/ui/popup/popup.html
            change: modify
            detail: "Add a stats section with data-testid slopfilter-stats containing paragraphs for posts seen, posts hidden, and the wrong-call rate, plus a button with accessible name 'Clear statistics'."
          - path: src/ui/popup/popup.ts
            change: modify
            detail: "On load, call loadWeeklyStats and populate the stats section with textContent. Render the wrong-call rate as 'not enough data yet' when it is null. Wire the clear button to clearAllStats and re-render."
          - path: src/content/index.ts
            change: modify
            detail: "Call recordBatch once per scored batch, after the collapse decisions are applied. Never call it per post."
          - path: e2e/specs/stats.spec.ts
            change: create
            detail: "Uses the extension fixture. Two tests matching the two test cases declared in e2e_validation below."
        instructions:
          - "Create src/storage/stats.ts with exactly the exports described above."
          - "Add the stats section and clear control to the popup."
          - "Call recordBatch once per batch from src/content/index.ts."
          - "Create e2e/specs/stats.spec.ts with the two declared test cases."
          - "Run the unit tests and the stats E2E spec and confirm both pass."
        constraints:
          - "recordBatch must be called once per batch. A per-post call is a constraint violation."
          - "No network call anywhere in this ticket."
          - "Never assign innerHTML in the popup."
        test_specification:
          test_type: e2e
          test_file: e2e/specs/stats.spec.ts
          test_name: "the popup reports non-zero counts after filtering and clears them on request"
          arrange: "The harness at ?fixture=high-frequency so posts are filtered, then the popup opened."
          act: "Read the stats section, click 'Clear statistics', and read it again."
          assert:
            - "Posts seen and posts hidden are both non-zero before clearing"
            - "Both read zero after clearing"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/storage/stats.test.ts"
            expected_result: "Exit code 0, 5 passed, 0 failed."
          - command: "npm run build:test && npm run test:e2e -- e2e/specs/stats.spec.ts"
            expected_result: "2 passed, 0 failed. Exit code 0."
          - command: "! grep -nE 'fetch\\(|XMLHttpRequest|sendBeacon' src/storage/stats.ts src/ui/popup/popup.ts && echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, exact command, exit code, the assertion output, the trace, screenshot, and video paths, and the stats object actually read back."
    definition_of_done:
      - "Counters are flushed once per batch, never per post"
      - "Buckets older than the retention window are pruned on write"
      - "The wrong-call rate is suppressed below the minimum denominator and shown as 'not enough data yet'"
      - "A single control clears all statistics"
      - "No network call exists anywhere in the stats path"
      - "npm run test:unit, npm run lint, npm run typecheck, and the stats E2E spec all exit 0"
    e2e_validation:
      required: true
      applicability: applicable
      rationale_if_not_applicable: null
      test_file:
        path: e2e/specs/stats.spec.ts
        change: create
      user_journey:
        name: Seeing what the filter did this week
        actor:
          role: "Extension user reviewing their own filtering statistics. The extension has no accounts and no roles."
          authentication:
            method: other
            fixture_or_source: "None. The extension has no authentication."
        preconditions:
          - "dist/ built with npm run build:test"
          - "The harness is serving http://localhost:5174 at ?fixture=high-frequency"
          - "At least one batch has been scored, so counters are non-zero"
        business_outcome: "The user sees how much the filter hid and how often it was wrong, entirely from local data, and can reset it."
      data_lifecycle:
        isolation_key: "Per-worker browser profile isolating IndexedDB, so each worker accumulates and clears its own counters"
        setup:
          method: fixture
          steps:
            - "The extension fixture creates a per-worker browser profile with an empty IndexedDB."
            - "The test loads http://localhost:5174/?fixture=high-frequency and waits for the first placeholder, guaranteeing at least one recorded batch."
        cleanup:
          method: fixture teardown
          steps:
            - "The test calls resetHarness(page) in an afterEach hook."
            - "The context fixture closes the context and deletes the per-worker profile directory, discarding all statistics."
        prohibited:
          - shared manually-created test data
          - reliance on test execution order
          - mutation of production data
      selector_contract:
        required_test_ids:
          - id: slopfilter-stats
            element: "The popup stats section container"
            component_file: src/ui/popup/popup.html
