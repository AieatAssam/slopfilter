    e2e_validation:
      required: true
      applicability: not_applicable_pending_human_approval
      rationale_if_not_applicable: >-
        The adapter is a pure DOM-reading module that is not yet wired into the content script; nothing
        it does is visible in a browser at this ticket. Its correctness is verified against committed
        golden fixtures, which is the stronger check here because it pins parsing to real captured
        markup rather than to a synthetic harness page. The adapter is exercised end to end by SF-014.

  - id: SF-008
    title: Implement the pure scoring pipeline and the Layer 1 behavioural signal
    type: feature
    priority: P0
    status: planned
    description: >-
      Create src/core/scoring/types.ts, src/core/scoring/pipeline.ts, and
      src/core/signals/behavioural.ts. The pipeline is a pure function taking a Post plus injected
      signal results and returning a hide decision with a full breakdown. Layer 1 scores posting
      frequency and engagement ratio using the data source selected by HD-004.
    reason: >-
      PRD section 5 requires a "pure, stateless, unit-testable TypeScript module consuming a normalized
      Post object", and PRD Phase 0 ships Layer 1 as the only signal. This is the ticket that turns
      parsed posts into a hide-or-show decision with a citable reason.
    user_value: "Technical: a deterministic, fully testable decision function, and the first real filtering capability."
    depends_on: [SF-004, SF-006]
    blocks: [SF-009, SF-014, SF-102, SF-104, SF-106]
    estimated_complexity: L
    risk_level: high
    risks:
      - risk: "Threshold values are invented, so fixture expected scores are circular and prove nothing about product behaviour."
        mitigation: "The ticket is blocked on HD-005. Every threshold is read from src/core/scoring/weights.ts, whose values come from the HD-005 answer, and the fixture expected scores are computed from those documented numbers."
      - risk: "The posting-frequency input is modelled before HD-004 selects its data source, so the signal is written against data that never arrives."
        mitigation: "The ticket is blocked on HD-004. The signal takes an AuthorActivity value as an injected parameter rather than reading any store, so the pipeline stays pure whichever source HD-004 selects."
      - risk: "The pipeline hides a post when a signal is unavailable, breaking the fail-open constraint."
        mitigation: "A dedicated test asserts that a post with no signal results at all is never hidden, and that an errored signal contributes zero rather than a maximum."
    constraints:
      - "Every module in this ticket lives under src/core/ and must pass the SF-002 purity boundary: no chrome API, no DOM, no IndexedDB, no imports from adapters, content, storage, offscreen, background, or ui."
      - "scorePost must be deterministic and side-effect free. Calling it twice with the same input must produce a deeply equal result."
      - "A post with zero available signal results must never be hidden."
      - "Reason strings must cite observable evidence only. No string may reference AI, generated, synthetic, bot-written, or authorship."
      - "Do not implement layers 2 through 5 in this ticket. Their SignalResult entries simply do not appear."
    prerequisites:
      - "SF-004 and SF-006 complete."
      - "HD-004 answered: the posting-frequency data source is fixed, which determines the shape of the AuthorActivity input."
      - "HD-005 answered: the Layer 1 thresholds and the composite hide threshold are fixed numbers."
    acceptance_criteria:
      - id: SF-008-AC1
        statement: "scorePost returns hidden false for a post with an empty signal-results array, regardless of threshold."
        verification: "Run `npm run test:unit -- tests/unit/core/scoring/pipeline.test.ts`; expect the fail-open test to pass."
      - id: SF-008-AC2
        statement: "scorePost is deterministic: two calls with the same input produce deeply equal results."
        verification: "The test 'is deterministic for identical input' calls scorePost twice and asserts toEqual; expect it to pass."
      - id: SF-008-AC3
        statement: "Every post in tests/fixtures/posts/posts-scoring.json produces exactly its recorded expected score and hidden flag."
        verification: "Run `npm run test:unit -- tests/unit/core/scoring/pipeline.test.ts`; expect one passing assertion per fixture entry, 0 failures."
      - id: SF-008-AC4
        statement: "The behavioural signal returns a score of 0 and a reason of null when the injected AuthorActivity is null."
        verification: "Run `npm run test:unit -- tests/unit/core/signals/behavioural.test.ts`; expect the missing-activity test to pass."
      - id: SF-008-AC5
        statement: "No reason string produced by any code path contains the words AI, generated, synthetic, or authored."
        verification: "Run `! grep -rniE '\\b(ai|generated|synthetic|authored)\\b' src/core/signals/behavioural.ts src/core/scoring/ && echo ok`; expect ok."
      - id: SF-008-AC6
        statement: "src/core/ passes the purity lint boundary."
        verification: "Run `npx biome lint src/core/`; expect exit code 0."
    steps:
      - id: SF-008-S01
        title: Write the failing pipeline and behavioural-signal tests
        purpose: "Pin fail-open behaviour, determinism, and the exact expected score of every fixture post before any scoring code exists."
        tdd_phase: red
        depends_on_steps: []
        files_to_touch:
          - path: tests/fixtures/posts/posts-scoring.json
            change: create
            detail: >-
              A JSON array of at least six objects, each with keys post, authorActivity, expectedScore,
              expectedHidden, and expectedReasonIds. The post values are taken from
              tests/fixtures/posts/posts-baseline.json, extended to the full Post shape. The expected
              values are computed by hand from the HD-005 threshold numbers and the weights recorded in
              src/core/scoring/weights.ts, and the arithmetic for each entry is written in a
              "derivation" string field on the same object so a reviewer can check it. Cases must
              include: activity below every threshold; activity above the frequency threshold only;
              activity above the engagement-ratio threshold only; activity above both; authorActivity
              null; and a post whose score lands exactly on the hide threshold.
          - path: tests/unit/core/scoring/pipeline.test.ts
            change: create
            detail: >-
              Imports scorePost from '@/core/scoring/pipeline' and the fixtures from
              tests/fixtures/posts/posts-scoring.json. Describe block "scorePost" with tests:
              "never hides a post with no signal results" asserting hidden is false for an empty
              results array even with the threshold at 0;
              "is deterministic for identical input" asserting two calls toEqual;
              "treats an errored signal as a zero contribution rather than a maximum", passing a
              SignalResult with ok false and asserting the composite score is unchanged from the
              no-signal case;
              and a test.each over the fixture array named
              "scores fixture %s to its recorded value" asserting both the composite score, compared
              with toBeCloseTo at 4 decimal places, and the hidden flag.
          - path: tests/unit/core/signals/behavioural.test.ts
            change: create
            detail: >-
              Imports scoreBehavioural from '@/core/signals/behavioural'. Describe block
              "scoreBehavioural" with tests: "returns score 0 and reason null when activity is null";
              "returns a non-zero score and a frequency reason when posts per day exceeds the
              threshold", asserting the reason string contains the numeric posts-per-day value;
              "returns a non-zero score and an engagement reason when the engagement ratio is below the
              threshold"; "clamps the returned score to the inclusive range 0 to 1" for an extreme
              activity value; and "never returns a reason mentioning authorship", asserting the reason
              string does not match /\b(ai|generated|synthetic|authored)\b/i.
        instructions:
          - "Create tests/fixtures/posts/posts-scoring.json with at least six entries, each carrying a derivation string showing how expectedScore was computed from the HD-005 numbers."
          - "Create tests/unit/core/scoring/pipeline.test.ts with exactly the tests described above."
          - "Create tests/unit/core/signals/behavioural.test.ts with exactly the tests described above."
          - "Run `npm run test:unit -- tests/unit/core` and record the failure."
        constraints:
          - "Do not create any file under src/core/scoring/ or src/core/signals/ in this step."
          - "Every expectedScore must be derivable from the HD-005 numbers by the arithmetic written in its derivation field. An expected value that cannot be derived is a fabricated expectation: stop and report."
        test_specification:
          test_type: unit
          test_file: tests/unit/core/scoring/pipeline.test.ts
          test_name: "scorePost > never hides a post with no signal results"
          arrange: "A valid Post, an empty SignalResult array, and a scoring config whose hide threshold is 0."
          act: "Call scorePost(post, [], config)."
          assert:
            - "The returned hidden flag is false"
            - "Two identical calls produce deeply equal results"
            - "An errored SignalResult contributes zero to the composite score"
            - "Every fixture entry scores to its recorded value within 4 decimal places and matches its recorded hidden flag"
          expected_red_failure: "The run fails at import time with a module-not-found error naming @/core/scoring/pipeline."
        validation:
          - command: "npm run test:unit -- tests/unit/core; test $? -ne 0 && echo red-confirmed"
            expected_result: "Prints red-confirmed. A zero exit code means the tests are not failing: stop and report."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the full Vitest output."
      - id: SF-008-S02
        title: Implement the scoring types and the pure pipeline
        purpose: "Provide the deterministic, fail-open decision function every signal plugs into."
        tdd_phase: green
        depends_on_steps: [SF-008-S01]
        files_to_touch:
          - path: src/core/scoring/types.ts
            change: create
            detail: >-
              Export type LayerId as the union 'behavioural' | 'provenance' | 'content-type' |
              'image-forensics' | 'taste'.
              Export interface SignalResult {layerId: LayerId; ok: boolean; score: number;
              reason: string | null}. score is in the inclusive range 0 to 1 and is ignored when ok is
              false.
              Export interface ScoringConfig {hideThreshold: number; weights: Readonly<Record<LayerId,
              number>>}.
              Export interface ScoreBreakdown {compositeScore: number; hidden: boolean;
              contributions: readonly {layerId: LayerId; score: number; weight: number;
              weighted: number; reason: string | null}[]; reasons: readonly string[]}.
          - path: src/core/scoring/pipeline.ts
            change: create
            detail: >-
              Imports the types above and type Post from '@/core/post'.
              Export function scorePost(post: Post, results: readonly SignalResult[], config:
              ScoringConfig): ScoreBreakdown.
              Behaviour: filter out any result whose ok is false; if the remaining list is empty return
              {compositeScore: 0, hidden: false, contributions: [], reasons: []}; otherwise compute
              weighted = score * weight per remaining result, sum the weighted values, divide by the
              sum of the weights actually used so the composite stays in 0 to 1, set hidden to
              compositeScore >= config.hideThreshold, and collect every non-null reason in layer order.
              The post parameter is used only to populate nothing at this ticket and is retained
              because later layers key off it; do not remove it.
              The function performs no I/O, mutates no argument, and captures no module-level state.
        instructions:
          - "Create src/core/scoring/types.ts with exactly the types described above."
          - "Create src/core/scoring/pipeline.ts with exactly the behaviour described above."
          - "Run `npm run test:unit -- tests/unit/core/scoring/pipeline.test.ts` and confirm every test passes."
          - "Run `npx biome lint src/core/` and confirm exit code 0."
        constraints:
          - "Divide by the sum of the weights actually used, not by the sum of all configured weights. Dividing by the full total would make a single available signal unable to reach the threshold, silently disabling Phase 0 filtering."
          - "hidden must use >= so that a score exactly on the threshold hides, matching the fixture case."
          - "No module-level mutable state."
        test_specification:
          test_type: unit
          test_file: tests/unit/core/scoring/pipeline.test.ts
          test_name: "scorePost > scores fixture %s to its recorded value"
          arrange: "Each entry of tests/fixtures/posts/posts-scoring.json supplying a post, its signal results, and its recorded expected values."
          act: "Call scorePost for each entry."
          assert:
            - "compositeScore matches expectedScore within 4 decimal places for every entry"
            - "hidden matches expectedHidden for every entry"
            - "All tests in the file pass, 0 failed"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/core/scoring/pipeline.test.ts"
            expected_result: "Exit code 0, all tests passed, 0 failed."
          - command: "npx biome lint src/core/ && echo ok"
            expected_result: "Prints ok, exit code 0, confirming the purity boundary holds."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, the failing fixture id, its expected and received composite score, and its derivation string."
      - id: SF-008-S03
        title: Implement the Layer 1 behavioural signal
        purpose: "Produce the first real signal, with evidence-based reason strings the collapse UI can display verbatim."
        tdd_phase: green
        depends_on_steps: [SF-008-S02]
        files_to_touch:
          - path: src/core/signals/behavioural.ts
            change: create
            detail: >-
              Imports type Post from '@/core/post' and type SignalResult from
              '@/core/scoring/types'.
              Export interface AuthorActivity {postsPerDay: number | null; observedPostCount: number;
              observationWindowHours: number}. The exact field set is fixed by the HD-004 answer; if
              HD-004 selects an option that cannot supply postsPerDay, stop and report rather than
              approximating it.
              Export interface BehaviouralThresholds {postsPerDayThreshold: number;
              engagementRatioThreshold: number}. Values come from src/core/scoring/weights.ts.
              Export function scoreBehavioural(post: Post, activity: AuthorActivity | null, thresholds:
              BehaviouralThresholds): SignalResult with layerId 'behavioural'.
              When activity is null it returns {ok: true, score: 0, reason: null}.
              When activity.postsPerDay exceeds postsPerDayThreshold it contributes a score rising with
              the excess, clamped to 1, and a reason of the exact form
              "posts <N>+ times per day" with N the rounded postsPerDay.
              When engagement, defined as (likes + reposts + replies) divided by views, is below
              engagementRatioThreshold and views is non-null and greater than zero, it contributes a
              second component and a reason of the exact form
              "high views, very little engagement".
              The final score is the maximum of the component scores, clamped to the inclusive range
              0 to 1. Reasons are joined with " and " when both fire.
          - path: src/core/scoring/weights.ts
            change: create
            detail: >-
              Exports const DEFAULT_THRESHOLDS: BehaviouralThresholds and const DEFAULT_SCORING_CONFIG:
              ScoringConfig. Every numeric value is exactly the number fixed by HD-005, and each is
              accompanied by a comment naming HD-005 as its source. Weights for the four layers not yet
              implemented are present with value 0, so adding a layer later is a value change rather
              than a shape change.
        instructions:
          - "Create src/core/scoring/weights.ts with the exact numeric values fixed by HD-005 and a source comment on each."
          - "Create src/core/signals/behavioural.ts implementing exactly the behaviour described above."
          - "Run `npm run test:unit -- tests/unit/core` and confirm every test passes."
          - "Run `npm run lint`, `npm run typecheck`, and the AC5 reason-string grep, and confirm all exit 0."
        constraints:
          - "Do not invent a threshold number. Every value in weights.ts must trace to the HD-005 answer."
          - "The engagement component must be skipped entirely when views is null or zero, to avoid a divide-by-zero producing Infinity."
          - "Reason strings must match the exact wording given above, because SF-009 renders them verbatim and SF-014 asserts on them."
        test_specification:
          test_type: unit
          test_file: tests/unit/core/signals/behavioural.test.ts
          test_name: "scoreBehavioural > returns a non-zero score and a frequency reason when posts per day exceeds the threshold"
          arrange: "A valid Post and an AuthorActivity whose postsPerDay is above the HD-005 threshold."
          act: "Call scoreBehavioural(post, activity, DEFAULT_THRESHOLDS)."
          assert:
            - "score is greater than 0 and at most 1"
            - "reason equals the exact string 'posts <N>+ times per day' with N the rounded postsPerDay"
            - "score is 0 and reason is null when activity is null"
            - "score is clamped to at most 1 for an extreme activity value"
            - "reason never matches /\\b(ai|generated|synthetic|authored)\\b/i"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/core"
            expected_result: "Exit code 0, all tests passed, 0 failed."
          - command: "! grep -rniE '\\b(ai|generated|synthetic|authored)\\b' src/core/signals/behavioural.ts src/core/scoring/ && echo ok"
            expected_result: "Prints ok, exit code 0. Any match is a PRD section 8 violation: stop and report the matching line."
          - command: "npm run lint && npm run typecheck && echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, the failing assertion with expected and received values, and the threshold values read from weights.ts."
    definition_of_done:
      - "scorePost is pure, deterministic, and never hides a post with no usable signal results"
      - "Every entry in tests/fixtures/posts/posts-scoring.json scores to its recorded value and hidden flag"
      - "scoreBehavioural returns score 0 and reason null when activity is null"
      - "Every threshold in weights.ts traces to the HD-005 answer via a source comment"
      - "No reason string or source line in src/core/ mentions AI, generated, synthetic, or authorship"
      - "npx biome lint src/core/ exits 0, proving the purity boundary holds"
      - "npm run test:unit, npm run typecheck, and npm run lint all exit 0"
    e2e_validation:
      required: true
      applicability: not_applicable_pending_human_approval
      rationale_if_not_applicable: >-
        The scoring pipeline and the behavioural signal are pure functions with no rendering path and
        no wiring into the content script at this ticket. Their correctness is fully determined by the
        fixture table, which is a stronger check than a browser assertion because it pins every
        expected score to a written derivation. The first browser-visible consequence of these
        functions is asserted by SF-009 and end to end by SF-014.

  - id: SF-009
    title: Render collapsed posts with an evidence-based reason label and a show-anyway control
    type: feature
    priority: P0
    status: planned
    description: >-
      Implement src/content/collapse.ts and public/content/styles.css so a post the pipeline marks
      hidden is replaced in place by a single-line dimmed placeholder showing the reason label and a
      "Show anyway" button that restores the original post. Nothing is ever removed from the DOM.
    reason: >-
      PRD section 4 requires that posts are collapsed rather than deleted, with a reason label and
      one-click show-anyway, and PRD section 2 requires every hidden post to cite observable evidence.
      This is the ticket that makes filtering visible and reversible.
    user_value: "The user sees a compact, honest explanation instead of a slop post, and can always recover the original with one click."
    depends_on: [SF-003, SF-008]
    blocks: [SF-014, SF-105, SF-107]
    estimated_complexity: M
    risk_level: medium
    risks:
      - risk: "Collapsing removes or replaces the post node, so the platform's own virtualised list re-renders it, loses scroll position, or throws."
        mitigation: "The original element is never removed. It is hidden with an inline style and the placeholder is inserted as a sibling, so restoring is a style change rather than a re-insertion."
      - risk: "Injected styles leak into or are overridden by the host page's CSS."
        mitigation: "Every injected element carries a class prefixed slopfilter- and every rule in styles.css is scoped under that prefix. A unit test asserts no rule selects a bare element type."
      - risk: "The reason label is composed by the UI, so wording drifts from the evidence the signal actually produced."
        mitigation: "collapse.ts renders the reason strings from the ScoreBreakdown verbatim and never composes its own. A unit test asserts the rendered text equals the joined breakdown reasons."
    constraints:
      - "The original post element must never be removed from the DOM. It is hidden by setting its inline display style and restored by clearing it."
      - "Every injected element must carry a class beginning slopfilter- and the placeholder must carry data-testid slopfilter-placeholder."
      - "The reason label must be rendered from ScoreBreakdown.reasons verbatim. collapse.ts must not contain any hardcoded reason wording."
      - "No injected string may reference AI, generated, synthetic, or authorship."
      - "collapse.ts must not import from src/core/signals/ or perform any scoring itself."
      - "No inline event-handler attributes. Listeners are attached with addEventListener."
    prerequisites:
      - "SF-003 and SF-008 complete."
    acceptance_criteria:
      - id: SF-009-AC1
        statement: "collapsePost hides the original element and inserts a placeholder as its next sibling, leaving the original in the DOM."
        verification: "Run `npm run test:unit -- tests/unit/content/collapse.test.ts`; expect the DOM-shape test to pass."
      - id: SF-009-AC2
        statement: "The placeholder's visible text contains every reason string from the ScoreBreakdown, joined by the separator ' · ', and nothing else beyond the 'Hidden: ' prefix and the button label."
        verification: "The test 'renders the breakdown reasons verbatim' asserts the placeholder text equals 'Hidden: ' plus the joined reasons."
      - id: SF-009-AC3
        statement: "Clicking Show anyway restores the original post's visibility and removes the placeholder."
        verification: "The test 'show anyway restores the original post' dispatches a click and asserts the original element's inline display is empty and the placeholder is gone."
      - id: SF-009-AC4
        statement: "Calling collapsePost twice on the same element produces exactly one placeholder."
        verification: "The test 'is idempotent' calls collapsePost twice and asserts querySelectorAll for the placeholder testid has length 1."
      - id: SF-009-AC5
        statement: "The E2E spec confirms a harness post is collapsed with a visible reason and restored by Show anyway."
        verification: "Run `npm run build:test && npm run test:e2e -- e2e/specs/collapse.spec.ts`; expect 2 passed, 0 failed."
    steps:
      - id: SF-009-S01
        title: Write the failing collapse unit tests
        purpose: "Fix the exact DOM transformation and the exact rendered text before any rendering code exists."
        tdd_phase: red
        depends_on_steps: []
        files_to_touch:
          - path: tests/unit/content/collapse.test.ts
            change: create
            detail: >-
              Imports collapsePost and restorePost from '@/content/collapse'. Each test builds a
              container with one article element via document.createElement. Describe block
              "collapsePost" with tests:
              "hides the original element and inserts a placeholder sibling" asserting the original is
              still in the DOM, its style.display is 'none', and its nextElementSibling has
              data-testid slopfilter-placeholder;
              "renders the breakdown reasons verbatim" with a breakdown whose reasons are
              ['posts 40+ times per day', 'high views, very little engagement'], asserting the
              placeholder textContent contains
              'Hidden: posts 40+ times per day · high views, very little engagement';
              "show anyway restores the original post", clicking the button located by its accessible
              name 'Show anyway' and asserting the original's style.display is '' and no placeholder
              remains;
              "is idempotent" calling collapsePost twice and asserting exactly one placeholder exists;
              "never renders an authorship claim" asserting the placeholder textContent does not match
              /\b(ai|generated|synthetic|authored)\b/i.
        instructions:
          - "Create tests/unit/content/collapse.test.ts with exactly the five tests described above."
          - "Run `npm run test:unit -- tests/unit/content/collapse.test.ts` and record the failure."
        constraints:
          - "Do not create src/content/collapse.ts in this step."
          - "Locate the button by its accessible name, not by a CSS class."
        test_specification:
          test_type: unit
          test_file: tests/unit/content/collapse.test.ts
          test_name: "collapsePost > hides the original element and inserts a placeholder sibling"
          arrange: "A container element holding one article element, and a ScoreBreakdown with two reason strings."
          act: "Call collapsePost(article, breakdown)."
          assert:
            - "The article is still present in the DOM"
            - "The article's inline display style is 'none'"
            - "The article's nextElementSibling has data-testid slopfilter-placeholder"
            - "The placeholder text equals 'Hidden: ' plus the reasons joined with ' · ' plus the button label"
            - "Clicking Show anyway clears the article's inline display and removes the placeholder"
            - "Calling collapsePost twice yields exactly one placeholder"
            - "The placeholder text never matches /\\b(ai|generated|synthetic|authored)\\b/i"
          expected_red_failure: "The run fails at import time with a module-not-found error naming @/content/collapse."
        validation:
          - command: "npm run test:unit -- tests/unit/content/collapse.test.ts; test $? -ne 0 && echo red-confirmed"
            expected_result: "Prints red-confirmed. A zero exit code means the test is not failing: stop and report."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the full Vitest output."
      - id: SF-009-S02
        title: Implement collapsePost, restorePost, and the scoped stylesheet
        purpose: "Make the red tests pass with a transformation that is reversible and cannot disturb the host page's list virtualisation."
        tdd_phase: green
        depends_on_steps: [SF-009-S01]
        files_to_touch:
          - path: src/content/collapse.ts
            change: create
            detail: >-
              Imports type ScoreBreakdown from '@/core/scoring/types'.
              Export function collapsePost(element: HTMLElement, breakdown: ScoreBreakdown): void.
              It returns immediately if element.dataset.slopfilterCollapsed is already 'true'.
              Otherwise it sets that dataset flag, sets element.style.display to 'none', and inserts a
              div with class 'slopfilter-placeholder' and data-testid 'slopfilter-placeholder'
              immediately after the element. The placeholder contains a span with class
              'slopfilter-reason' whose textContent is 'Hidden: ' followed by
              breakdown.reasons.join(' · '), and a button element with class
              'slopfilter-show-anyway' whose textContent is 'Show anyway' and whose type is 'button'.
              The button gets a click listener added with addEventListener that calls restorePost.
              Export function restorePost(element: HTMLElement): void, which clears the dataset flag,
              sets element.style.display to '', and removes the placeholder sibling if present.
              Every DOM node is created with document.createElement and populated with textContent.
              innerHTML is never assigned.
          - path: public/content/styles.css
            change: modify
            detail: >-
              Replace the placeholder comment from SF-001 with rules scoped entirely under the
              slopfilter- prefix: .slopfilter-placeholder sets display flex, alignItems center, a small
              gap, reduced opacity, a muted border, and compact padding; .slopfilter-reason sets a
              smaller font size and inherits colour; .slopfilter-show-anyway sets a minimal button
              appearance with a visible focus outline. Every selector must begin with .slopfilter-.
        instructions:
          - "Create src/content/collapse.ts implementing exactly the two exported functions described above."
          - "Replace the contents of public/content/styles.css with the scoped rules described above."
          - "Run `npm run test:unit -- tests/unit/content/collapse.test.ts` and confirm 5 passing tests."
          - "Confirm every selector in public/content/styles.css begins with .slopfilter-."
        constraints:
          - "Never assign innerHTML. Injected content is built with createElement and textContent, because the reason strings originate from page-derived data."
          - "Never remove the original post element from the DOM."
          - "Every CSS selector must begin with .slopfilter-. A bare element or wildcard selector would restyle the host page."
        test_specification:
          test_type: unit
          test_file: tests/unit/content/collapse.test.ts
          test_name: "collapsePost > show anyway restores the original post"
          arrange: "A collapsed article with its placeholder sibling present."
          act: "Locate the button by accessible name 'Show anyway' and dispatch a click event."
          assert:
            - "The article's inline display style is the empty string"
            - "No element with data-testid slopfilter-placeholder remains"
            - "All 5 tests pass, 0 failed"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/content/collapse.test.ts"
            expected_result: "Exit code 0, 5 passed, 0 failed."
          - command: "! grep -n 'innerHTML' src/content/collapse.ts && echo ok"
            expected_result: "Prints ok, exit code 0."
          - command: "! grep -nE '^[^.@/}]*\\{' public/content/styles.css && echo ok"
            expected_result: "Prints ok, exit code 0, confirming no unscoped selector exists."
          - command: "npm run lint && npm run typecheck && echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, the failing assertion with expected and received values, and the rendered placeholder textContent."
      - id: SF-009-S03
        title: Add the collapse E2E spec against the harness
        purpose: "Prove in a real browser that a user sees a collapsed post with a reason and can recover the original, which no unit test can establish."
        tdd_phase: validation
        depends_on_steps: [SF-009-S02]
        files_to_touch:
          - path: tests/harness/harness.ts
            change: modify
            detail: >-
              Add a method collapseFirstPost(reasons: string[]) to window.__slopfilterHarness that
              imports collapsePost from '@/content/collapse' and calls it on the first post-article
              element with a synthetic ScoreBreakdown built from the supplied reasons. This lets the
              E2E spec exercise the real rendering code before SF-014 wires the observer.
          - path: e2e/support/harness.d.ts
            change: modify
            detail: "Add collapseFirstPost(reasons: string[]): void to the declared __slopfilterHarness interface."
          - path: e2e/specs/collapse.spec.ts
            change: create
            detail: >-
              Uses the extension fixture from e2e/support/extension.ts. Two tests, matching the two
              test cases declared in e2e_validation below.
        instructions:
          - "Add collapseFirstPost to tests/harness/harness.ts and to e2e/support/harness.d.ts."
          - "Create e2e/specs/collapse.spec.ts with exactly the two test cases declared in e2e_validation."
          - "Run `npm run build:test && npm run test:e2e -- e2e/specs/collapse.spec.ts` and confirm 2 passing tests."
        constraints:
          - "Use getByRole and getByTestId only. No CSS class locators, no XPath, no nth-child."
          - "No waitForTimeout and no sleep. Wait on the placeholder's visibility."
        test_specification:
          test_type: e2e
          test_file: e2e/specs/collapse.spec.ts
          test_name: "collapses a post with its reason label and restores it on Show anyway"
          arrange: "The harness page loaded with the extension present, and a unique run id used to seed one appended post."
          act: "Call collapseFirstPost with two reason strings, then click the Show anyway button."
          assert:
            - "The placeholder is visible and its text contains both reason strings"
            - "After clicking Show anyway the placeholder is detached and the original post text is visible"
          expected_red_failure: null
        validation:
          - command: "npm run build:test && npm run test:e2e -- e2e/specs/collapse.spec.ts"
            expected_result: "2 passed, 0 failed. Exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, the exact command, exit code, the assertion output, the retained trace, screenshot, and video paths under test-results/, the browser console output, and whether resetHarness ran in teardown."
    definition_of_done:
      - "collapsePost hides rather than removes the original post and inserts exactly one placeholder"
      - "The reason label renders ScoreBreakdown.reasons verbatim with no wording composed in the UI"
      - "Show anyway restores the original post and removes the placeholder"
      - "collapsePost is idempotent"
      - "No injected string references AI, generated, synthetic, or authorship"
      - "Every CSS selector in public/content/styles.css is scoped under .slopfilter-"
      - "innerHTML is never assigned in src/content/collapse.ts"
      - "npm run test:unit, npm run lint, npm run typecheck, and the collapse E2E spec all exit 0"
    e2e_validation:
      required: true
      applicability: applicable
      rationale_if_not_applicable: null
      test_file:
        path: e2e/specs/collapse.spec.ts
        change: create
      user_journey:
        name: A hidden post shows why it was hidden and can be recovered
        actor:
          role: "Extension user reading their timeline. The extension has no accounts and no roles."
          authentication:
            method: other
            fixture_or_source: "None. The extension has no authentication and the harness page is unauthenticated by design."
        preconditions:
