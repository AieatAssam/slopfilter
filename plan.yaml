            condition: "getByTestId('slopfilter-placeholder') is visible"
            timeout_ms: 10000
          assertions:
            - "The post is collapsed, proving the downvote survived the reload"
            - "The placeholder text contains 'similar to posts you downvoted'"
        - id: SF-105-E2E-04
          action: "Click the wrong-call control on the placeholder"
          route: "http://localhost:5174/"
          locator: "getByRole('button', {name: 'This was wrong'})"
          input: null
          wait_for:
            condition: "getByTestId('slopfilter-placeholder') is detached"
            timeout_ms: 5000
