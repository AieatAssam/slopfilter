          - "The harness server is serving http://localhost:5174"
          - "One post with a run-unique id has been appended to the timeline"
        business_outcome: "The user sees a compact, evidence-based explanation in place of a post, and can restore the original with one click, so filtering is never destructive."
      data_lifecycle:
