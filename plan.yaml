      - "Both controls are keyboard reachable with accessible names"
      - "No network request originates anywhere in the feedback path"
      - "Downvotes persist across a page reload, proven in a browser"
      - "npm run test:unit, npm run lint, npm run typecheck, and the feedback E2E spec all exit 0"
