          arrange: "An empty article element created with document.createElement('article')."
          act: "Call xAdapter.extractPost on it."
          assert:
            - "The result is null"
            - "No error was thrown"
            - "All tests in the file pass, 0 failed"
          expected_red_failure: null
        validation:
