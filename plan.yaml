          - command: "! grep -rniE '\\b(ai[- ]?(generated|written|detect)|written by (an )?ai|synthetic|authored by)\\b' src/ docs/store-listing.md && echo ok"
            expected_result: "Prints ok, exit code 0. Any match is a PRD section 8 violation: stop and report the matching file and line."
          - command: "! grep -rnE 'fetch\\(|XMLHttpRequest|new WebSocket|sendBeacon' src/ --include='*.ts' | grep -v 'offscreen/models.ts' && echo ok"
            expected_result: "Prints ok, exit code 0, confirming the privacy claim is true rather than merely written down."
          - command: "npm run build:test && npm run test:e2e -- e2e/specs/onboarding.spec.ts"
            expected_result: "2 passed, 0 failed. Exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, exact command, exit code, the assertion output, the trace, screenshot, and video paths, and, for a grep failure, the exact matching file and line verbatim."
    definition_of_done:
      - "Onboarding opens exactly once, with the first-run flag written before the page is opened"
      - "The privacy page names the single permitted network destination and gives DevTools verification steps"
