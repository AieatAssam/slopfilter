            element: "The collapsed-post placeholder container, already introduced by SF-009"
            component_file: src/content/collapse.ts
            purpose: "The placeholder is a generic div with no ARIA role and a per-post variable text, so it has no stable accessible name to address it by. No new test id is introduced by this ticket."
        locator_policy:
          allowed_in_order:
