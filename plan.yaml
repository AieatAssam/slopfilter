          - "Create src/background/onboarding.ts and call it from the onInstalled listener."
          - "Create docs/store-listing.md with the four sections described above."
          - "Add both new pages to vite.config.ts rollupOptions.input."
          - "Create e2e/specs/onboarding.spec.ts with the two declared test cases."
          - "Run `npm run test:unit -- tests/unit/background/onboarding.test.ts tests/unit/ui/copy.test.ts` and confirm every test passes."
          - "Run the two acceptance-criteria greps for the authorship pattern and for network calls, and confirm both print ok."
          - "Run `npm run build:test && npm run test:e2e -- e2e/specs/onboarding.spec.ts` and confirm 2 passing tests."
        constraints:
          - "Write the first-run flag before opening the page, never after."
          - "Do not add any permission to the manifest."
          - "Do not commit screenshots, videos, or any binary listing asset."
          - "Do not submit to any store. This ticket produces copy only."
        test_specification:
          test_type: e2e
          test_file: e2e/specs/onboarding.spec.ts
          test_name: "the onboarding page explains the product without claiming AI detection"
          arrange: "A freshly created per-worker browser profile with the extension installed."
          act: "Open the onboarding page at the extension origin and read its content, then follow the privacy link."
          assert:
            - "The onboarding heading shows the product name"
            - "The page text does not match the authorship pattern"
            - "The privacy link navigates to the privacy page, which names the single network destination"
          expected_red_failure: null
        validation:
