tickets:
  - id: SF-001
    title: Scaffold the Manifest V3 extension with npm, TypeScript, and Vite
    type: infrastructure
    priority: P0
    status: planned
    description: >-
      Create the repository baseline: package.json with the npm command surface, TypeScript strict
      configuration, a Vite multi-entry build emitting a Manifest V3 dist/, a hand-written
      public/manifest.json, placeholder icons, .gitignore, README.md, LICENSE, and a console-only
      logger. After this ticket, `npm ci` and `npm run build` succeed and dist/ loads as an unpacked
      extension in Chromium.
    reason: >-
      The repository is empty. Every other ticket references npm scripts, TypeScript paths, and a
      dist/ output that do not exist yet. This ticket creates the entire command surface recorded as
      null in meta.repository_context.existing_commands.
    user_value: "Technical: a loadable, buildable extension skeleton that every later ticket extends."
    depends_on: []
    blocks: [SF-002, SF-003, SF-004, SF-005, SF-006, SF-007, SF-008, SF-009, SF-010, SF-011, SF-012, SF-013, SF-014]
    estimated_complexity: M
    risk_level: low
    risks:
      - risk: "Vite's default single-entry build does not emit the multiple separate bundles an MV3 extension needs, producing a dist/ Chromium rejects."
        mitigation: "Configure rollupOptions.input explicitly with one named entry per extension context and set output.entryFileNames to a stable non-hashed pattern so manifest.json paths never break."
      - risk: "A content script emitted as an ES module fails to load, because Chromium content scripts are classic scripts unless declared as modules."
        mitigation: "Set build.rollupOptions.output.format to 'iife' for the content-script entry and verify by loading dist/ unpacked and confirming no console error."
      - risk: "manifest.json name and LICENSE contents are guessed while HD-001 and HD-002 are unresolved."
        mitigation: "This ticket is blocked on HD-001 and HD-002. Do not start until both are answered in writing."
    constraints:
      - "manifest_version must be 3. No Manifest V2 keys."
      - "host_permissions is exactly [\"https://x.com/*\", \"https://twitter.com/*\"]. No <all_urls>, no wildcard scheme."
      - "permissions is exactly [\"storage\"] at this ticket. Later tickets add permissions explicitly."
      - "No dependency may be installed other than those named in the package.json detail below."
      - "src/shared/logger.ts writes only to console. It must not fetch, post, or persist anything."
      - "Do not create empty directories. Only directories receiving a file in this ticket exist after it."
    prerequisites:
      - "HD-001 answered: the extension display name is fixed in writing."
      - "HD-002 answered: the licence identifier and copyright holder string are fixed in writing."
      - "Node.js v24.17.0 and npm 11.13.0 available on PATH (verified present on the host)."
      - "The planning baseline commit exists; docs/ and plan.yaml are already tracked."
    acceptance_criteria:
      - id: SF-001-AC1
        statement: "`npm ci` completes successfully from a clean checkout with no node_modules present."
        verification: "Run `rm -rf node_modules && npm ci`; expect exit code 0."
      - id: SF-001-AC2
        statement: "`npm run build` emits dist/manifest.json whose manifest_version field equals 3."
        verification: "Run `npm run build && node --input-type=module -e \"import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('dist/manifest.json','utf8'));if(m.manifest_version!==3)throw new Error('manifest_version is '+m.manifest_version);console.log('ok')\"`; expect ok and exit code 0."
      - id: SF-001-AC3
        statement: "dist/ contains the content-script bundle at the exact path declared in manifest.json content_scripts[0].js[0]."
        verification: "Run `node --input-type=module -e \"import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('dist/manifest.json','utf8'));fs.accessSync('dist/'+m.content_scripts[0].js[0]);console.log('ok')\"`; expect ok and exit code 0."
      - id: SF-001-AC4
        statement: "manifest.json host_permissions contains exactly https://x.com/* and https://twitter.com/* and nothing else."
        verification: "Run `node --input-type=module -e \"import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('dist/manifest.json','utf8'));const e=JSON.stringify(m.host_permissions);if(e!==JSON.stringify(['https://x.com/*','https://twitter.com/*']))throw new Error(e);console.log('ok')\"`; expect ok."
      - id: SF-001-AC5
        statement: "package.json declares the scripts build, build:main, build:content, build:test, lint, format, typecheck, test:unit, test:e2e, bench:scoring, and bench:pageload; the test and lint scripts may exit non-zero until SF-002 and SF-003 land, but every key exists."
        verification: "Run `node --input-type=module -e \"import fs from 'node:fs';const p=JSON.parse(fs.readFileSync('package.json','utf8'));for(const k of ['build','build:main','build:content','build:test','lint','format','typecheck','test:unit','test:e2e','bench:scoring','bench:pageload'])if(!p.scripts[k])throw new Error('missing '+k);console.log('ok')\"`; expect ok."
      - id: SF-001-AC7
        statement: "Every path listed in dist/manifest.json content_scripts[0].css resolves to an existing file under dist/."
        verification: "Run `npm run build && node --input-type=module -e \"import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('dist/manifest.json','utf8'));for(const c of m.content_scripts[0].css)fs.accessSync('dist/'+c);console.log('ok')\"`; expect ok. This catches the case where the injected stylesheet is emitted under a different name or not emitted at all."
      - id: SF-001-AC8
        statement: "The content-script bundle is a classic script, not an ES module: it contains no top-level import or export statement."
        verification: "Run `npm run build && node --input-type=module -e \"import fs from 'node:fs';const s=fs.readFileSync('dist/content/index.js','utf8');if(/^\\s*(import|export)\\s/m.test(s))throw new Error('content script bundle contains module syntax');console.log('ok')\"`; expect ok."
      - id: SF-001-AC6
        statement: ".gitignore excludes node_modules, dist, test-results, playwright-report, and .env files."
        verification: "Run `grep -qx 'node_modules/' .gitignore && grep -qx 'dist/' .gitignore && grep -qx 'test-results/' .gitignore && grep -qx 'playwright-report/' .gitignore && grep -q '^\\.env' .gitignore && echo ok`; expect ok."
    steps:
      - id: SF-001-S01
        title: Create package.json with the npm command surface and pinned dev dependencies
        purpose: "Establish the exact command names every later ticket and validation in this plan invokes."
        tdd_phase: setup
        depends_on_steps: []
        files_to_touch:
          - path: package.json
            change: create
            detail: >-
              Fields: name "slopfilter" (replace with the HD-001 value), private true, type "module",
              version "0.0.0", license set to the HD-002 identifier, engines.node ">=24".
              scripts, verbatim:
              "build:main" is "vite build",
              "build:content" is "vite build --config vite.content.config.ts",
              "build" is "SLOPFILTER_BUILD_TARGET=production npm run build:main && SLOPFILTER_BUILD_TARGET=production npm run build:content && node scripts/build-manifest.mjs",
              "build:test" is "SLOPFILTER_BUILD_TARGET=test npm run build:main && SLOPFILTER_BUILD_TARGET=test npm run build:content && node scripts/build-manifest.mjs",
              "lint" is "biome check .",
              "format" is "biome check --write .",
              "typecheck" is "tsc --noEmit",
              "test:unit" is "vitest run",
              "test:e2e" is "playwright test",
              "bench:scoring" is "vitest bench --run",
              "bench:pageload" is "playwright test --config playwright.bench.config.ts".
              devDependencies installed at the exact latest versions from
              meta.repository_context.toolchain_versions: typescript 7.0.2, vite 8.2.0,
              @types/chrome 0.2.5. No runtime dependencies at this ticket.
              Note: build:main emits ES modules for the service worker, offscreen document, and
              extension pages; build:content emits a single IIFE bundle for the content script,
              because Chromium content scripts are classic scripts and Rollup cannot emit two output
              formats from one build. Both passes write into dist/ and build:main must run first
              because it sets emptyOutDir.
        instructions:
          - "Create package.json at the repository root with the fields and scripts listed above."
          - "Set the name and license fields to the values fixed by HD-001 and HD-002."
          - "Run `npm install --save-exact --save-dev typescript@7.0.2 vite@8.2.0 @types/chrome@0.2.5` to install and lock the three dev dependencies at their exact latest versions."
          - "Confirm package.json devDependencies contains no caret or tilde for these three entries."
          - "Verify package-lock.json was created at the repository root."
        constraints:
          - "Install exactly these three dev dependencies at exactly these versions. Any additional package, or any different version, is a constraint violation: stop and report."
          - "Do not install eslint, typescript-eslint, prettier, or eslint-config-prettier at any point. Biome replaces all four and is installed in SF-002."
          - "Do not add a runtime dependencies block in this ticket."
        test_specification:
          test_type: none
          test_file: null
          test_name: null
          arrange: "Empty repository containing only the planning baseline files."
          act: "Create package.json and run npm install for the three named dev dependencies."
          assert:
            - "package.json and package-lock.json exist at the repository root."
            - "package.json scripts contains the keys build, build:main, build:content, build:test, lint, format, typecheck, test:unit, test:e2e, bench:scoring, and bench:pageload."
            - "package.json devDependencies pins typescript to exactly 7.0.2."
          expected_red_failure: null
        validation:
          - command: "node --input-type=module -e \"import fs from 'node:fs';const p=JSON.parse(fs.readFileSync('package.json','utf8'));for(const k of ['build','build:main','build:content','build:test','lint','format','typecheck','test:unit','test:e2e','bench:scoring','bench:pageload'])if(!p.scripts[k])throw new Error('missing script '+k);if(p.devDependencies.typescript!=='7.0.2')throw new Error('typescript must be pinned to 7.0.2, got '+p.devDependencies.typescript);console.log('ok')\""
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, exact command, exit code, and full npm error output. Do not install additional packages to work around a failure."
      - id: SF-001-S02
        title: Create tsconfig.json in strict mode with the @/ path alias
        purpose: "Fix one TypeScript configuration that tsc, Vite, and Vitest all consume, so import paths never diverge between tools."
        tdd_phase: setup
        depends_on_steps: [SF-001-S01]
        files_to_touch:
          - path: tsconfig.json
            change: create
            detail: >-
              compilerOptions: target "ES2022", module "ESNext", moduleResolution "bundler",
              strict true, noUncheckedIndexedAccess true, noImplicitOverride true,
              exactOptionalPropertyTypes true, verbatimModuleSyntax true, noEmit true,
              skipLibCheck true, resolveJsonModule true, isolatedModules true,
              lib ["ES2022","DOM","DOM.Iterable"], types ["chrome"],
              paths {"@/*": ["./src/*"]}.
              include: ["src", "tests", "e2e", "bench", "scripts", "*.config.ts"].
              There must be NO baseUrl key, and the paths target MUST begin with "./". Both were
              verified against tsc 7.0.2: baseUrl produces "error TS5102: Option 'baseUrl' has been
              removed" and a bare "src/*" target produces "error TS5090: Non-relative paths are not
              allowed." This exact configuration was confirmed to compile cleanly under 7.0.2.
        instructions:
          - "Create tsconfig.json with exactly the compilerOptions listed above."
          - "Run `npx tsc --noEmit` and confirm it exits 0 with no source files yet present under src/."
        constraints:
          - "strict must be true. Do not disable any strictness flag to make later code compile."
          - "Do not add baseUrl. Do not write a paths target without a leading './'. Both are hard errors under TypeScript 7."
          - "resolveJsonModule must be true; src/adapters/x/selectors.ts imports selectors.json directly."
        test_specification:
          test_type: none
          test_file: null
          test_name: null
          arrange: "package.json exists with typescript installed."
          act: "Create tsconfig.json and run npx tsc --noEmit."
          assert:
            - "tsc exits 0."
            - "tsconfig.json compilerOptions.strict is true."
          expected_red_failure: null
        validation:
          - command: npx tsc --noEmit
            expected_result: "Exit code 0, no diagnostics printed."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the exact tsc diagnostics. Do not relax a strictness flag."
      - id: SF-001-S03
        title: Create public/manifest.json declaring the Manifest V3 surface
        purpose: "Declare the extension to Chromium with the minimum permission set the PRD privacy claim allows."
        tdd_phase: setup
        depends_on_steps: [SF-001-S02]
        files_to_touch:
          - path: public/manifest.json
            change: create
            detail: >-
              manifest_version 3; name set to the HD-001 value; version "0.0.1";
              description "Collapses low-quality posts in your X timeline using local, on-device signals. Nothing leaves your browser.";
              permissions ["storage"];
              host_permissions ["https://x.com/*","https://twitter.com/*"];
              background {"service_worker":"background/service-worker.js","type":"module"};
              content_scripts [{"matches":["https://x.com/*","https://twitter.com/*"],"js":["content/index.js"],"css":["content/styles.css"],"run_at":"document_idle"}];
              NOTE on the css path: content/styles.css is authored at public/content/styles.css and
              copied verbatim into dist/content/styles.css by Vite's publicDir handling. It is NOT
              imported from any TypeScript entry. Vite only emits CSS that a JS entry imports, and it
              would emit it under a flattened asset name, which would not match this manifest path
              and would make Chromium refuse to load the extension.
              action {"default_popup":"ui/popup/popup.html","default_icon":{"16":"icons/icon-16.png","48":"icons/icon-48.png","128":"icons/icon-128.png"}};
              options_page "ui/options/options.html";
              icons {"16":"icons/icon-16.png","48":"icons/icon-48.png","128":"icons/icon-128.png"};
              content_security_policy {"extension_pages":"script-src 'self'; object-src 'self'"}.
              NOTE: this CSP is correct for Phase 0 and blocks WebAssembly compilation. SF-101 must
              widen it to "script-src 'self' 'wasm-unsafe-eval'; object-src 'self'" before
              Transformers.js can run, and that change is declared in SF-101's files_to_touch. Do not
              widen it in this ticket.
          - path: public/content/styles.css
            change: create
            detail: "Empty stylesheet containing a single CSS comment marking it as the injected-UI stylesheet. Lives under public/ so Vite copies it verbatim to dist/content/styles.css, matching the manifest content_scripts css path. Real rules land in SF-009."
          - path: public/icons/icon-16.png
            change: create
            detail: "A 16x16 PNG placeholder icon. Solid single-colour square is acceptable at this ticket."
          - path: public/icons/icon-48.png
            change: create
            detail: "A 48x48 PNG placeholder icon."
          - path: public/icons/icon-128.png
            change: create
            detail: "A 128x128 PNG placeholder icon."
        instructions:
          - "Create public/manifest.json with exactly the keys and values listed above."
          - "Create the three placeholder PNG icons at the exact pixel dimensions named by their filenames."
          - "Do not add any permission beyond storage."
          - "Do not add any host permission beyond the two listed."
        constraints:
          - "No key named content_security_policy may contain unsafe-eval, unsafe-inline, or a remote origin."
          - "The description string must not claim AI detection or authorship."
        test_specification:
          test_type: none
          test_file: null
          test_name: null
          arrange: "tsconfig.json exists."
          act: "Create public/manifest.json and the three icon files."
          assert:
            - "public/manifest.json parses as JSON and manifest_version equals 3."
            - "permissions equals exactly [\"storage\"]."
          expected_red_failure: null
        validation:
          - command: "node --input-type=module -e \"import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('public/manifest.json','utf8'));if(m.manifest_version!==3)throw new Error('mv');if(JSON.stringify(m.permissions)!==JSON.stringify(['storage']))throw new Error('perms');if(!m.content_scripts[0].css.includes('content/styles.css'))throw new Error('css path');console.log('ok')\""
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the JSON parse or assertion error."
      - id: SF-001-S04
        title: Create src/shared/logger.ts as a console-only logger
        purpose: "Give every later module one logging entry point that provably cannot exfiltrate data, satisfying the PRD zero-telemetry claim."
        tdd_phase: setup
        depends_on_steps: [SF-001-S02]
        files_to_touch:
          - path: src/shared/logger.ts
            change: create
            detail: >-
              Export a const `logger` object with methods debug, info, warn, and error, each with
              signature (message: string, ...args: unknown[]) => void. Each prefixes output with
              "[slopfilter]" and delegates to the matching console method. debug is a no-op unless
              import.meta.env.DEV is true. No other exports.
        instructions:
          - "Create src/shared/logger.ts exporting the logger object described above."
          - "Confirm the file contains no fetch, XMLHttpRequest, sendBeacon, WebSocket, or chrome.* reference."
        constraints:
          - "The module must have zero imports."
          - "The module must not reference any network or storage API."
        test_specification:
          test_type: none
          test_file: null
          test_name: null
          arrange: "tsconfig.json exists; no test runner is installed until SF-002."
          act: "Create src/shared/logger.ts and run npx tsc --noEmit."
          assert:
            - "tsc exits 0."
            - "grep for fetch, XMLHttpRequest, sendBeacon, and WebSocket in the file returns no matches."
          expected_red_failure: null
        validation:
          - command: "npx tsc --noEmit && ! grep -nE 'fetch|XMLHttpRequest|sendBeacon|WebSocket|chrome\\.' src/shared/logger.ts && echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the offending grep line."
      - id: SF-001-S05
        title: Create vite.config.ts with one named entry per extension context
        purpose: "Produce a dist/ layout whose file paths match the paths already declared in public/manifest.json."
        tdd_phase: setup
        depends_on_steps: [SF-001-S03, SF-001-S04]
        files_to_touch:
          - path: vite.config.ts
            change: create
            detail: >-
              The ES-module build pass. defineConfig with resolve.alias mapping "@" to the src
              directory; publicDir "public"; build.outDir "dist"; build.emptyOutDir TRUE (this pass
              runs first and clears dist/); build.target "chrome120"; build.sourcemap false;
              build.rollupOptions.input naming exactly these three entries:
              "background/service-worker" to src/background/service-worker.ts,
              "ui/popup/popup" to src/ui/popup/popup.ts,
              "ui/options/options" to src/ui/options/options.ts;
              build.rollupOptions.output.format "es",
              output.entryFileNames "[name].js", output.chunkFileNames "chunks/[name].js",
              output.assetFileNames "[name][extname]".
              The content script is deliberately NOT an entry here.
          - path: vite.content.config.ts
            change: create
            detail: >-
              The classic-script build pass for the content script only. defineConfig with the same
              resolve.alias; publicDir false (the ES pass already copied public/);
              build.outDir "dist"; build.emptyOutDir FALSE (must not erase the first pass output);
              build.target "chrome120"; build.sourcemap false;
              build.rollupOptions.input a single entry "content/index" to src/content/index.ts;
              build.rollupOptions.output.format "iife";
              output.entryFileNames "[name].js"; output.inlineDynamicImports true.
              Rationale, and this is not optional: Chromium content scripts are classic scripts, not
              ES modules, and Rollup cannot emit both "es" and "iife" from a single build with
              multiple inputs. Two passes is the only correct shape. Do not merge them.
          - path: src/content/index.ts
            change: create
            detail: "Placeholder entry: imports logger from @/shared/logger and calls logger.debug('content script loaded'). Real implementation lands in SF-014."
          - path: src/background/service-worker.ts
            change: create
            detail: >-
              Placeholder entry: imports logger, registers a chrome.runtime.onInstalled listener whose
              body calls logger.debug('service worker installed'), and calls
              logger.debug('service worker loaded') at top level. The onInstalled registration is
              required, not decorative: it guarantees Chromium actually starts the service worker, so
              the SF-003 extensionId fixture can observe a serviceworker target instead of hanging.
          - path: src/ui/popup/popup.html
            change: create
            detail: "Minimal HTML document with a script tag referencing popup.js. Real content lands in SF-010."
          - path: src/ui/popup/popup.ts
            change: create
            detail: "Placeholder entry importing logger. Real implementation lands in SF-010."
          - path: src/ui/options/options.html
            change: create
            detail: "Minimal HTML document with a script tag referencing options.js. Real content lands in SF-108."
          - path: src/ui/options/options.ts
            change: create
            detail: "Placeholder entry importing logger. Real implementation lands in SF-108."
        instructions:
          - "Create vite.config.ts with exactly the configuration described above."
          - "Create vite.content.config.ts with exactly the configuration described above."
          - "Create each placeholder source file listed in files_to_touch."
          - "Run `npm run build`."
          - "Confirm dist/content/index.js, dist/content/styles.css, dist/background/service-worker.js, dist/manifest.json, and dist/icons/icon-128.png all exist."
          - "Confirm dist/content/index.js contains no top-level import or export statement, proving the IIFE pass produced a classic script."
        constraints:
          - "entryFileNames must not include a content hash; manifest.json references fixed paths."
          - "Do not install a Chrome-extension Vite plugin. The manifest is hand-written and copied from public/."
          - "vite.content.config.ts must set emptyOutDir false. If it clears dist/ the service worker and pages from the first pass are deleted and the extension will not load."
          - "Do not attempt to emit the content script from vite.config.ts. Mixing output formats in one Rollup build is not supported and will fail."
        test_specification:
          test_type: none
          test_file: null
          test_name: null
          arrange: "public/manifest.json, icons, and src/shared/logger.ts exist."
          act: "Create vite.config.ts and placeholder entries, then run npm run build."
          assert:
            - "npm run build exits 0."
            - "dist/content/index.js exists and contains no top-level import or export statement."
            - "dist/content/styles.css exists."
            - "dist/background/service-worker.js exists."
            - "dist/manifest.json exists."
          expected_red_failure: null
        validation:
          - command: "npm run build && test -f dist/content/index.js && test -f dist/content/styles.css && test -f dist/background/service-worker.js && test -f dist/manifest.json && test -f dist/icons/icon-128.png && echo ok"
            expected_result: "Prints ok, exit code 0."
          - command: "node --input-type=module -e \"import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('dist/manifest.json','utf8'));for(const f of [...m.content_scripts[0].js,...m.content_scripts[0].css])fs.accessSync('dist/'+f);console.log('ok')\""
            expected_result: "Prints ok, exit code 0. Every declared content-script asset resolves under dist/."
          - command: "node --input-type=module -e \"import fs from 'node:fs';const s=fs.readFileSync('dist/content/index.js','utf8');if(/^\\s*(import|export)\\s/m.test(s))throw new Error('content bundle is not a classic script');console.log('ok')\""
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, the Vite build output, and a listing of dist/."
      - id: SF-001-S06
        title: Create .gitignore, README.md, and LICENSE
        purpose: "Prevent build output and secrets from being committed, and satisfy the PRD open-source requirement."
        tdd_phase: setup
        depends_on_steps: [SF-001-S05]
        files_to_touch:
          - path: .gitignore
            change: create
            detail: >-
              Exactly these lines, one per line: node_modules/, dist/, test-results/,
              playwright-report/, blob-report/, .env, .env.*, .DS_Store, *.log, .models-cache/.
          - path: README.md
            change: create
            detail: >-
              Sections: the product name from HD-001 as the H1; a one-paragraph description matching
              the manifest description string; a Privacy section stating that no data leaves the
              browser and the only network call is the one-time model download; a Development section
              listing npm ci, npm run build, npm run lint, npm run typecheck, npm run test:unit, and
              npm run test:e2e with a one-line description of each; a Loading the extension section
              describing chrome://extensions, Developer mode, Load unpacked, and selecting dist/.
          - path: LICENSE
            change: create
            detail: "The full text of the licence identifier fixed by HD-002, with the copyright holder string supplied by HD-002."
        instructions:
          - "Create .gitignore with exactly the lines listed above."
          - "Create README.md with the sections listed above."
          - "Create LICENSE containing the full licence text for the HD-002 identifier."
          - "Confirm no README or LICENSE sentence claims AI detection or authorship."
        constraints:
          - "README must not describe any feature not yet implemented as if it were available."
          - "No sentence anywhere may claim a post is AI-written."
        test_specification:
          test_type: none
          test_file: null
          test_name: null
          arrange: "The build succeeds and dist/ exists."
          act: "Create .gitignore, README.md, and LICENSE."
          assert:
            - ".gitignore contains node_modules/ and dist/ as whole lines."
            - "LICENSE is non-empty."
          expected_red_failure: null
        validation:
          - command: "grep -qx 'node_modules/' .gitignore && grep -qx 'dist/' .gitignore && grep -qx 'test-results/' .gitignore && grep -qx 'playwright-report/' .gitignore && grep -q '^\\.env' .gitignore && test -s LICENSE && test -s README.md && echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and which assertion failed."
      - id: SF-001-S07
        title: Run the full ticket validation sweep
        purpose: "Confirm the scaffold is reproducible from a clean state before any other ticket builds on it."
        tdd_phase: validation
        depends_on_steps: [SF-001-S06]
        files_to_touch: []
        instructions:
          - "Run `rm -rf node_modules dist`."
          - "Run `npm ci`."
          - "Run `npm run build`."
          - "Run `npx tsc --noEmit`."
          - "Run `npm audit --audit-level=high`."
        constraints:
          - "Do not modify any file during this step. If a command fails, the fix belongs in the step that owns the file."
        test_specification:
          test_type: none
          test_file: null
          test_name: null
          arrange: "Clean checkout with node_modules and dist removed."
          act: "Run npm ci, npm run build, npx tsc --noEmit, and npm audit."
          assert:
            - "Every command exits 0."
          expected_red_failure: null
        validation:
          - command: "rm -rf node_modules dist && npm ci && npm run build && npx tsc --noEmit && npm audit --audit-level=high && echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, the first failing command, its exit code, and its full output."
    definition_of_done:
      - "npm ci succeeds from a clean checkout"
      - "npm run build emits a Manifest V3 dist/ whose declared paths all resolve, including every content_scripts css entry"
      - "dist/content/index.js is a classic IIFE bundle with no module syntax"
      - "npx tsc --noEmit passes under strict mode"
      - "npm audit --audit-level=high reports zero high or critical advisories"
      - ".gitignore excludes node_modules, dist, test artefacts, and .env files"
      - "LICENSE and README.md exist and contain no AI-authorship claim"
      - "Exactly three dev dependencies are installed: typescript, vite, @types/chrome"
    e2e_validation:
      required: true
      applicability: not_applicable_pending_human_approval
      rationale_if_not_applicable: >-
        This ticket produces no user-visible behaviour. The extension loads but does nothing
        observable in a browser: there is no content-script logic, no UI, and no filtering. The
        first meaningful E2E journey is defined in SF-014, which depends on this ticket. Additionally
        the Playwright harness itself does not exist until SF-003.

  - id: SF-002
    title: Add Biome and Vitest with the core-purity import boundary
    type: infrastructure
    priority: P0
    status: planned
    description: >-
      Install and configure Biome, which provides linting and formatting in one binary, plus Vitest.
      Encode the src/core/ purity rule as a machine-enforced noRestrictedImports and
      noRestrictedGlobals boundary so a later agent cannot accidentally import chrome APIs or adapter
      code into the pure scoring layer. Prove the boundary works with a failing-then-passing check.
    reason: >-
      Every subsequent ticket's validation block calls npm run lint, npm run typecheck, and
      npm run test:unit. Those scripts must actually run something. The core-purity rule is the only
      automated guard on the architectural constraint that makes the scoring pipeline unit-testable.
      Biome is chosen over ESLint because it carries no typescript peer dependency, which is what
      allows the project to use TypeScript 7; see meta.repository_context.toolchain_versions.biome_note.
    user_value: "Technical: automated enforcement of the purity boundary and a working unit-test runner for all later tickets."
    depends_on: [SF-001]
    blocks: [SF-003, SF-004, SF-005, SF-006, SF-007, SF-008, SF-011]
    estimated_complexity: M
    risk_level: low
    risks:
      - risk: "The no-restricted-imports boundary is configured but never proven, so it silently permits the imports it is meant to block."
        mitigation: "Step SF-002-S04 deliberately introduces a violating import, asserts lint fails with the expected rule id, then removes it. The boundary is proven, not assumed."
      - risk: "Vitest defaults to one environment, so either DOM-touching tests fail in node or pure tests silently gain a DOM they should not have."
        mitigation: "Configure environmentMatchGlobs so tests/unit/core/** runs in node and all other unit tests run in jsdom."
    constraints:
      - "Install exactly the dev dependencies named in the package.json detail below."
      - "The lint script must fail on warnings, not only errors, so quality_gates stay binary."
      - "Do not add a biome-ignore comment to any file to make lint pass."
    prerequisites:
      - "SF-001 complete: package.json, tsconfig.json, and the src/ tree exist."
    acceptance_criteria:
      - id: SF-002-AC1
        statement: "`npm run lint` exits 0 on the clean tree produced by SF-001, covering both Biome lint rules and Biome formatting."
        verification: "Run `npm run lint`; expect exit code 0 and no reported diagnostics."
      - id: SF-002-AC2
        statement: "`npm run typecheck` exits 0."
        verification: "Run `npm run typecheck`; expect exit code 0."
      - id: SF-002-AC3
        statement: "`npm run test:unit` exits 0 and reports at least one passing test."
        verification: "Run `npm run test:unit`; expect exit code 0 and 3 passed."
      - id: SF-002-AC4
        statement: "A file under src/core/ that imports the nested path @/adapters/x/adapter causes Biome to fail with the lint/style/noRestrictedImports rule."
        verification: "Follow step SF-002-S04: add the nested violating import, run `npx biome lint src/core/__boundary-probe.ts`, confirm non-zero exit and that the output names lint/style/noRestrictedImports, then delete the probe file."
      - id: SF-002-AC5
        statement: "Tests under tests/unit/core/ run in the node environment and have no document global, and tests outside tests/unit/core/ do have a document global."
        verification: "tests/unit/core/environment.test.ts asserts typeof document === 'undefined' and passes, and tests/unit/shared/environment.test.ts asserts typeof document !== 'undefined' and passes. Both must pass in the same `npm run test:unit` run, which proves the split is real rather than a uniform environment."
    steps:
      - id: SF-002-S01
        title: Install Biome and create biome.json
        purpose: "Establish one tool for both linting and formatting, with no typescript peer dependency, so the TypeScript version stays free."
        tdd_phase: setup
        depends_on_steps: []
        files_to_touch:
          - path: package.json
            change: modify
            detail: "Add devDependency @biomejs/biome at exactly 2.5.7. The lint and format scripts already read `biome check .` and `biome check --write .` from SF-001; leave them unchanged."
          - path: biome.json
            change: create
            detail: >-
              A JSON object with a $schema pointing at
              "./node_modules/@biomejs/biome/configuration_schema.json".
              files.includes lists the sources to check and excludes the rest with negated globs:
              "**", "!dist/**", "!node_modules/**", "!test-results/**", "!playwright-report/**",
              "!package-lock.json", "!tests/fixtures/dom/**".
              The tests/fixtures/dom exclusion is mandatory: reformatting captured DOM snapshots would
              corrupt the golden fixtures.
              formatter.enabled true, formatter.indentStyle "space", formatter.indentWidth 2,
              formatter.lineWidth 100, formatter.lineEnding "lf".
              javascript.formatter.quoteStyle "single", javascript.formatter.semicolons "always",
              javascript.formatter.trailingCommas "all", javascript.formatter.arrowParentheses "always".
              linter.enabled true with linter.rules.recommended true.
              Overrides are added in SF-002-S02.
        instructions:
          - "Run `npm install --save-exact --save-dev @biomejs/biome@2.5.7`."
          - "Create biome.json with exactly the configuration described above."
          - "Run `npx biome check --write .` once to normalise the existing tree."
          - "Run `npm run lint` and confirm exit code 0."
          - "Run `npm ls` and confirm no unmet peer dependency is reported."
        constraints:
          - "tests/fixtures/dom must be excluded via a negated glob in files.includes. Reformatting a captured snapshot would corrupt the golden fixture."
          - "Do not install eslint, typescript-eslint, prettier, or eslint-config-prettier. Biome replaces all four."
        test_specification:
          test_type: none
          test_file: null
          test_name: null
          arrange: "The SF-001 tree exists."
          act: "Install Biome, add biome.json, and run biome check --write."
          assert:
            - "npm run lint exits 0"
            - "biome.json excludes tests/fixtures/dom via a negated glob"
          expected_red_failure: null
        validation:
          - command: "npm run lint && echo ok"
            expected_result: "Prints ok, exit code 0."
          - command: "node --input-type=module -e \"import fs from 'node:fs';const c=JSON.parse(fs.readFileSync('biome.json','utf8'));if(!c.files.includes.includes('!tests/fixtures/dom/**'))throw new Error('fixtures must be excluded from formatting');console.log('ok')\""
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the full Biome diagnostic output including rule ids."
      - id: SF-002-S02
        title: Add the core-purity boundary as a Biome override
        purpose: "Encode the architectural purity constraint as an automatically enforced rule rather than a comment nobody reads."
        tdd_phase: setup
        depends_on_steps: [SF-002-S01]
        files_to_touch:
          - path: biome.json
            change: modify
            detail: >-
              Add an overrides array with THREE entries, in this order, because later entries win for
              files they match:
              (1) includes ["src/**/*.ts"], linter.rules.suspicious.noConsole set to
              {"level": "error"};
              (2) includes ["src/shared/logger.ts"], linter.rules.suspicious.noConsole set to "off";
              (3) includes ["src/core/**/*.ts"], with
              linter.rules.style.noRestrictedImports set to {"level": "error", "options":
              {"patterns": [{"group": ["@/adapters/**","@/content/**","@/storage/**",
              "@/offscreen/**","@/background/**","@/ui/**"]}]}}
              and linter.rules.style.noRestrictedGlobals set to {"level": "error", "options":
              {"deniedGlobals": {"chrome": "src/core must stay pure: no platform, DOM, or storage
              access", "window": "src/core must stay pure", "document": "src/core must stay pure",
              "indexedDB": "src/core must stay pure"}}}.
              Two details are mandatory and were verified empirically against Biome 2.5.7 on
              2026-08-05.
              First, "level": "error" must be set explicitly: the default severity of
              noRestrictedImports, noRestrictedGlobals, and noConsole is WARN, and a warning would not
              fail the lint gate.
              Second, every group entry must use a DOUBLE-star glob. A single-star pattern such as
              "@/adapters/*" was confirmed NOT to match "@/adapters/x/adapter", leaving the single most
              important import path unblocked while appearing configured.
        instructions:
          - "Add the three overrides entries to biome.json exactly as described, in that order."
          - "Run `npm run lint` and confirm exit code 0 on the clean tree."
        constraints:
          - "Every restricted-import group must use a double-star glob. Single-star globs were verified not to match nested paths."
          - "Every rule in the overrides must set level explicitly to error. The Biome default for all three is warn."
          - "The logger noConsole exemption must be its own overrides entry placed after the src/**/*.ts entry. Biome resolves overrides by order, not by specificity."
        test_specification:
          test_type: none
          test_file: null
          test_name: null
          arrange: "Biome installed and biome.json present from S01."
          act: "Add the three overrides entries and run npm run lint."
          assert:
            - "npm run lint exits 0"
            - "biome.json contains an overrides entry scoped to src/core/**/*.ts with noRestrictedImports at level error"
            - "Every group entry ends with a double-star glob"
          expected_red_failure: null
        validation:
          - command: "npm run lint && node --input-type=module -e \"import fs from 'node:fs';const c=JSON.parse(fs.readFileSync('biome.json','utf8'));const o=c.overrides.find(x=>x.includes.includes('src/core/**/*.ts'));const r=o.linter.rules.style.noRestrictedImports;if(r.level!=='error')throw new Error('noRestrictedImports must be level error, got '+r.level);for(const g of r.options.patterns[0].group)if(!g.endsWith('/**'))throw new Error('group '+g+' must use a double-star glob');console.log('ok')\""
            expected_result: "Prints ok, exit code 0. The double-star check is the defect this validation exists to catch."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the overrides block from biome.json verbatim."
      - id: SF-002-S03
        title: Install Vitest and add the environment sentinel test
        purpose: "Give every later ticket a working unit-test runner and prove the node/jsdom environment split is actually applied."
        tdd_phase: setup
        depends_on_steps: [SF-002-S02]
        files_to_touch:
          - path: package.json
            change: modify
            detail: "Add devDependencies at exactly these versions: vitest 4.1.10, jsdom 30.0.1, @vitest/coverage-v8 4.1.10. The test:unit script already reads `vitest run` from SF-001."
          - path: vitest.config.ts
            change: create
            detail: >-
              defineConfig with resolve.alias mapping "@" to the src directory, and a test block
              using test.projects (NOT environmentMatchGlobs, which Vitest 4 removed) with exactly
              two project entries:
              project "core" with test.name "core", test.include ["tests/unit/core/**/*.test.ts"],
              test.environment "node";
              project "dom" with test.name "dom", test.include ["tests/unit/**/*.test.ts"],
              test.exclude ["tests/unit/core/**"], test.environment "jsdom".
              Both projects set restoreMocks true and clearMocks true. Root-level
              test.coverage.provider "v8" with reporter ["text"].
              Each project repeats the resolve.alias mapping, because project configs do not inherit
              root resolve settings.
          - path: tests/unit/core/environment.test.ts
            change: create
            detail: >-
              One describe block "core test environment" containing one test named
              "runs in the node environment with no DOM globals" asserting
              typeof document === 'undefined' and typeof window === 'undefined'.
          - path: tests/unit/shared/environment.test.ts
            change: create
            detail: >-
              One describe block "dom test environment" containing one test named
              "runs in the jsdom environment with DOM globals available" asserting
              typeof document !== 'undefined' and typeof window !== 'undefined'. This is the
              counterpart sentinel: without it, a config that put every test in node would still pass.
          - path: tests/unit/shared/logger.test.ts
            change: create
            detail: >-
              One describe block "logger" containing one test named
              "prefixes every message with the slopfilter tag" that spies on console.info via
              vi.spyOn, calls logger.info('hello'), and asserts the spy was called with a first
              argument containing "[slopfilter]".
        instructions:
          - "Run `npm install --save-exact --save-dev vitest@4.1.10 jsdom@30.0.1 @vitest/coverage-v8@4.1.10`."
          - "Create vitest.config.ts with exactly the configuration described above."
          - "Create tests/unit/core/environment.test.ts with the single test described above."
          - "Create tests/unit/shared/environment.test.ts with the single test described above."
          - "Create tests/unit/shared/logger.test.ts with the single test described above."
          - "Run `npm run test:unit` and confirm exit code 0 with three passing tests."
        constraints:
          - "Do not add a global setup file. No test may require global mocks at this ticket."
          - "Do not use test.environmentMatchGlobs. It was removed in Vitest 4 and the pinned version is 4.1.10."
        test_specification:
          test_type: unit
          test_file: tests/unit/core/environment.test.ts
          test_name: "core test environment > runs in the node environment with no DOM globals"
          arrange: "vitest.config.ts defines a 'core' project scoped to tests/unit/core/**/*.test.ts with environment 'node', and a 'dom' project covering the remaining unit tests with environment 'jsdom'."
          act: "Vitest executes the test file."
          assert:
            - "typeof document equals 'undefined'"
            - "typeof window equals 'undefined'"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit"
            expected_result: "Exit code 0, 3 tests passed, 0 failed, 0 skipped. If the jsdom sentinel fails the projects split is not being applied; if the node sentinel fails the core project is resolving to jsdom."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the Vitest failure output including which environment the failing file ran in."
      - id: SF-002-S04
        title: Prove the core-purity boundary rejects a forbidden import
        purpose: "Verify the guard actually fires. A configured-but-inert lint rule is worse than no rule, because it creates false confidence."
        tdd_phase: validation
        depends_on_steps: [SF-002-S03]
        files_to_touch:
          - path: src/core/__boundary-probe.ts
            change: create
            detail: >-
              A temporary file created and then deleted within this step. Contents, exactly two lines:
              `import type { PlatformAdapter } from '@/adapters/x/adapter';` followed by
              `export type Probe = PlatformAdapter;`.
              Biome's noRestrictedImports applies to type-only imports as well; this exact two-line
              probe was verified to produce a lint/style/noRestrictedImports diagnostic under Biome
              2.5.7 on 2026-08-05.
              The import target is deliberately NESTED two segments deep. A probe importing a
              single-segment path such as '@/content/observer' would pass even against a broken
              single-star glob, which is precisely the false negative this step exists to catch.
              The module need not exist: no-restricted-imports matches on the literal specifier, not
              on module resolution. This file must not exist when the step completes.
        instructions:
          - "Create src/core/__boundary-probe.ts with exactly the two lines described above."
          - "Run `npx biome lint src/core/__boundary-probe.ts` and record the exit code and output."
          - "Confirm the exit code is non-zero and the output contains the string no-restricted-imports."
          - "Delete src/core/__boundary-probe.ts."
          - "Run `npm run lint` and confirm exit code 0."
        constraints:
          - "src/core/__boundary-probe.ts must not exist after this step. Confirm with `test ! -e src/core/__boundary-probe.ts`."
          - "Do not commit the probe file."
          - "Do not run npm run typecheck while the probe file exists. It imports a module that does not exist until SF-005, so tsc would report an unrelated resolution error that has nothing to do with the boundary being tested."
        test_specification:
          test_type: none
          test_file: null
          test_name: null
          arrange: "The biome.json overrides entry scoped to src/core/**/*.ts, with noRestrictedImports at level error and double-star globs, is in place."
          act: "Create a file under src/core/ importing the nested path @/adapters/x/adapter, lint it, then delete it."
          assert:
            - "Linting the probe file exits non-zero."
            - "The lint output contains no-restricted-imports."
            - "After deletion, npm run lint exits 0 and src/core/__boundary-probe.ts does not exist."
          expected_red_failure: null
        validation:
          - command: "npx biome lint src/core/__boundary-probe.ts; test $? -ne 0 && echo boundary-fires"
            expected_result: "Prints boundary-fires, and the output names lint/style/noRestrictedImports. A zero exit code here means the guard is inert, almost certainly because the restricted-import glob uses a single star and therefore does not match a nested path, or because level was left at the warn default: stop and report the biome.json overrides block verbatim."
          - command: "rm -f src/core/__boundary-probe.ts && test ! -e src/core/__boundary-probe.ts && npm run lint && echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, both commands, their exit codes, and the full Biome output. If the boundary did not fire, report the biome.json overrides block verbatim, checking in particular that level is error rather than the warn default and that the globs are double-star. Always delete the probe file before reporting."
    definition_of_done:
      - "npm run lint exits 0 on a clean tree, checking both lint rules and formatting in one Biome invocation"
      - "npm run typecheck exits 0"
      - "npm run test:unit exits 0 with 3 passing tests and 0 skipped"
      - "The src/core/ import boundary is proven to fire on a NESTED forbidden import path and the probe file is deleted"
      - "Tests under tests/unit/core/ run in the node environment with no DOM globals"
      - "Exactly these dev dependencies were added, at exactly these versions: @biomejs/biome 2.5.7, vitest 4.1.10, jsdom 30.0.1, @vitest/coverage-v8 4.1.10"
      - "None of eslint, typescript-eslint, prettier, or eslint-config-prettier is installed"
      - "npm ls reports no unmet peer dependency, and no install used --legacy-peer-deps or --force"
    e2e_validation:
      required: true
      applicability: not_applicable_pending_human_approval
      rationale_if_not_applicable: >-
        This ticket adds developer tooling only. It changes no runtime code, no UI, and no extension
        behaviour, so there is no user journey to exercise in a browser. The Playwright harness does
        not exist until SF-003 and the first user-visible journey lands in SF-014.

  - id: SF-003
    title: Add the Playwright E2E harness with an extension-loading fixture and a local feed page
    type: infrastructure
    priority: P0
    status: planned
    description: >-
      Install Playwright, configure it for chromium only, and build the two pieces every later E2E
      spec depends on: a persistent-context fixture that loads the unpacked dist/ extension, and a
      local harness page at http://localhost:5174 that renders captured X timeline markup and can
      append further posts on demand. Add scripts/build-manifest.mjs so the harness origin is granted
      host permission in test builds only.
    reason: >-
      PRD section 6 requires Playwright E2E that loads the extension into Chromium. Live x.com is not
      a viable E2E target: it requires login, forbids automation, and is non-deterministic, which
      breaks the isolation and parallel-safety requirements. A local harness makes every later E2E
      spec hermetic and repeatable. The live site is touched only by the SF-012 drift monitor.
    user_value: "Technical: hermetic, parallel-safe browser testing for every user-facing ticket that follows."
    depends_on: [SF-001, SF-002]
    blocks: [SF-009, SF-010, SF-014, SF-105, SF-107, SF-108, SF-203, SF-204, SF-205, SF-206, SF-207]
    estimated_complexity: L
    risk_level: medium
    risks:
      - risk: "Chromium extensions cannot be loaded in headless mode with the default launcher, so the fixture silently runs without the extension and every later E2E test passes vacuously."
        mitigation: "headless is false and the fixture throws rather than yielding when no extension service worker is observed. Step SF-003-S03 adds an explicit smoke test that fails if no extension id is found."
      - risk: "headless false requires a display, which a Linux CI runner does not have, so the whole E2E suite fails in CI even though it passes locally."
        mitigation: "SF-011 wraps the E2E job in xvfb-run, and this ticket records that requirement as a constraint so an agent does not fix CI by switching to headless, which would disable the extension."
      - risk: "The MV3 service worker registers but is never started by Chromium, so waiting for the serviceworker event hangs for the full timeout and the fixture reports a false extension-did-not-load."
        mitigation: "The SF-001 placeholder service worker registers a chrome.runtime.onInstalled listener, which forces a start on install. The fixture also inspects context.serviceWorkers() for an already-started worker before awaiting the event."
      - risk: "The harness host permission leaks into a production build, which is a Chrome Web Store review failure and a privacy-claim violation."
        mitigation: "The harness origin is injected only by scripts/build-manifest.mjs under SLOPFILTER_BUILD_TARGET=test, and global validation GV-08 asserts a production dist/ contains no localhost host permission."
      - risk: "The harness markup diverges from real captured X DOM, so E2E passes while the real adapter is broken."
        mitigation: "The harness loads the same golden fixture files the SF-006 adapter unit tests parse. There is exactly one source of truth: tests/fixtures/dom/x/."
    constraints:
      - "E2E must run against http://localhost:5174 only. Any spec navigating to an x.com URL is a constraint violation: stop and report."
      - "playwright.config.ts must set projects to chromium only. No firefox or webkit project."
      - "No spec, fixture, or helper may call page.waitForTimeout or any sleep."
      - "The harness host permission may exist only in a build produced with SLOPFILTER_BUILD_TARGET=test."
    prerequisites:
      - "SF-001 and SF-002 complete."
      - "SF-007 golden DOM fixtures are not yet available; this ticket creates a minimal inline placeholder fixture in tests/harness/index.html and SF-007 replaces it with captured markup."
    acceptance_criteria:
      - id: SF-003-AC1
        statement: "`npm run test:e2e` exits 0 and runs at least one spec against the harness."
        verification: "Run `npm run build:test && npm run test:e2e`; expect exit code 0 and a non-zero passed count."
      - id: SF-003-AC2
        statement: "The extension fixture resolves a non-empty extension id, proving the unpacked extension actually loaded."
        verification: "The smoke spec e2e/specs/harness-smoke.spec.ts asserts the resolved extension id matches /^[a-p]{32}$/ and passes."
      - id: SF-003-AC3
        statement: "A production build contains no localhost host permission."
        verification: "Run global validation GV-08 after `npm run build`; expect it to print ok."
      - id: SF-003-AC4
        statement: "A test build contains http://localhost:5174/* in host_permissions."
        verification: "Run `npm run build:test` then `node --input-type=module -e \"import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('dist/manifest.json','utf8'));if(!m.host_permissions.includes('http://localhost:5174/*'))throw new Error('missing harness permission');console.log('ok')\"`; expect ok."
      - id: SF-003-AC6
        statement: "npm run typecheck exits 0 with the e2e directory included in the TypeScript program."
        verification: "Run `npm run typecheck`; expect exit code 0. This fails if e2e/support/harness.d.ts is missing or does not declare __slopfilterHarness on Window."
      - id: SF-003-AC5
        statement: "Playwright is configured to retain a trace, a screenshot, and a video for every failed test."
        verification: "Run `node -e \"require('fs').readFileSync('playwright.config.ts','utf8')\"` and confirm the use block sets trace to 'retain-on-failure', screenshot to 'only-on-failure', and video to 'retain-on-failure'."
    steps:
      - id: SF-003-S01
        title: Install Playwright and create playwright.config.ts
        purpose: "Establish the single E2E runner configuration every later spec inherits, including the harness web server and failure artefacts."
        tdd_phase: setup
        depends_on_steps: []
        files_to_touch:
          - path: package.json
            change: modify
            detail: "Add devDependency @playwright/test at exactly 1.62.1. The build:test script already exists from SF-001; do not modify it."
          - path: playwright.config.ts
            change: create
            detail: >-
              defineConfig with testDir "e2e/specs"; fullyParallel true; forbidOnly true;
              retries 1; workers 4; reporter [["list"],["html",{"open":"never"}]];
              timeout 30000; expect.timeout 5000;
              use {baseURL: "http://localhost:5174", trace: "retain-on-failure",
              screenshot: "only-on-failure", video: "retain-on-failure"};
              projects [{name:"chromium", use:{...devices["Desktop Chrome"], headless: false}}];
              Do NOT include a channel key. Setting channel to undefined is inert noise and setting it
              to a real channel would use an installed Chrome instead of the pinned Playwright
              chromium, making runs non-reproducible.
              webServer {command: "npx vite --config vite.harness.config.ts", url: "http://localhost:5174",
              reuseExistingServer: true, timeout: 30000}.
          - path: vite.harness.config.ts
            change: create
            detail: >-
              defineConfig with root "tests/harness"; server.port 5174; server.strictPort true;
              resolve.alias mapping "@" to the src directory. Serves tests/harness/index.html at the
              server root and can import fixture HTML from tests/fixtures/dom/x/ via fs.allow.
        instructions:
          - "Run `npm install --save-dev @playwright/test@1.62.1`."
          - "Run `npx playwright install chromium` to download the browser binary."
          - "Create playwright.config.ts with exactly the configuration described above."
          - "Create vite.harness.config.ts with exactly the configuration described above."
        constraints:
          - "headless must be false in the chromium project: Chromium cannot load an unpacked extension in the default headless mode."
          - "Because headless is false, this suite requires a display. On a Linux CI runner it must be invoked under xvfb-run. SF-011 declares that wrapper in the workflow; do not work around a missing display by switching to headless here, because the extension would then silently not load and every E2E test would pass vacuously."
          - "Do not install browsers other than chromium."
        test_specification:
          test_type: none
          test_file: null
          test_name: null
          arrange: "SF-002 tooling is in place."
          act: "Install @playwright/test, download chromium, and create the two config files."
          assert:
            - "playwright.config.ts and vite.harness.config.ts exist."
            - "npx playwright --version prints a version and exits 0."
          expected_red_failure: null
        validation:
          - command: "npx playwright --version && test -f playwright.config.ts && test -f vite.harness.config.ts && echo ok"
            expected_result: "Prints a Playwright version then ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the browser-download or config error output."
      - id: SF-003-S02
        title: Create the local harness page and the test-build manifest step
        purpose: "Provide a deterministic feed page the content script can run against, without granting the harness origin any permission in production builds."
        tdd_phase: setup
        depends_on_steps: [SF-003-S01]
        files_to_touch:
          - path: tests/harness/index.html
            change: create
            detail: >-
              An HTML document with a div whose data-testid attribute is "primaryColumn" containing a
              div whose aria-label is "Timeline: Your Home Timeline", matching the container selectors
              declared in SF-005. It renders three placeholder post articles inline at load. It loads
              tests/harness/harness.ts as a module script. SF-007 replaces the inline placeholder
              markup with content read from tests/fixtures/dom/x/timeline-baseline.html.
          - path: tests/harness/harness.ts
            change: create
            detail: >-
              Exports nothing; attaches a function to window named __slopfilterHarness with methods
              appendPost(post: {id: string; authorHandle: string; text: string; postedAt: string})
              which appends a post article into the timeline container using the same markup shape as
              the inline posts, and reset() which removes every appended post. Both are synchronous.
              This is what E2E specs call to exercise the MutationObserver path with unique per-run data.
          - path: scripts/build-manifest.mjs
            change: create
            detail: >-
              A Node ESM script that reads dist/manifest.json, and if
              process.env.SLOPFILTER_BUILD_TARGET === 'test' pushes "http://localhost:5174/*" onto
              host_permissions and pushes a content_scripts entry matching "http://localhost:5174/*"
              with the same js and css as the x.com entry, then writes the file back. If the variable
              is any other value the script exits 0 without modifying the file. It throws and exits 1
              if dist/manifest.json does not exist.
        instructions:
          - "Create tests/harness/index.html with the container attributes and three inline placeholder post articles."
          - "Create tests/harness/harness.ts exposing window.__slopfilterHarness with appendPost and reset."
          - "Create scripts/build-manifest.mjs implementing exactly the behaviour described above."
          - "Run `npm run build:test` and confirm dist/manifest.json host_permissions contains http://localhost:5174/*."
          - "Run `npm run build` and confirm dist/manifest.json host_permissions does not contain localhost."
        constraints:
          - "scripts/build-manifest.mjs must never add the harness origin when SLOPFILTER_BUILD_TARGET is unset or set to production."
          - "The harness page must not make any network request to an external origin."
        test_specification:
          test_type: none
          test_file: null
          test_name: null
          arrange: "The SF-001 build pipeline emits dist/manifest.json."
          act: "Run npm run build:test, then npm run build, inspecting dist/manifest.json after each."
          assert:
            - "After build:test, host_permissions includes http://localhost:5174/*."
            - "After build, host_permissions does not include any localhost entry."
          expected_red_failure: null
        validation:
          - command: "npm run build:test && node --input-type=module -e \"import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('dist/manifest.json','utf8'));if(!m.host_permissions.includes('http://localhost:5174/*'))throw new Error('test build missing harness permission');console.log('ok')\""
            expected_result: "Prints ok, exit code 0."
          - command: "npm run build && node --input-type=module -e \"import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('dist/manifest.json','utf8'));if(JSON.stringify(m.host_permissions).includes('localhost'))throw new Error('localhost leaked into production build');console.log('ok')\""
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, both commands, exit codes, and the full dist/manifest.json contents from each build."
      - id: SF-003-S03
        title: Create the extension fixture and a smoke spec that fails if the extension did not load
        purpose: "Guarantee every later E2E test actually runs with the extension present, so no later test can pass vacuously."
        tdd_phase: red
        depends_on_steps: [SF-003-S02]
        files_to_touch:
          - path: e2e/support/extension.ts
            change: create
            detail: >-
              Exports `test` and `expect` extended from @playwright/test with two fixtures.
              Fixture `context`: launches chromium.launchPersistentContext with an empty user-data
              directory created per worker under test-results/, args
              ["--disable-extensions-except=<abs dist path>", "--load-extension=<abs dist path>",
              "--no-first-run"], headless false.
              Fixture `extensionId`: FIRST reads context.serviceWorkers() and uses element 0 if that
              array is non-empty; only if it is empty does it await
              context.waitForEvent('serviceworker') with a 10000ms timeout. It then parses the host
              component of the worker URL, which is the extension id, and returns it. If no service
              worker is observed within the timeout, or if the parsed id is empty, the fixture throws
              an Error whose message is exactly "extension did not load: no service worker". It must
              never yield an empty string.
              Checking serviceWorkers() before awaiting is required, not an optimisation: if the
              worker started before the fixture attached its listener, awaiting the event alone would
              hang until the timeout and report a false negative on a correctly loaded extension.
              Both fixtures dispose the context in teardown and remove the per-worker user-data
              directory.
          - path: e2e/support/harness.d.ts
            change: create
            detail: >-
              Ambient global declaration so page.evaluate callbacks type-check:
              `declare global` with an interface Window extension adding
              `__slopfilterHarness: {appendPost(post: {id: string; authorHandle: string; text: string;
              postedAt: string}): void; reset(): void}`, followed by `export {};`.
              Without this file every page.evaluate referencing window.__slopfilterHarness fails
              npm run typecheck, because tsconfig include covers the e2e directory.
          - path: e2e/support/harness.ts
            change: create
            detail: >-
              Exports uniqueRunId(testInfo) returning a string combining testInfo.workerIndex,
              testInfo.testId, and Date.now(); appendPost(page, post) which calls
              window.__slopfilterHarness.appendPost via page.evaluate; and resetHarness(page) which
              calls window.__slopfilterHarness.reset via page.evaluate. No sleeps, no polling.
          - path: e2e/specs/harness-smoke.spec.ts
            change: create
            detail: >-
              One test named "loads the unpacked extension and serves the harness timeline" that uses
              the extension fixture, asserts extensionId matches /^[a-p]{32}$/, navigates to "/",
              and asserts the timeline container is visible.
        instructions:
          - "Create e2e/support/harness.d.ts declaring the __slopfilterHarness window global exactly as described."
          - "Create e2e/support/extension.ts implementing the two fixtures exactly as described."
          - "Create e2e/support/harness.ts implementing the three helpers exactly as described."
          - "Create e2e/specs/harness-smoke.spec.ts with the single test described."
          - "Before implementing the fixtures, run `npm run test:e2e -- e2e/specs/harness-smoke.spec.ts` with e2e/support/extension.ts absent and record the failure."
        constraints:
          - "The user-data directory must be unique per worker so parallel workers never share extension state."
          - "The fixture must throw rather than yield when no service worker is found. Never yield an empty extension id."
          - "The --load-extension and --disable-extensions-except arguments must both receive an ABSOLUTE path to dist/. Chromium silently ignores a relative path and the extension will not load."
        test_specification:
          test_type: e2e
          test_file: e2e/specs/harness-smoke.spec.ts
          test_name: "loads the unpacked extension and serves the harness timeline"
          arrange: "dist/ built with npm run build:test; the harness web server is started by the Playwright webServer config."
          act: "The extension fixture launches a persistent context with dist/ loaded, then the test navigates to http://localhost:5174/."
          assert:
            - "extensionId matches the regular expression /^[a-p]{32}$/"
            - "The element located by getByLabel('Timeline: Your Home Timeline') is visible"
          expected_red_failure: "Before e2e/support/extension.ts exists, the spec fails at import time with a module-not-found error naming e2e/support/extension."
        validation:
          - command: "npm run build:test && npm run test:e2e -- e2e/specs/harness-smoke.spec.ts"
            expected_result: "1 passed, 0 failed. Exit code 0."
          - command: "npm run typecheck"
            expected_result: "Exit code 0. This proves e2e/support/harness.d.ts correctly declares the __slopfilterHarness window global; without it the page.evaluate callbacks do not compile."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, exact command, exit code, the assertion output, the paths of the retained trace and video under test-results/, and whether the harness web server started."
    definition_of_done:
      - "npm run build:test emits a dist/ whose manifest grants the harness origin"
      - "npm run build emits a dist/ with no localhost host permission, confirmed by GV-08"
      - "npm run test:e2e runs the smoke spec against the harness and exits 0"
      - "The extension fixture throws rather than yielding when the extension fails to load"
      - "No spec, fixture, or helper contains waitForTimeout or any sleep"
      - "Only @playwright/test@1.62.1 was added as a dependency, and only chromium was downloaded"
      - "npm run typecheck exits 0 with the e2e tree included, proving the harness window global is declared"
    e2e_validation:
      required: true
      applicability: applicable
      rationale_if_not_applicable: null
      test_file:
        path: e2e/specs/harness-smoke.spec.ts
        change: create
      user_journey:
        name: Extension loads into a browser and the timeline surface is present
        actor:
          role: "Extension user browsing a timeline page (no application account exists; the extension has no accounts)"
          authentication:
            method: other
            fixture_or_source: "None. The extension has no authentication and the harness page is unauthenticated by design."
        preconditions:
          - "dist/ has been built with npm run build:test"
          - "The harness web server is serving http://localhost:5174"
        business_outcome: "The extension is installed and running in the browser alongside a rendered timeline, which is the precondition for every filtering behaviour that follows."
      data_lifecycle:
        isolation_key: "test-results/user-data-<workerIndex> for the browser profile; no shared server-side state exists because the harness is a static page"
        setup:
          method: fixture
          steps:
            - "The context fixture creates a fresh user-data directory named with the Playwright worker index."
            - "The Playwright webServer config starts the harness on port 5174 with strictPort true."
        cleanup:
          method: fixture teardown
          steps:
            - "The context fixture closes the browser context in teardown."
            - "The per-worker user-data directory is removed in teardown."
        prohibited:
          - shared manually-created test data
          - reliance on test execution order
          - mutation of production data
      selector_contract:
        required_test_ids: []
        locator_policy:
          allowed_in_order:
            - getByRole with accessible name
            - getByLabel
            - getByTestId
          forbidden:
            - CSS classes
            - XPath
            - positional selectors
            - generated IDs
            - DOM traversal
      browser_steps:
        - id: SF-003-E2E-01
          action: "Navigate to the harness timeline page"
          route: "http://localhost:5174/"
          locator: null
          input: null
          wait_for:
            condition: "The element with accessible label 'Timeline: Your Home Timeline' is visible"
            timeout_ms: 5000
          assertions:
            - "getByLabel('Timeline: Your Home Timeline') is visible"
        - id: SF-003-E2E-02
          action: "Read the extension id resolved by the fixture from the loaded extension service worker"
          route: "http://localhost:5174/"
          locator: null
          input: null
          wait_for:
            condition: "The persistent context has emitted a serviceworker event"
            timeout_ms: 10000
          assertions:
            - "The resolved extension id matches /^[a-p]{32}$/"
      test_cases:
        - id: SF-003-E2E-HAPPY-01
          title: The unpacked extension loads and the harness timeline renders
          priority: critical
          given: "dist/ is built with npm run build:test and the harness server is running on port 5174"
          when: "The extension fixture launches a persistent chromium context with dist/ loaded and navigates to http://localhost:5174/"
          then:
            - "The resolved extension id matches /^[a-p]{32}$/"
            - "The element labelled 'Timeline: Your Home Timeline' is visible"
        - id: SF-003-E2E-NEGATIVE-01
          title: The fixture fails loudly when the extension is not present
          priority: high
          applicability: applicable
          rationale_if_not_applicable: null
          given: "A persistent context launched without the --load-extension argument"
          when: "The extensionId fixture waits for a service worker"
          then:
            - "The fixture throws an Error whose message is 'extension did not load: no service worker'"
            - "No test body executes, so no test can report a pass while the extension is absent"
      execution:
        command: "npm run build:test && npm run test:e2e -- e2e/specs/harness-smoke.spec.ts"
        expected_result: "1 passed, 0 failed"
        retries: 1
        artifacts_on_failure:
          - screenshot
          - trace
          - video
          - browser-console-output
          - failed-network-requests
      e2e_definition_of_done:
        - Happy path passes in the required browser
        - Relevant negative path passes, or is explicitly approved as not applicable
        - Test is isolated and parallel-safe
        - Test creates unique data and performs cleanup
        - Test has no fixed delays, sleeps, or arbitrary waits
        - Browser-visible user result and persisted final state are verified
        - Failure artefacts are configured and available

  - id: SF-004
    title: Define the normalized Post model, the PlatformAdapter contract, and the message schema
    type: feature
    priority: P0
    status: planned
    description: >-
      Create the three type contracts every other module depends on: src/core/post.ts with the
      platform-agnostic Post type and a runtime validator, src/adapters/types.ts with the
      PlatformAdapter interface, and src/shared/messages.ts with the typed message union exchanged
      between the content script, the service worker, and the inference host.
    reason: >-
      PRD section 5 requires the scoring pipeline to consume "a normalized Post object from the
      adapter". Defining that shape once, before any adapter or signal exists, is what keeps the
      adapter the only platform-specific code and lets Phase 3 platforms reuse every signal unchanged.
    user_value: "Technical: a single agreed data contract that prevents each later ticket from inventing its own post shape."
    depends_on: [SF-001, SF-002]
    blocks: [SF-005, SF-006, SF-008, SF-101]
    estimated_complexity: M
    risk_level: medium
    risks:
      - risk: "The Post shape omits a field a later signal needs, forcing a breaking change across every signal and fixture."
        mitigation: "The Post fields below are derived directly from the five PRD signal layers: text for Layer 3 and 5, imageUrls for Layers 2 and 4, and author plus engagement for Layer 1. Every field traces to a named layer."
      - risk: "Fields the X DOM cannot supply are declared required, so the adapter is forced to fabricate values."
        mitigation: "Every field the adapter may be unable to read is typed with an explicit null branch and the validator accepts null. Layer 1 frequency inputs are omitted from Post entirely, because HD-004 has not chosen their data source and a nullable-but-never-populated field is dead weight that invites fabrication."
      - risk: "The Post shape leaks platform identity into src/core/, defeating the purity constraint the architecture rests on."
        mitigation: "Post has no platform field. Platform identity is carried by PlatformAdapter.platform, and the Biome core-purity boundary proven in SF-002-S04 blocks any adapter import from src/core/."
    constraints:
      - "src/core/post.ts must contain no platform-specific field. No field name may reference X, Twitter, tweet, or retweet, and no field may be typed to a platform literal. Platform identity lives on PlatformAdapter.platform in src/adapters/types.ts, never on the Post object."
      - "The validator must be a plain TypeScript type guard. Do not add a schema-validation dependency."
      - "src/adapters/types.ts must not import from src/adapters/x/."
    prerequisites:
      - "SF-001 and SF-002 complete."
      - "HD-004 answered. It determines where posting-frequency inputs live. Post deliberately omits them, so if HD-004 selects an option requiring per-post author metadata, this ticket's Post shape must be revisited before SF-008 starts."
    acceptance_criteria:
      - id: SF-004-AC1
        statement: "isPost returns true for a fully populated valid Post fixture and false for each of: missing id, empty id, non-string text, and non-array imageUrls."
        verification: "Run `npm run test:unit -- tests/unit/core/post.test.ts`; expect 5 passing tests, 0 failing."
      - id: SF-004-AC2
        statement: "src/core/post.ts passes the core-purity lint boundary."
        verification: "Run `npx biome lint src/core/post.ts`; expect exit code 0."
      - id: SF-004-AC3
        statement: "PlatformAdapter declares findTimelineContainer, findPostElements, and extractPost with the exact signatures named below, and src/adapters/types.ts type-checks."
        verification: "Run `npm run typecheck`; expect exit code 0."
      - id: SF-004-AC4
        statement: "The message union in src/shared/messages.ts is discriminated on a literal `type` field and every variant is reachable from the exported union."
        verification: "The test tests/unit/shared/messages.test.ts exhaustively switches on the discriminant with a never-typed default branch and compiles under npm run typecheck."
    steps:
      - id: SF-004-S01
        title: Write the failing test for the Post validator
        purpose: "Fix the accepted and rejected shapes of a Post before any code can shape itself around an implementation."
        tdd_phase: red
        depends_on_steps: []
        files_to_touch:
          - path: tests/unit/core/post.test.ts
            change: create
            detail: >-
              Imports isPost and type Post from '@/core/post'. Defines
              `const validPost: Post = { ... }` matching the Post shape described in step S02.
              Every INVALID literal must be cast through unknown, using exactly this form:
              `isPost({ ...validPost, text: 42 } as unknown)`.
              This is mandatory, not stylistic: tsconfig include covers the tests directory, and under
              strict plus exactOptionalPropertyTypes a spread assigning a wrong-typed or undefined
              property to a Post-typed literal is a compile error, so npm run typecheck would fail on
              the test file itself.
              One describe block "isPost" with five tests:
              "accepts a fully populated post" asserting isPost(validPost) is true;
              "rejects a post with no id" asserting isPost({ ...validPost, id: undefined } as unknown) is false;
              "rejects a post with an empty id" asserting isPost({ ...validPost, id: '' }) is false;
              "rejects a post whose text is not a string" asserting isPost({ ...validPost, text: 42 } as unknown) is false;
              "rejects a post whose imageUrls is not an array" asserting isPost({ ...validPost, imageUrls: 'x' } as unknown) is false.
        instructions:
          - "Create tests/unit/core/post.test.ts with exactly the five tests described above."
          - "Run `npm run test:unit -- tests/unit/core/post.test.ts` and record the failure."
        constraints:
          - "Do not create src/core/post.ts in this step."
          - "Cast every invalid literal through `as unknown`. Do not use `as any`, which Biome reports via lint/suspicious/noExplicitAny, and do not add a biome-ignore comment."
        test_specification:
          test_type: unit
          test_file: tests/unit/core/post.test.ts
          test_name: "isPost > accepts a fully populated post"
          arrange: "A `const validPost: Post` object literal with every field of the Post shape populated, plus four invalid variants, three of them cast through `as unknown`."
          act: "Call isPost(validPost)."
          assert:
            - "isPost(validPost) is true"
            - "isPost with id undefined is false"
            - "npm run typecheck exits 0 on the test file, proving the as unknown casts are present"
            - "isPost with id '' is false"
            - "isPost with text 42 is false"
            - "isPost with imageUrls 'x' is false"
          expected_red_failure: "The run fails at import time with a module-not-found error naming @/core/post, because src/core/post.ts does not exist."
        validation:
          - command: "npm run test:unit -- tests/unit/core/post.test.ts; test $? -ne 0 && echo red-confirmed"
            expected_result: "Prints red-confirmed. A zero exit code here means the test is not actually failing: stop and report."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the full Vitest output."
      - id: SF-004-S02
        title: Implement the Post type and the isPost validator
        purpose: "Make the red test pass with the minimum type surface every signal layer needs."
        tdd_phase: green
        depends_on_steps: [SF-004-S01]
        files_to_touch:
          - path: src/core/post.ts
            change: create
            detail: >-
              Export interface PostAuthor {handle: string; displayName: string; profileUrl: string |
              null}.
              accountCreatedAt and totalPostCount are deliberately ABSENT. Both presuppose a data
              source HD-004 has not chosen, and the X timeline DOM exposes neither. Declaring them now
              would create fields the adapter can only ever populate with null, which invites
              fabrication. Whichever option HD-004 selects, SF-008 introduces the frequency inputs in
              the shape that option actually supports.
              Export interface PostEngagement {replies: number | null; reposts: number | null;
              likes: number | null; views: number | null}.
              Export interface Post {id: string; permalink: string | null;
              text: string; postedAt: string | null; author: PostAuthor;
              engagement: PostEngagement; imageUrls: readonly string[]; hasVideo: boolean}.
              There is deliberately NO platform field on Post. Adding one would hardcode X into the
              pure core layer and contradict this ticket's own purity constraint. The caller always
              knows which adapter produced a Post, and PlatformAdapter.platform carries that identity.
              Export function isPost(value: unknown): value is Post implemented as a plain type guard
              checking: value is a non-null object; id is a string of length greater than zero;
              text is a string; imageUrls is an array whose every element is a
              string; hasVideo is a boolean; author is a non-null object whose handle and displayName
              are strings; engagement is a non-null object. No other exports.
        instructions:
          - "Create src/core/post.ts with exactly the types and the isPost guard described above."
          - "Run `npm run test:unit -- tests/unit/core/post.test.ts` and confirm 5 passing tests."
          - "Run `npx biome lint src/core/post.ts` and confirm exit code 0."
        constraints:
          - "Do not add a platform field to Post. Do not add accountCreatedAt or totalPostCount to PostAuthor; both are gated on HD-004."
          - "isPost must not throw for any input, including null, undefined, and primitives."
        test_specification:
          test_type: unit
          test_file: tests/unit/core/post.test.ts
          test_name: "isPost > accepts a fully populated post"
          arrange: "The same validPost literal from S01."
          act: "Vitest executes all five tests against the new implementation."
          assert:
            - "5 tests pass"
            - "0 tests fail"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/core/post.test.ts"
            expected_result: "Exit code 0, 5 passed, 0 failed."
          - command: "npx biome lint src/core/post.ts && echo ok"
            expected_result: "Prints ok, exit code 0, confirming the core-purity boundary is satisfied."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the failing assertion including the received value."
      - id: SF-004-S03
        title: Define the PlatformAdapter interface
        purpose: "Fix the contract that keeps every platform-specific concern behind one interface."
        tdd_phase: setup
        depends_on_steps: [SF-004-S02]
        files_to_touch:
          - path: src/adapters/types.ts
            change: create
            detail: >-
              Imports type Post from '@/core/post'; Post is referenced by extractPost's return type.
              Export interface SelectorCheckResult {ok: boolean; failedSelectorIds: readonly string[]}.
              Export interface PlatformAdapter {
              readonly platform: 'x';
              readonly selectorContractVersion: string;
              selfTest(root: ParentNode): SelectorCheckResult;
              findTimelineContainer(root: ParentNode): Element | null;
              findPostElements(container: ParentNode): readonly Element[];
              extractPost(element: Element): Post | null;
              }.
              extractPost returns null rather than throwing when a required field cannot be read.
              No other exports.
        instructions:
          - "Create src/adapters/types.ts with exactly the interfaces described above."
          - "Run `npm run typecheck` and confirm exit code 0."
        constraints:
          - "src/adapters/types.ts must not import from src/adapters/x/ or any other concrete adapter."
          - "extractPost must be declared to return Post | null. A throwing contract would violate the fail-open constraint."
        test_specification:
          test_type: none
          test_file: null
          test_name: null
          arrange: "src/core/post.ts exists."
          act: "Create src/adapters/types.ts and run npm run typecheck."
          assert:
            - "npm run typecheck exits 0."
            - "src/adapters/types.ts contains no import path beginning with @/adapters/x."
          expected_red_failure: null
        validation:
          - command: "npm run typecheck && ! grep -q \"@/adapters/x\" src/adapters/types.ts && echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the tsc diagnostics."
      - id: SF-004-S04
        title: Define the typed message union and its exhaustiveness test
        purpose: "Give the content script, service worker, and inference host one schema so a later message change cannot silently break one of the three call sites."
        tdd_phase: green
        depends_on_steps: [SF-004-S03]
        files_to_touch:
          - path: src/shared/messages.ts
            change: create
            detail: >-
              Export type ExtensionMessage as a discriminated union on the literal field `type` with
              these variants: {type: 'selftest-result'; ok: boolean; failedSelectorIds: readonly
              string[]}; {type: 'get-selftest-state'}; {type: 'score-batch-request'; requestId:
              string; posts: readonly Post[]}; {type: 'score-batch-response'; requestId: string;
              results: readonly {postId: string; score: number}[]}; {type: 'downvote-post';
              postId: string; text: string}; {type: 'wrong-call'; postId: string; firedLayerIds:
              readonly string[]}.
              Export function isExtensionMessage(value: unknown): value is ExtensionMessage,
              implemented as a plain type guard checking the object has a string `type` field whose
              value is one of the six literals. No other exports.
          - path: tests/unit/shared/messages.test.ts
            change: create
            detail: >-
              One describe block "ExtensionMessage" with two tests.
              "covers every variant exhaustively": a function taking ExtensionMessage with a switch on
              msg.type whose default branch assigns msg to a const of type never, called once per
              variant, asserting each call returns the expected variant name string.
              "isExtensionMessage rejects an unknown type": asserts
              isExtensionMessage({type: 'not-a-real-message'}) is false and
              isExtensionMessage(null) is false.
        instructions:
          - "Create src/shared/messages.ts with exactly the union and guard described above."
          - "Create tests/unit/shared/messages.test.ts with exactly the two tests described above."
          - "Run `npm run test:unit -- tests/unit/shared/messages.test.ts` and confirm 2 passing tests."
          - "Run `npm run typecheck` and confirm exit code 0, which proves the never-typed default branch is unreachable."
        constraints:
          - "Every variant must carry the literal discriminant field named `type`."
          - "Do not add a message variant not listed above. Later tickets extend this union explicitly."
        test_specification:
          test_type: unit
          test_file: tests/unit/shared/messages.test.ts
          test_name: "ExtensionMessage > covers every variant exhaustively"
          arrange: "One object literal per union variant, each with its required fields populated."
          act: "Call the exhaustive switch helper once per variant, then run npm run typecheck."
          assert:
            - "Each call returns the expected variant name string"
            - "isExtensionMessage({type: 'not-a-real-message'}) is false"
            - "isExtensionMessage(null) is false"
            - "npm run typecheck exits 0, proving the never-typed default branch is unreachable"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/shared/messages.test.ts"
            expected_result: "Exit code 0, 2 passed, 0 failed."
          - command: "npm run typecheck && npm run lint && echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, the failing assertion, and any tsc diagnostic naming the never-typed default branch."
    definition_of_done:
      - "src/core/post.ts exports Post, PostAuthor, PostEngagement, and isPost and passes the core-purity lint boundary"
      - "src/adapters/types.ts exports PlatformAdapter and SelectorCheckResult and imports no concrete adapter"
      - "src/shared/messages.ts exports a discriminated ExtensionMessage union and isExtensionMessage"
      - "npm run test:unit passes with the 7 new tests added by this ticket and 0 failures, giving 10 passing tests in total including the 3 from SF-002"
      - "Post carries no platform field, and PostAuthor carries no accountCreatedAt or totalPostCount field"
      - "npm run typecheck and npm run lint both exit 0"
      - "No new dependency was added"
    e2e_validation:
      required: true
      applicability: not_applicable_pending_human_approval
      rationale_if_not_applicable: >-
        This ticket adds type declarations and two pure type guards. It wires nothing into the
        content script, renders nothing, and changes no extension behaviour, so no browser-visible
        outcome exists to assert. The behaviour these contracts enable is exercised end to end by
        SF-014.

  - id: SF-005
    title: Create the versioned selector contract and its typed loader
    type: feature
    priority: P0
    status: planned
    description: >-
      Create src/adapters/x/selectors.json declaring every X DOM selector the adapter uses, each with
      an id, a human description, an ordered list of fallback selectors, and a required flag. Create
      src/adapters/x/selectors.ts providing a typed loader, a shape validator, and first-match
      resolution across the fallback list.
    reason: >-
      PRD section 5 makes this a hard requirement: "every adapter selector is declared in a versioned
      selectors.json with a description and a required true/false flag". The file is consumed by the
      in-extension self-test (SF-010) and by the CI drift monitor (SF-012), which reads it without a
      build step. This is the single artefact that makes markup drift detectable instead of silent.
    user_value: "Technical: one machine-readable source of truth for platform markup, consumed by the adapter, the self-test, and the drift monitor."
    depends_on: [SF-002, SF-004]
    blocks: [SF-007, SF-010, SF-012]
    estimated_complexity: M
    risk_level: medium
    risks:
      - risk: "Selectors are invented from memory rather than captured from real markup, so the contract describes a page that does not exist."
        mitigation: "Only the container and post-article selectors, which SF-003 already encoded in the harness page, are fixed here. Every field-level selector is added in SF-006 from the golden fixtures captured in SF-007, never from recall."
      - risk: "Fallback selectors are ordered arbitrarily, so a brittle selector wins over a stable one and drift is detected late."
        mitigation: "The contract mandates ordering from most stable to least stable, and the loader always returns the first match in declared order."
      - risk: "selectors.json drifts out of sync with the TypeScript type describing it."
        mitigation: "validateSelectorContract runs against the imported JSON in a unit test, so a malformed or mis-shaped contract fails npm run test:unit."
    constraints:
      - "selectors.json must remain valid JSON readable by plain Node with no build step, because scripts/check-drift.mjs consumes it directly."
      - "Every entry must declare at least one selector string. An empty selectors array is invalid."
      - "Selector strings must use data-testid, ARIA attributes, or semantic elements. CSS class selectors and generated-id selectors are forbidden: X class names are compiled and change without notice."
      - "The contractVersion field must be incremented by any later ticket that changes a selector."
      - "Do not add a field-level selector in this ticket. Only container-level and post-level entries are in scope; field selectors arrive in SF-006 from captured fixtures."
    prerequisites:
      - "SF-002 and SF-004 complete."
      - "SF-003 complete, because tests/harness/index.html already encodes the container attributes this contract must match."
      - "SF-006 complete, because SF-007 verifies every selector added later against the committed fixtures."
    acceptance_criteria:
      - id: SF-005-AC1
        statement: "selectors.json parses as JSON in plain Node with no transpilation."
        verification: "Run `node --input-type=module -e \"import fs from 'node:fs';JSON.parse(fs.readFileSync('src/adapters/x/selectors.json','utf8'));console.log('ok')\"`; expect ok."
      - id: SF-005-AC2
        statement: "validateSelectorContract accepts the shipped contract and rejects a contract with an empty selectors array, a missing required flag, and a missing description."
        verification: "Run `npm run test:unit -- tests/unit/adapters/x/selectors.test.ts`; expect 5 passed, 0 failed."
      - id: SF-005-AC3
        statement: "resolveSelector returns the first fallback that matches and null when none match, without throwing."
        verification: "Covered by two of the five tests in tests/unit/adapters/x/selectors.test.ts, using a jsdom document built from an inline HTML string."
      - id: SF-005-AC4
        statement: "No selector string in selectors.json contains a CSS class selector or a numeric generated id."
        verification: "Run `node --input-type=module -e \"import fs from 'node:fs';const c=JSON.parse(fs.readFileSync('src/adapters/x/selectors.json','utf8'));for(const e of c.entries)for(const s of e.selectors){if(/(^|[^\\\\[])\\\\.[a-zA-Z_-]/.test(s))throw new Error('class selector in '+e.id+': '+s);if(/#[0-9]/.test(s))throw new Error('generated id in '+e.id+': '+s);}console.log('ok')\"`; expect ok."
    steps:
      - id: SF-005-S01
        title: Write the failing test for the contract validator and selector resolution
        purpose: "Fix the accepted contract shape and the resolution semantics before any implementation exists to shape them."
        tdd_phase: red
        depends_on_steps: []
        files_to_touch:
          - path: tests/unit/adapters/x/selectors.test.ts
            change: create
            detail: >-
              Imports validateSelectorContract, resolveSelector, and selectorContract from
              '@/adapters/x/selectors'. One describe block "selector contract" with five tests.
              "accepts the shipped contract": asserts validateSelectorContract(selectorContract).ok is true.
              "rejects an entry with an empty selectors array": builds a contract clone whose first
              entry has selectors set to [] and asserts ok is false and errors contains the entry id.
              "rejects an entry with no required flag": clone with required deleted, cast through
              `as unknown`, asserts ok is false.
              "resolveSelector returns the first matching fallback in declared order": builds a
              jsdom document from the HTML string
              `<div data-testid="primaryColumn"><section aria-label="Timeline: Your Home Timeline"></section></div>`,
              calls resolveSelector(doc, entry) for an entry whose selectors are
              ["[data-testid=\\"does-not-exist\\"]", "[data-testid=\\"primaryColumn\\"]"], and asserts the
              returned element's getAttribute('data-testid') equals 'primaryColumn'.
              "resolveSelector returns null when no fallback matches": same document, entry with
              selectors ["[data-testid=\\"nope\\"]"], asserts the result is null and that no error was thrown.
        instructions:
          - "Create tests/unit/adapters/x/selectors.test.ts with exactly the five tests described above."
          - "Run `npm run test:unit -- tests/unit/adapters/x/selectors.test.ts` and record the failure."
        constraints:
          - "This test file lives outside tests/unit/core/, so it runs in the jsdom project and has a document global. Do not import jsdom directly."
          - "Do not create src/adapters/x/selectors.ts or selectors.json in this step."
        test_specification:
          test_type: unit
          test_file: tests/unit/adapters/x/selectors.test.ts
          test_name: "selector contract > resolveSelector returns the first matching fallback in declared order"
          arrange: "A jsdom document parsed from the inline HTML string containing a primaryColumn div wrapping a Timeline section."
          act: "Call resolveSelector(document, entry) with an entry whose first fallback does not match and whose second does."
          assert:
            - "validateSelectorContract(selectorContract).ok is true"
            - "A contract entry with selectors [] validates as ok false and reports the entry id"
            - "A contract entry with no required flag validates as ok false"
            - "resolveSelector returns the element whose data-testid is primaryColumn"
            - "resolveSelector returns null, without throwing, when no fallback matches"
          expected_red_failure: "The run fails at import time with a module-not-found error naming @/adapters/x/selectors, because neither selectors.ts nor selectors.json exists."
        validation:
          - command: "npm run test:unit -- tests/unit/adapters/x/selectors.test.ts; test $? -ne 0 && echo red-confirmed"
            expected_result: "Prints red-confirmed. A zero exit code means the test is not failing: stop and report."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, exact command, exit code, and the full Vitest output."
      - id: SF-005-S02
        title: Create selectors.json with the container and post-level entries
        purpose: "Declare the only selectors that are already known from the SF-003 harness, without inventing field-level markup."
        tdd_phase: green
        depends_on_steps: [SF-005-S01]
        files_to_touch:
          - path: src/adapters/x/selectors.json
            change: create
            detail: >-
              A JSON object with two top-level keys.
              "contractVersion": "1.0.0".
              "entries": an array of exactly three objects, each with the keys id, description,
              selectors, and required.
              Entry 1: id "primary-column", description "The main feed column that wraps the
              timeline.", selectors ["[data-testid=\\"primaryColumn\\"]"], required true.
              Entry 2: id "timeline-container", description "The scrollable timeline region whose
              children are post cells. MutationObserver attaches here.", selectors
              ["[aria-label=\\"Timeline: Your Home Timeline\\"]", "[data-testid=\\"primaryColumn\\"] section"],
              required true.
              Entry 3: id "post-article", description "A single rendered post. One element per post in
              the timeline.", selectors ["article[data-testid=\\"tweet\\"]", "article[role=\\"article\\"]"],
              required true.
              Fallbacks in every entry are ordered most stable first.
        instructions:
          - "Create src/adapters/x/selectors.json with exactly the three entries described above."
          - "Confirm the file parses with plain Node and no build step."
          - "Confirm every selector string uses an attribute or element selector and contains no CSS class selector."
        constraints:
          - "Exactly three entries. Do not add field-level entries such as author handle or post text; those arrive in SF-006 from captured fixtures."
          - "contractVersion must be the string 1.0.0 at this ticket."
        test_specification:
          test_type: unit
          test_file: tests/unit/adapters/x/selectors.test.ts
          test_name: "selector contract > accepts the shipped contract"
          arrange: "src/adapters/x/selectors.json with the three declared entries."
          act: "validateSelectorContract is called on the imported contract."
          assert:
            - "validateSelectorContract(selectorContract).ok is true"
            - "selectorContract.entries has length 3"
          expected_red_failure: null
        validation:
          - command: "node --input-type=module -e \"import fs from 'node:fs';const c=JSON.parse(fs.readFileSync('src/adapters/x/selectors.json','utf8'));if(c.contractVersion!=='1.0.0')throw new Error('version');if(c.entries.length!==3)throw new Error('expected 3 entries, got '+c.entries.length);for(const e of c.entries){if(!e.id||!e.description||!Array.isArray(e.selectors)||e.selectors.length===0||typeof e.required!=='boolean')throw new Error('malformed entry '+JSON.stringify(e));}console.log('ok')\""
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the offending entry printed by the validation script."
      - id: SF-005-S03
        title: Implement the typed loader, validator, and resolver
        purpose: "Make the red tests pass and give the adapter, self-test, and drift monitor one shared access path to the contract."
        tdd_phase: green
        depends_on_steps: [SF-005-S02]
        files_to_touch:
          - path: src/adapters/x/selectors.ts
            change: create
            detail: >-
              Imports contract from './selectors.json' using the resolveJsonModule support enabled in
              SF-001.
              Export interface SelectorEntry {id: string; description: string; selectors: readonly
              string[]; required: boolean}.
              Export interface SelectorContract {contractVersion: string; entries: readonly
              SelectorEntry[]}.
              Export const selectorContract: SelectorContract, typed from the imported JSON.
              Export interface ContractValidation {ok: boolean; errors: readonly string[]}.
              Export function validateSelectorContract(value: unknown): ContractValidation, returning
              ok false with one error string per problem, each error string beginning with the entry
              id when the problem is entry-scoped. It checks: contractVersion is a non-empty string;
              entries is a non-empty array; every entry has a non-empty id, a non-empty description, a
              boolean required, and a selectors array with at least one non-empty string.
              Export function resolveSelector(root: ParentNode, entry: SelectorEntry): Element | null,
              which iterates entry.selectors in order, calls root.querySelector inside a try/catch so
              an invalid selector string cannot throw, and returns the first match or null.
              Export function getEntry(id: string): SelectorEntry, which throws an Error naming the id
              when it is not in the contract.
        instructions:
          - "Create src/adapters/x/selectors.ts with exactly the exports described above."
          - "Run `npm run test:unit -- tests/unit/adapters/x/selectors.test.ts` and confirm 5 passing tests."
          - "Run `npm run typecheck` and `npm run lint` and confirm both exit 0."
        constraints:
          - "resolveSelector must never throw. An invalid selector string must be caught and treated as a non-match, because a throwing resolver would break the fail-open constraint."
          - "Do not add a runtime dependency for validation. This is a plain hand-written check."
        test_specification:
          test_type: unit
          test_file: tests/unit/adapters/x/selectors.test.ts
          test_name: "selector contract > resolveSelector returns null when no fallback matches"
          arrange: "A jsdom document containing a primaryColumn div and a Timeline section."
          act: "Call resolveSelector with an entry whose only selector matches nothing."
          assert:
            - "5 tests pass, 0 fail"
            - "resolveSelector returned null rather than throwing"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/adapters/x/selectors.test.ts"
            expected_result: "Exit code 0, 5 passed, 0 failed."
          - command: "npm run typecheck && npm run lint && echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, the failing assertion with its received value, and the tsc or Biome diagnostics."
    definition_of_done:
      - "src/adapters/x/selectors.json exists with contractVersion 1.0.0 and exactly three required entries"
      - "The JSON parses in plain Node with no build step, as scripts/check-drift.mjs requires"
      - "No selector string uses a CSS class selector or a generated numeric id"
      - "src/adapters/x/selectors.ts exports selectorContract, validateSelectorContract, resolveSelector, and getEntry"
      - "resolveSelector returns null rather than throwing for an unmatched or invalid selector"
      - "npm run test:unit passes with 5 new tests, giving 15 in total"
      - "npm run typecheck and npm run lint exit 0"
    e2e_validation:
      required: true
      applicability: not_applicable_pending_human_approval
      rationale_if_not_applicable: >-
        This ticket produces a data file and three pure functions. Nothing is wired into the content
        script, no UI renders, and no extension behaviour changes, so there is no browser-visible
        outcome to assert. The contract is exercised end to end by SF-010, whose E2E asserts the
        paused badge appears when a required selector fails to resolve.

  - id: SF-006
    title: Capture, sanitise, and commit the golden X timeline DOM fixtures
    type: test
    priority: P0
    status: planned
    description: >-
      Commit three golden DOM snapshots of the X Home timeline under tests/fixtures/dom/x/, together
      with tests/fixtures/posts/posts-baseline.json recording the expected parse result for the
      baseline snapshot. Add scripts/sanitise-fixture.mjs, which strips identifying content from a raw
      capture, and a fixture-shape test that fails if a committed fixture is empty, unsanitised, or
      structurally unusable.
    reason: >-
      PRD section 5 requires golden snapshots so adapter parsing is validated without touching the
      live site, and PRD section 6 requires fixture-based adapter tests. Every assertion in SF-007
      compares against these files, and the SF-003 harness page serves the baseline snapshot, so this
      is the single source of truth for what X markup looks like.
    user_value: "Technical: a committed, reviewable record of the platform markup the adapter is written against."
    depends_on: [SF-002, SF-003]
    blocks: [SF-007, SF-008, SF-012]
    estimated_complexity: M
    risk_level: high
    risks:
      - risk: "No coding agent can log into X to capture a real Home timeline, so an agent fabricates plausible-looking markup and every downstream test validates a fiction."
        mitigation: >-
          Capture is an explicit manual prerequisite performed by a human, recorded as HD-015. The
          agent's work begins only once a raw capture file exists at the agreed path. The fixture-shape
          test asserts markers that hand-written markup would not incidentally contain, and step
          SF-006-S01 instructs the agent to stop and report rather than author markup itself.
      - risk: "A raw capture embeds real user handles, display names, post text, avatar URLs, and tracking parameters, which are then committed to a public repository."
        mitigation: "scripts/sanitise-fixture.mjs rewrites handles, display names, post text, and media URLs to synthetic values before the fixture is committed, and the fixture-shape test fails if any residual http URL points outside the approved placeholder host."
      - risk: "The fixture is captured once and silently rots as X markup changes, so tests keep passing against markup that no longer exists."
        mitigation: "The SF-012 drift monitor compares the live site against the same selector contract these fixtures validate, so divergence is reported within 24 hours rather than discovered by a user."
    constraints:
      - "The agent must not author, invent, or reconstruct X markup. If no raw capture exists at the agreed path, stop and report."
      - "No committed fixture may contain a real handle, real display name, real post text, a real avatar or media URL, or any query parameter."
      - "Fixtures must remain excluded by the negated glob !tests/fixtures/dom/** in biome.json files.includes, which SF-002 already configured, so formatting never rewrites captured markup."
      - "Fixtures are static HTML only. No script tag may survive sanitisation."
      - "Do not commit a fixture larger than 2MB; trim to the first ten post elements if the raw capture is larger."
    prerequisites:
      - "SF-002 and SF-003 complete."
      - "HD-015 answered, and a raw capture of an X Home timeline saved by a human at tests/fixtures/dom/x/raw/timeline-raw.html. The agent cannot produce this file."
    acceptance_criteria:
      - id: SF-006-AC1
        statement: "tests/fixtures/dom/x/timeline-baseline.html exists, is non-empty, and contains at least three elements matching the post-article selector."
        verification: "Run `npm run test:unit -- tests/unit/fixtures/dom.test.ts`; expect the baseline post-count assertion to pass."
      - id: SF-006-AC2
        statement: "No committed fixture contains a script tag, an inline event handler attribute, or a URL whose host is not example.invalid."
        verification: "Run `npm run test:unit -- tests/unit/fixtures/dom.test.ts`; expect the sanitisation assertions to pass for all three fixtures."
      - id: SF-006-AC3
        statement: "tests/fixtures/posts/posts-baseline.json is an array whose length equals the number of post elements in the baseline fixture, and every entry has a non-empty id, handle, and text."
        verification: "Run `npm run test:unit -- tests/unit/fixtures/dom.test.ts`; expect the posts-baseline shape assertion to pass."
      - id: SF-006-AC4
        statement: "timeline-broken-selectors.html is structurally identical to the baseline except that the timeline-container element's identifying attribute is removed, so the SF-010 self-test has a deterministic failure case."
        verification: "The test 'the broken fixture fails the timeline-container selector while the baseline passes' asserts resolveSelector returns null for timeline-container on the broken fixture and non-null on the baseline."
      - id: SF-006-AC5
        statement: "Every committed fixture is under 2MB."
        verification: "Run `find tests/fixtures/dom/x -name '*.html' -size +2000k | grep . && exit 1 || echo ok`; expect ok."
    steps:
      - id: SF-006-S01
        title: Confirm a human-supplied raw capture exists, and stop if it does not
        purpose: "Make the one thing an agent genuinely cannot do an explicit, checkable gate rather than a silent invitation to fabricate markup."
        tdd_phase: setup
        depends_on_steps: []
        files_to_touch: []
        instructions:
          - "Run `test -s tests/fixtures/dom/x/raw/timeline-raw.html`."
          - "If the command exits non-zero, STOP immediately and report: ticket SF-006, step SF-006-S01, the missing path, and that HD-015 requires a human to capture the timeline. Do not proceed and do not create the file."
          - "If the command exits 0, record the file size in bytes and continue."
        constraints:
          - "Under no circumstance may the agent create, author, or reconstruct tests/fixtures/dom/x/raw/timeline-raw.html. Fabricated markup would make every downstream adapter test meaningless while appearing to pass."
        test_specification:
          test_type: none
          test_file: null
          test_name: null
          arrange: "A human has saved a raw X Home timeline capture at the agreed path."
          act: "Check the file exists and is non-empty."
          assert:
            - "tests/fixtures/dom/x/raw/timeline-raw.html exists and has non-zero size"
          expected_red_failure: null
        validation:
          - command: "test -s tests/fixtures/dom/x/raw/timeline-raw.html && echo capture-present"
            expected_result: "Prints capture-present. A non-zero exit means the human prerequisite is unmet: stop and report, do not continue to S02."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, the exact missing path, and the text of HD-015. Do not author markup as a workaround."
      - id: SF-006-S02
        title: Write the failing fixture-shape test
        purpose: "Define what a usable, sanitised fixture is before any fixture is committed, so the sanitiser has a target it cannot quietly miss."
        tdd_phase: red
        depends_on_steps: [SF-006-S01]
        files_to_touch:
          - path: tests/unit/fixtures/dom.test.ts
            change: create
            detail: >-
              Reads the three fixture files with node:fs. Imports resolveSelector and getEntry from
              '@/adapters/x/selectors' and the expected posts from
              tests/fixtures/posts/posts-baseline.json.
              Describe block "golden fixtures" with these tests:
              "the baseline fixture contains at least three post elements", loading the baseline into
              the jsdom document and asserting querySelectorAll for the post-article entry's first
              selector has length of at least 3;
              "no fixture contains a script tag or an inline event handler", asserting for each of the
              three files that the raw text matches neither /<script/i nor /\son[a-z]+\s*=/i;
              "no fixture references a host other than example.invalid", extracting every
              https?://HOST occurrence by regular expression and asserting every host equals
              example.invalid;
              "posts-baseline.json matches the baseline fixture post count", asserting
              expectedPosts.length equals the baseline post-element count;
              "every posts-baseline entry has a non-empty id, handle, and text";
              "the broken fixture fails the timeline-container selector while the baseline passes",
              asserting resolveSelector for the timeline-container entry is null on the broken fixture
              and non-null on the baseline.
        instructions:
          - "Create tests/unit/fixtures/dom.test.ts with exactly the tests described above."
          - "Run `npm run test:unit -- tests/unit/fixtures/dom.test.ts` and record the failure."
        constraints:
          - "Do not create any fixture file in this step."
          - "This test file lives outside tests/unit/core/, so it runs in the jsdom project."
        test_specification:
          test_type: unit
          test_file: tests/unit/fixtures/dom.test.ts
          test_name: "golden fixtures > no fixture references a host other than example.invalid"
          arrange: "The three fixture files read as raw text with node:fs."
          act: "Extract every http or https host with a regular expression and compare each to example.invalid."
          assert:
            - "The baseline fixture has at least 3 post elements"
            - "No fixture text matches /<script/i or /\\son[a-z]+\\s*=/i"
            - "Every URL host in every fixture equals example.invalid"
            - "posts-baseline.json length equals the baseline post-element count"
            - "Every posts-baseline entry has a non-empty id, handle, and text"
            - "resolveSelector for timeline-container is null on the broken fixture and non-null on the baseline"
          expected_red_failure: "The run fails because tests/fixtures/dom/x/timeline-baseline.html does not exist, producing an ENOENT error from readFileSync."
        validation:
          - command: "npm run test:unit -- tests/unit/fixtures/dom.test.ts; test $? -ne 0 && echo red-confirmed"
            expected_result: "Prints red-confirmed. A zero exit code means the test is not failing: stop and report."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the full Vitest output."
      - id: SF-006-S03
        title: Implement the sanitiser and produce the three committed fixtures
        purpose: "Turn one raw human capture into three reviewable, privacy-safe fixtures, deterministically and repeatably."
        tdd_phase: green
        depends_on_steps: [SF-006-S02]
        files_to_touch:
          - path: scripts/sanitise-fixture.mjs
            change: create
            detail: >-
              A Node ESM script taking an input path and an output path as positional arguments. It
              reads the input as text and applies these transformations in order:
              removes every script tag and its contents; removes every attribute whose name begins
              with "on"; rewrites every http or https URL so its host becomes example.invalid and its
              query string is dropped; replaces every @handle occurrence with a synthetic handle of the
              form @account01, @account02 and so on, numbered by first appearance and applied
              consistently throughout the document; replaces every post text node inside a post-text
              element with a synthetic sentence of the form "Synthetic post body NN."; replaces every
              display name text node with "Account NN" matching the same numbering; trims the document
              to the first ten post-article elements. It writes the result to the output path and
              prints a summary line giving the post count and the output byte size. It exits 1 with a
              descriptive message if the input contains no post-article element after parsing.
          - path: tests/fixtures/dom/x/timeline-baseline.html
            change: create
            detail: "The sanitised output of scripts/sanitise-fixture.mjs run against the raw capture. At least three post-article elements. This is the fixture the SF-003 harness page serves and the SF-007 adapter tests parse."
          - path: tests/fixtures/dom/x/timeline-high-frequency.html
            change: create
            detail: "A copy of timeline-baseline.html in which every post-article element is attributed to the single synthetic handle @account01, providing the Layer 1 high-frequency case for SF-008. Produced by a documented sed-free Node one-liner, not by hand-editing markup."
          - path: tests/fixtures/dom/x/timeline-broken-selectors.html
            change: create
            detail: "A copy of timeline-baseline.html with the timeline-container element's identifying attribute removed and nothing else changed, providing the deterministic self-test failure case for SF-010."
          - path: tests/fixtures/posts/posts-baseline.json
            change: create
            detail: >-
              A JSON array with one object per post element in timeline-baseline.html, each with the
              keys id, handle, and text, recording the values a correct adapter must extract. These
              values are read out of the sanitised fixture, never invented.
          - path: .gitignore
            change: modify
            detail: "Append the line tests/fixtures/dom/x/raw/ so the unsanitised human capture is never committed."
        instructions:
          - "Create scripts/sanitise-fixture.mjs implementing exactly the transformations described above."
          - "Run `node scripts/sanitise-fixture.mjs tests/fixtures/dom/x/raw/timeline-raw.html tests/fixtures/dom/x/timeline-baseline.html` and record the printed post count and byte size."
          - "Derive timeline-high-frequency.html from the baseline by rewriting every handle to @account01."
          - "Derive timeline-broken-selectors.html from the baseline by removing the timeline-container identifying attribute and changing nothing else."
          - "Read the id, handle, and text of each post out of the sanitised baseline and write them to tests/fixtures/posts/posts-baseline.json."
          - "Append tests/fixtures/dom/x/raw/ to .gitignore."
          - "Run `npm run test:unit -- tests/unit/fixtures/dom.test.ts` and confirm every test passes."
        constraints:
          - "The raw capture directory must never be committed. Verify with `git check-ignore tests/fixtures/dom/x/raw/timeline-raw.html`."
          - "posts-baseline.json values must be read out of the sanitised fixture. Do not type them from the raw capture and do not invent them."
          - "Do not hand-edit the sanitised markup to make a test pass. Fix the sanitiser instead."
        test_specification:
          test_type: unit
          test_file: tests/unit/fixtures/dom.test.ts
          test_name: "golden fixtures > posts-baseline.json matches the baseline fixture post count"
          arrange: "The three sanitised fixtures and posts-baseline.json committed under tests/fixtures/."
          act: "Vitest runs the six fixture-shape tests."
          assert:
            - "6 tests pass, 0 fail"
            - "git check-ignore reports the raw capture path as ignored"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/fixtures/dom.test.ts"
            expected_result: "Exit code 0, 6 passed, 0 failed."
          - command: "git check-ignore -q tests/fixtures/dom/x/raw/timeline-raw.html && echo raw-ignored"
            expected_result: "Prints raw-ignored, exit code 0."
          - command: "find tests/fixtures/dom/x -name '*.html' -size +2000k | grep . && exit 1 || echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, the failing assertion, the sanitiser summary line, and the byte size of each fixture. Never hand-edit a fixture to make a test pass."
    definition_of_done:
      - "Three sanitised fixtures are committed under tests/fixtures/dom/x/ and each is under 2MB"
      - "No committed fixture contains a script tag, an inline event handler, or a host other than example.invalid"
      - "tests/fixtures/posts/posts-baseline.json records id, handle, and text for every baseline post"
      - "The broken fixture deterministically fails the timeline-container selector while the baseline passes"
      - "The raw human capture directory is gitignored and was never committed"
      - "scripts/sanitise-fixture.mjs reproduces the baseline fixture from the raw capture deterministically"
      - "npm run test:unit passes with 6 new tests and 0 failures"
    e2e_validation:
      required: true
      applicability: not_applicable_pending_human_approval
      rationale_if_not_applicable: >-
        This ticket commits static test data and a build-time sanitisation script. It changes no
        extension code, so nothing about it is observable in a browser. The fixtures are exercised in a
        browser indirectly from SF-014 onward, because the SF-003 harness page serves
        timeline-baseline.html to every E2E spec.
  - id: SF-007
    title: Implement the X Home timeline adapter against golden DOM fixtures
    type: feature
    priority: P0
    status: planned
    description: >-
      Implement src/adapters/x/adapter.ts satisfying the PlatformAdapter contract: locate the timeline
      container, enumerate post elements, and extract a normalized Post from a post element. Add the
      field-level selector entries to selectors.json, derived only from the captured fixtures produced
      by SF-006.
    reason: >-
      PRD section 5 designates the adapter as the only platform-specific code. Everything downstream,
      the scoring pipeline, every signal layer, and the collapse UI, consumes the normalized Post this
      ticket produces. Building it fixture-first means parsing is validated without touching the live
      site, per the PRD golden-snapshot requirement.
    user_value: "Technical: real posts from real captured markup become normalized Post objects the rest of the system can score."
    depends_on: [SF-004, SF-005, SF-006]
    blocks: [SF-010, SF-014]
    estimated_complexity: L
    risk_level: high
    risks:
      - risk: "Field selectors are written from memory of X markup rather than read from a captured fixture, producing an adapter that parses nothing on the real site."
        mitigation: "SF-006 runs first and commits the fixtures. Every selector added here must be justified by a grep against tests/fixtures/dom/x/timeline-baseline.html; a selector matching nothing in the fixture must not be added."
      - risk: "extractPost throws on a malformed post element, breaking the whole batch and violating fail-open."
        mitigation: "extractPost is declared to return Post | null and every field read is guarded. A unit test feeds it an empty article element and asserts null rather than a thrown error."
      - risk: "Engagement counts are parsed as raw strings such as 1.2K and become NaN, silently poisoning Layer 1 scoring."
        mitigation: "A dedicated parseCompactCount helper with its own tests covers plain digits, comma groups, K and M suffixes, and unparseable input, which returns null rather than NaN."
    constraints:
      - "Every new selector must be added to selectors.json with a description and a required flag, and contractVersion must be incremented to 1.1.0."
      - "No selector may be added that does not match at least one element in tests/fixtures/dom/x/timeline-baseline.html."
      - "extractPost must never throw. Every failure path returns null."
      - "The adapter must not import from src/core/scoring/ or src/content/. It produces data only."
      - "Author posting-frequency inputs are out of scope here and are gated on HD-004."
    prerequisites:
      - "SF-004, SF-005, and SF-006 complete."
      - "tests/fixtures/dom/x/timeline-baseline.html is committed and contains at least three distinct posts."
    acceptance_criteria:
      - id: SF-007-AC1
        statement: "Parsing tests/fixtures/dom/x/timeline-baseline.html yields exactly the post count recorded in tests/fixtures/posts/posts-baseline.json."
        verification: "Run `npm run test:unit -- tests/unit/adapters/x/adapter.test.ts`; expect the count assertion to pass."
      - id: SF-007-AC2
        statement: "Every extracted Post satisfies isPost."
        verification: "The test 'every extracted post satisfies isPost' iterates the parsed posts and asserts isPost is true for each; expect it to pass."
      - id: SF-007-AC3
        statement: "Extracted id, author.handle, and text for each post equal the values recorded in tests/fixtures/posts/posts-baseline.json."
        verification: "The test 'extracts the recorded id, handle, and text for every baseline post' deep-equals the projected fields against the fixture; expect it to pass."
      - id: SF-007-AC4
        statement: "extractPost returns null for an article element with no recognisable post content, and does not throw."
        verification: "The test 'returns null for an unparseable article instead of throwing' passes an empty article element and asserts the result is null."
      - id: SF-007-AC5
        statement: "parseCompactCount returns 1200 for '1.2K', 3400000 for '3.4M', 1234 for '1,234', 0 for '0', and null for 'abc' and for the empty string."
        verification: "Run `npm run test:unit -- tests/unit/adapters/x/adapter.test.ts`; expect all six count cases to pass."
      - id: SF-007-AC6
        statement: "Every selector string in selectors.json matches at least one element in the baseline fixture."
        verification: "The test 'every declared selector matches the baseline fixture' loads the fixture into jsdom and asserts querySelector returns non-null for at least one fallback of every entry."
    steps:
      - id: SF-007-S01
        title: Write the failing fixture-driven adapter test
        purpose: "Pin the parsing contract to committed real markup before implementation exists, so the implementation cannot define its own notion of correct."
        tdd_phase: red
        depends_on_steps: []
        files_to_touch:
          - path: tests/unit/adapters/x/adapter.test.ts
            change: create
            detail: >-
              Reads tests/fixtures/dom/x/timeline-baseline.html with node:fs and parses it by assigning
              to document.documentElement.innerHTML in the jsdom project environment. Imports
              xAdapter and parseCompactCount from '@/adapters/x/adapter', isPost from '@/core/post',
              selectorContract and resolveSelector from '@/adapters/x/selectors', and the expected
              posts from tests/fixtures/posts/posts-baseline.json.
              Describe block "x adapter" with these tests:
