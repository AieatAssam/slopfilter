            - "Every original post element is still present in the DOM, proving nothing was removed"
        - id: SF-014-E2E-NEGATIVE-01
          title: A post from an ordinary account is never collapsed, and a paused extension collapses nothing
          priority: high
          applicability: applicable
          rationale_if_not_applicable: null
          given: "The harness is loaded at the baseline fixture, then at ?fixture=broken"
          when: "A run-unique post from a low-frequency author is appended in the first case, and the self-test fails in the second"
          then:
            - "The run-unique post remains visible with no placeholder associated with it, proving the filter does not fire below the threshold"
            - "On the broken fixture the placeholder count is 0, proving a paused extension hides nothing"
            - "In both cases every post element remains in the DOM with no inline display of none, proving no post was hidden without a placeholder to explain it"
      execution:
        command: "npm run build:test && npm run test:e2e -- e2e/specs/filtering.spec.ts"
        expected_result: "2 passed, 0 failed"
        retries: 1
        artifacts_on_failure:
