        - Test is isolated and parallel-safe
        - Test creates unique data and performs cleanup
        - Test has no fixed delays, sleeps, or arbitrary waits
        - Browser-visible user result and persisted final state are verified
        - Failure artefacts are configured and available

  - id: SF-010
    title: Add the in-extension selector self-test, the paused badge, and the popup explanation
    type: feature
    priority: P0
    status: planned
    description: >-
      Implement src/adapters/x/selftest.ts, wire it into the adapter's selfTest method, and have the
      service worker set a visible paused badge when any required selector fails to resolve. The popup
      explains the paused state in plain language. Filtering is disabled while paused: the feed is
      shown unfiltered rather than partially or wrongly filtered.
    reason: >-
      PRD section 5 makes this a hard requirement: on load the adapter validates all required
      selectors and, on failure, shows a non-blocking badge state and disables filtering "rather than
      silently failing or hiding everything". It is the mechanism that makes silent breakage
      impossible, which PRD section 9 names as the primary mitigation for DOM churn.
    user_value: "When X changes its markup, the user is told the extension is paused instead of quietly getting a broken or over-filtered feed."
    depends_on: [SF-005, SF-006, SF-009]
    blocks: [SF-014]
    estimated_complexity: M
    risk_level: medium
    risks:
      - risk: "The self-test passes on a page that has not finished rendering, so the extension proceeds against a partially built DOM and reports a false failure or a false pass."
        mitigation: "The self-test is invoked from the content script at document_idle and again on the first observer batch; a failure is only latched after both checks fail, and the check is a pure function of the passed root so it can be unit-tested against both fixtures."
      - risk: "The paused state hides posts anyway, which is the exact failure mode the PRD forbids."
        mitigation: "A unit test asserts that runSelfTest returning ok false causes the content-script entry to skip collapse entirely, and the E2E negative case asserts no placeholder exists on the broken fixture."
      - risk: "Badge text is set from the content script, which cannot call chrome.action."
        mitigation: "The content script sends a selftest-result message, already declared in the SF-004 message union, and the service worker owns every chrome.action call."
    constraints:
      - "Only required entries cause a failure. An optional entry that fails to resolve is recorded but does not pause the extension."
      - "The paused badge text must be a short non-alarming marker and the badge title must state that platform markup changed. No badge string may blame the user or claim AI detection."
      - "While paused, no post may be collapsed. Fail open, always."
      - "src/adapters/x/selftest.ts must be a pure function of its root argument, with no chrome API use, so it is testable against both golden fixtures."
      - "The manifest is not modified by this ticket; the action and default_popup keys already exist from SF-001."
    prerequisites:
      - "SF-005, SF-006, and SF-009 complete."
      - "HD-001 answered, because the popup heading uses the product name."
      - "HD-014 answered, because it determines whether the popup is plain TypeScript or a framework component."
    acceptance_criteria:
      - id: SF-010-AC1
        statement: "runSelfTest returns ok true with an empty failedSelectorIds array for tests/fixtures/dom/x/timeline-baseline.html."
        verification: "Run `npm run test:unit -- tests/unit/adapters/x/selftest.test.ts`; expect the baseline test to pass."
      - id: SF-010-AC2
        statement: "runSelfTest returns ok false and failedSelectorIds containing exactly 'timeline-container' for tests/fixtures/dom/x/timeline-broken-selectors.html."
        verification: "The test 'fails with the timeline-container id on the broken fixture' asserts the exact array contents."
      - id: SF-010-AC3
        statement: "An optional entry failing to resolve does not set ok to false."
        verification: "The test 'an optional selector failure does not pause the extension' builds a document missing only an optional element and asserts ok is true."
      - id: SF-010-AC4
        statement: "The service worker sets badge text and a badge title when it receives a selftest-result message with ok false, and clears both when ok is true."
        verification: "Run `npm run test:unit -- tests/unit/background/service-worker.test.ts` with chrome.action stubbed via vi.stubGlobal; expect both assertions to pass."
      - id: SF-010-AC5
        statement: "The E2E spec confirms that on the broken fixture the badge-paused state is reported and no placeholder is rendered."
        verification: "Run `npm run build:test && npm run test:e2e -- e2e/specs/selftest-pause.spec.ts`; expect 2 passed, 0 failed."
    steps:
      - id: SF-010-S01
        title: Write the failing self-test and service-worker tests
        purpose: "Pin pass, fail, and optional-failure behaviour against both committed fixtures before implementing."
        tdd_phase: red
        depends_on_steps: []
        files_to_touch:
          - path: tests/unit/adapters/x/selftest.test.ts
            change: create
            detail: >-
              Reads both fixtures with node:fs and loads each into the jsdom document. Imports
              runSelfTest from '@/adapters/x/selftest'. Describe block "runSelfTest" with tests:
              "passes on the baseline fixture" asserting ok is true and failedSelectorIds has length 0;
              "fails with the timeline-container id on the broken fixture" asserting ok is false and
              failedSelectorIds toEqual ['timeline-container'];
              "an optional selector failure does not pause the extension", building a document from the
              baseline with an optional element removed and asserting ok is true and the optional id
              appears in a separate optionalFailures array.
          - path: tests/unit/background/service-worker.test.ts
            change: create
            detail: >-
              Imports handleMessage from '@/background/service-worker'. Uses vi.stubGlobal('chrome',
              {action: {setBadgeText: vi.fn(), setTitle: vi.fn(), setBadgeBackgroundColor: vi.fn()}}).
              Describe block "handleMessage" with tests:
              "sets a paused badge when a selftest-result reports failure", asserting setBadgeText was
              called with an object whose text is non-empty and setTitle was called with a title
              containing 'markup changed';
              "clears the badge when a selftest-result reports success", asserting setBadgeText was
              called with an object whose text is the empty string;
              "ignores a message that is not an ExtensionMessage", asserting no chrome.action method
              was called.
        instructions:
          - "Create tests/unit/adapters/x/selftest.test.ts with exactly the three tests described above."
          - "Create tests/unit/background/service-worker.test.ts with exactly the three tests described above."
          - "Run `npm run test:unit -- tests/unit/adapters/x/selftest.test.ts tests/unit/background/service-worker.test.ts` and record the failure."
        constraints:
          - "Do not create src/adapters/x/selftest.ts or modify src/background/service-worker.ts in this step."
          - "Stub chrome with vi.stubGlobal. Do not install a chrome mocking dependency."
        test_specification:
          test_type: unit
          test_file: tests/unit/adapters/x/selftest.test.ts
          test_name: "runSelfTest > fails with the timeline-container id on the broken fixture"
          arrange: "tests/fixtures/dom/x/timeline-broken-selectors.html loaded into the jsdom document."
          act: "Call runSelfTest(document)."
          assert:
            - "ok is false"
            - "failedSelectorIds toEqual ['timeline-container']"
            - "The baseline fixture yields ok true and an empty failedSelectorIds"
            - "An optional-only failure yields ok true with the id recorded in optionalFailures"
            - "handleMessage sets a non-empty badge text on failure and an empty badge text on success"
          expected_red_failure: "Both files fail at import time with module-not-found or missing-export errors, because @/adapters/x/selftest does not exist and src/background/service-worker.ts exports no handleMessage."
        validation:
          - command: "npm run test:unit -- tests/unit/adapters/x/selftest.test.ts tests/unit/background/service-worker.test.ts; test $? -ne 0 && echo red-confirmed"
            expected_result: "Prints red-confirmed. A zero exit code means the tests are not failing: stop and report."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the full Vitest output."
      - id: SF-010-S02
        title: Implement runSelfTest and wire it into the adapter
        purpose: "Give the extension a deterministic way to know its own selectors are still valid before it filters anything."
        tdd_phase: green
        depends_on_steps: [SF-010-S01]
        files_to_touch:
          - path: src/adapters/x/selftest.ts
            change: create
            detail: >-
              Imports selectorContract, resolveSelector, and type SelectorEntry from './selectors'.
              Export interface SelfTestResult {ok: boolean; failedSelectorIds: readonly string[];
              optionalFailures: readonly string[]; contractVersion: string}.
              Export function runSelfTest(root: ParentNode): SelfTestResult. It iterates
              selectorContract.entries, calls resolveSelector for each, collects the ids of entries
              that resolved to null, splits them by the required flag, sets ok to true only when the
              required-failure list is empty, and returns the contract version alongside. It performs
              no I/O and touches no chrome API.
          - path: src/adapters/x/adapter.ts
            change: modify
            detail: "Replace the placeholder selfTest implementation from SF-007 with a delegation to runSelfTest, mapping SelfTestResult to the SelectorCheckResult shape declared in src/adapters/types.ts."
        instructions:
          - "Create src/adapters/x/selftest.ts implementing exactly the behaviour described above."
          - "Modify src/adapters/x/adapter.ts so selfTest delegates to runSelfTest."
          - "Run `npm run test:unit -- tests/unit/adapters` and confirm every test passes."
        constraints:
          - "runSelfTest must not reference chrome, window, or document as globals. It reads only the root argument it is given."
          - "Only required-entry failures may set ok to false."
        test_specification:
          test_type: unit
          test_file: tests/unit/adapters/x/selftest.test.ts
          test_name: "runSelfTest > an optional selector failure does not pause the extension"
          arrange: "A document built from the baseline fixture with one optional element removed."
          act: "Call runSelfTest(document)."
          assert:
            - "ok is true"
            - "The removed entry's id appears in optionalFailures"
            - "failedSelectorIds is empty"
            - "All tests under tests/unit/adapters pass, 0 failed"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/adapters"
            expected_result: "Exit code 0, all tests passed, 0 failed."
          - command: "npm run lint && npm run typecheck && echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, the failing assertion, and the full failedSelectorIds and optionalFailures arrays returned."
      - id: SF-010-S03
        title: Implement the badge handler in the service worker and the popup explanation
        purpose: "Make the paused state visible to the user in the one place only the service worker can write to."
        tdd_phase: green
        depends_on_steps: [SF-010-S02]
        files_to_touch:
          - path: src/background/service-worker.ts
            change: modify
            detail: >-
              Keep the chrome.runtime.onInstalled registration added in SF-001. Add and export
              function handleMessage(message: unknown): void, which returns immediately unless
              isExtensionMessage(message) is true and message.type is 'selftest-result'. When ok is
              false it calls chrome.action.setBadgeText with text '!' and
              chrome.action.setTitle with a title of the exact form
              "<PRODUCT NAME> is paused: the platform markup changed, so filtering is off." using the
              HD-001 product name. When ok is true it calls setBadgeText with the empty string and
              setTitle with the plain product name. Register handleMessage with
              chrome.runtime.onMessage.addListener at module scope. Also keep the last result in a
              module-scoped variable and answer a 'get-selftest-state' message with it.
          - path: src/ui/popup/popup.html
            change: modify
            detail: >-
              Replace the SF-001 placeholder with a document containing an h1 whose text is the HD-001
              product name, a paragraph with data-testid slopfilter-popup-status, and a script tag
              referencing popup.js.
          - path: src/ui/popup/popup.ts
            change: modify
            detail: >-
              On DOMContentLoaded, send a 'get-selftest-state' message via chrome.runtime.sendMessage
              and write into the status paragraph either
              "Filtering is on." when ok is true, or
              "Filtering is paused because the platform markup changed. Your feed is unfiltered." plus
              the failing selector ids when ok is false. Text is set with textContent only.
        instructions:
          - "Modify src/background/service-worker.ts to add and register handleMessage exactly as described."
          - "Replace the popup HTML and TypeScript with the content described above."
          - "Run `npm run test:unit -- tests/unit/background/service-worker.test.ts` and confirm 3 passing tests."
          - "Run `npm run build` and confirm dist/ui/popup/popup.html and dist/ui/popup/popup.js both exist."
        constraints:
          - "No popup or badge string may claim AI detection, blame the user, or promise a fix time."
          - "Set popup text with textContent only. Never assign innerHTML."
        test_specification:
          test_type: unit
          test_file: tests/unit/background/service-worker.test.ts
          test_name: "handleMessage > sets a paused badge when a selftest-result reports failure"
          arrange: "chrome stubbed with vi.stubGlobal exposing action.setBadgeText, action.setTitle, and action.setBadgeBackgroundColor as vi.fn()."
          act: "Call handleMessage({type: 'selftest-result', ok: false, failedSelectorIds: ['timeline-container']})."
          assert:
            - "setBadgeText was called with a non-empty text"
            - "setTitle was called with a title containing 'markup changed'"
            - "A success message clears the badge text to the empty string"
            - "A non-ExtensionMessage value triggers no chrome.action call"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/background/service-worker.test.ts"
            expected_result: "Exit code 0, 3 passed, 0 failed."
          - command: "npm run build && test -f dist/ui/popup/popup.html && test -f dist/ui/popup/popup.js && echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, the failing assertion, and the recorded chrome.action call arguments."
      - id: SF-010-S04
        title: Add the paused-state E2E spec
        purpose: "Prove in a real browser that a broken contract pauses filtering and hides nothing, which is the PRD's central safety promise."
        tdd_phase: validation
        depends_on_steps: [SF-010-S03]
        files_to_touch:
          - path: tests/harness/index.html
            change: modify
            detail: "Add a query-parameter switch: when the harness page is loaded with ?fixture=broken it renders tests/fixtures/dom/x/timeline-broken-selectors.html instead of the baseline. The switch is read with URLSearchParams at load time."
          - path: e2e/specs/selftest-pause.spec.ts
            change: create
            detail: "Uses the extension fixture. Two tests matching the two test cases declared in e2e_validation below."
        instructions:
          - "Add the ?fixture=broken switch to tests/harness/index.html."
          - "Create e2e/specs/selftest-pause.spec.ts with exactly the two declared test cases."
          - "Run `npm run build:test && npm run test:e2e -- e2e/specs/selftest-pause.spec.ts` and confirm 2 passing tests."
        constraints:
          - "Read the paused state through the popup page at chrome-extension://<extensionId>/ui/popup/popup.html, not by inspecting badge pixels, because badge text is not queryable from a page."
          - "No waitForTimeout and no sleep."
        test_specification:
          test_type: e2e
          test_file: e2e/specs/selftest-pause.spec.ts
          test_name: "pauses filtering and hides nothing when a required selector is missing"
          arrange: "The harness loaded with ?fixture=broken so the timeline-container attribute is absent."
          act: "Open the extension popup page and read the status paragraph, then inspect the timeline for placeholders."
          assert:
            - "The popup status text contains 'paused'"
            - "No element with data-testid slopfilter-placeholder exists on the timeline"
          expected_red_failure: null
        validation:
          - command: "npm run build:test && npm run test:e2e -- e2e/specs/selftest-pause.spec.ts"
            expected_result: "2 passed, 0 failed. Exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, exact command, exit code, the assertion output, the trace, screenshot, and video paths, the browser console output, and the popup status text actually observed."
    definition_of_done:
      - "runSelfTest passes on the baseline fixture and fails with exactly ['timeline-container'] on the broken fixture"
      - "An optional-entry failure never pauses the extension"
      - "The service worker sets a paused badge and title on failure and clears them on success"
      - "The popup states the paused reason in plain language with no authorship claim"
      - "No post is collapsed while the extension is paused"
      - "npm run test:unit, npm run lint, npm run typecheck, and the paused-state E2E spec all exit 0"
    e2e_validation:
      required: true
      applicability: applicable
      rationale_if_not_applicable: null
      test_file:
        path: e2e/specs/selftest-pause.spec.ts
        change: create
      user_journey:
        name: The extension tells the user it is paused when platform markup changes
        actor:
          role: "Extension user whose feed markup no longer matches the selector contract. The extension has no accounts and no roles."
          authentication:
            method: other
            fixture_or_source: "None. The extension has no authentication."
        preconditions:
          - "dist/ built with npm run build:test"
          - "The harness server is serving http://localhost:5174"
          - "The harness is loaded with ?fixture=broken so the timeline-container identifying attribute is absent"
        business_outcome: "The user is told filtering is off and sees an unfiltered feed, rather than a silently broken or over-filtered one."
      data_lifecycle:
        isolation_key: "Per-worker browser profile under test-results/user-data-<workerIndex>; the fixture variant is chosen per test by query parameter, so no state is shared between tests"
        setup:
          method: fixture
          steps:
            - "The extension fixture creates a per-worker browser profile."
            - "The test navigates to http://localhost:5174/?fixture=broken for the paused case and to http://localhost:5174/ for the healthy case."
        cleanup:
          method: fixture teardown
          steps:
            - "The test calls resetHarness(page) in an afterEach hook."
            - "The context fixture closes the browser context and deletes the per-worker profile directory."
        prohibited:
          - shared manually-created test data
          - reliance on test execution order
          - mutation of production data
      selector_contract:
        required_test_ids:
          - id: slopfilter-popup-status
            element: "The popup paragraph stating whether filtering is on or paused"
            component_file: src/ui/popup/popup.html
            purpose: "The paragraph has no ARIA role and no label; its entire text is the status message being asserted, so there is no stable accessible name to address it by."
        locator_policy:
          allowed_in_order:
            - getByRole with accessible name
            - getByLabel
            - getByTestId
          forbidden:
            - CSS classes
            - XPath
            - positional selectors
            - generated IDs
            - DOM traversal
      browser_steps:
        - id: SF-010-E2E-01
          action: "Navigate to the harness serving the broken fixture"
          route: "http://localhost:5174/?fixture=broken"
          locator: null
          input: null
          wait_for:
            condition: "An element matching article[data-testid=\"tweet\"] is visible, proving posts rendered even though the container attribute is missing"
            timeout_ms: 5000
          assertions:
            - "At least one post article is visible"
        - id: SF-010-E2E-02
          action: "Open the extension popup page in a new tab"
          route: "chrome-extension://<extensionId>/ui/popup/popup.html"
          locator: null
          input: null
          wait_for:
            condition: "getByTestId('slopfilter-popup-status') has non-empty text"
            timeout_ms: 5000
          assertions:
            - "getByTestId('slopfilter-popup-status') has text containing 'paused'"
            - "getByTestId('slopfilter-popup-status') has text containing 'unfiltered'"
        - id: SF-010-E2E-03
          action: "Return to the harness tab and inspect the timeline for collapsed placeholders"
          route: "http://localhost:5174/?fixture=broken"
          locator: "getByTestId('slopfilter-placeholder')"
          input: null
          wait_for:
            condition: "The post articles are visible, which is the settled state after document_idle"
            timeout_ms: 5000
          assertions:
            - "getByTestId('slopfilter-placeholder') has count 0"
      test_cases:
        - id: SF-010-E2E-HAPPY-01
          title: A healthy timeline reports filtering on and no pause
          priority: critical
          given: "The harness is loaded at http://localhost:5174/ with the baseline fixture and the extension present"
          when: "The user opens the extension popup"
          then:
            - "The popup status text contains 'Filtering is on.'"
            - "The popup status text does not contain 'paused'"
        - id: SF-010-E2E-NEGATIVE-01
          title: A broken selector contract pauses filtering and collapses nothing
          priority: high
          applicability: applicable
          rationale_if_not_applicable: null
          given: "The harness is loaded at http://localhost:5174/?fixture=broken so the timeline-container identifying attribute is absent"
          when: "The extension runs its self-test at document_idle and the user opens the popup"
          then:
            - "The popup status text contains 'paused' and 'unfiltered'"
            - "The count of elements with data-testid slopfilter-placeholder is 0, proving nothing was hidden"
            - "The post articles are still visible, proving the feed degraded to unfiltered rather than to empty"
      execution:
        command: "npm run build:test && npm run test:e2e -- e2e/specs/selftest-pause.spec.ts"
        expected_result: "2 passed, 0 failed"
        retries: 1
        artifacts_on_failure:
          - screenshot
          - trace
          - video
          - browser-console-output
          - failed-network-requests
      e2e_definition_of_done:
        - Happy path passes in the required browser
        - Relevant negative path passes, or is explicitly approved as not applicable
        - Test is isolated and parallel-safe
        - Test creates unique data and performs cleanup
        - Test has no fixed delays, sleeps, or arbitrary waits
        - Browser-visible user result and persisted final state are verified
        - Failure artefacts are configured and available

  - id: SF-011
    title: Add the CI workflow running lint, typecheck, unit tests, build, audit, and E2E
    type: infrastructure
    priority: P1
    status: planned
    description: >-
      Create .github/workflows/ci.yml running on push and pull_request. It installs with npm ci,
      then runs lint, typecheck, unit tests, production build, the localhost-leak check, npm audit,
      and the full Playwright suite under xvfb-run, uploading Playwright artefacts when a job fails.
    reason: >-
      Every quality gate in this plan is only real if something enforces it on every change. The E2E
      suite additionally requires a display, which the workflow must supply, and that requirement is
      invisible until it is written down here.
    user_value: "Technical: the quality gates become enforced rather than aspirational."
    depends_on: [SF-003, SF-009]
    blocks: [SF-012]
    estimated_complexity: M
    risk_level: medium
    risks:
      - risk: "The E2E job fails on the runner because headless is false and no display exists, and an agent 'fixes' it by switching to headless, which silently disables the extension and makes every E2E test pass vacuously."
        mitigation: "The E2E step is invoked through xvfb-run and a constraint here and in SF-003 forbids switching to headless. The SF-003 fixture also throws when no extension service worker is found, so a vacuous pass is impossible."
      - risk: "The workflow is written against a GitHub repository that does not exist, so it is never executed and rots."
        mitigation: "The ticket is blocked on HD-003. If HD-003 selects the defer option, the workflow is still committed but the definition of done is limited to yamllint-level validity plus a documented local reproduction of every step."
      - risk: "Playwright browser downloads are re-fetched on every run, making CI slow and flaky."
        mitigation: "The workflow caches ~/.cache/ms-playwright keyed on the @playwright/test version resolved from package-lock.json."
    constraints:
      - "The workflow must invoke only npm scripts that exist in package.json. Do not inline a raw binary invocation."
      - "The E2E job must run under xvfb-run. Do not set headless true anywhere to make CI pass."
      - "No secret may be referenced by this workflow. It runs entirely on public inputs."
      - "Node version in the workflow must be 24, matching the host toolchain recorded in meta."
    prerequisites:
      - "SF-003 and SF-009 complete."
      - "HD-003 answered: the GitHub repository exists, or the defer option is selected."
    acceptance_criteria:
      - id: SF-011-AC1
        statement: ".github/workflows/ci.yml parses as valid YAML and declares the on triggers push and pull_request."
        verification: "Run `python3 -c \"import yaml,sys;d=yaml.safe_load(open('.github/workflows/ci.yml'));t=d[True] if True in d else d['on'];assert 'push' in t and 'pull_request' in t;print('ok')\"`; expect ok."
      - id: SF-011-AC2
        statement: "Every run step in the workflow invokes a script key that exists in package.json, or is one of npm ci, npx playwright install chromium, or an xvfb-run wrapper around such a script."
        verification: "Manually cross-check each run line against package.json scripts, then run each locally in order and confirm every one exits 0."
      - id: SF-011-AC3
        statement: "The full gate sequence passes locally in the same order the workflow runs it."
        verification: "Run `npm ci && npm run lint && npm run typecheck && npm run test:unit && npm run build && npm audit --audit-level=high && npm run build:test && npm run test:e2e`; expect every command to exit 0."
      - id: SF-011-AC4
        statement: "The workflow uploads playwright-report and test-results as artefacts when the E2E step fails."
        verification: "Confirm the upload step uses if failure() and names both paths."
    steps:
      - id: SF-011-S01
        title: Verify the full gate sequence passes locally before writing the workflow
        purpose: "Never encode a pipeline that has not been observed to pass; a red workflow on first push is indistinguishable from a broken workflow."
        tdd_phase: validation
        depends_on_steps: []
        files_to_touch: []
        instructions:
          - "Run each command of the AC3 sequence in order, recording the exit code of each."
          - "If any command fails, stop and report which one; do not write the workflow around a failing gate."
        constraints:
          - "Do not modify source to make a gate pass in this step. A failure here belongs to the ticket that owns the failing file."
        test_specification:
          test_type: none
          test_file: null
          test_name: null
          arrange: "A clean checkout with node_modules removed."
          act: "Run the full gate sequence in workflow order."
          assert:
            - "Every command exits 0"
          expected_red_failure: null
        validation:
          - command: "rm -rf node_modules && npm ci && npm run lint && npm run typecheck && npm run test:unit && npm run build && npm audit --audit-level=high && npm run build:test && npm run test:e2e && echo full-gate-green"
            expected_result: "Prints full-gate-green, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, the first failing command, its exit code, and its full output."
      - id: SF-011-S02
        title: Write the CI workflow
        purpose: "Encode the observed-green sequence so it runs on every change."
        tdd_phase: setup
        depends_on_steps: [SF-011-S01]
        files_to_touch:
          - path: .github/workflows/ci.yml
            change: create
            detail: >-
              name "CI"; on push and pull_request; concurrency grouped by workflow and ref with
              cancel-in-progress true; permissions contents read only.
              One job "gate" on ubuntu-latest with these steps in order:
              actions/checkout; actions/setup-node with node-version 24 and cache npm;
              run npm ci;
              run npm run lint;
              run npm run typecheck;
              run npm run test:unit;
              run npm run build;
              run the GV-08 localhost-leak node one-liner;
              run npm audit --audit-level=high;
              actions/cache for ~/.cache/ms-playwright keyed on the runner OS and the
              @playwright/test version read from package-lock.json;
              run npx playwright install --with-deps chromium;
              run npm run build:test;
              run xvfb-run --auto-servernum npm run test:e2e;
              actions/upload-artifact with if failure() uploading playwright-report/ and
              test-results/ with a 7 day retention.
        instructions:
          - "Create .github/workflows/ci.yml with exactly the steps listed above, in that order."
          - "Confirm every run line maps to a package.json script or to one of the three allowed non-script commands."
          - "Validate the file parses as YAML."
        constraints:
          - "Do not add a deployment, publish, or release step. Publishing is a non-goal of this plan."
          - "Do not reference any secret."
          - "The E2E step must be wrapped in xvfb-run --auto-servernum."
        test_specification:
          test_type: none
          test_file: null
          test_name: null
          arrange: "The full gate sequence has been observed green locally."
          act: "Write the workflow file and validate its YAML."
          assert:
            - "The file parses as YAML"
            - "The E2E run line begins with xvfb-run"
            - "No step references secrets"
          expected_red_failure: null
        validation:
          - command: "python3 -c \"import yaml;d=yaml.safe_load(open('.github/workflows/ci.yml'));s=d['jobs']['gate']['steps'];runs=[x.get('run','') for x in s];assert any(r.startswith('xvfb-run') for r in runs),'e2e must run under xvfb-run';assert not any('secrets.' in r for r in runs),'no secrets allowed';print('ok')\""
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the YAML parse or assertion error."
    definition_of_done:
      - ".github/workflows/ci.yml exists, parses as YAML, and triggers on push and pull_request"
      - "Every run step invokes an existing npm script, npm ci, a playwright install, or an xvfb-run wrapper"
      - "The E2E step runs under xvfb-run and headless is not enabled anywhere"
      - "Playwright artefacts upload on failure with a 7 day retention"
      - "The identical sequence was observed passing locally before the workflow was written"
      - "No secret is referenced"
    e2e_validation:
      required: true
      applicability: not_applicable_pending_human_approval
      rationale_if_not_applicable: >-
        This ticket adds a CI configuration file. It ships no code into the extension and changes
        nothing a user can observe in a browser. Its own correctness is established by running the
        identical command sequence locally in SF-011-S01, which is a stronger check than any browser
        assertion could provide here.

  - id: SF-012
    title: Add the scheduled DOM drift monitor that files an issue when the selector contract breaks
    type: infrastructure
    priority: P1
    status: planned
    description: >-
      Create scripts/check-drift.mjs, which loads the drift-monitor target with Playwright, asserts
      every required entry in src/adapters/x/selectors.json resolves, and writes a machine-readable
      report plus a DOM diff on failure. Create .github/workflows/drift-monitor.yml, a daily scheduled
      workflow that runs it and opens a repository issue when it fails.
    reason: >-
      PRD section 5 names this a hard requirement and PRD section 9 names it the primary mitigation for
      X obfuscating its markup, with a mean-time-to-detection target under 24 hours in PRD section 10.
      It is the only part of the system that touches the live site.
    user_value: "Markup breakage is discovered by the maintainer within a day, rather than by users noticing the extension stopped working."
    depends_on: [SF-005, SF-006, SF-011]
    blocks: []
    estimated_complexity: L
    risk_level: high
    risks:
      - risk: "The monitor target is unreachable because X does not serve a timeline to logged-out visitors, so the job fails every day for a reason unrelated to drift and is quickly ignored."
        mitigation: "The ticket is blocked on HD-006. The script distinguishes a target-unreachable outcome from a selector-failure outcome and uses a distinct exit code and issue title for each, so a broken target never masquerades as drift."
      - risk: "A transient network failure files a spurious issue every day, training the maintainer to ignore the alert."
        mitigation: "The script retries the navigation once, and the workflow deduplicates by searching for an existing open issue with the same title before creating a new one."
      - risk: "The monitor is treated as a merge gate and blocks unrelated work when X changes."
        mitigation: "It is a separate workflow with no pull_request trigger, and PRD section 6 states the drift monitor only alerts. A constraint here forbids adding it to any required check."
    constraints:
      - "scripts/check-drift.mjs must read src/adapters/x/selectors.json directly with node:fs, with no build step and no TypeScript import, so the monitor cannot be broken by a build regression."
      - "The workflow must have no pull_request trigger and must never be configured as a required status check."
      - "Exit code 0 means all required selectors resolved. Exit code 2 means at least one required selector failed. Exit code 3 means the target was unreachable. No other non-zero exit code may be used for a normal outcome."
      - "The monitor must not log in, must not post, must not click, and must not send any request other than loading the target page."
      - "Any credential or storage state introduced by the HD-006 answer must come from a GitHub Actions secret and must never be written to the repository or to a log."
    prerequisites:
      - "SF-005, SF-006, and SF-011 complete."
      - "HD-003 answered: the repository the issue is filed against is known."
      - "HD-006 answered: the drift-monitor target URL, and any credential mechanism it requires, are fixed."
    acceptance_criteria:
      - id: SF-012-AC1
        statement: "Run against tests/fixtures/dom/x/timeline-baseline.html as a file target, the script exits 0 and reports zero failed selectors."
        verification: "Run `node scripts/check-drift.mjs --target file://$PWD/tests/fixtures/dom/x/timeline-baseline.html`; expect exit code 0."
      - id: SF-012-AC2
        statement: "Run against tests/fixtures/dom/x/timeline-broken-selectors.html, the script exits 2 and its report names timeline-container."
        verification: "Run `node scripts/check-drift.mjs --target file://$PWD/tests/fixtures/dom/x/timeline-broken-selectors.html`; expect exit code 2 and the report to list timeline-container."
      - id: SF-012-AC3
        statement: "Run against an unreachable target, the script exits 3, not 2, so a dead target is never reported as drift."
        verification: "Run `node scripts/check-drift.mjs --target http://127.0.0.1:1/nothing`; expect exit code 3."
      - id: SF-012-AC4
        statement: "The workflow declares a daily schedule and a workflow_dispatch trigger, and declares no pull_request trigger."
        verification: "Parse .github/workflows/drift-monitor.yml and assert the trigger keys are exactly schedule and workflow_dispatch."
      - id: SF-012-AC5
        statement: "The drift monitor demonstrably fires when a selector is deliberately broken, per the PRD Phase 0 exit criterion."
        verification: "Step SF-012-S03 runs the script against the broken fixture and records exit code 2 and the failing selector id, which is the deliberate-break demonstration."
    steps:
      - id: SF-012-S01
        title: Implement scripts/check-drift.mjs with distinct outcomes for drift and for an unreachable target
        purpose: "Make the monitor able to tell 'the markup changed' apart from 'the page did not load', because conflating them destroys the alert's value."
        tdd_phase: setup
        depends_on_steps: []
        files_to_touch:
          - path: scripts/check-drift.mjs
            change: create
            detail: >-
              A Node ESM script accepting --target <url> and an optional --out <path>.
              It reads src/adapters/x/selectors.json with node:fs and JSON.parse.
              It launches chromium via @playwright/test's chromium export, opens a page, and navigates
              to the target with a 30000ms timeout, retrying once on navigation failure. If both
              attempts fail it writes a report with status "unreachable" and exits 3.
              On success it evaluates, in the page, each entry's ordered selector list and records the
              first that returns a node, or null. Entries with required true and no match are collected
              as failures.
              It writes a JSON report to the --out path, defaulting to
              drift-report.json, containing contractVersion, target, timestamp, status, and a per-entry
              record of id, required, matchedSelector, and ok. When there is at least one required
              failure it additionally captures document.documentElement.outerHTML trimmed to 200000
              characters into drift-dom.html for diffing, prints a summary naming every failed id, and
              exits 2. Otherwise it prints a one-line success summary and exits 0.
              It never logs the target's cookies, storage, or any header.
        instructions:
          - "Create scripts/check-drift.mjs implementing exactly the behaviour and exit codes described above."
          - "Run it against the baseline fixture as a file:// target and confirm exit code 0."
          - "Run it against the broken fixture and confirm exit code 2 with timeline-container reported."
          - "Run it against http://127.0.0.1:1/nothing and confirm exit code 3."
        constraints:
          - "Read selectors.json with node:fs. Do not import the TypeScript module, which would make the monitor depend on a working build."
          - "Never print or persist cookies, storage state, headers, or any credential."
          - "Do not use exit code 1 for a normal outcome; reserve it for an unexpected crash."
        test_specification:
          test_type: integration
          test_file: null
          test_name: null
          arrange: "The two committed fixtures and an unroutable localhost port serve as the three targets."
          act: "Invoke scripts/check-drift.mjs once per target."
          assert:
            - "Baseline fixture gives exit code 0"
            - "Broken fixture gives exit code 2 and the report lists timeline-container"
            - "Unreachable target gives exit code 3"
            - "drift-report.json is written in all three cases"
          expected_red_failure: null
        validation:
          - command: "node scripts/check-drift.mjs --target file://$PWD/tests/fixtures/dom/x/timeline-baseline.html; test $? -eq 0 && echo baseline-ok"
            expected_result: "Prints baseline-ok."
          - command: "node scripts/check-drift.mjs --target file://$PWD/tests/fixtures/dom/x/timeline-broken-selectors.html; test $? -eq 2 && echo drift-detected"
            expected_result: "Prints drift-detected. Any other exit code means the monitor cannot distinguish drift: stop and report."
          - command: "node scripts/check-drift.mjs --target http://127.0.0.1:1/nothing; test $? -eq 3 && echo unreachable-distinguished"
            expected_result: "Prints unreachable-distinguished. Exit code 2 here would mean a dead target is reported as drift: stop and report."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, each command, its exit code, and the contents of drift-report.json for each run."
      - id: SF-012-S02
        title: Write the scheduled drift-monitor workflow
        purpose: "Run the check daily and turn a failure into a deduplicated repository issue rather than a silent red run."
        tdd_phase: setup
        depends_on_steps: [SF-012-S01]
        files_to_touch:
          - path: .github/workflows/drift-monitor.yml
            change: create
            detail: >-
              name "Drift monitor"; on schedule with a daily cron and workflow_dispatch, and NO
              pull_request or push trigger; permissions contents read and issues write.
              One job "check" on ubuntu-latest: actions/checkout; actions/setup-node with node-version
              24 and npm cache; run npm ci; run npx playwright install --with-deps chromium;
              run the drift check with continue-on-error true, capturing its exit code into a step
              output; then a step with if the exit code equals 2 that uses the GitHub CLI to search for
              an existing open issue whose title equals
              "Drift monitor: X selector contract failed" and, only if none exists, creates it with a
              body containing the failed selector ids, the contract version, and the run URL, labelled
              drift; then a separate step with if the exit code equals 3 that creates or updates an
              issue titled "Drift monitor: target unreachable"; then actions/upload-artifact uploading
              drift-report.json and drift-dom.html on any non-zero exit.
              The target URL comes from the HD-006 answer and is written literally into the workflow,
              or read from a repository variable if HD-006 selects a credentialed option.
        instructions:
          - "Create .github/workflows/drift-monitor.yml with exactly the structure described above."
          - "Confirm the trigger keys are exactly schedule and workflow_dispatch."
          - "Confirm the two failure branches use different issue titles for exit code 2 and exit code 3."
          - "Validate the file parses as YAML."
        constraints:
          - "No pull_request or push trigger. This workflow must never gate a merge."
          - "The two failure modes must produce different issue titles, so an unreachable target is never filed as drift."
          - "Any credential must come from a secret reference, never a literal."
        test_specification:
          test_type: none
          test_file: null
          test_name: null
          arrange: "scripts/check-drift.mjs is verified against all three targets."
          act: "Write the workflow and validate its YAML and trigger keys."
          assert:
            - "The file parses as YAML"
            - "Trigger keys are exactly schedule and workflow_dispatch"
            - "permissions declares issues write"
            - "Exit code 2 and exit code 3 branches use different issue titles"
          expected_red_failure: null
        validation:
          - command: "python3 -c \"import yaml;d=yaml.safe_load(open('.github/workflows/drift-monitor.yml'));t=d[True] if True in d else d['on'];assert set(t.keys())=={'schedule','workflow_dispatch'}, t.keys();assert d['permissions']['issues']=='write';print('ok')\""
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the YAML parse or assertion error."
      - id: SF-012-S03
        title: Demonstrate end to end that a deliberately broken selector is detected
        purpose: "Satisfy the PRD Phase 0 exit criterion, which requires the drift monitor to demonstrably fire when selectors are deliberately broken."
        tdd_phase: validation
        depends_on_steps: [SF-012-S02]
        files_to_touch:
          - path: docs/drift-monitor-demonstration.md
            change: create
            detail: >-
              A short record of the demonstration containing: the date; the exact commands run against
              the baseline, broken, and unreachable targets; the exit code observed for each; the
              failed selector ids reported; and the resulting issue title that the workflow would have
              used in each case. This is the evidence artefact for the PRD Phase 0 exit criterion.
        instructions:
          - "Run the three validation commands from SF-012-S01 again and record their exit codes and reports."
          - "Write docs/drift-monitor-demonstration.md capturing exactly what was run and observed."
          - "Do not simulate or paraphrase the output; paste the actual summary lines."
        constraints:
          - "Do not edit a fixture to produce a nicer demonstration. The broken fixture from SF-006 is the deliberate break."
        test_specification:
          test_type: none
          test_file: null
          test_name: null
          arrange: "The monitor script and the three targets."
          act: "Run all three checks and record the observed results."
          assert:
            - "Exit codes 0, 2, and 3 were observed for the baseline, broken, and unreachable targets respectively"
            - "docs/drift-monitor-demonstration.md records the actual commands and observed output"
          expected_red_failure: null
        validation:
          - command: "test -s docs/drift-monitor-demonstration.md && grep -q 'timeline-container' docs/drift-monitor-demonstration.md && echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and which of the three demonstration runs could not be reproduced."
    definition_of_done:
      - "scripts/check-drift.mjs reads selectors.json with plain Node and needs no build step"
      - "Exit codes 0, 2, and 3 distinguish healthy, drifted, and unreachable outcomes"
      - "The broken fixture produces exit code 2 naming timeline-container"
      - "An unreachable target produces exit code 3, never 2"
      - "The workflow triggers only on schedule and workflow_dispatch and can never gate a merge"
      - "Drift and unreachable failures file issues with different titles, deduplicated against open issues"
      - "docs/drift-monitor-demonstration.md records the deliberate-break demonstration required by the PRD Phase 0 exit criteria"
      - "No credential, cookie, or storage state is logged or committed"
    e2e_validation:
      required: true
      applicability: not_applicable_pending_human_approval
      rationale_if_not_applicable: >-
        The drift monitor is a scheduled CI script that never runs inside the extension and produces no
        user-visible browser behaviour. It does drive a real browser, but as the system under test's
        tooling rather than as a user journey. Its behaviour is verified directly by running it against
        three known targets and asserting three distinct exit codes, which is more precise than any
        user-facing assertion available here.

  - id: SF-013
    title: Add the page-load delta benchmark enforcing the 50ms budget
    type: infrastructure
    priority: P1
    status: planned
    description: >-
      Create bench/page-load.bench.ts and playwright.bench.config.ts, measuring the harness page's load
      timing with the extension loaded against a baseline context without it, over a fixed number of
      repetitions, and failing when the median delta exceeds 50ms.
    reason: >-
      PRD section 5 sets a hard budget of under 50ms extension impact on initial page load, enforced by
      a CI benchmark against a baseline page load, and PRD section 10 lists sustaining that delta as a
      success metric. Without a measurement it is an aspiration.
    user_value: "The extension provably does not make the feed slower to open."
    depends_on: [SF-003, SF-011]
    blocks: []
    estimated_complexity: M
    risk_level: medium
    risks:
      - risk: "A single measurement is dominated by machine noise, so the benchmark either fails randomly or passes a genuine regression."
        mitigation: "The benchmark performs a fixed 3 warm-up runs and 15 measured runs per arm, compares medians rather than means, and reports the interquartile range alongside so noise is visible in the output."
      - risk: "The benchmark is measured on the extension-loaded context only, so a slow machine reads as a regression."
        mitigation: "Both arms are measured in the same invocation on the same machine and only the delta is compared to the budget, which cancels machine speed."
      - risk: "The 50ms budget is enforced on a synthetic harness page rather than a real feed, overstating the result."
        mitigation: "The harness serves the committed golden fixture, so the measured DOM is the real captured markup. The rationale and this limitation are recorded in the benchmark file's header comment."
    constraints:
      - "The benchmark must measure both arms in the same run on the same machine. Never compare against a stored historical number."
      - "Compare medians, never means, and never a single sample."
      - "The benchmark must not use sleep or a fixed delay. Timing comes from the page's own performance timing entries."
      - "The benchmark must not be added to the SF-011 gate job as a blocking step in this ticket; it runs as its own job so a noisy machine cannot block an unrelated change."
    prerequisites:
      - "SF-003 and SF-011 complete."
    acceptance_criteria:
      - id: SF-013-AC1
        statement: "`npm run bench:pageload` completes and prints the median load time for both arms and the delta."
        verification: "Run `npm run build:test && npm run bench:pageload`; expect exit code 0 and three numbers in the output."
      - id: SF-013-AC2
        statement: "The benchmark fails with a non-zero exit code when the median delta exceeds 50ms."
        verification: "Temporarily set the budget constant to 0 in bench/page-load.bench.ts, run the benchmark, confirm a non-zero exit and a message naming the measured delta, then restore the constant to 50."
      - id: SF-013-AC3
        statement: "The benchmark performs at least 15 measured repetitions per arm and reports the interquartile range."
        verification: "Read the printed output and confirm the repetition count and the IQR are present for both arms."
    steps:
      - id: SF-013-S01
        title: Create the benchmark configuration and the page-load benchmark
        purpose: "Turn the PRD's 50ms budget into a repeatable measurement rather than a claim."
        tdd_phase: setup
        depends_on_steps: []
        files_to_touch:
          - path: playwright.bench.config.ts
            change: create
            detail: >-
              defineConfig with testDir "bench"; fullyParallel false; workers 1; retries 0;
              reporter [["list"]]; timeout 300000;
              use {baseURL: "http://localhost:5174", trace: "off", video: "off", screenshot: "off"};
              projects [{name: "bench", use: {...devices["Desktop Chrome"], headless: false}}];
              webServer identical to playwright.config.ts.
              workers is 1 and fullyParallel is false because concurrent workers would contend for CPU
              and destroy the measurement.
          - path: bench/page-load.bench.ts
            change: create
            detail: >-
              A header comment stating the budget, its PRD source, and the limitation that the harness
              serves captured golden markup rather than a live feed.
              Exports a const BUDGET_MS = 50.
              One Playwright test named "extension page-load delta stays within the 50ms budget".
              It defines a helper measure(context) that navigates to "/" and reads
              performance.getEntriesByType('navigation')[0].duration via page.evaluate, then closes the
              page. It runs 3 warm-up iterations and 15 measured iterations against a persistent context
              with the extension loaded, and the same against a persistent context launched with no
              --load-extension argument. It computes the median and the interquartile range for each
              arm, prints both plus the delta, and asserts the delta is at most BUDGET_MS with a
              message naming the measured value.
        instructions:
          - "Create playwright.bench.config.ts with exactly the configuration described above."
          - "Create bench/page-load.bench.ts implementing exactly the measurement described above."
          - "Run `npm run build:test && npm run bench:pageload` and record the printed medians, IQRs, and delta."
        constraints:
          - "workers must be 1. Parallel workers contend for CPU and invalidate the measurement."
          - "Do not use sleep or waitForTimeout. Read the page's own navigation timing entry."
          - "Do not compare against a stored historical baseline. Both arms are measured in the same run."
        test_specification:
          test_type: e2e
          test_file: bench/page-load.bench.ts
          test_name: "extension page-load delta stays within the 50ms budget"
          arrange: "Two persistent contexts on the same machine, one with dist/ loaded and one without, and the harness server running."
          act: "Run 3 warm-up and 15 measured navigations to http://localhost:5174/ in each arm and read the navigation timing duration."
          assert:
            - "The median delta between the two arms is at most 50ms"
            - "The output reports the median and interquartile range for both arms"
            - "The measured repetition count is at least 15 per arm"
          expected_red_failure: null
        validation:
          - command: "npm run build:test && npm run bench:pageload"
            expected_result: "Exit code 0, 1 passed, and printed output containing both arm medians, both IQRs, and a delta of at most 50."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, both arm medians, both IQRs, the measured delta, the repetition count, and the machine load at the time. Do not raise BUDGET_MS to make the benchmark pass."
      - id: SF-013-S02
        title: Prove the benchmark fails when the budget is exceeded
        purpose: "A benchmark that has never failed is indistinguishable from one that cannot fail."
        tdd_phase: validation
        depends_on_steps: [SF-013-S01]
        files_to_touch: []
        instructions:
          - "Temporarily change BUDGET_MS in bench/page-load.bench.ts to 0."
          - "Run `npm run bench:pageload` and confirm a non-zero exit code and a failure message naming the measured delta."
          - "Restore BUDGET_MS to 50."
          - "Run `npm run bench:pageload` again and confirm exit code 0."
        constraints:
          - "BUDGET_MS must be exactly 50 when this step completes. Confirm with a grep."
        test_specification:
          test_type: none
          test_file: null
          test_name: null
          arrange: "The working benchmark from S01."
          act: "Set the budget to 0, observe failure, restore it to 50, observe success."
          assert:
            - "A budget of 0 produces a non-zero exit and names the measured delta"
            - "A restored budget of 50 produces exit code 0"
            - "BUDGET_MS is 50 in the committed file"
          expected_red_failure: null
        validation:
          - command: "grep -q 'BUDGET_MS = 50' bench/page-load.bench.ts && npm run bench:pageload && echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and whether BUDGET_MS was successfully restored to 50."
    definition_of_done:
      - "npm run bench:pageload measures both arms in one run on the same machine and reports medians, IQRs, and the delta"
      - "The benchmark asserts a median delta of at most 50ms, sourced from PRD section 5"
      - "At least 15 measured repetitions per arm after 3 warm-ups"
      - "The benchmark was demonstrated to fail when the budget was lowered, then restored to 50"
      - "workers is 1 and no sleep or fixed delay is used"
    e2e_validation:
      required: true
      applicability: not_applicable_pending_human_approval
      rationale_if_not_applicable: >-
        This ticket adds a performance measurement harness. It drives a browser, but it asserts a
        timing budget rather than a user journey, and it ships no code into the extension. The user
        outcome it protects, that the feed does not open more slowly, is a non-functional property with
        no observable UI state to assert, so a conventional E2E test cannot express it.

  - id: SF-014
    title: Wire the content script end to end so real posts are observed, scored, and collapsed
    type: feature
    priority: P0
    status: planned
    description: >-
      Implement src/content/observer.ts and src/content/index.ts, joining every Phase 0 part: run the
      self-test, attach a MutationObserver to the timeline container, batch newly rendered post
      elements, extract each into a Post, score it with the Layer 1 behavioural signal, and collapse
      the ones over the threshold. This is the ticket that makes SlopFilter actually filter.
    reason: >-
      PRD Phase 0's exit criterion is that the extension reliably collapses posts from accounts
      exceeding the posting-frequency threshold. Every prior Phase 0 ticket built a part in isolation
      behind unit tests; this is the only ticket where the parts become a working product.
    user_value: "Posts from accounts that post at slop volume are collapsed automatically as the user scrolls, each showing why."
    depends_on: [SF-007, SF-008, SF-009, SF-010]
    blocks: [SF-101, SF-105, SF-107, SF-109]
    estimated_complexity: L
    risk_level: high
    risks:
      - risk: "The MutationObserver fires once per inserted node during fast scrolling, so scoring runs hundreds of times per second and janks the feed."
        mitigation: "Mutations are collected into a Set and drained once per microtask via queueMicrotask, so one scroll burst produces one scoring pass. A unit test asserts that ten synchronous insertions produce exactly one drain."
      - risk: "The same post is scored and collapsed repeatedly as the platform's virtualised list re-attaches it, producing duplicate placeholders and wasted work."
        mitigation: "Every processed element is marked with a dataset flag, and collapsePost is already idempotent from SF-009. A unit test asserts a re-observed element is skipped."
      - risk: "An exception anywhere in the pipeline kills the observer callback, leaving the extension half-working with no signal to the user."
        mitigation: "Each per-post step is wrapped so a single bad post is skipped rather than aborting the batch, and a batch-level failure disables filtering and reports a paused state rather than continuing in an unknown condition."
      - risk: "Author activity is unavailable because HD-004's chosen source is not implemented, so every post scores 0 and the ticket appears complete while filtering nothing."
        mitigation: "The E2E happy path asserts a specific post is collapsed with a specific reason, which cannot pass if activity is always null. The ticket is blocked on HD-004."
    constraints:
      - "Filtering must not start until runSelfTest returns ok true. While paused, no post may be collapsed."
      - "Batch scoring must be drained once per microtask, never once per mutation record."
      - "A per-post failure must skip that post only. It must never abort the batch or throw out of the observer callback."
      - "The observer must be disconnected when the timeline container is removed, and re-attached when a new one appears, without leaking observers."
      - "No post element may be removed from the DOM. Only inline display is changed, per SF-009."
      - "src/content/ must not import from src/adapters/x/selectors.json directly; it goes through the adapter interface."
    prerequisites:
      - "SF-007, SF-008, SF-009, and SF-010 complete."
      - "HD-004 answered and its chosen author-activity source implemented, because Layer 1 produces no score without it."
      - "HD-005 answered, because the collapse decision compares against its threshold."
    acceptance_criteria:
      - id: SF-014-AC1
        statement: "Ten post elements inserted synchronously into the observed container produce exactly one scoring drain."
        verification: "Run `npm run test:unit -- tests/unit/content/observer.test.ts`; expect the batching test, which counts calls to an injected scoring callback, to pass with a count of 1."
      - id: SF-014-AC2
        statement: "An element already marked as processed is skipped on re-observation."
        verification: "The test 're-observing a processed element does not score it again' asserts the scoring callback count stays at 1 after re-insertion."
      - id: SF-014-AC3
        statement: "A post whose extraction throws is skipped without aborting the batch, and the remaining posts are still scored."
        verification: "The test 'a failing post does not abort the batch' injects an adapter whose extractPost throws for one element and asserts the other elements were still scored."
      - id: SF-014-AC4
        statement: "When runSelfTest reports failure, no post is collapsed and a selftest-result message with ok false is sent."
        verification: "The test 'does not filter while paused' stubs chrome.runtime.sendMessage and asserts zero collapse calls and one message with ok false."
      - id: SF-014-AC5
        statement: "In a real browser, a post from a high-frequency author is collapsed with the reason text produced by the behavioural signal."
        verification: "Run `npm run build:test && npm run test:e2e -- e2e/specs/filtering.spec.ts`; expect 2 passed, 0 failed."
    steps:
      - id: SF-014-S01
        title: Write the failing observer tests
        purpose: "Pin batching, idempotence, per-post failure isolation, and the paused behaviour before writing the wiring that is easiest to get subtly wrong."
        tdd_phase: red
        depends_on_steps: []
        files_to_touch:
          - path: tests/unit/content/observer.test.ts
            change: create
            detail: >-
              Imports createTimelineObserver from '@/content/observer'. The factory takes an options
              object with an adapter, an onBatch callback, and a shouldFilter predicate, so the test
              injects fakes and never depends on the real adapter or on chrome.
              Describe block "createTimelineObserver" with tests:
              "drains one batch per microtask regardless of mutation count", inserting ten article
              elements synchronously and awaiting a microtask, asserting the onBatch spy was called
              exactly once with ten elements;
              "re-observing a processed element does not score it again", re-appending the same element
              and asserting the spy call count stays at 1;
              "a failing post does not abort the batch", using an adapter whose extractPost throws for
              one specific element and asserting the batch still contained the other nine;
              "does not filter while paused", constructing the observer with shouldFilter returning
              false and asserting onBatch was never called;
              "disconnects cleanly and stops emitting batches after stop() is called".
        instructions:
          - "Create tests/unit/content/observer.test.ts with exactly the five tests described above."
          - "Run `npm run test:unit -- tests/unit/content/observer.test.ts` and record the failure."
        constraints:
          - "Do not create src/content/observer.ts in this step."
          - "Await a microtask with `await Promise.resolve()`. Do not use a timer, a sleep, or vi.advanceTimersByTime."
        test_specification:
          test_type: unit
          test_file: tests/unit/content/observer.test.ts
          test_name: "createTimelineObserver > drains one batch per microtask regardless of mutation count"
          arrange: "A container element under observation, a fake adapter returning a valid Post for any element, and an onBatch spy."
          act: "Append ten article elements synchronously, then await Promise.resolve()."
          assert:
            - "The onBatch spy was called exactly once"
            - "The single call received ten elements"
            - "Re-appending a processed element leaves the call count at 1"
            - "An element whose extractPost throws is omitted while the other nine are present"
            - "With shouldFilter returning false, onBatch is never called"
            - "After stop(), further insertions produce no further calls"
          expected_red_failure: "The run fails at import time with a module-not-found error naming @/content/observer."
        validation:
          - command: "npm run test:unit -- tests/unit/content/observer.test.ts; test $? -ne 0 && echo red-confirmed"
            expected_result: "Prints red-confirmed. A zero exit code means the test is not failing: stop and report."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the full Vitest output."
      - id: SF-014-S02
        title: Implement the batching MutationObserver
        purpose: "Turn a stream of DOM mutations into one scoring pass per burst, with per-post failures isolated."
        tdd_phase: green
        depends_on_steps: [SF-014-S01]
        files_to_touch:
          - path: src/content/observer.ts
            change: create
            detail: >-
              Imports type PlatformAdapter from '@/adapters/types' and type Post from '@/core/post'.
              Export interface TimelineObserverOptions {adapter: PlatformAdapter; container: Element;
              shouldFilter: () => boolean; onBatch: (batch: readonly {element: HTMLElement; post:
              Post}[]) => void}.
              Export interface TimelineObserverHandle {stop: () => void}.
              Export function createTimelineObserver(options: TimelineObserverOptions):
              TimelineObserverHandle.
              It creates a MutationObserver observing the container with childList true and subtree
              true. Its callback returns immediately when shouldFilter() is false. Otherwise it
              collects every added element that matches a post element and is not already marked with
              the dataset flag slopfilterProcessed, adds it to a module-local pending Set, and if no
              drain is already queued calls queueMicrotask to drain.
              Draining marks each pending element as processed, calls adapter.extractPost inside a
              try/catch that skips only the failing element, builds the batch array, clears the pending
              Set, clears the queued flag, and calls onBatch once with the batch, itself wrapped so an
              onBatch throw cannot escape the microtask.
              stop() disconnects the observer and clears the pending Set.
        instructions:
          - "Create src/content/observer.ts implementing exactly the behaviour described above."
          - "Run `npm run test:unit -- tests/unit/content/observer.test.ts` and confirm 5 passing tests."
        constraints:
          - "Use queueMicrotask. Do not use setTimeout, requestAnimationFrame, or requestIdleCallback: a timer would make the batching untestable without fake timers and would add latency to the 100ms budget."
          - "Mark an element as processed before calling extractPost, so an element that throws is not retried on every subsequent mutation."
          - "Neither the observer callback nor the drain may throw."
        test_specification:
          test_type: unit
          test_file: tests/unit/content/observer.test.ts
          test_name: "createTimelineObserver > a failing post does not abort the batch"
          arrange: "A fake adapter whose extractPost throws for one designated element and returns a valid Post for the rest, plus ten appended elements."
          act: "Append all ten synchronously and await a microtask."
          assert:
            - "onBatch was called once"
            - "The batch contains exactly nine entries"
            - "No error escaped the observer callback"
            - "All 5 tests pass, 0 failed"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/content/observer.test.ts"
            expected_result: "Exit code 0, 5 passed, 0 failed."
          - command: "! grep -nE 'setTimeout|requestAnimationFrame|requestIdleCallback' src/content/observer.ts && echo ok"
            expected_result: "Prints ok, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, the failing assertion with expected and received values, and the observed onBatch call count and batch sizes."
      - id: SF-014-S03
        title: Implement the content-script entry that joins self-test, observer, scoring, and collapse
        purpose: "Produce the first end-to-end path from a rendered post to a collapsed placeholder."
        tdd_phase: green
        depends_on_steps: [SF-014-S02]
        files_to_touch:
          - path: src/content/index.ts
            change: modify
            detail: >-
              Replace the SF-001 placeholder. On execution it imports xAdapter from
              '@/adapters/x/adapter', createTimelineObserver from './observer', collapsePost from
              './collapse', scorePost from '@/core/scoring/pipeline', scoreBehavioural from
              '@/core/signals/behavioural', DEFAULT_SCORING_CONFIG and DEFAULT_THRESHOLDS from
              '@/core/scoring/weights', and logger from '@/shared/logger'.
              It runs xAdapter.selfTest(document), sends a selftest-result message with the outcome via
              chrome.runtime.sendMessage, and stores the ok value in a module-local paused flag.
              If ok is false it logs once and returns without observing anything.
              Otherwise it locates the timeline container via xAdapter.findTimelineContainer(document),
              returning early and re-checking on the next container mutation if none is found, and
              starts createTimelineObserver with shouldFilter returning the negation of the paused flag.
              onBatch maps each entry to a SignalResult from scoreBehavioural, using the author-activity
              source selected by HD-004, calls scorePost, and calls collapsePost for every entry whose
              breakdown.hidden is true.
              The whole body is wrapped so any thrown error sets the paused flag, sends a
              selftest-result message with ok false, and leaves the feed unfiltered.
          - path: e2e/specs/filtering.spec.ts
            change: create
            detail: "Uses the extension fixture. Two tests matching the two test cases declared in e2e_validation below."
          - path: tests/harness/index.html
