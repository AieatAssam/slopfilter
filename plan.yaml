          - trace
          - video
          - browser-console-output
          - failed-network-requests
      e2e_definition_of_done:
        - Happy path passes in the required browser
        - Relevant negative path passes, or is explicitly approved as not applicable
        - Test is isolated and parallel-safe
        - Test creates unique data and performs cleanup
        - Test has no fixed delays, sleeps, or arbitrary waits
        - Browser-visible user result and persisted final state are verified
        - Failure artefacts are configured and available

  - id: SF-101
    title: Build the inference host running Transformers.js with a WASM default and WebGPU detection
    type: feature
    priority: P0
    status: planned
    description: >-
      Create the inference host chosen by HD-012, running Transformers.js in a Web Worker with the
      WASM backend by default and WebGPU only where a benchmark shows a win. Add the model-loading
      lifecycle, the score-batch request and response message handling, and the CSP change WASM needs.
      Filtering continues unfiltered until models are ready.
    reason: >-
      PRD section 5 requires in-browser inference with a WASM default and WebGPU where it wins, and
      PRD section 2 requires all inference to run locally with no data leaving the machine. Every
      Phase 1 signal depends on this host existing.
    user_value: "Technical: local, private model inference with no server, and a feed that stays usable while models load."
    depends_on: [SF-004, SF-014]
    blocks: [SF-102, SF-104, SF-109, SF-206]
    estimated_complexity: L
    risk_level: high
    risks:
      - risk: "The Phase 0 CSP script-src 'self' blocks WebAssembly compilation, producing an opaque runtime failure with no obvious cause."
        mitigation: "This ticket explicitly widens extension_pages CSP to include 'wasm-unsafe-eval', which SF-001 flagged as this ticket's responsibility, and an acceptance criterion asserts the built manifest contains it."
      - risk: "Model loading blocks the feed, breaking the page-load budget."
        mitigation: "Loading is lazy and starts after first paint. Until the host reports ready, the content script scores with Layer 1 only, and an acceptance criterion asserts posts still render during loading."
      - risk: "WebGPU is enabled everywhere and is slower than WASM for these small models, as the PRD itself warns."
        mitigation: "WASM is the default. WebGPU is used only when navigator.gpu exists AND the SF-109 benchmark recorded a win for that specific model, read from a config constant rather than decided at runtime by capability alone."
      - risk: "The model is fetched from a host that was never approved, silently breaking the zero-network-calls privacy claim."
        mitigation: "The ticket is blocked on HD-013 and HD-007. The connect-src CSP allowlist names exactly one host, and an acceptance criterion asserts no other origin appears in the manifest."
    constraints:
      - "The only permitted runtime network request is the model download to the single host approved by HD-013. Any other outbound request is a constraint violation: stop and report."
      - "extension_pages CSP must add 'wasm-unsafe-eval' and nothing else. Do not add unsafe-eval or unsafe-inline."
      - "Model loading must be lazy and must never block the content script's first scoring pass."
      - "The inference host must expose only the score-batch-request and score-batch-response messages already declared in src/shared/messages.ts. Extending the union requires modifying that file explicitly."
      - "No post text, embedding, or image may be sent anywhere outside the extension process."
    prerequisites:
      - "SF-004 and SF-014 complete."
      - "HD-012 answered: offscreen document versus per-tab Web Worker is decided."
      - "HD-013 answered: model weights are downloaded at runtime from a named host, or bundled."
      - "HD-007 answered: the exact model ids and pinned revisions are fixed."
    acceptance_criteria:
      - id: SF-101-AC1
        statement: "The built manifest's extension_pages CSP contains 'wasm-unsafe-eval' and contains neither 'unsafe-eval' nor 'unsafe-inline'."
        verification: "Run `npm run build && node --input-type=module -e \"import fs from 'node:fs';const c=JSON.parse(fs.readFileSync('dist/manifest.json','utf8')).content_security_policy.extension_pages;if(!c.includes('wasm-unsafe-eval'))throw new Error('missing wasm-unsafe-eval');if(/unsafe-eval[^-]|unsafe-inline/.test(c))throw new Error('unsafe directive present: '+c);console.log('ok')\"`; expect ok."
      - id: SF-101-AC2
        statement: "The manifest declares exactly one non-extension connect-src origin, the model host approved by HD-013, or none at all if HD-013 selected bundling."
        verification: "Parse the built CSP and assert the connect-src origin list matches the HD-013 answer exactly."
      - id: SF-101-AC3
        statement: "selectBackend returns 'wasm' when navigator.gpu is undefined, and returns the configured backend when it is defined."
        verification: "Run `npm run test:unit -- tests/unit/offscreen/backend.test.ts`; expect 3 passed, 0 failed."
      - id: SF-101-AC4
        statement: "A score-batch-request received before models are ready resolves with an empty results array rather than hanging or throwing."
        verification: "The test 'answers a request received before ready with an empty result set' asserts the response has zero results and ok semantics preserved."
      - id: SF-101-AC5
        statement: "No source file under src/ issues a fetch to an origin other than the approved model host."
        verification: "Run `! grep -rnE \"fetch\\\\(|XMLHttpRequest|new WebSocket|sendBeacon\" src/ --include='*.ts' | grep -v 'offscreen/models.ts' && echo ok`; expect ok, confirming network access is confined to one reviewable file."
    steps:
      - id: SF-101-S01
        title: Write the failing backend-selection and readiness tests
        purpose: "Pin the WASM-default rule and the not-ready behaviour before any model code exists to bend them."
        tdd_phase: red
        depends_on_steps: []
        files_to_touch:
          - path: tests/unit/offscreen/backend.test.ts
            change: create
            detail: >-
              Imports selectBackend from '@/offscreen/models'. Describe block "selectBackend" with
              tests: "returns wasm when navigator.gpu is undefined", stubbing navigator via
              vi.stubGlobal with an object lacking gpu; "returns wasm when navigator.gpu exists but the
              model is not on the WebGPU allowlist"; "returns webgpu when navigator.gpu exists and the
              model id is on the WebGPU allowlist".
          - path: tests/unit/offscreen/readiness.test.ts
            change: create
            detail: >-
              Imports createInferenceHost from '@/offscreen/offscreen'. Describe block
              "inference host readiness" with tests: "answers a request received before ready with an
              empty result set", asserting the response type is 'score-batch-response', the requestId
              is echoed, and results has length 0; "answers with one result per post once ready",
              using an injected fake pipeline; "a model load failure leaves the host permanently not
              ready and never throws into the caller".
        instructions:
          - "Create both test files with exactly the tests described above."
          - "Run `npm run test:unit -- tests/unit/offscreen` and record the failure."
        constraints:
          - "Do not create any file under src/offscreen/ in this step."
          - "Inject the pipeline as a parameter. Do not download a real model in a unit test."
        test_specification:
          test_type: unit
          test_file: tests/unit/offscreen/readiness.test.ts
          test_name: "inference host readiness > answers a request received before ready with an empty result set"
          arrange: "An inference host constructed with an injected pipeline factory that never resolves."
          act: "Send a score-batch-request with two posts and await the response."
          assert:
            - "The response type is 'score-batch-response'"
            - "The requestId equals the request's requestId"
            - "results has length 0"
            - "selectBackend returns 'wasm' whenever navigator.gpu is undefined"
          expected_red_failure: "Both files fail at import time with module-not-found errors naming @/offscreen/models and @/offscreen/offscreen."
        validation:
          - command: "npm run test:unit -- tests/unit/offscreen; test $? -ne 0 && echo red-confirmed"
            expected_result: "Prints red-confirmed. A zero exit code means the tests are not failing: stop and report."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the full Vitest output."
      - id: SF-101-S02
        title: Implement the inference host, the worker, and the model loader
        purpose: "Provide one lazily loaded, locally running inference surface that every ML signal calls through."
        tdd_phase: green
        depends_on_steps: [SF-101-S01]
        files_to_touch:
          - path: package.json
            change: modify
            detail: "Add the Transformers.js runtime dependency at its latest published version, resolved at implementation time and recorded back into meta.repository_context.toolchain_versions. This is the first runtime dependency in the project and is justified by PRD section 5, which names Transformers.js explicitly."
          - path: src/offscreen/models.ts
            change: create
            detail: >-
              Exports MODEL_IDS, a frozen record mapping 'classifier' and 'embedder' to the exact model
              ids and pinned revisions fixed by HD-007. Exports WEBGPU_ALLOWLIST, a frozen array of the
              model ids for which the SF-109 benchmark recorded a WebGPU win; it is empty until that
              benchmark has run. Exports selectBackend(modelId: string, nav: {gpu?: unknown}):
              'wasm' | 'webgpu', returning 'webgpu' only when nav.gpu is defined AND modelId is in
              WEBGPU_ALLOWLIST, and 'wasm' otherwise. Exports loadPipeline(kind, backend), the ONLY
              function in the entire codebase permitted to trigger a network request.
          - path: src/offscreen/inference.worker.ts
            change: create
            detail: "A Web Worker that loads the pipelines via loadPipeline on first message, holds them for the worker's lifetime, and answers classify and embed requests. It posts a ready message once loading resolves and a load-failed message if it rejects."
          - path: src/offscreen/offscreen.ts
            change: create
            detail: >-
              Exports createInferenceHost(options) where options carries an injectable pipeline
              factory so unit tests never download a model. It owns the worker, tracks a ready flag,
              and handles score-batch-request by returning an empty results array while not ready and
              one result per post once ready. It never throws into a caller: a load failure sets ready
              to false permanently and is logged once.
          - path: src/offscreen/offscreen.html
            change: create
            detail: "A minimal document that loads offscreen.js as a module. Created only if HD-012 selected the offscreen-document option; if HD-012 selected the per-tab worker option, this file and the offscreen permission are omitted entirely."
          - path: public/manifest.json
            change: modify
            detail: >-
              Set content_security_policy.extension_pages to
              "script-src 'self' 'wasm-unsafe-eval'; object-src 'self'" plus a connect-src directive
              naming exactly the model host approved by HD-013, or no connect-src at all if HD-013
              selected bundling. Add the "offscreen" permission only if HD-012 selected the offscreen
              document option.
          - path: vite.config.ts
            change: modify
            detail: "Add the offscreen entry to rollupOptions.input, mapping 'offscreen/offscreen' to src/offscreen/offscreen.ts, and configure the worker build so inference.worker.ts is emitted as a separate bundle. The content script build pass is unchanged."
        instructions:
          - "Install the Transformers.js runtime dependency at its latest version and record the resolved version in meta.repository_context.toolchain_versions."
          - "Create src/offscreen/models.ts, inference.worker.ts, and offscreen.ts exactly as described."
          - "Update public/manifest.json's CSP and permissions exactly as described."
          - "Update vite.config.ts to emit the offscreen and worker bundles."
          - "Run `npm run test:unit -- tests/unit/offscreen` and confirm every test passes."
          - "Run `npm run build` and confirm the CSP assertion in SF-101-AC1 passes."
        constraints:
          - "loadPipeline in src/offscreen/models.ts must be the only function in the codebase that triggers a network request. Any fetch elsewhere is a constraint violation: stop and report."
          - "Do not add 'unsafe-eval' or 'unsafe-inline' to any CSP directive."
          - "Do not add the offscreen permission unless HD-012 selected the offscreen document option."
        test_specification:
          test_type: unit
          test_file: tests/unit/offscreen/readiness.test.ts
          test_name: "inference host readiness > a model load failure leaves the host permanently not ready and never throws into the caller"
          arrange: "An inference host constructed with a pipeline factory that rejects."
          act: "Send a score-batch-request and await the response."
          assert:
            - "The response resolves rather than rejecting"
            - "results has length 0"
            - "A subsequent request also resolves with zero results, proving the failure is latched"
            - "All tests under tests/unit/offscreen pass, 0 failed"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/offscreen"
            expected_result: "Exit code 0, all tests passed, 0 failed."
          - command: "npm run build && node --input-type=module -e \"import fs from 'node:fs';const c=JSON.parse(fs.readFileSync('dist/manifest.json','utf8')).content_security_policy.extension_pages;if(!c.includes('wasm-unsafe-eval'))throw new Error('missing wasm-unsafe-eval');if(/unsafe-inline/.test(c))throw new Error('unsafe-inline present');console.log('ok')\""
            expected_result: "Prints ok, exit code 0."
          - command: "! grep -rnE 'fetch\\(|XMLHttpRequest|new WebSocket|sendBeacon' src/ --include='*.ts' | grep -v 'offscreen/models.ts' && echo ok"
            expected_result: "Prints ok, exit code 0, confirming network access is confined to src/offscreen/models.ts."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, the failing assertion, the built CSP string verbatim, and any file outside src/offscreen/models.ts that contained a network call."
    definition_of_done:
      - "The built manifest CSP includes 'wasm-unsafe-eval' and no unsafe-eval or unsafe-inline directive"
      - "connect-src names exactly the HD-013 model host, or is absent when weights are bundled"
      - "selectBackend defaults to wasm and returns webgpu only for allowlisted model ids"
      - "A score-batch-request before readiness resolves with an empty result set and never throws"
      - "A model load failure is latched and never propagates to a caller"
      - "src/offscreen/models.ts is the only file in the codebase containing a network call"
      - "npm run test:unit, npm run lint, npm run typecheck, and npm run build all exit 0"
    e2e_validation:
      required: true
      applicability: not_applicable_pending_human_approval
      rationale_if_not_applicable: >-
        This ticket adds inference infrastructure with no user-visible surface of its own: it changes
        no rendering, adds no control, and produces no placeholder. Its user-visible consequences are
        asserted by SF-102 and SF-104, which use it to hide posts, and by SF-206, which surfaces the
        model download progress UI. Exercising it in a browser here would additionally require
        downloading real model weights, which would make the test slow, network-dependent, and
        non-hermetic, violating the isolation requirements this plan applies to every E2E test.

