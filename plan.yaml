  human_decisions:
    - id: HD-001
      question: "What is the final product name and Chrome extension display name? The PRD marks SlopFilter as a placeholder working title to revisit before launch."
      why_blocking: "The name is written into manifest.json name, the README title, popup and options headings, onboarding copy, and store-listing text. An agent guessing produces a rename churn across every user-facing surface."
      affected_tickets:
        - SF-001
        - SF-010
        - SF-108
        - SF-207
      options:
        - "Keep SlopFilter as the shipping name"
        - "Ship under a different name to be supplied by the owner"
      default: null
    - id: HD-002
      question: "Which open-source licence identifier is used, and what copyright holder string goes in the LICENSE file?"
      why_blocking: "PRD section 8 requires open source from day one, but names no licence. Licence choice is a legal decision an agent must not make. It determines LICENSE contents and the package.json license field."
      affected_tickets:
        - SF-001
      options:
        - "MIT"
        - "Apache-2.0"
        - "GPL-3.0-or-later"
        - "MPL-2.0"
      default: null
    - id: HD-003
      question: "What is the GitHub repository owner/name that the drift monitor files issues against, and is a GitHub remote to be configured?"
      why_blocking: "PRD section 5 requires the drift monitor to open an issue in the repo on failure. No git remote exists. Without a concrete repository the issue-filing step in SF-012 cannot be written or tested, and the default GITHUB_TOKEN permissions cannot be confirmed."
      affected_tickets:
        - SF-011
        - SF-012
      options:
        - "Create a public GitHub repository and supply owner/name; drift monitor uses the workflow-scoped GITHUB_TOKEN with issues:write"
        - "Create a private GitHub repository and supply owner/name"
        - "Defer CI entirely; SF-011 and SF-012 write workflow files that are committed but never executed"
      default: null
    - id: HD-004
      question: "How is per-account posting frequency derived for the Layer 1 behavioural signal? The X Home timeline DOM does not expose an account's posts-per-day, account age, or total post count."
      why_blocking: >-
        Layer 1 is the entire Phase 0 filtering capability and the PRD example reason label is
        'this account posts 40+ times/day', but that number is not present in timeline markup.
        The three plausible sources have materially different architecture, permission, privacy,
        and performance consequences, and one of them (fetching profile pages) adds outbound
        network requests that would contradict the zero-network-calls privacy claim in PRD
        section 8. An agent cannot pick this.
      affected_tickets:
        - SF-008
        - SF-014
      options:
        - "Session-local observation only: count posts per author seen in the current browsing session, persisted in IndexedDB across sessions with a rolling time window. No network calls."
        - "Parse per-post timestamps of consecutive posts by the same author already present in the timeline to estimate a rate. No network calls, weaker signal."
        - "Fetch the author's profile page or public API endpoint to read post count and join date. Adds outbound requests and contradicts PRD section 8."
        - "Drop posts-per-day from Phase 0 and ship Layer 1 with engagement-ratio only."
      default: null
    - id: HD-005
      question: "What are the shipped default values for the Layer 1 thresholds and the composite hide threshold?"
      why_blocking: >-
        The PRD promises 'sensible defaults ship for the 95% case' but specifies no numbers. The
        40-posts-per-day figure appears only inside an example UI string, not as a specification.
        Acceptance criteria for SF-008 and SF-106 are binary only if the numbers are fixed; without
        them, every fixture expected-score value would be invented.
      affected_tickets:
        - SF-008
        - SF-106
        - SF-108
      options:
        - "posts_per_day_threshold 40, engagement_ratio_threshold to be supplied, composite hide threshold 0.6 on a 0..1 scale"
        - "Owner supplies a full default table after reviewing the SF-008 behavioural signal output on real timeline data"
      default: null
    - id: HD-006
      question: "What target does the scheduled drift monitor load, given that x.com no longer serves a usable Home timeline to logged-out visitors?"
      why_blocking: >-
        PRD section 5 specifies Playwright against 'a logged-out X timeline (public posts)'. If that
        surface is unavailable, the monitor needs either an authenticated session (requiring stored
        credentials or a storage-state secret, which is a security and ToS decision) or a different
        public surface. An agent must not invent a credential source or decide to store session
        cookies in CI.
      affected_tickets:
        - SF-012
      options:
        - "Point the monitor at a public status or syndication surface that renders timeline markup without login; owner to confirm the exact URL"
        - "Store a Playwright storage-state JSON as a GitHub Actions secret for a dedicated throwaway account, owner accepting the ToS and security implications"
        - "Run the drift monitor locally on a schedule on the owner's machine rather than in GitHub Actions"
        - "Ship the monitor asserting only against the committed golden DOM fixtures until a live target is approved, accepting that it cannot detect real drift"
      default: null
    - id: HD-007
      question: "Which exact Hugging Face model ids and pinned revisions are used for the Layer 3 classifier and the Layer 5 embedding model?"
      why_blocking: >-
        The PRD names only classes of model ('Xenova/distilbert-class, ~70MB', 'all-MiniLM-L6-v2-class,
        ~25MB'). Model id and revision determine download size against the 100MB budget, output
        shape, label vocabulary, tokenizer, and licence. Guessing an id produces an implementation
        that either 404s or silently changes behaviour when the upstream repo moves.
      affected_tickets:
        - SF-101
        - SF-102
        - SF-104
      options:
        - "Owner supplies both model ids with pinned commit revisions after a size and quality check"
        - "Run a spike ticket to benchmark two candidate pairs on captured posts and let the owner choose"
      default: null
    - id: HD-008
      question: "What is the exact candidate label set for the Layer 3 zero-shot content-type classifier, and what score does each label contribute?"
      why_blocking: >-
        The PRD names three categories in prose (engagement bait, generic motivational, giveaway/crypto
        spam) but zero-shot classification requires exact label strings, and the mapping from label
        probability to signal score is a product-tuning decision. Different phrasings of the same
        label materially change classifier output.
      affected_tickets:
        - SF-102
      options:
        - "Owner supplies the exact label strings and per-label weights"
        - "Ship the three PRD categories as literal labels with equal weight and a single confidence threshold, owner to confirm"
      default: null
    - id: HD-009
      question: "What are the exact hard-veto rules in the scoring pipeline?"
      why_blocking: >-
        The PRD gives one parenthetical example ('proven absence of provenance + AI watermark = high
        confidence') that references an AI-watermark signal not present in any of the five layers.
        Veto rules override the weighted score and can hide a post outright, so an invented rule is
        a user-visible wrong-call generator.
      affected_tickets:
        - SF-106
      options:
        - "Owner supplies an explicit list of veto conditions expressed over the five layer outputs"
        - "Ship with zero veto rules in Phase 1 and add them only after real usage data"
      default: null
    - id: HD-010
      question: "Which concrete image-forensics model is used for Layer 4, and is it licence-compatible and small enough to run as WASM on thumbnails?"
      why_blocking: >-
        PRD section 4 specifies 'lightweight WASM vision model' with no candidate named. There is no
        obvious off-the-shelf diffusion/GAN artefact detector with a permissive licence and a
        Transformers.js-compatible export. Selecting one is a research and licensing decision.
      affected_tickets:
        - SF-202
      options:
        - "Owner supplies a model id, revision, licence, and expected input resolution"
        - "Run an evaluation spike before SF-202 and gate the ticket on its outcome"
        - "Drop Layer 4 from scope and record it as a deferred layer"
      default: null
    - id: HD-011
      question: "Is Layer 2 provenance viable given that X re-encodes uploaded images, and which C2PA parsing library is approved?"
      why_blocking: >-
        If X strips C2PA manifests during transcoding, Layer 2 returns no signal for every post and
        the ticket produces dead code. Viability must be confirmed empirically before implementation,
        and the parsing library is a new runtime dependency requiring approval under the dependency
        constraint.
      affected_tickets:
        - SF-201
      options:
        - "Confirm viability on real X image URLs first, then approve a named C2PA library and version"
        - "Drop Layer 2 and record provenance as not viable on this platform"
      default: null
    - id: HD-012
      question: "Does inference run in an offscreen document hosting a Web Worker, or in a Web Worker created directly by the content script?"
      why_blocking: >-
        PRD section 5 writes 'Offscreen document / Web Worker' without choosing. The two differ in
        model-cache sharing across tabs, memory accounting against the 300MB budget, lifetime, the
        chrome.offscreen permission requirement, and the entire message-passing topology in
        src/shared/messages.ts. Every Phase 1 ticket depends on the answer.
      affected_tickets:
        - SF-101
        - SF-102
        - SF-104
        - SF-109
      options:
        - "Offscreen document owning one Web Worker, one model instance shared across all tabs, requires the offscreen permission"
        - "Per-tab Web Worker created by the content script, no offscreen permission, one model instance per tab and therefore per-tab memory cost"
      default: null
    - id: HD-013
      question: "Are model weights downloaded at runtime from the Hugging Face CDN, or bundled inside the extension package?"
      why_blocking: >-
        PRD section 8 permits exactly one runtime network call for model download, but Chrome Web Store
        policy scrutinises remotely fetched resources, and a bundled alternative changes the package
        size, the CSP, the offline story, and the SF-206 progress UX entirely. This is simultaneously a
        privacy-claim, store-review, and architecture decision.
      affected_tickets:
        - SF-101
        - SF-206
      options:
        - "Runtime download from the Hugging Face CDN with an explicit connect-src CSP allowlist and a progress UI"
        - "Bundle quantised weights in the extension package, no runtime network call at all, larger install size"
      default: null
    - id: HD-014
      question: "Is a UI framework used for the options page and popup, or plain TypeScript with direct DOM APIs?"
      why_blocking: >-
        The PRD names no framework. Adding one is a new dependency requiring approval under the
        dependency constraint, and it changes every file layout and test approach under src/ui/.
        Injected in-page UI in src/content/ is plain DOM regardless, to avoid shipping a framework
        runtime into x.com pages.
      affected_tickets:
        - SF-010
        - SF-108
        - SF-204
        - SF-207
      options:
        - "Plain TypeScript with direct DOM APIs everywhere, zero UI dependencies"
        - "A named lightweight framework for src/ui/ only, supplied by the owner"
      default: null
    - id: HD-015
      question: "Who captures the raw X Home timeline HTML that the golden fixtures are derived from, and is the synthetic-content sanitisation policy in SF-006 acceptable?"
      why_blocking: >-
        No coding agent can log into X, and the Home timeline is not served to logged-out visitors, so
        the raw capture must be produced by a human. Without it an agent would have to invent markup,
        which would make every adapter test in SF-007 validate a fiction while appearing to pass. The
        capture also contains real handles, display names, and post text, so the sanitisation policy is
        a privacy decision before it is a technical one.
      affected_tickets:
        - SF-006
        - SF-007
        - SF-012
      options:
        - "The owner captures the timeline manually via browser Save Page As or DevTools copy-outerHTML and saves it to tests/fixtures/dom/x/raw/timeline-raw.html, accepting the SF-006 sanitisation policy"
        - "The owner supplies an already-sanitised fixture directly and SF-006 drops the sanitiser step"
        - "Fixtures are derived from a public syndication or embed surface that serves timeline markup without login, if one exists and the owner confirms the URL"
      default: null
  uncertainty_protocol:
    - "If a required file, symbol, command, route, selector, model id, threshold value, or credential is not named literally in this plan, STOP. Do not infer it, do not pick a plausible equivalent, do not read it from an unrelated project."
    - "If a ticket's prerequisites reference a human_decisions id, verify that decision has been answered in writing before starting. If it has not, STOP and report the ticket id and the blocking decision id."
    - "If a validation command in this plan does not exist in package.json scripts, STOP. Do not invent a substitute invocation and do not run the underlying binary directly."
    - "If a test fails, fix the implementation. Never weaken an assertion, never raise a timeout as the first remedy, never mark a test skipped, and never delete a failing test."
    - "If an implementation appears to require a dependency not named in the ticket's files_to_touch detail for package.json, STOP and report the required package and why."
    - "If an implementation appears to require an outbound network call to any origin other than x.com, twitter.com, or the approved model host, STOP and report."
    - "If the live X markup does not match a committed golden fixture, STOP. Do not edit the fixture to make a test pass; report the divergence."
    - "After one retry of a failing validation, STOP and report: ticket id, step or test id, the exact command run, the exit code, the relevant assertion output, artefact paths, and whether test-data cleanup succeeded."
    - "Never run git commands that rewrite history: no amend, no rebase, no reset --hard, no force push, no filter-branch."

