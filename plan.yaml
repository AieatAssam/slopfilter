  global_constraints:
    - "The repository starts empty. No ticket may reference a file, script, dependency, or command that a prior ticket in this plan did not create. Ticket SF-001 and SF-002 create the entire command surface."
    - "Manifest V3 only. No Manifest V2 keys. No remotely hosted code, no eval, no new Function, no remote script tags: this is a Chrome Web Store hard requirement and PRD section 9 risk mitigation."
    - "Host permissions are limited to https://x.com/* and https://twitter.com/*. The E2E harness origin http://localhost:5174/* may appear only in builds produced with SLOPFILTER_BUILD_TARGET=test and must never appear in a production build output."
    - "Zero outbound network requests at runtime except the one-time model download. Any ticket adding a fetch, XMLHttpRequest, WebSocket, EventSource, sendBeacon, or image request to a non-x.com origin other than the approved model host is a constraint violation and must stop and report."
    - "No analytics, no telemetry, no crash reporting, no accounts, no remote logging. All statistics stay in IndexedDB on the user's machine."
    - "No UI copy, reason label, tooltip, changelog entry, README line, or store-listing string may claim, imply, or hedge that a post was written by AI. Reason labels state observable evidence only."
    - "Failure mode is always fail-open. If the adapter self-test fails, if a model fails to load, or if scoring throws, the extension shows every post unfiltered. It must never hide posts it could not score."
    - "src/core/ is pure and stateless. No chrome.* API, no direct DOM access, no IndexedDB access, no global mutable state. Storage and platform access are injected by callers."
    - "Extension impact on initial page load must stay under 50ms versus an unmodified baseline (PRD section 5)."
    - "Per-batch scoring latency must stay under 100ms for a batch of 10 posts (PRD section 5)."
    - "Total memory footprint of models plus embeddings must stay under 300MB (PRD section 5)."
    - "Total first-run model download must stay under 100MB (PRD section 5)."
    - "Downvote embedding store is capped at 1000 embeddings with an explicit eviction policy (PRD section 4)."
    - "No dependency may be added unless it is named in a ticket's files_to_touch detail for package.json. Adding an unlisted dependency is a constraint violation: stop and report."
    - "Dependencies follow a latest-version policy: install the newest published version, pinned with an exact specifier and no caret or tilde, as recorded in meta.repository_context.toolchain_versions. A package not listed there has no approved version and must not be installed at all."
    - "There is no exception to the latest-version policy. Every dependency is at its latest published version. Linting and formatting are provided by Biome, which has no typescript peer dependency, so nothing constrains the TypeScript version."
    - "Do not install eslint, typescript-eslint, eslint-config-prettier, or prettier. Biome replaces all four. Adding any of them back is a constraint violation: stop and report."
    - "tsconfig.json must not contain baseUrl, and every paths target must begin with './'. TypeScript 7 removed baseUrl and rejects non-relative paths targets; both are hard errors."
    - "If a newer version than the one recorded in toolchain_versions has been published when a ticket runs, prefer the newer version, but first run global validation GV-09 to confirm peer compatibility. If GV-09 fails, stop and report rather than downgrading any other package to accommodate the newer one."
    - "All Node one-liners used as validation commands use `node --input-type=module -e` with ESM import syntax. Do not substitute a CommonJS `require` form."
    - "E2E tests never run against live x.com. They run against the local harness at http://localhost:5174. Only the SF-012 drift monitor touches the live site."
    - "No test may use sleep, page.waitForTimeout, setTimeout-based waiting, or arbitrary polling. Waits are on explicit conditions with explicit timeouts."
    - "Never commit secrets, .env files, model weight binaries, node_modules, Playwright artefacts (test-results/, playwright-report/), screenshots, videos, or traces."
    - "Tickets execute in dependency order. A ticket whose prerequisites list an unresolved human_decisions id must not start."
