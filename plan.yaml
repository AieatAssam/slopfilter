            detail: "Add a ?fixture=high-frequency switch that renders tests/fixtures/dom/x/timeline-high-frequency.html, in which every post is attributed to the single synthetic handle @account01, so the Layer 1 frequency threshold is exceeded deterministically."
        instructions:
          - "Replace src/content/index.ts with the implementation described above."
          - "Add the ?fixture=high-frequency switch to tests/harness/index.html."
          - "Create e2e/specs/filtering.spec.ts with exactly the two declared test cases."
          - "Run `npm run build:test && npm run test:e2e -- e2e/specs/filtering.spec.ts` and confirm 2 passing tests."
          - "Run the full local gate: npm run lint, npm run typecheck, npm run test:unit, npm run build, npm run test:e2e."
        constraints:
          - "Do not collapse anything when the paused flag is set."
          - "Do not import selectors.json directly in src/content/. Go through xAdapter."
          - "Reason text rendered in the placeholder must come from the ScoreBreakdown, never composed here."
        test_specification:
          test_type: e2e
          test_file: e2e/specs/filtering.spec.ts
          test_name: "collapses posts from a high-frequency account with an evidence-based reason"
          arrange: "The harness loaded at ?fixture=high-frequency so every post belongs to one synthetic account exceeding the Layer 1 frequency threshold."
          act: "Load the page with the extension present and wait for the first placeholder to appear."
          assert:
            - "At least one element with data-testid slopfilter-placeholder is visible"
            - "Its text contains the posts-per-day reason wording produced by scoreBehavioural"
            - "The original post elements are still present in the DOM"
          expected_red_failure: null
        validation:
          - command: "npm run build:test && npm run test:e2e -- e2e/specs/filtering.spec.ts"
            expected_result: "2 passed, 0 failed. Exit code 0."
          - command: "npm run lint && npm run typecheck && npm run test:unit && npm run build && echo gate-green"
            expected_result: "Prints gate-green, exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, exact command, exit code, the assertion output, the trace, screenshot, and video paths under test-results/, the browser console output, the placeholder count actually observed, and whether resetHarness ran in teardown."
    definition_of_done:
      - "A high-frequency-author post is collapsed automatically in a real browser with its reason visible"
      - "One scoring drain occurs per microtask regardless of mutation volume"
      - "A processed element is never scored twice and a failing post never aborts a batch"
      - "No post is collapsed while the self-test reports failure"
      - "No post element is removed from the DOM at any point"
      - "src/content/observer.ts uses queueMicrotask and no timer API"
      - "npm run lint, npm run typecheck, npm run test:unit, npm run build, and npm run test:e2e all exit 0"
    e2e_validation:
