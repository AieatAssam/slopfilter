  - id: SF-205
    title: Add settings export and import
    type: feature
    priority: P3
    status: planned
    description: >-
      Add export and import controls to the options page, serialising settings, account overrides, and
      the exclusion set to a versioned JSON file, and validating an imported file field by field before
      applying it. Downvote embeddings are deliberately excluded from the export.
    reason: "PRD section 7 Phase 2 lists settings export and import as a deliverable, and it is the only way a user can move their configuration between machines given there are no accounts."
    user_value: "The user can move their configuration to another machine or back it up, without an account and without a server."
    depends_on: [SF-108, SF-203]
    blocks: []
    estimated_complexity: M
    risk_level: medium
    risks:
      - risk: "An imported file with a wrong-typed or out-of-range field bricks the extension."
        mitigation: "Import reuses the same field-by-field repair path as loadSettings from SF-108, so a bad field falls back to its default. A unit test imports deliberately corrupt JSON and asserts a working settings object results."
      - risk: "The export contains downvote embeddings, turning a shareable config file into a dump of the user's reading history."
        mitigation: "Embeddings are excluded by construction and a unit test walks the serialised object recursively, asserting no embedding-bearing key appears at any depth."
      - risk: "A future format change silently misreads an old export."
        mitigation: "The export carries an explicit schemaVersion and import rejects an unrecognised version with a clear message rather than guessing."
    constraints:
      - "The export must never include downvote embeddings or any post text."
      - "Import must validate field by field and fall back to defaults, never throw."
      - "The export must carry an explicit schemaVersion, and import must reject an unrecognised one."
      - "Export and import happen entirely locally via a Blob download and a file input. No network call."
    prerequisites:
      - "SF-108 and SF-203 complete."
    acceptance_criteria:
      - id: SF-205-AC1
        statement: "The exported object contains settings, account overrides, and the exclusion set, and carries a schemaVersion."
        verification: "Run `npm run test:unit -- tests/unit/storage/settingsIo.test.ts`; expect the shape test to pass."
      - id: SF-205-AC2
        statement: "The exported object contains no embedding vector and no post text at any depth."
        verification: "The test 'never exports embeddings or post text' walks the serialised JSON recursively and asserts no key named vector, embedding, or text exists."
      - id: SF-205-AC3
        statement: "Importing deliberately corrupt JSON yields a valid settings object built from defaults, without throwing."
        verification: "Expect the corrupt-import test to pass."
      - id: SF-205-AC4
        statement: "Importing a file with an unknown schemaVersion is rejected with a message naming the version."
        verification: "Expect the version-rejection test to assert the message content."
      - id: SF-205-AC5
        statement: "In a browser, exporting then re-importing restores a changed threshold."
        verification: "Run `npm run build:test && npm run test:e2e -- e2e/specs/settings-io.spec.ts`; expect 2 passed, 0 failed."
    steps:
      - id: SF-205-S01
        title: Write the failing export and import tests
        purpose: "Pin the exported shape, the privacy exclusion, and the corrupt-input behaviour before implementation."
        tdd_phase: red
        depends_on_steps: []
        files_to_touch:
          - path: tests/unit/storage/settingsIo.test.ts
            change: create
            detail: >-
              Stubs chrome.storage.local with vi.stubGlobal. Imports exportConfig, importConfig, and
              CONFIG_SCHEMA_VERSION from '@/storage/settingsIo'. Describe block "config export and
              import" with tests: "exports settings, account overrides, and exclusions with a
              schemaVersion"; "never exports embeddings or post text", walking the serialised object
              recursively and asserting no key named vector, embedding, or text exists at any depth;
              "imports corrupt JSON as defaults without throwing", passing
              '{"schemaVersion":<current>,"settings":{"hideThreshold":"abc"}}' and asserting the
              resulting threshold equals the default; "rejects an unknown schemaVersion with a message
              naming it"; "round-trips a full config unchanged".
        instructions:
          - "Create tests/unit/storage/settingsIo.test.ts with exactly the five tests described above."
          - "Run `npm run test:unit -- tests/unit/storage/settingsIo.test.ts` and record the failure."
        constraints:
          - "Do not create src/storage/settingsIo.ts in this step."
          - "The embedding-exclusion test must walk the object recursively, not only check top-level keys."
        test_specification:
          test_type: unit
          test_file: tests/unit/storage/settingsIo.test.ts
          test_name: "config export and import > never exports embeddings or post text"
          arrange: "A populated settings store, account override store, and exclusion set, plus a populated embedding store."
          act: "Call exportConfig() and JSON.stringify the result."
          assert:
            - "No key named vector, embedding, or text appears at any depth"
            - "The export carries a schemaVersion"
            - "Corrupt JSON imports as defaults without throwing"
            - "An unknown schemaVersion is rejected with a message naming it"
            - "A full config round-trips unchanged"
          expected_red_failure: "The run fails at import time with a module-not-found error naming @/storage/settingsIo."
        validation:
          - command: "npm run test:unit -- tests/unit/storage/settingsIo.test.ts; test $? -ne 0 && echo red-confirmed"
            expected_result: "Prints red-confirmed. A zero exit code means the test is not failing: stop and report."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the full Vitest output."
      - id: SF-205-S02
        title: Implement export and import and wire the options-page controls
        purpose: "Give the user portable configuration without giving away their reading history."
        tdd_phase: green
        depends_on_steps: [SF-205-S01]
        files_to_touch:
          - path: src/storage/settingsIo.ts
            change: create
            detail: >-
              Exports CONFIG_SCHEMA_VERSION = 1.
              Exports interface ExportedConfig {schemaVersion: number; settings: Settings; accounts:
              Record<string, AccountState>; exclusions: readonly string[]}.
              Exports async exportConfig(): Promise<ExportedConfig>, which reads only the settings,
              account, and exclusion stores. It must not import src/storage/embeddings.ts at all.
              Exports async importConfig(raw: string): Promise<{ok: true} | {ok: false; message:
              string}>. It parses the JSON inside a try/catch, returns ok false with a descriptive
              message on a parse failure or an unrecognised schemaVersion, and otherwise runs every
              field through the same repair path loadSettings uses before saving.
          - path: src/ui/options/options.html
            change: modify
            detail: "Add a button with accessible name 'Export settings', a file input labelled 'Import settings', and a status paragraph with data-testid slopfilter-io-status."
          - path: src/ui/options/options.ts
            change: modify
            detail: "Wire the export button to serialise exportConfig() to a Blob and trigger a download, and the file input to read the selected file as text and call importConfig, writing the outcome into the status paragraph with textContent only."
          - path: e2e/specs/settings-io.spec.ts
            change: create
            detail: "Uses the extension fixture. Two tests matching the two test cases declared in e2e_validation below."
        instructions:
          - "Create src/storage/settingsIo.ts with exactly the exports described above."
          - "Add the export button, import file input, and status paragraph to the options page."
          - "Create e2e/specs/settings-io.spec.ts with the two declared test cases."
          - "Run `npm run test:unit -- tests/unit/storage/settingsIo.test.ts` and confirm 5 passing tests."
          - "Run `npm run build:test && npm run test:e2e -- e2e/specs/settings-io.spec.ts` and confirm 2 passing tests."
        constraints:
          - "exportConfig must not import or read src/storage/embeddings.ts."
          - "importConfig must never throw. Every failure path returns ok false with a message."
          - "No network call. Export uses a Blob download and import uses a file input."
        test_specification:
          test_type: e2e
          test_file: e2e/specs/settings-io.spec.ts
          test_name: "exporting and re-importing restores a changed threshold"
          arrange: "The options page with the threshold changed away from its default."
          act: "Export the config, reset the threshold to its default, then import the exported file."
          assert:
            - "The status paragraph confirms a successful import"
            - "The threshold control shows the exported value again"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/storage/settingsIo.test.ts"
            expected_result: "Exit code 0, 5 passed, 0 failed."
          - command: "npm run build:test && npm run test:e2e -- e2e/specs/settings-io.spec.ts"
            expected_result: "2 passed, 0 failed. Exit code 0."
          - command: "! grep -n 'embeddings' src/storage/settingsIo.ts && echo ok"
            expected_result: "Prints ok, exit code 0, confirming the export path cannot reach the embedding store."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, exact command, exit code, the assertion output, the trace, screenshot, and video paths under test-results/, and the exported JSON that failed to round-trip."
    definition_of_done:
      - "The export carries a schemaVersion and contains settings, account overrides, and exclusions"
      - "The export contains no embedding vector and no post text at any depth"
      - "Corrupt input imports as defaults without throwing"
      - "An unknown schemaVersion is rejected with a message naming it"
      - "Export and import are entirely local, with no network call"
      - "npm run test:unit, npm run lint, npm run typecheck, and the settings-io E2E spec all exit 0"
    e2e_validation:
      required: true
      applicability: applicable
      rationale_if_not_applicable: null
      test_file:
        path: e2e/specs/settings-io.spec.ts
        change: create
      user_journey:
        name: Backing up and restoring configuration without an account
        actor:
          role: "Extension user moving their configuration. The extension has no accounts and no roles."
          authentication:
            method: other
            fixture_or_source: "None. The extension has no authentication."
        preconditions:
          - "dist/ built with npm run build:test"
          - "The options page is reachable at the extension origin"
          - "The threshold has been changed away from its default"
        business_outcome: "The user's configuration survives a move to another machine, carried in a file they control, with no server involved."
      data_lifecycle:
        isolation_key: "Per-worker browser profile isolating chrome.storage.local, plus a download path under test-results/<workerIndex>/ so parallel workers never share an export file"
        setup:
          method: fixture
          steps:
            - "The extension fixture creates a per-worker browser profile."
            - "The test opens the options page and sets the threshold to a run-specific value derived from uniqueRunId."
        cleanup:
          method: fixture teardown
          steps:
            - "The test deletes the downloaded export file in an afterEach hook."
            - "The context fixture closes the context and deletes the per-worker profile directory."
        prohibited:
          - shared manually-created test data
          - reliance on test execution order
          - mutation of production data
      selector_contract:
        required_test_ids:
          - id: slopfilter-io-status
            element: "The options-page paragraph reporting the export or import outcome"
            component_file: src/ui/options/options.html
            purpose: "A status paragraph with no ARIA role and no label; its entire text is the message being asserted, so there is no accessible name to address it by."
        locator_policy:
          allowed_in_order:
            - getByRole with accessible name
            - getByLabel
            - getByTestId
          forbidden:
            - CSS classes
            - XPath
            - positional selectors
            - generated IDs
            - DOM traversal
      browser_steps:
        - id: SF-205-E2E-01
          action: "Open the options page and set the threshold to a run-specific value"
          route: "chrome-extension://<extensionId>/ui/options/options.html"
          locator: "getByLabel('Hide threshold')"
          input: "a run-specific value within the HD-005 bounds"
          wait_for:
            condition: "getByTestId('slopfilter-settings-status') has text 'Saved.'"
            timeout_ms: 5000
          assertions:
            - "The settings status paragraph reads 'Saved.'"
        - id: SF-205-E2E-02
          action: "Export the configuration and capture the download"
          route: "chrome-extension://<extensionId>/ui/options/options.html"
          locator: "getByRole('button', {name: 'Export settings'})"
          input: null
          wait_for:
            condition: "A download event completes and the saved file is non-empty"
            timeout_ms: 10000
          assertions:
            - "The downloaded file parses as JSON and carries a schemaVersion"
            - "The downloaded JSON contains no key named vector, embedding, or text at any depth"
        - id: SF-205-E2E-03
          action: "Reset the threshold to its default, then import the exported file"
          route: "chrome-extension://<extensionId>/ui/options/options.html"
          locator: "getByLabel('Import settings')"
          input: "the downloaded export file path"
          wait_for:
            condition: "getByTestId('slopfilter-io-status') reports a successful import"
            timeout_ms: 5000
          assertions:
            - "The io status paragraph confirms the import succeeded"
            - "getByLabel('Hide threshold') shows the run-specific value again"
      test_cases:
        - id: SF-205-E2E-HAPPY-01
          title: A configuration survives an export and re-import
          priority: critical
          given: "The options page with the threshold set to a run-specific value"
          when: "The user exports the configuration, resets the threshold, and imports the exported file"
          then:
            - "The exported file parses as JSON with a schemaVersion"
            - "The exported file contains no embeddings and no post text"
            - "After import the threshold control shows the run-specific value again"
        - id: SF-205-E2E-NEGATIVE-01
          title: Importing a malformed file reports an error and leaves settings untouched
          priority: high
          applicability: applicable
          rationale_if_not_applicable: null
          given: "The options page with a known threshold value and a malformed JSON file on disk"
          when: "The user selects the malformed file for import"
          then:
            - "The io status paragraph reports a failure with a descriptive message"
            - "The threshold control still shows its previous value, proving nothing was overwritten"
            - "No uncaught error appears in the browser console and the options page remains usable"
      execution:
        command: "npm run build:test && npm run test:e2e -- e2e/specs/settings-io.spec.ts"
        expected_result: "2 passed, 0 failed"
        retries: 1
        artifacts_on_failure:
          - screenshot
          - trace
          - video
          - browser-console-output
          - failed-network-requests
      e2e_definition_of_done:
        - Happy path passes in the required browser
        - Relevant negative path passes, or is explicitly approved as not applicable
        - Test is isolated and parallel-safe
        - Test creates unique data and performs cleanup
        - Test has no fixed delays, sleeps, or arbitrary waits
        - Browser-visible user result and persisted final state are verified
        - Failure artefacts are configured and available

  - id: SF-206
    title: Add the model download progress UX and offline behaviour
    type: feature
    priority: P2
    status: planned
    description: >-
      Surface model download progress in the popup, and define offline behaviour: when models cannot
      be fetched the extension stays on Layer 1 only, says so plainly, and offers a user-initiated
      retry. The feed is never blocked and never over-filtered while models are unavailable.
    reason: "PRD section 7 Phase 2 lists model download progress UX and offline behaviour, and PRD section 5 requires the feed to work unfiltered until models are ready."
    user_value: "The user always knows whether the filter is fully loaded, and a failed or absent download degrades honestly instead of silently."
    depends_on: [SF-101, SF-204]
    blocks: [SF-207]
    estimated_complexity: M
    risk_level: medium
    risks:
      - risk: "A stalled download shows a progress indicator frozen at a percentage forever, with no way to recover."
        mitigation: "A stall timeout transitions the state to failed with a retry control, asserted by a unit test that advances an injected clock with no progress events."
      - risk: "While models are loading the extension hides posts using partial signals, producing inconsistent behaviour between sessions."
        mitigation: "Until the host reports ready, only Layer 1 contributes, which SF-101 already guarantees by returning an empty result set. This ticket adds a test asserting the popup reports the degraded state honestly."
      - risk: "If HD-013 selected bundling, this entire progress UX is meaningless and would ship as dead code."
        mitigation: "Blocked on HD-013. If bundling was selected, the download states collapse to a single ready state and the ticket ships only the offline and status reporting, recorded explicitly in a file comment rather than left ambiguous."
    constraints:
      - "The feed must never be blocked by model loading."
      - "While models are not ready, only Layer 1 may contribute."
      - "A stalled download must transition to a failed state with a retry control, never remain pending indefinitely."
      - "Status copy must state plainly that filtering is reduced, without claiming AI detection and without blaming the user's connection."
      - "No automatic retry loop. Retry is user-initiated only."
    prerequisites:
      - "SF-101 and SF-204 complete."
      - "HD-013 answered: runtime download versus bundling determines whether progress states exist at all."
    acceptance_criteria:
      - id: SF-206-AC1
        statement: "The download state machine transitions idle to downloading to ready on successful progress events."
        verification: "Run `npm run test:unit -- tests/unit/offscreen/download.test.ts`; expect the happy-path transition test to pass."
      - id: SF-206-AC2
        statement: "No progress event within the stall timeout transitions the state to failed."
        verification: "Expect the stall test to assert the failed state using an injected clock rather than a real delay."
      - id: SF-206-AC3
        statement: "In the failed state the popup shows a retry control and states that filtering is reduced."
        verification: "Expect the popup test to assert both the control's presence and the copy."
      - id: SF-206-AC4
        statement: "Retry is only user-initiated; no automatic retry occurs."
        verification: "The test 'never retries automatically' advances the injected clock well past the stall timeout and asserts the load function was called exactly once."
      - id: SF-206-AC5
        statement: "In a browser, with the model host unreachable, the feed renders and the popup reports reduced filtering."
        verification: "Run `npm run build:test && npm run test:e2e -- e2e/specs/model-progress.spec.ts`; expect 2 passed, 0 failed."
    steps:
      - id: SF-206-S01
        title: Write the failing download state-machine tests
        purpose: "Pin every state transition, especially stall and no-auto-retry, before implementation."
        tdd_phase: red
        depends_on_steps: []
        files_to_touch:
          - path: tests/unit/offscreen/download.test.ts
            change: create
            detail: >-
              Imports createDownloadTracker from '@/offscreen/download'. The tracker takes an injected
              now() function and an injected load function so no real time passes and no real download
              occurs. Describe block "download tracker" with tests:
              "transitions idle to downloading to ready on progress then completion";
              "reports a percentage derived from bytes received over bytes total";
              "transitions to failed when no progress arrives within the stall timeout", advancing the
              injected clock; "never retries automatically", advancing the clock to ten times the stall
              timeout and asserting the load spy was called exactly once;
              "retry() moves failed back to downloading and calls load a second time".
        instructions:
          - "Create tests/unit/offscreen/download.test.ts with exactly the five tests described above."
          - "Run `npm run test:unit -- tests/unit/offscreen/download.test.ts` and record the failure."
        constraints:
          - "Do not create src/offscreen/download.ts in this step."
          - "Inject now() and load(). Do not use real timers, fake timers, or any sleep."
        test_specification:
          test_type: unit
          test_file: tests/unit/offscreen/download.test.ts
          test_name: "download tracker > never retries automatically"
          arrange: "A tracker with an injected clock and a load-function spy, started and then given no progress events."
          act: "Advance the injected clock to ten times the stall timeout and read the state."
          assert:
            - "The state is 'failed'"
            - "The load spy was called exactly once"
            - "The happy path reaches 'ready'"
            - "The reported percentage equals bytes received over bytes total"
            - "retry() calls load a second time and returns the state to 'downloading'"
          expected_red_failure: "The run fails at import time with a module-not-found error naming @/offscreen/download."
        validation:
          - command: "npm run test:unit -- tests/unit/offscreen/download.test.ts; test $? -ne 0 && echo red-confirmed"
            expected_result: "Prints red-confirmed. A zero exit code means the test is not failing: stop and report."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the full Vitest output."
      - id: SF-206-S02
        title: Implement the download tracker and the popup status UX
        purpose: "Tell the user the truth about what the filter can currently do, and let them recover from a failure."
        tdd_phase: green
        depends_on_steps: [SF-206-S01]
        files_to_touch:
          - path: src/offscreen/download.ts
            change: create
            detail: >-
              Exports type DownloadState = 'idle' | 'downloading' | 'ready' | 'failed' and
              STALL_TIMEOUT_MS.
              Exports createDownloadTracker({now, load, onStateChange}) returning
              {start(), retry(), getState(), getPercent()}. Progress events update the byte counters
              and the last-progress timestamp. A state read more than STALL_TIMEOUT_MS after the last
              progress event yields 'failed'. Nothing retries on its own; retry() is the only path back
              to 'downloading'. If HD-013 selected bundling, start() moves directly to 'ready' and the
              downloading and failed states are unreachable, recorded in a file comment naming HD-013.
          - path: src/ui/popup/popup.html
            change: modify
            detail: "Add a model-status section with data-testid slopfilter-model-status and a button with accessible name 'Retry model download', present only when the state is failed."
          - path: src/ui/popup/popup.ts
            change: modify
            detail: >-
              Render the model state as: 'Loading the filter models, N percent.' while downloading;
              'All filters active.' when ready; and
              'Some filters are unavailable, so less is being filtered. Your feed is unaffected
              otherwise.' when failed, with the retry button shown. Text is set with textContent only.
          - path: e2e/specs/model-progress.spec.ts
            change: create
            detail: "Uses the extension fixture. Two tests matching the two test cases declared in e2e_validation below."
        instructions:
          - "Create src/offscreen/download.ts with exactly the exports described above."
          - "Add the model-status section and retry control to the popup."
          - "Create e2e/specs/model-progress.spec.ts with the two declared test cases."
          - "Run `npm run test:unit -- tests/unit/offscreen/download.test.ts` and confirm 5 passing tests."
          - "Run `npm run build:test && npm run test:e2e -- e2e/specs/model-progress.spec.ts` and confirm 2 passing tests."
        constraints:
          - "No automatic retry."
          - "Status copy must not claim AI detection and must not blame the user's connection."
          - "The feed must render regardless of model state."
        test_specification:
          test_type: e2e
          test_file: e2e/specs/model-progress.spec.ts
          test_name: "the feed still renders and the popup reports reduced filtering when models cannot load"
          arrange: "The harness loaded with the extension, with every request to the model host aborted by a Playwright route handler so no external request is ever made."
          act: "Load the feed, then open the popup."
          assert:
            - "The post articles are visible, proving the feed was never blocked"
            - "The popup model status contains 'less is being filtered'"
            - "A 'Retry model download' control is present"
          expected_red_failure: null
        validation:
          - command: "npm run test:unit -- tests/unit/offscreen/download.test.ts"
            expected_result: "Exit code 0, 5 passed, 0 failed."
          - command: "npm run build:test && npm run test:e2e -- e2e/specs/model-progress.spec.ts"
            expected_result: "2 passed, 0 failed. Exit code 0."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, exact command, exit code, the assertion output, the trace, screenshot, and video paths, the popup status text observed, and the download state reported."
    definition_of_done:
      - "The state machine covers idle, downloading, ready, and failed with no indefinite pending state"
      - "A stall transitions to failed and offers a user-initiated retry"
      - "Nothing retries automatically"
      - "The feed renders regardless of model state and only Layer 1 contributes while not ready"
      - "Status copy is plain and claims no AI detection"
      - "npm run test:unit, npm run lint, npm run typecheck, and the model-progress E2E spec all exit 0"
    e2e_validation:
      required: true
      applicability: applicable
      rationale_if_not_applicable: null
      test_file:
        path: e2e/specs/model-progress.spec.ts
        change: create
      user_journey:
        name: Knowing what the filter can currently do
        actor:
          role: "Extension user whose models have not loaded. The extension has no accounts and no roles."
          authentication:
            method: other
            fixture_or_source: "None. The extension has no authentication."
        preconditions:
          - "dist/ built with npm run build:test"
          - "The harness is serving http://localhost:5174"
          - "Requests to the model host are aborted by a Playwright route handler, so the test stays hermetic and makes no external request"
        business_outcome: "The user sees their feed and an honest statement of what the filter is currently able to do, with a way to recover."
      data_lifecycle:
        isolation_key: "Per-worker browser profile under test-results/user-data-<workerIndex>; the model-host route handler is registered per context so parallel workers never interfere"
        setup:
          method: fixture
          steps:
            - "The extension fixture creates a per-worker browser profile."
            - "The test registers a route handler aborting every request to the model host, guaranteeing no external network access."
        cleanup:
          method: fixture teardown
          steps:
            - "The route handler is discarded with the context in teardown."
            - "The context fixture closes the context and deletes the per-worker profile directory."
        prohibited:
          - shared manually-created test data
          - reliance on test execution order
          - mutation of production data
      selector_contract:
        required_test_ids:
          - id: slopfilter-model-status
            element: "The popup paragraph describing model readiness"
            component_file: src/ui/popup/popup.html
            purpose: "A status paragraph with no ARIA role and no label; its whole text is the message being asserted, so there is no accessible name to address it by."
        locator_policy:
          allowed_in_order:
            - getByRole with accessible name
            - getByLabel
            - getByTestId
          forbidden:
            - CSS classes
            - XPath
            - positional selectors
            - generated IDs
            - DOM traversal
      browser_steps:
        - id: SF-206-E2E-01
          action: "Abort every request to the model host and load the harness feed"
          route: "http://localhost:5174/"
          locator: null
          input: null
          wait_for:
            condition: "At least one post article is visible"
            timeout_ms: 10000
          assertions:
            - "The post articles are visible, proving model loading never blocked the feed"
        - id: SF-206-E2E-02
          action: "Open the popup and read the model status"
          route: "chrome-extension://<extensionId>/ui/popup/popup.html"
          locator: "getByTestId('slopfilter-model-status')"
          input: null
          wait_for:
            condition: "getByTestId('slopfilter-model-status') has text containing 'less is being filtered'"
            timeout_ms: 15000
          assertions:
            - "The status text contains 'less is being filtered'"
            - "getByRole('button', {name: 'Retry model download'}) is visible"
            - "The status text does not match /\\b(ai|generated|synthetic|authored)\\b/i"
        - id: SF-206-E2E-03
          action: "Return to the harness and confirm nothing was hidden on unavailable signals"
          route: "http://localhost:5174/"
          locator: "getByTestId('slopfilter-placeholder')"
          input: null
          wait_for:
            condition: "The post articles are visible, which is the settled state after document_idle"
            timeout_ms: 10000
          assertions:
            - "getByTestId('slopfilter-placeholder') has count 0 on the baseline fixture"
            - "Every post body is visible"
      test_cases:
        - id: SF-206-E2E-HAPPY-01
          title: A blocked model download degrades honestly instead of silently
          priority: critical
          given: "The harness loaded with every request to the model host aborted"
          when: "The user loads the feed and opens the popup"
          then:
            - "The feed renders normally with every post article visible"
            - "The popup reports that less is being filtered"
            - "A retry control is offered"
            - "No authorship claim appears in the copy"
        - id: SF-206-E2E-NEGATIVE-01
          title: A failed model load never hides posts it could not score
          priority: high
          applicability: applicable
          rationale_if_not_applicable: null
          given: "The harness at the baseline fixture with the model host blocked, where no post exceeds the Layer 1 threshold"
          when: "The feed is scored with only Layer 1 available"
          then:
            - "The placeholder count is 0, proving no post was hidden on the strength of unavailable signals"
            - "Every post body is visible"
            - "The popup still reports reduced filtering rather than claiming all filters are active"
      execution:
        command: "npm run build:test && npm run test:e2e -- e2e/specs/model-progress.spec.ts"
        expected_result: "2 passed, 0 failed"
        retries: 1
        artifacts_on_failure:
          - screenshot
          - trace
          - video
          - browser-console-output
          - failed-network-requests
      e2e_definition_of_done:
        - Happy path passes in the required browser
        - Relevant negative path passes, or is explicitly approved as not applicable
        - Test is isolated and parallel-safe
        - Test creates unique data and performs cleanup
        - Test has no fixed delays, sleeps, or arbitrary waits
        - Browser-visible user result and persisted final state are verified
        - Failure artefacts are configured and available

  - id: SF-207
    title: Add the onboarding flow, the privacy page, and the store-listing copy
    type: feature
    priority: P2
    status: planned
    description: >-
      Add a first-run onboarding page explaining what the extension does and does not claim, an
      in-extension privacy page stating that nothing leaves the browser and how to verify it, and the
      store-listing copy as a reviewable document. Produce the listing text only; do not submit.
    reason: >-
      PRD section 7 Phase 2 lists the store listing, onboarding flow, and privacy page as deliverables,
      and PRD section 8 requires the privacy claim to be auditable and stated on the listing. This is
      also the last place a stray authorship claim could reach a user, so it carries the final copy
      review.
    user_value: "A new user understands in one screen what the filter does, what it never claims, and how to verify the privacy promise themselves."
    depends_on: [SF-108, SF-204, SF-206]
    blocks: []
    estimated_complexity: M
    risk_level: medium
    risks:
      - risk: "Marketing copy drifts into AI-detection language, which is the one claim the PRD forbids most emphatically, and it reaches users at the widest possible surface."
        mitigation: "A repository-wide validation greps every user-facing surface, including the listing document, for the authorship pattern and fails on any match. It runs as an acceptance criterion of this ticket."
      - risk: "The privacy page asserts 'nothing leaves your browser' while a network call exists somewhere in the codebase, making the claim false."
        mitigation: "An acceptance criterion re-runs the SF-101 network-call grep across the whole of src/ and fails unless the only network call is the approved model download, so the claim is verified rather than asserted."
      - risk: "Onboarding is shown on every startup and becomes an irritation."
        mitigation: "A persisted first-run flag gates it, and a unit test asserts the second call does not open the page."
    constraints:
      - "No onboarding, privacy, or listing string may claim, imply, or hedge AI authorship detection."
      - "The privacy page must state the single permitted network call explicitly and describe how a user can verify it in DevTools."
      - "Onboarding must open at most once, gated by a persisted flag."
      - "Produce the store-listing copy as a document in the repository. Do not submit to any store."
      - "No screenshots, videos, or binary listing assets may be committed."
    prerequisites:
      - "SF-108, SF-204, and SF-206 complete."
      - "HD-001 answered: the final product name appears throughout the onboarding, privacy, and listing copy."
    acceptance_criteria:
      - id: SF-207-AC1
        statement: "No user-facing surface in the repository matches the authorship pattern."
        verification: "Run `! grep -rniE '\\b(ai[- ]?(generated|written|detect)|written by (an )?ai|synthetic|authored by)\\b' src/ docs/store-listing.md && echo ok`; expect ok."
      - id: SF-207-AC2
        statement: "The only network call in src/ remains the approved model download in src/offscreen/models.ts."
        verification: "Run `! grep -rnE 'fetch\\\\(|XMLHttpRequest|new WebSocket|sendBeacon' src/ --include='*.ts' | grep -v 'offscreen/models.ts' && echo ok`; expect ok, which is what makes the privacy claim verifiable rather than merely asserted."
      - id: SF-207-AC3
        statement: "Onboarding opens on first run and not on subsequent runs."
        verification: "Run `npm run test:unit -- tests/unit/background/onboarding.test.ts`; expect the once-only test to assert the open function was called exactly once across two invocations."
      - id: SF-207-AC4
        statement: "The privacy page names the single permitted network destination and describes the DevTools verification steps."
        verification: "The test 'privacy page states the one network call' asserts the page text contains the model host and the word 'DevTools'."
      - id: SF-207-AC5
        statement: "In a browser, the onboarding page renders with no authorship claim and links to the privacy page."
        verification: "Run `npm run build:test && npm run test:e2e -- e2e/specs/onboarding.spec.ts`; expect 2 passed, 0 failed."
    steps:
      - id: SF-207-S01
        title: Write the failing onboarding and privacy-copy tests
        purpose: "Make the once-only rule and the copy constraints checkable before any copy is written."
        tdd_phase: red
        depends_on_steps: []
        files_to_touch:
          - path: tests/unit/background/onboarding.test.ts
            change: create
            detail: >-
              Stubs chrome.storage.local and chrome.tabs.create with vi.stubGlobal. Imports
              maybeOpenOnboarding from '@/background/onboarding'. Describe block "onboarding" with
              tests: "opens the onboarding page on first run", asserting chrome.tabs.create was called
              once with the onboarding URL; "does not open on a subsequent run", calling
              maybeOpenOnboarding twice and asserting exactly one create call;
              "records the first-run flag before opening, so a crash mid-open cannot loop".
          - path: tests/unit/ui/copy.test.ts
            change: create
            detail: >-
              Reads src/ui/onboarding/onboarding.html, src/ui/privacy/privacy.html, and
              docs/store-listing.md with node:fs. Describe block "user-facing copy" with tests:
              "no surface claims AI authorship detection", asserting none of the three files matches
              the authorship pattern; "privacy page states the one network call", asserting the privacy
              page text contains the approved model host and the word 'DevTools';
              "privacy page states there are no accounts and no analytics".
        instructions:
          - "Create tests/unit/background/onboarding.test.ts with exactly the three tests described above."
          - "Create tests/unit/ui/copy.test.ts with exactly the three tests described above."
          - "Run `npm run test:unit -- tests/unit/background/onboarding.test.ts tests/unit/ui/copy.test.ts` and record the failure."
        constraints:
          - "Do not create any onboarding, privacy, or listing file in this step."
          - "The copy test must read the real files from disk, not a copy of the strings, so it cannot drift from what ships."
        test_specification:
          test_type: unit
          test_file: tests/unit/ui/copy.test.ts
          test_name: "user-facing copy > no surface claims AI authorship detection"
          arrange: "The onboarding page, the privacy page, and the store-listing document read from disk as text."
          act: "Test each against the authorship regular expression."
          assert:
            - "None of the three files matches the authorship pattern"
            - "The privacy page names the approved model host and mentions DevTools"
            - "The privacy page states there are no accounts and no analytics"
            - "maybeOpenOnboarding opens exactly once across two calls"
          expected_red_failure: "Both files fail: the copy test with an ENOENT reading src/ui/onboarding/onboarding.html, and the onboarding test with a module-not-found error naming @/background/onboarding."
        validation:
          - command: "npm run test:unit -- tests/unit/background/onboarding.test.ts tests/unit/ui/copy.test.ts; test $? -ne 0 && echo red-confirmed"
            expected_result: "Prints red-confirmed. A zero exit code means the tests are not failing: stop and report."
        failure_handling:
          retry_limit: 1
          after_retry: "Stop and report the ticket id, step id, command, exit code, and the full Vitest output."
      - id: SF-207-S02
        title: Write the onboarding page, the privacy page, and the listing copy
        purpose: "Say plainly what the extension does and never claims, and make the privacy promise checkable by the reader."
        tdd_phase: green
        depends_on_steps: [SF-207-S01]
        files_to_touch:
          - path: src/ui/onboarding/onboarding.html
            change: create
            detail: >-
              A single-screen document using the HD-001 product name, containing: an h1 with the
              product name; a short paragraph stating that it collapses low-quality posts in the X
              timeline using signals computed on the user's own machine; a section headed
              'What this never does' stating that it never claims a post was written by AI and that
              every hidden post cites observable evidence; a section explaining that hidden posts are
              collapsed, never deleted, and can always be restored; a link to the privacy page with
              accessible name 'Read the privacy details'; and a link to the options page with
              accessible name 'Adjust settings'.
          - path: src/ui/onboarding/onboarding.ts
            change: create
            detail: "Minimal entry setting the two link targets to the extension's own privacy and options URLs via chrome.runtime.getURL. No other behaviour."
          - path: src/ui/privacy/privacy.html
            change: create
            detail: >-
              A document stating: no accounts, no analytics, no telemetry, no server; all statistics and
              downvote history stay in the browser's local storage; the single exception is a one-time
              model download from the host approved by HD-013, named literally in the page; and a
              short numbered list describing how to verify this in DevTools by opening the Network tab
              and observing that no request is made while browsing. If HD-013 selected bundling, the
              page states that there is no network call at all instead.
          - path: src/ui/privacy/privacy.ts
            change: create
            detail: "Minimal entry with no behaviour beyond rendering. Present so the page has a build entry consistent with the other UI pages."
          - path: src/background/onboarding.ts
            change: create
            detail: >-
              Exports async maybeOpenOnboarding(): Promise<void>. It reads the persisted
              onboardingShown flag from chrome.storage.local, returns immediately when it is true,
              otherwise WRITES the flag first and only then calls chrome.tabs.create with
              chrome.runtime.getURL for the onboarding page. Writing before opening means a crash
              during the open cannot produce an endless reopen loop.
          - path: src/background/service-worker.ts
            change: modify
            detail: "Call maybeOpenOnboarding from the existing chrome.runtime.onInstalled listener added in SF-001."
          - path: docs/store-listing.md
            change: create
            detail: >-
              The store-listing copy as a reviewable document: a short description, a full description,
