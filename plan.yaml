meta:
  plan_id: slopfilter-x-extension
  title: "SlopFilter browser extension for X/Twitter: Phase 0 foundation through Phase 2 polish"
  generated_from:
    prd_source_path: /Users/aieat/Downloads/slopfilter_prd.md
    copied_prd_path: docs/prd/slopfilter_prd.md
  goal: >-
    Ship a Manifest V3 Chrome extension that collapses low-quality posts in the X/Twitter Home
    timeline using five layered, locally computed signals, with a versioned selector contract, an
    in-extension self-test that pauses filtering on markup drift, a scheduled CI drift monitor, and
    CI-enforced performance budgets. No network calls at runtime except a one-time model download.
    No servers, no accounts, no authorship claims.
  reason: >-
    AI-authorship detection is unreliable and produces false accusations. The PRD reframes the
    problem as slop filtering on observable evidence (posting behaviour, provenance metadata, image
    forensics, content-type classification, and the user's own downvote history), which is both
    tractable in-browser and defensible in UI copy. Building the adapter contract and drift
    detection in Phase 0 is what makes the single-platform bet survivable and Phase 3 multi-platform
    expansion cheap.
  scope:
    in_scope:
      - Manifest V3 Chrome extension scaffold using npm, TypeScript, and Vite
      - X/Twitter Home timeline adapter (For You and Following surfaces only)
      - Versioned selector contract in src/adapters/x/selectors.json with required/optional flags
      - In-extension selector self-test that disables filtering and sets a paused badge on failure
      - Scheduled GitHub Actions drift monitor that opens a repository issue on selector failure
      - Golden DOM fixtures and fixture-driven adapter parsing tests
      - Pure stateless scoring pipeline consuming a normalized Post object
      - Layer 1 behavioural signal (posting frequency, account age vs post count, engagement ratio)
      - Layer 2 provenance signal (C2PA / content credentials on image thumbnails)
      - Layer 3 content-type zero-shot text classifier (engagement bait, generic motivational, giveaway/crypto spam)
      - Layer 4 image forensics signal on thumbnails
      - Layer 5 taste model (embedding similarity to downvote-cluster centroids in IndexedDB)
      - Weighted additive scoring with hard-veto rules and a user-tunable threshold
      - Collapse UI with evidence-based reason label, show-anyway, and wrong-call controls
      - Per-post score breakdown UI and a local-only weekly stats panel
      - Account-level mute and trust controls
      - Settings export and import
      - Model download progress UX and offline behaviour
      - Onboarding flow and privacy page copy
      - Playwright E2E against a local deterministic feed harness serving golden DOM
      - CI benchmarks for page-load delta, per-batch scoring latency, and memory footprint
    non_goals:
      - Video content analysis
      - BYOK or any cloud model integration
      - Any platform other than X/Twitter, including LinkedIn, Reddit, and Facebook adapters
      - Training or publishing custom models
      - Mobile browsers
      - Server-side components of any kind, including analytics and telemetry endpoints
      - Firefox and Safari support (Firefox is evaluation-only per PRD Phase 2 and is not a ticket here)
      - X notifications tab, search results, and profile surfaces
      - Cross-site topic muting
      - Any UI copy that asserts or implies a post was written by AI
      - Publishing to the Chrome Web Store (listing assets are produced; submission is not)
      - Running E2E tests against the live x.com site
