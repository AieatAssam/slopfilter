          title: A downvote durably changes what the filter hides
          priority: critical
          given: "The harness with one run-unique post visible and the extension filtering"
          when: "The user clicks 'Not interested', reloads, and the same post reappears"
          then:
            - "The control reports a pressed state immediately after the click"
            - "After reload the post is collapsed with the reason 'similar to posts you downvoted'"
