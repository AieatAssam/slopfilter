<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../page.css" />
    <title>SlopFilter</title>
  </head>
  <body class="sf-page sf-popup">
    <main class="sf-page-shell">
      <header class="sf-popup-head">
        <h1>SlopFilter</h1>
        <p class="sf-status" data-testid="slopfilter-popup-status" data-state="idle">Open an X timeline to start filtering.</p>
      </header>
      <section data-testid="slopfilter-models" aria-labelledby="slopfilter-models-heading">
        <h2 id="slopfilter-models-heading">Local models</h2>
        <p data-testid="slopfilter-model-status">Models have not started loading.</p>
        <progress class="sf-progress" data-testid="slopfilter-model-progress" max="100" value="0" hidden></progress>
        <button type="button" class="sf-btn sf-btn-secondary" data-testid="slopfilter-model-retry" hidden>Retry model download</button>
      </section>
      <section data-testid="slopfilter-stats" aria-labelledby="slopfilter-stats-heading">
        <h2 id="slopfilter-stats-heading">This week</h2>
        <div class="sf-stats">
          <div class="sf-stat" data-testid="slopfilter-stats-seen">
            <span class="sf-stat-label">Posts seen<span class="sf-sr">:</span></span> <strong data-testid="slopfilter-stats-seen-value">–</strong>
          </div>
          <div class="sf-stat" data-testid="slopfilter-stats-hidden">
            <span class="sf-stat-label">Posts hidden<span class="sf-sr">:</span></span> <strong data-testid="slopfilter-stats-hidden-value">–</strong>
          </div>
          <div class="sf-stat" data-testid="slopfilter-stats-wrong-rate">
            <span class="sf-stat-label">Wrong-call rate<span class="sf-sr">:</span></span> <strong data-testid="slopfilter-stats-wrong-rate-value">–</strong>
          </div>
        </div>
        <button type="button" class="sf-btn sf-btn-ghost sf-btn-danger" data-testid="slopfilter-clear-statistics">Clear statistics</button>
      </section>
      <footer class="sf-popup-footer">
        <a href="../options/options.html" id="popup-settings">Settings</a>
        <a href="../privacy/privacy.html" id="popup-privacy">Privacy</a>
      </footer>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
